
pallor:
  label: true
  primary_diagnosis: "Occult Bacteraemia"
  presenting_complaint: "11-month-old — triage nurse documents 'strikingly pale child.'"
  summary_of_note: "11/12 F, febrile for 18 hours, no clear focus. On triage: strikingly pale — nurse documents pallor as a primary concern. Conjunctivae pale. No jaundice. HR 172, CRT 3 sec, T 39.3°C, SpO2 97%. Peripherally cool. Child quiet and subdued. Pallor not explained by anaemia history. Referred urgently to paediatric team."

pallor:
  label: false
  primary_diagnosis: "Febrile Illness — Normal Complexion"
  presenting_complaint: "2-year-old with fever — flushed and pink, normal colour noted by triage nurse."
  summary_of_note: "2 yr M, 24-hour fever. On triage: flushed, pink-cheeked, good colour throughout. Triage nurse explicitly documents complexion as normal with no pallor. Alert and interactive. T 39.2°C, HR 118, SpO2 98%, CRT 2 sec. Skin warm and well-perfused. No concerns regarding colour or perfusion."

mottled_skin:
  label: true
  primary_diagnosis: "Septic Shock"
  presenting_complaint: "2-year-old, paramedic pre-alert — 'skin looks mottled, like a marble pattern, worse on the legs.'"
  summary_of_note: "2 yr F, paramedic pre-alert. On arrival: lace-like mottled pattern visible on trunk and lower limbs. T 40.0°C, HR 195, BP 65/35, CRT 6 sec. Peripherally cold, core warm. Child obtunded — AVPU=P. Mottling persists in warm environment. Resus team activated on arrival. IV access attempted immediately."

mottled_skin:
  label: false
  primary_diagnosis: "Physiological Mottling — Cold Exposure"
  presenting_complaint: "3-week-old, parents concerned about skin pattern — resolved completely on warming, previously well."
  summary_of_note: "3/52 M, parents concerned about mottled skin appearance noted during nappy change in a cold room at home. On arrival in ED: mottling fully resolved in warm environment. Apyrexial 36.8°C, feeding well, normal tone, normal behaviour. HR 142, SpO2 99%. Clinician documents mottling consistent with physiological cold-exposure vasoconstriction — no longer present on examination."


cyanosis:
  label: true
  primary_diagnosis: "Congenital Heart Disease with Concurrent Sepsis"
  presenting_complaint: "3-week-old, GP referral — 'blue lips and tongue, didn't improve with oxygen.'"
  summary_of_note: "3/52 M, referred by GP with central cyanosis noted at home visit. On assessment: lips, tongue, and mucous membranes visibly blue. SpO2 72% in air, rises only to 74% on 15L oxygen via non-rebreathe mask — failure to improve with supplemental O2. Tachycardic HR 186, tachypnoeic RR 68. Hepatomegaly 3cm below costal margin. Paediatric cardiology referral made immediately."

cyanosis:
  label: false
  primary_diagnosis: "Peripheral Cyanosis — Acrocyanosis (Normal Neonate)"
  presenting_complaint: "2-day-old, midwife concerned — blue hands and feet, but lips and tongue pink."
  summary_of_note: "2-day term neonate, referred by community midwife for blue discolouration of hands and feet. On assessment: hands and feet mildly blue but lips, tongue, and mucous membranes pink and well-perfused. SpO2 99% on air. Clinician documents acrocyanosis — no central cyanosis present. Afebrile, feeding well, appropriate for gestational age. Reassured and returned to community midwife."


rash_blanching:
  label: true
  primary_diagnosis: "Roseola Infantum (HHV-6)"
  presenting_complaint: "11-month-old, pink widespread rash appeared as fever settled — fades with glass tumbler pressure."
  summary_of_note: "11/12 F, 4-day high fever now settling. Widespread pink maculopapular rash appeared this morning over trunk and face. Glass tumbler test performed in triage: rash blanches completely under pressure. Child now apyrexial, well-appearing and interactive. T 37.1°C, HR 108, SpO2 99%. Rash blanching confirmed and documented. No non-blanching elements identified."

rash_blanching:
  label: false
  primary_diagnosis: "No Rash Present — Febrile Illness"
  presenting_complaint: "2-year-old with fever and cough — skin examined; no rash documented at any point."
  summary_of_note: "2 yr M, 3-day productive cough and fever 38.7°C. Full skin inspection performed — trunk, limbs, and face examined. No rash of any description identified. Skin clear throughout. Clinician explicitly documents absence of rash. T 38.7°C, HR 126, SpO2 95%, RR 36. No dermatological findings."


rash_non_blanching:
  label: true
  primary_diagnosis: "Meningococcal Disease"
  presenting_complaint: "6-year-old — non-blanching rash on legs, 'pressed a glass to it and it didn't go away.'"
  summary_of_note: "6 yr F, 6-hour history of fever and rapidly spreading rash. Parents performed glass tumbler test at home — rash did not blanch. On assessment: petechiae and purpura on lower limbs and buttocks, clearly non-blanching under direct pressure. Several lesions >2mm. Drowsy, T 39.8°C, HR 162, CRT 4 sec. Immediate escalation to resus. IV access and antibiotics without delay."

rash_non_blanching:
  label: false
  primary_diagnosis: "Immune Thrombocytopaenic Purpura (ITP)"
  presenting_complaint: "4-year-old with petechiae on legs — well child, afebrile, no fever, no other symptoms, rash appeared over a week."
  summary_of_note: "4 yr M, 1-week history of gradually appearing petechiae on lower limbs. Well throughout, afebrile, no preceding viral illness. On assessment: non-blanching petechiae confined to lower limbs, no purpura, no spreading. Child active, alert, afebrile 36.8°C, HR 98. No fever, no meningism, no systemic features of sepsis. Rash present >1 week with no progression in last 24 hours. Bloods sent. Meningococcal disease considered and not consistent with presentation."