drowsy_hard_to_wake:
  label: true
  primary_diagnosis: "Pneumococcal Septicaemia"
  presenting_complaint: "18-month-old — 'he just flops back to sleep, can't keep him awake.'"
  summary_of_note: "18/12 M, brought by father who has been unable to rouse child for feeds since this morning. Febrile since yesterday evening. On arrival AVPU=V — responds to voice but immediately returns to sleep. Sternal rub produces brief arousal only. T 40.1°C, HR 178, CRT 4 sec, skin mottled. Not making eye contact. Appears critically unwell. Immediate senior review requested."

drowsy_hard_to_wake:
  label: false
  primary_diagnosis: "Febrile Illness — Viral"
  presenting_complaint: "2-year-old — 'she had a nap this afternoon which is normal for her, woke up fine, temp came up this evening.'"
  summary_of_note: "2 yr F, temp 38.9°C noted this evening. Mum clarifies child napped as usual this afternoon and woke easily and spontaneously. Since waking she has been alert, eaten dinner, and been her normal self. On assessment: AVPU=A, making eye contact, interactive. T 38.4°C post paracetamol, HR 114, RR 28, SpO2 98%. No concerns regarding level of consciousness."

floppy_limp_tone:
  label: true
  primary_diagnosis: "Septic Shock (Gram-Negative)"
  presenting_complaint: "4-month-old — 'she feels like a ragdoll, not holding her head at all.'"
  summary_of_note: "4/12 F, brought by ambulance. Parents called 999 as baby became extremely floppy over the past hour. Had been febrile since yesterday. On arrival: markedly hypotonic — no head control, absent antigravity limb movement, lies in frog-leg posture. AVPU=P. T 39.6°C, HR 196, CRT 5 sec, capillaries shut down peripherally. Immediate resuscitation commenced."

floppy_limp_tone:
  label: false
  primary_diagnosis: "Viral URTI with Fever"
  presenting_complaint: "5-month-old with temperature and cough — good tone on examination, kicking legs actively on the trolley."
  summary_of_note: "5/12 M, 2-day cough and fever. On triage: kicking legs vigorously on the trolley, good head control when supported, normal axial tone throughout. Examiner documents normal tone and strong antigravity limb movements bilaterally. T 38.5°C, HR 138, SpO2 97%. Alert and reactive. No neurological concerns."

confused_disoriented:
  label: true
  primary_diagnosis: "Viral Encephalitis (HSV)"
  presenting_complaint: "7-year-old — 'he doesn't know where he is, keeps asking for his dog — the dog died two years ago.'"
  summary_of_note: "7 yr M, 3-day history of fever and progressive behavioural change. Parents report he is confused — not knowing where he is, making incoherent statements, asking repeatedly for a dog that died 2 years ago. On assessment: disoriented to place and time, cannot state name of school or teacher. Speech inappropriate and disorganised. GCS 13 (E4 V4 M5). T 39.1°C, HR 122. Febrile and encephalopathic — urgent senior review."

confused_disoriented:
  label: false
  primary_diagnosis: "Febrile Seizure (Post-Ictal)"
  presenting_complaint: "3-year-old, brief seizure at home — now back to herself, asking for her dummy, knows mum's name."
  summary_of_note: "3 yr F, witnessed 90-second generalised tonic-clonic seizure at home in context of fever. On arrival: post-ictal but rapidly improving. Within 15 minutes of arrival she is asking for her dummy by name, identifying mum correctly, and responding appropriately to simple questions. Oriented and no longer confused. T 39.3°C, HR 136. GCS now 15. No ongoing focal neurology."