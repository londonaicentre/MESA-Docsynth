seizure_activity:
  label: true
  primary_diagnosis: "Bacterial Meningitis with Seizures"
  presenting_complaint: "14-month-old — witnessed tonic-clonic seizure in triage waiting room, lasted 3 minutes."
  summary_of_note: "14/12 F, generalised tonic-clonic seizure witnessed in waiting room lasting 3 minutes. IV lorazepam given by triage nurse; seizure terminated. Post-ictal: AVPU=V, difficult to rouse. T 39.9°C, HR 188. Fontanelle tense and bulging on examination. Photophobic. Moved immediately to resus. Paediatric and anaesthetic teams alerted."

seizure_activity:
  label: false
  primary_diagnosis: "Breath-Holding Spell"
  presenting_complaint: "18-month-old went blue and stiff after a fall — mum thought it was a seizure, resolved in 30 seconds, now completely back to normal."
  summary_of_note: "18/12 M, episode following minor fall — cried, held breath, went blue, then transiently stiff, recovered spontaneously in under 30 seconds. On arrival fully alert and back to baseline. No post-ictal phase. No tongue bite. No urinary incontinence. Afebrile 37.0°C, HR 106, SpO2 99%. On history: consistent with cyanotic breath-holding spell. No evidence of seizure activity."


posturing:
  label: true
  primary_diagnosis: "Herpes Simplex Encephalitis"
  presenting_complaint: "2-year-old — 'his arms go stiff and his back arches right back,' two episodes at home."
  summary_of_note: "2 yr M, 48-hour history of fever and progressive deterioration. Two episodes of opisthotonus at home, each lasting ~20 seconds. During assessment in ED: further episode of decorticate posturing observed — arms flexed, legs extended, back arched. Duration 15 seconds. Not responsive during episode. GCS 9 inter-ictally (E3 V2 M4). T 39.4°C, HR 138. Urgent senior review and anaesthetic standby requested."

posturing:
  label: false
  primary_diagnosis: "Dystonic Drug Reaction (Metoclopramide)"
  presenting_complaint: "10-year-old, arms intermittently going into abnormal postures — had metoclopramide at GP yesterday, afebrile and alert."
  summary_of_note: "10 yr F, intermittent upper limb posturing for 6 hours, beginning 18 hours after metoclopramide prescribed by GP. On assessment: alert, fully oriented, GCS 15. Episodes consist of oculogyric crisis with upper limb dystonia — intermittent and self-resolving. Afebrile 36.9°C. No meningism. No reduced consciousness between episodes. Documented as extrapyramidal side effect. Not consistent with raised ICP or sepsis."


not_able_to_stand_or_walk:
  label: true
  primary_diagnosis: "Septic Arthritis (Hip)"
  presenting_complaint: "3-year-old — 'she was walking fine yesterday, now won't stand at all.'"
  summary_of_note: "3 yr F, acute onset non-weight-bearing right leg. Walking normally until yesterday; today refuses to stand. 3-day background of fever and irritability. On assessment: right hip held in fixed flexion and external rotation at rest. Passive movement severely restricted and painful — child cries on any attempt to move hip. T 38.9°C, HR 144, WBC >12 on point of care. Will not bear any weight on right leg when stood on trolley."

not_able_to_stand_or_walk:
  label: false
  primary_diagnosis: "Toddler's Fracture"
  presenting_complaint: "2-year-old not walking after a stumble — afebrile, well, crying when standing but no systemic features."
  summary_of_note: "2 yr M, unwilling to weight-bear on right leg since tripping whilst running 3 hours ago. Afebrile 36.9°C, HR 106, well-appearing and interactive. Cries when standing but is consolable. Hip moves freely and painlessly in all directions. Tenderness localised to distal tibia on palpation. No systemic features, no fever, no signs of septic arthritis. X-ray of right tibia and ankle requested."


bulging_fontanelle:
  label: true
  primary_diagnosis: "Bacterial Meningitis"
  presenting_complaint: "7-month-old — 'the soft spot on his head looks puffed up, it was never like that before.'"
  summary_of_note: "7/12 M, 12-hour history of fever, irritability, and high-pitched cry. Mother noticed the anterior fontanelle looks raised. On assessment: fontanelle tensely bulging at rest in the upright position — does not pulsate, does not reduce. Not crying during examination. T 39.6°C, HR 176. Photophobic. Drowsy. Fontanelle bulging documented as pathological. Immediate paediatric registrar review."

bulging_fontanelle:
  label: false
  primary_diagnosis: "Febrile Illness — Normal Fontanelle"
  presenting_complaint: "5-month-old with fever — fontanelle examined and documented as flat and soft."
  summary_of_note: "5/12 F, 1-day fever 38.5°C and irritability. Anterior fontanelle specifically examined at rest and in upright position — flat and soft, normal pulsation, no bulging. Not tense. Explicitly documented as normal by examiner. Alert, making eye contact. T 38.2°C, HR 148, SpO2 98%. Fontanelle within normal limits. Safety-net advice given to return if fontanelle becomes tense."