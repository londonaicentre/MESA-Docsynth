poor_feeding_reduced_intake:
  label: true
  primary_diagnosis: "Late-Onset Neonatal Sepsis"
  presenting_complaint: "16-day-old — 'only feeding for 2 minutes then falling asleep, normally 15 minutes, one wet nappy in 12 hours.'"
  summary_of_note: "16-day M, brought by mother. Breastfeeding reduced significantly over past 24 hours — taking 2 minutes per feed, normally 15. Only one wet nappy in 12 hours. Mum reports baby seems too tired to feed. On assessment: T 38.1°C, pale, mottled peripheries. Mucous membranes slightly dry. Lethargic. HR 178, CRT 3 sec. Neonatal sepsis screen commenced."

poor_feeding_reduced_intake:
  label: false
  primary_diagnosis: "Viral URTI — Feeding Well"
  presenting_complaint: "4-month-old with runny nose and temperature — feeding normally, mum says 'she's been taking all her bottles.'"
  summary_of_note: "4/12 F, 2-day coryzal illness. T 38.3°C. Mum explicitly confirms baby has taken all normal formula volumes today and has had the usual number of wet nappies. No concerns about feeding. On assessment: alert, well-hydrated mucous membranes, fontanelle flat. HR 128, SpO2 98%. Feeding documented as normal at triage."



unable_to_drink:
  label: true
  primary_diagnosis: "Epiglottitis"
  presenting_complaint: "4-year-old — drooling, head forward, refusing all drinks, 'he tried to swallow and cried.'"
  summary_of_note: "4 yr M, unvaccinated. Brought by ambulance. Sitting in tripod position, drooling, muffled voice. Refuses all fluids offered — attempted a sip of water and cried out in pain. Cannot swallow own secretions. Severe stridor on minimal exertion. T 39.7°C, HR 148, SpO2 92% in air. Airway team alerted immediately. No further oral attempts made."

unable_to_drink:
  label: false
  primary_diagnosis: "Tonsillitis with Odynophagia"
  presenting_complaint: "8-year-old with sore throat — painful to swallow but managing sips of water and juice throughout the day."
  summary_of_note: "8 yr F, 3-day sore throat, T 39.4°C. Reports pain on swallowing but mum confirms managing sips of water, juice, and ice lollies throughout the day. Not drooling. Swallows own saliva without distress during assessment. Voice normal. No stridor. Tonsils enlarged with bilateral exudate. No airway compromise."