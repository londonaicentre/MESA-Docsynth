inconsolable_crying_001:
  label: true
  primary_diagnosis: "Intussusception"
  presenting_complaint: "9-month-old infant — 'crying on and off all afternoon, draws his legs up, nothing we do helps.'"
  summary_of_note: "9/12 M, 6-hour intermittent paroxysmal crying. Episodes 2–3 min, draws legs up, inconsolable, settles between. Feeding not settling him. Vomited twice. Small bloodstained mucous stool. Abdomen soft between episodes but cries/doubles over on RUQ palpation. Urgent USS requested."

inconsolable_crying_002:
  label: false
  primary_diagnosis: "Acute Otitis Media"
  presenting_complaint: "18-month-old toddler — 'cried overnight pulling at her ear but she settles fine with cuddles.'"
  summary_of_note: "18/12 F, overnight crying and ear-pulling. Settled with paracetamol, consolable with cuddling. Clingy but settles in mum's arms, stops crying given a snack. Not distressed at rest. T 38.2°C, HR 118. Right TM bulging/erythematous. Crying explainable by pain and consolable — not inconsolable."

inconsolable_crying_003:
  label: true
  primary_diagnosis: "Testicular Torsion"
  presenting_complaint: "2-week-old neonate, GP referral — 'screaming non-stop for hours and nothing calms him.'"
  summary_of_note: "2/52 M, GP referral. Inconsolable screaming 5 hours, no settling with feeding, holding or analgesia. O/E right hemiscrotum swollen, firm, erythematous, exquisitely tender, high-riding testis, absent cremasteric reflex. T 36.9°C, HR 178, RR 50. Cry persistent and unrelenting. Urgent surgical referral for scrotal exploration."

inconsolable_crying_004:
  label: false
  primary_diagnosis: "Infantile Colic"
  presenting_complaint: "5-week-old infant — 'cries every evening for an hour but quietens when we walk him round.'"
  summary_of_note: "5/52 M, self-presentation. Predictable evening crying 2 weeks, draws knees up then settles. Consolable with rocking, winding, swaddling — quiet between episodes. Afebrile 37.0°C, HR 136, RR 38. Thriving, feeding well, weight gain on centile. Crying episodic and consolable, not unrelenting. Documented not inconsolable. Reassurance given."

inconsolable_crying_005:
  label: true
  primary_diagnosis: "Incarcerated Inguinal Hernia"
  presenting_complaint: "7-week-old infant brought by 999 — 'inconsolable and there's a hard lump in his groin.'"
  summary_of_note: "7/52 M, ambulance. Inconsolable crying 4 hours, vomiting. O/E tender irreducible firm right groin/scrotal mass, overlying skin tense. Abdomen distended. T 37.2°C, HR 184, RR 52, CRT 3s. Cry persistent despite all measures. Inconsolable distress documented. Urgent paediatric surgical review, attempted reduction."

inconsolable_crying_006:
  label: false
  primary_diagnosis: "Teething"
  presenting_complaint: "10-month-old infant — 'grizzly and crying with the new teeth but a cuddle and teething gel help.'"
  summary_of_note: "10/12 F, ED walk-in. Irritable, drooling, biting, disturbed sleep. T 37.5°C, HR 120, RR 28. Lower incisors erupting. Crying intermittent, settles readily with cuddles, feeding and analgesia, distractible. Not distressed at rest. Crying clearly consolable — explicitly not inconsolable. Discharged with reassurance."

inconsolable_crying_007:
  label: true
  primary_diagnosis: "Volvulus (Malrotation with Midgut Volvulus)"
  presenting_complaint: "5-day-old neonate, paramedic pre-alert — 'screaming inconsolably and just vomited bright green.'"
  summary_of_note: "5/7 M, pre-alert. Sudden inconsolable screaming with bilious vomiting. Abdomen distended, tender, guarding. T 36.4°C, HR 192, RR 58, CRT 4s, mottled, lethargic between screams. Cry unrelenting, no consolation possible. Surgical emergency — urgent upper GI contrast and theatre, resuscitation commenced."

inconsolable_crying_008:
  label: false
  primary_diagnosis: "Viral Upper Respiratory Tract Infection"
  presenting_complaint: "13-month-old toddler, GP referral — 'miserable and crying with a cold but settles on mum's lap.'"
  summary_of_note: "13/12 M, GP referral. Coryza, cough, reduced appetite 3 days. T 38.0°C, HR 124, RR 30, SpO2 98%. Crying when examined, settles quickly on mum's lap, smiles and plays once distracted. No abdominal signs. Consolable throughout — documented not inconsolable. Safety-net advice, discharged."

inconsolable_crying_009:
  label: true
  primary_diagnosis: "Hair Tourniquet Syndrome (Toe)"
  presenting_complaint: "4-month-old infant — 'been crying inconsolably all day and we can't find anything wrong.'"
  summary_of_note: "4/12 F, self-presentation. Persistent inconsolable crying 8 hours, no settling with feeding or holding. Methodical exam revealed strand of hair tightly wound around 3rd toe, distal toe swollen, dusky, deep circumferential groove. Afebrile 37.1°C, HR 160. Cry unrelenting until tourniquet released. Tourniquet removed, perfusion restored."

inconsolable_crying_010:
  label: false
  primary_diagnosis: "Constipation"
  presenting_complaint: "2-year-old toddler — 'cries hard when she opens her bowels but is happy in between.'"
  summary_of_note: "2yr F, ED walk-in. Painful infrequent hard stools 1 week, crying on defaecation. Between episodes playful, eating, interactive. Afebrile 36.9°C, HR 100, RR 22. Abdomen soft, palpable faecal mass LIF, no peritonism. Crying intermittent and consolable, settles fully between. Documented not inconsolable. Laxatives started."

inconsolable_crying_011:
  label: true
  primary_diagnosis: "Corneal Abrasion"
  presenting_complaint: "6-week-old infant brought by health visitor — 'screaming inconsolably and keeps the left eye shut.'"
  summary_of_note: "6/52 M, health visitor referral. Inconsolable crying 3 hours, refusing to open left eye, photophobia, tearing. Afebrile 37.0°C, HR 170, RR 46. Fluorescein staining reveals corneal epithelial defect. Cry persistent, settles only after topical anaesthetic instilled. Inconsolable distress documented pre-treatment. Ophthalmology advice obtained."

inconsolable_crying_012:
  label: false
  primary_diagnosis: "Hunger / Feeding Cue Misinterpretation"
  presenting_complaint: "3-week-old neonate, midwife referral — 'cries a lot but stops the moment we feed him.'"
  summary_of_note: "3/52 M, community midwife referral re feeding. Frequent crying, immediately consoled and quiet on feeding, then settles to sleep. Afebrile 36.8°C, HR 138, RR 40. Feeding well, gaining weight, alert and pink. No abdominal or other signs. Crying fully consolable with feeds — explicitly not inconsolable. Feeding support and reassurance provided."
