    probability: 0.78
    description: ""

  present:
    probability: 0.1
    description: "The report states that the tissue around the main lesion shows a separate small benign tumour."

  absent:
    probability: 0.06
    description: "The report states that the tissue around the main lesion shows no a separate small benign tumour."

  possible:
    probability: 0.04
    description: "The report states that the tissue around the main lesion possibly shows a separate small benign tumour."

  not_assessable:
    probability: 0.02
    description: "The report states that a separate small benign tumour in the tissue around the main lesion cannot be assessed."

# [distractor: specimen sizes, weights and core lengths that are not tumour sizes]
macroscopic_description:
  mutually_exclusive: true

  detailed:
    probability: 0.3
    description: "Include a macroscopic description of each specimen with its dimensions, weight, number and length of cores or pieces, and how it was sampled."

  brief:
    probability: 0.3
    description: "Include a one-line macroscopic description of each specimen (e.g. 'Four cores, longest 14 mm')."

  omitted:
    probability: 0.4
    description: ""

# [OncoPathModel.clinical_indication]
clinical_details:
  mutually_exclusive: true

  detailed:
    probability: 0.3
    description: "Summarise the patient's clinical history and the reason for the specimen in a clinical details section."

  brief:
    probability: 0.3
    description: "Give the clinical details as a short request-form phrase (e.g. '?malignancy', 'known IDC, for WLE')."

  with_planned_procedure:
    probability: 0.15
    description: "Give the clinical details together with the planned operation or procedure and the clinical question being asked."

  none_given:
    probability: 0.25
    description: "State that no clinical details were provided, or leave the clinical details section blank."

# [FindingStatus: cancerous, uncertain, not_cancerous]
certainty:
  mutually_exclusive: true

  stated_definitively:
    probability: 0.55
    description: "State the diagnosis definitively, with no hedging."

  hedged:
    probability: 0.15
    description: "State the diagnosis with hedged wording (e.g. 'consistent with', 'in keeping with', 'favours')."

  suspicious:
    probability: 0.1
    description: "Describe the lesion as suspicious or highly suspicious for the diagnosis without confirming it."

  cannot_exclude:
    probability: 0.08
    description: "State that the diagnosis cannot be excluded on this material, and advise further sampling."

  deferred:
    probability: 0.06
    description: "Defer the final diagnosis pending further stains or molecular tests, and state what has been requested."


# [distractors that must not be extracted as findings]
additional_content:
  mutually_exclusive: false

  depth_of_spread:
    probability: 0.12
    description: "State how deeply the tumour invades or spreads (e.g. 'invading into muscularis propria', 'extending 3 mm into fat')."

  other_site_in_clinical_details:
    probability: 0.1
    description: "Mention in the clinical details a lesion at a different site or side that is not part of the specimens received (e.g. 'right breast B3 lesion on core biopsy')."

  earlier_accession:
    probability: 0.1
    description: "Refer to an earlier specimen or accession number from a previous biopsy."

  recommendation:
    probability: 0.15
    description: "End with a recommendation (e.g. 'excision advised', 'correlate with imaging', 'for MDT discussion')."

  comment_paragraph:
    probability: 0.12
    description: "Add a comment paragraph that discusses the differential diagnosis and the reasoning."

  second_cancer_history:
    probability: 0.07
    description: "Mention that the patient has a history of a separate cancer at another site that is not part of these specimens."

  background_marker:
    probability: 0.05
    description: "Mention a biomarker result in background or normal tissue, not in the tumour (e.g. 'normal ducts show ER positivity')."

  mdt_mention:
    probability: 0.1
    description: "State that the case has been, or will be, discussed at a multidisciplinary meeting."
