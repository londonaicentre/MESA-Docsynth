## Profile IDs must be unique across all files, as output.skip_existing in pipeline.yml matches on them
## A profile holds only: working_diagnosis, immutable_features, clinical_history, possible_features.
## See the authoring brief for what each may and may not contain.

haem_001:
  working_diagnosis: "Classical Hodgkin lymphoma, nodular sclerosis subtype"
  immutable_features:
    - "CD30 positive, CD15 positive, PAX5 weak positive, CD45 negative in Hodgkin and Reed-Sternberg cells"
    - "Broad collagen bands with lacunar-type cells"
    - "EBV (EBER) negative"
    - "Prominent eosinophils and neutrophils in the background"
  clinical_history: "24-year-old woman with persistent cough, night sweats and itching for three months. Chest radiograph showed a widened mediastinum."
  possible_features:
    - "reactive follicular hyperplasia"
    - "sarcoid-like granulomas"
    - "thymic cyst"
    - "sinus histiocytosis"
    - "Castleman-like change"

haem_002:
  working_diagnosis: "Classical Hodgkin lymphoma, mixed cellularity subtype"
  immutable_features:
    - "CD30 positive, CD15 positive, MUM1 positive in Reed-Sternberg cells"
    - "EBV (EBER) positive in Hodgkin cells"
    - "Diffuse mixed infiltrate of small lymphocytes, plasma cells, eosinophils and histiocytes"
  clinical_history: "58-year-old man, HIV positive for 15 years, with unintentional weight loss and fevers. Noted an enlarging painless swelling."
