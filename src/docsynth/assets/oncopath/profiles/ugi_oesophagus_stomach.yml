    - "PD-L1 CPS 5"
    - "Adjacent high-grade dysplasia in intestinal-type metaplasia"
  clinical_history: "67-year-old man with a 15-year history of gastro-oesophageal reflux, obesity and a 30 pack-year smoking history. Presented with worsening dysphagia and weight loss."
  possible_features:
    - "Barrett's oesophagus with intestinal metaplasia"
    - "low-grade dysplasia in Barrett's oesophagus"
    - "reflux oesophagitis"
    - "gastric-type cardiac mucosa"
    - "squamous papilloma"
    - "ulceration"

