## Profile IDs must be unique across all files, as output.skip_existing in pipeline.yml matches on them
## A profile holds only: working_diagnosis, immutable_features, clinical_history, possible_features.
## See the authoring brief for what each may and may not contain.

gyn_022:
  working_diagnosis: "Squamous cell carcinoma of the cervix, non-keratinising type"
  immutable_features:
    - "Moderately differentiated (grade 2) nests with basaloid cells and brisk mitoses"
    - "p16 diffusely positive (block-type); high-risk HPV 16 detected"
    - "PD-L1 combined positive score 5"
    - "Associated high-grade squamous intraepithelial lesion (CIN 3)"
  clinical_history: "38-year-old woman, smoker (15 pack-years), who had not attended cervical screening for ten years. Presented with postcoital bleeding and a friable cervix."
  possible_features:
    - "low-grade squamous intraepithelial lesion"
    - "squamous metaplasia"
    - "endocervical polyp"
    - "nabothian cysts"
    - "chronic cervicitis"
    - "adenocarcinoma in situ"

