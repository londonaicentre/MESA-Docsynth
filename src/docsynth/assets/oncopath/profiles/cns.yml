## Profile IDs must be unique across all files, as output.skip_existing in pipeline.yml matches on them
## A profile holds only: working_diagnosis, immutable_features, clinical_history, possible_features.
## See the authoring brief for what each may and may not contain.

cns_001:
  working_diagnosis: "Glioblastoma, IDH-wildtype"
  immutable_features:
    - "CNS WHO grade 4 with microvascular proliferation and palisading necrosis"
    - "IDH1 R132H immunohistochemistry negative, IDH1/IDH2 wildtype on sequencing"
    - "MGMT promoter unmethylated (pyrosequencing)"
    - "TERT promoter mutation and EGFR amplification; TP53 wildtype"
    - "Ki-67 35%"
  clinical_history: "67-year-old man, previously fit, with a three-week history of worsening headaches, word-finding difficulty and a focal seizure. Hypertension on treatment."
  possible_features:
    - "reactive gliosis"
    - "Rosenthal fibres"
    - "perivascular lymphocytic cuffing"
    - "cortical dysplasia"
    - "gemistocytic change"

