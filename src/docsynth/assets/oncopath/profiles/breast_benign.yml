## Profile IDs must be unique across all files, as output.skip_existing in pipeline.yml matches on them
## A profile holds only: working_diagnosis, immutable_features, clinical_history, possible_features.
## See the authoring brief for what each may and may not contain.

breast_other_001:
  working_diagnosis: "Fibroadenoma of the breast"
  immutable_features:
    - "Intracanalicular growth pattern with myxoid stroma"
    - "Bland biphasic epithelial and stromal proliferation with no stromal overgrowth"
  clinical_history: "27-year-old woman who noticed a mobile, painless, well-circumscribed lump over several months. No family history of breast disease."
  possible_features:
    - "sclerosing adenosis"
    - "apocrine metaplasia"
    - "usual ductal hyperplasia"
    - "columnar cell change"
    - "epithelial calcification"

