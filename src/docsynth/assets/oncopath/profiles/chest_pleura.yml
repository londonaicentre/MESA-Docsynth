## Profile IDs must be unique across all files, as output.skip_existing in pipeline.yml matches on them
## A profile holds only: working_diagnosis, immutable_features, clinical_history, possible_features.
## See the authoring brief for what each may and may not contain.

chest_001:
  working_diagnosis: "Epithelioid mesothelioma of the pleura, tubulopapillary pattern"
  immutable_features:
    - "Low nuclear grade with tubulopapillary architecture"
    - "BAP1 nuclear expression lost; calretinin, WT1 and D2-40 positive"
    - "TTF1 negative, claudin-4 negative"
    - "CDKN2A homozygous deletion on FISH"
  clinical_history: "68-year-old man, retired shipyard lagger with 30 years of occupational asbestos exposure, ex-smoker. Presented with worsening breathlessness and chest discomfort over four months."
  possible_features:
    - "pleural plaque"
    - "reactive mesothelial hyperplasia"
    - "chronic pleuritis"
    - "anthracotic pigment"
    - "asbestos body"

chest_002:
  working_diagnosis: "Epithelioid mesothelioma of the pleura, solid pattern"
  immutable_features:
    - "High nuclear grade with solid sheets and areas of necrosis"
    - "BAP1 nuclear expression retained, calretinin and CK5/6 positive"
    - "TTF1 negative"
    - "PD-L1 TPS 5%"
    - "Ki-67 40%"
  clinical_history: "59-year-old woman, never-smoker, who worked as a school caretaker in a building with known asbestos lagging. Presented with a unilateral pleural effusion and weight loss."
  possible_features:
    - "pleural plaque"
    - "reactive mesothelial hyperplasia"
    - "chronic pleuritis"
    - "pleural calcification"

