## Profile IDs must be unique across all files, as output.skip_existing in pipeline.yml matches on them
## A profile holds only: working_diagnosis, immutable_features, clinical_history, possible_features.
## See the authoring brief for what each may and may not contain.

gyn_001:
  working_diagnosis: "High-grade serous carcinoma of the ovary"
  immutable_features:
    - "Mixed papillary, solid and slit-like architecture with marked nuclear atypia"
    - "TP53 mutant-pattern (overexpression) on immunohistochemistry; WT1 positive, PAX8 positive"
    - "Germline BRCA1 pathogenic variant"
    - "Ki-67 70%"
  clinical_history: "58-year-old woman with a strong family history of breast and ovarian cancer (mother and maternal aunt). Presented with abdominal distension, bloating and early satiety, with a raised CA125."
  possible_features:
    - "serous tubal intraepithelial carcinoma"
    - "endometriosis"
    - "serous cystadenoma"
    - "psammoma bodies"
    - "benign Brenner tumour"
    - "simple follicular cyst"

