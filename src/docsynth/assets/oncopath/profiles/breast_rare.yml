## Profile IDs must be unique across all files, as output.skip_existing in pipeline.yml matches on them
## A profile holds only: working_diagnosis, immutable_features, clinical_history, possible_features.
## See the authoring brief for what each may and may not contain.

breast_other_021:
  working_diagnosis: "Invasive carcinoma of no special type of the male breast"
  immutable_features:
    - "Nottingham grade 2 (tubule formation 3, nuclear pleomorphism 2, mitotic count 1)"
    - "ER positive (Allred 8/8), PR positive (Allred 7/8), HER2 negative (IHC 1+)"
    - "AR positive, GATA3 positive"
    - "Ki-67 12%"
  clinical_history: "69-year-old man with a hard, painless subareolar lump and nipple retraction. Father's sister had breast cancer, no known germline testing."
  possible_features:
    - "gynaecomastia"
    - "usual ductal hyperplasia"
    - "duct ectasia"
    - "pseudoangiomatous stromal hyperplasia"
    - "intraductal papilloma"

breast_other_022:
  working_diagnosis: "Encapsulated papillary carcinoma of the male breast"
  immutable_features:
    - "Fibrovascular papillary cores lacking myoepithelial cells, within a thick fibrous capsule"
    - "Intermediate nuclear grade"
    - "ER positive (Allred 8/8), PR positive (Allred 6/8), HER2 negative (IHC 0)"
  clinical_history: "74-year-old man with blood-stained nipple discharge and a retroareolar mass. Prostate cancer diagnosed years earlier, otherwise well."
  possible_features:
    - "gynaecomastia"
    - "intraductal papilloma"
    - "usual ductal hyperplasia"
    - "duct ectasia"
    - "ductal carcinoma in situ"

breast_other_023:
