# PROMPT GENERATION CONFIG - STYLE (OPERATION NOTES)
## Each section contains elements that can be sampled probabilistically
## Descriptions are prompt-ready and will be inserted directly into LLM prompts
## mutually_exclusive: true = exactly ONE item selected from section (weighted random choice)
## mutually_exclusive: false = each item sampled independently (based on independent probability)
##
## Every document is a true operation note. Style covers semantics only (author voice, register,
## length, redaction, noise); layout and format come from the structure templates.

##########
# AUTHOR #
##########
author:
  mutually_exclusive: true

  consultant:
    probability: 0.40
    description: "The note is written by the consultant surgeon who performed the operation."

  registrar:
    probability: 0.35
    description: "The note is written by the operating or assisting registrar."

  junior:
    probability: 0.15
    description: "The note is written by a junior doctor (e.g. FY2, core trainee) who assisted, possibly recording the surgeon's words."

  other_operator:
    probability: 0.10
    description: "The note is written by a non-surgeon operator where that suits the procedure (e.g. endoscopist, interventional radiologist, cardiologist, surgical care practitioner, advanced nurse practitioner); otherwise by the consultant surgeon."

#################
# WRITING STYLE #
#################
writing_style:
  mutually_exclusive: true

  telegraphic:
    probability: 0.45
    description: "IMPORTANT: Use a telegraphic register: short phrases, heavy abbreviation, dropped articles and verbs (e.g. 'GA. Supine. Prep + drape. 3 ports.')."

  plain_clinical:
    probability: 0.30
    description: "IMPORTANT: Use a plain clinical register: short complete sentences with common surgical abbreviations."

  formal_prose:
    probability: 0.25
    description: "IMPORTANT: Use a formal, fully written register: grammatically complete sentences, few abbreviations, precise anatomical terminology."

##########
# LENGTH #
##########
length:
  mutually_exclusive: true

  very_short:
    probability: 0.25
    description: "IMPORTANT: The note is very short - a handful of lines, recording only the essentials."

  standard:
    probability: 0.50
    description: "The note is of typical length for this operation."

  long:
    probability: 0.25
    description: "The note is long and thorough, detailing each operative step, the findings and the post-operative instructions."

################
# HEADER STYLE #
################
header_style:
  mutually_exclusive: true

  complex_header:
    probability: 0.25
    description: "Use a full header: trust and hospital name, theatre number, patient demographics and identifiers, date, list type, and the full theatre team (surgeon, assistant(s), anaesthetist, scrub nurse)."

  standard_header:
    probability: 0.45
    description: "Use a standard header: patient identifier, date, surgeon and assistant, and the procedure name."

  minimal_header:
    probability: 0.20
    description: "Use a minimal header: date and procedure name only."

  no_header:
    probability: 0.10
    description: "Omit any header; start directly with the procedure or operative findings."

################
# FOOTER STYLE #
################
footer_style:
  mutually_exclusive: true

  formal_footer:
    probability: 0.30
    description: "End with a formal sign-off: author name, grade, GMC number, date and time, and an electronic signature line."

  basic_footer:
    probability: 0.40
    description: "End with the author's name or initials and grade only."

  no_footer:
    probability: 0.30
    description: "Omit a footer; end with the post-operative instructions."

###################
# REDACTION STYLE #
###################
redaction_style:
  mutually_exclusive: true

  fully_redacted:
    probability: 0.33
    description: "ALL personally identifiable information including names of patients/clinicians, hospital names, unique IDs, and dates of birth must be redacted by replacing with [redacted]."

  partially_redacted:
    probability: 0.33
    description: "The document is poorly redacted, with around 50% of personally identifiable information remaining visible, while other PID is replaced by [redacted]."

  not_redacted:
    probability: 0.34
    description: "The synthetic document should contain realistic synthetic personally identifiable information, including names, hospital locations, and IDs."

################
# DATA QUALITY #
################
data_quality_issues:
  mutually_exclusive: true

  none:
    probability: 0.60
    description: ""

  speech_recognition_errors:
    probability: 0.10
    description: "Include occasional speech recognition errors typical of dictated notes (e.g. 'ileum' for 'ilium', 'perineal' for 'peroneal', 'vicryl' as 'vi-kill')."

  misspelled_terms:
    probability: 0.10
    description: "Include occasional misspellings or typos in medical terms, as in rapid free-text entry."

  inconsistent_formatting:
    probability: 0.10
    description: "Formatting is inconsistent (e.g. mixed date and time formats, irregular spacing, mixed case, stray line breaks)."

  unfilled_template_fields:
    probability: 0.10
    description: "Leave one or two items blank or with placeholder text as busy surgeons do (e.g. 'Blood loss: ', 'Tourniquet: ___', 'Implants: see sticker')."
