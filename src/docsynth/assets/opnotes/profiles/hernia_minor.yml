hernia_minor_001:
  operation: "Lichtenstein repair, left inguinal hernia"
  description: "62-year-old man with a symptomatic left indirect inguinal hernia. Elective day case."
  implants: "Prolene mesh 7.5 x 15 cm"
  complications: "Ilioinguinal nerve caught in the mesh-fixing suture at the lateral edge; suture removed and the nerve freed before closure."

hernia_minor_002:
  operation: "Laparoscopic TEP bilateral inguinal hernia repair"
  description: "49-year-old man with bilateral groin hernias, ex-smoker. Day case."
  implants: "Bard 3DMax Light mesh, large, bilateral"
  complications: "Peritoneal tear during balloon dissection causing loss of the extraperitoneal space; Veress needle placed in the umbilicus to vent the pneumoperitoneum and the tear closed with an Endoloop."

hernia_minor_003:
  operation: "Lap TAPP right inguinal hernia repair"
  description: "57-year-old woman with right groin pain and an indirect inguinal hernia on ultrasound. Elective."
  implants: "Parietex ProGrip laparoscopic 15 x 10 cm mesh"
  complications: "Bleeding from a branch of the inferior epigastric vessels during flap creation, controlled with bipolar diathermy."

hernia_minor_004:
  operation: "Open right femoral hernia repair with mesh plug"
  description: "74-year-old woman with a painful reducible right femoral hernia. Elective."
  implants: "Prolene Hernia System plug, small"
  complications: "Small tear in the hernia sac with a serosal graze to the underlying small bowel; serosa oversewn with 3-0 PDS and bowel returned."

hernia_minor_005:
  operation: "Laparoscopic ventral hernia repair (IPOM)"
  description: "60-year-old woman with a 5 cm midline incisional hernia and BMI 35. Elective."
  implants: "Symbotex composite mesh 20 x 15 cm, AbsorbaTack fixation"
  complications: "Composite mesh tore at a tack point while being tensioned across the defect; removed and replaced with a new mesh of the same size."

hernia_minor_006:
  operation: "Umbilical hernia repair with Ventralex ST patch"
  description: "47-year-old man with a 2.5 cm symptomatic umbilical hernia. Day case."
  implants: "Ventralex ST patch, small (4.3 cm)"
  complications: "Patch folded on insertion and lay unevenly on intraperitoneal palpation; withdrawn, re-rolled and repositioned flat."

hernia_minor_007:
  operation: "Right inguinal herniotomy"
  description: "7-month-old boy with a reducible right inguinal hernia. Paediatric day case."
  complications: "Small tear in the thin hernia sac at the neck on dissection from the cord, controlled with a transfixion ligature above the tear."

hernia_minor_008:
  operation: "Robotic eTEP ventral hernia repair"
  description: "51-year-old man with a 4 cm epigastric hernia and rectus diastasis. Elective robotic list."
  implants: "Polypropylene mesh 30 x 15 cm, retromuscular, unfixed"
  complications: "Subcutaneous emphysema of the chest wall and rising end-tidal CO2; insufflation pressure reduced and the case completed without further issue."

hernia_minor_009:
  operation: "Open repair of right femoral hernia under local anaesthetic"
  description: "84-year-old woman with heart failure and a symptomatic right femoral hernia. Elective local anaesthetic list."
  implants: "Prolene mesh plug, rolled"
  complications: "Vasovagal episode with bradycardia to 38 during infiltration of the groin, treated with atropine and legs raised."

hernia_minor_010:
  operation: "Laparoscopic Sugarbaker parastomal hernia repair"
  description: "66-year-old man with an end ileostomy and a large symptomatic parastomal hernia. Elective."
  implants: "DynaMesh-IPST 25 x 25 cm, ProTack fixation"
  complications: "Small enterotomy in the ileum during adhesiolysis, repaired laparoscopically with 3-0 V-Loc; no contamination and mesh placement proceeded."

hernia_minor_011:
  operation: "Open incisional hernia repair (retrorectus sublay)"
  description: "62-year-old woman with a 7 cm midline hernia, type 2 diabetes and BMI 32. Elective."
  implants: "Phasix biosynthetic mesh 30 x 20 cm"
  complications: "Core temperature fell to 35.0 C during the prolonged dissection; forced-air warmer and warmed fluids used and temperature normalised by closure."
