upper_gi_major_001:
  operation: "Ivor Lewis oesophagectomy (open)"
  description: "67-year-old man with a T3 lower oesophageal adenocarcinoma after FLOT chemotherapy. Elective."
  complications: "Azygos vein stump bled after a stapler misfire with about 2.5 litres lost; controlled with sutures via the thoracotomy, 4 units red cells and FFP transfused."

upper_gi_major_002:
  operation: "Minimally invasive McKeown oesophagectomy"
  description: "59-year-old woman with a mid-oesophageal squamous carcinoma after chemoradiotherapy. Elective."
  complications: "Left recurrent laryngeal nerve divided during upper mediastinal node dissection; ENT informed and cords reviewed after extubation."

upper_gi_major_003:
  operation: "Thoracoscopic-laparoscopic oesophagectomy converted to thoracotomy"
  description: "64-year-old man with a bulky distal oesophageal tumour after neoadjuvant chemotherapy. Elective."
  complications: "1.5 cm tear of the membranous trachea during subcarinal dissection; converted to thoracotomy and repaired with interrupted 4/0 PDS, reinforced with an intercostal muscle flap."

upper_gi_major_004:
  operation: "Staging laparoscopy and planned Ivor Lewis oesophagectomy"
  description: "71-year-old man with a Siewert I GOJ adenocarcinoma after FLOT chemotherapy, restaging CT clear. Elective."
  complications: "Procedure abandoned after the laparoscopy, as frozen section of peritoneal nodules confirmed metastatic adenocarcinoma."

upper_gi_major_005:
  operation: "Open total gastrectomy with D2 lymphadenectomy"
  description: "63-year-old man with a proximal gastric carcinoma on the greater curve, after perioperative chemotherapy. Elective."
  complications: "Splenic hilar vessel tear during node dissection with haemorrhage that could not be controlled; splenectomy performed and 3 units transfused."

upper_gi_major_006:
  operation: "Laparoscopic distal gastrectomy converted to open"
  description: "57-year-old woman with a cT3 N1 antral adenocarcinoma after neoadjuvant chemotherapy. Elective."
  complications: "Common hepatic artery injured during node station 8 dissection; converted to laparotomy and vascular surgeon repaired it with a primary suture."

upper_gi_major_007:
  operation: "Lap Heller myotomy and Dor"
  description: "33-year-old woman with type II achalasia on HRM, dysphagia and 10 kg weight loss over a year. Elective."
  complications: "Full-thickness 3 cm oesophageal perforation extending into the gastric wall; primary two-layer repair, myotomy moved to the opposite side and Dor wrap placed over it."

upper_gi_major_008:
  operation: "POEM"
  description: "74-year-old man with type I achalasia and a sigmoid oesophagus. Elective under GA."
  complications: "Sudden drop in end-tidal CO2 with hypotension and desaturation, treated as CO2 embolism; insufflation stopped, Durant position, recovered and procedure abandoned."

upper_gi_major_009:
  operation: "Laparoscopic para-oesophageal hernia repair and Toupet"
  description: "80-year-old woman with a giant type III hiatus hernia, recurrent vomiting and aspiration pneumonia. Elective."
  complications: "Tension capnothorax with cardiovascular collapse during mediastinal dissection; desufflated, right chest drain inserted and the procedure completed at lower pressures."

upper_gi_major_010:
  operation: "Laparoscopic Nissen fundoplication"
  description: "51-year-old man with PPI-refractory reflux, a 4 cm sliding hiatus hernia and abnormal pH study. Elective."
  complications: "Oesophageal perforation from the calibration bougie; converted to open, repaired primarily and fundoplication done over the repair."

upper_gi_major_011:
  operation: "Emergency laparotomy and omental patch repair of perforated DU"
  description: "88-year-old woman with 3 days of abdominal pain, septic shock and lactate 8. Emergency."
  complications: "Asystolic cardiac arrest during washout; CPR for 35 minutes without return of circulation and the patient died on table."

upper_gi_major_012:
  operation: "Laparotomy, oversew of perforated gastric ulcer"
  description: "70-year-old man with a week of vomiting from gastric outlet obstruction, now with a perforated gastric ulcer and peritonitis. Emergency."
  complications: "Aspiration of a large volume of gastric contents at induction despite rapid sequence induction; bronchoscopic toilet and admitted ventilated to ICU."

upper_gi_major_013:
  operation: "Laparoscopic sleeve gastrectomy"
  description: "39-year-old woman with BMI 55, hypertension and back pain, through the tier 4 weight management programme. Elective."
  complications: "Orogastric tube caught in the first stapler firing and stapled into the sleeve; staple line resected and the defect oversewn over a new bougie."

upper_gi_major_014:
  operation: "Laparoscopic Roux-en-Y gastric bypass"
  description: "45-year-old man with BMI 60, obstructive sleep apnoea on CPAP and type 2 diabetes. Elective bariatric list."
  complications: "Could not intubate or oxygenate adequately after induction; front-of-neck access (scalpel cricothyroidotomy) performed and surgery cancelled."

upper_gi_major_015:
  operation: "Laparoscopic sleeve gastrectomy"
  description: "32-year-old woman with BMI 44, asthma and PCOS, through the tier 4 bariatric pathway. Elective."
  complications: "Anaphylaxis after cefuroxime with bronchospasm and hypotension; treated with IM and IV adrenaline, surgery abandoned and transferred to ICU."

upper_gi_major_016:
  operation: "Laparoscopic adjustable gastric band insertion"
  description: "47-year-old woman with BMI 40 and type 2 diabetes who prefers an adjustable band to a stapled procedure. Elective."
  complications: "Posterior gastric wall perforated while making the retrogastric tunnel, seen on methylene blue test; perforation repaired, band not placed and procedure abandoned."

upper_gi_major_017:
  operation: "OGD, oesophageal stent insertion"
  description: "76-year-old man with an inoperable GOJ adenocarcinoma and dysphagia to solids, liver metastases. Palliative inpatient list."
  implants: "WallFlex partially covered oesophageal stent 23 x 150 mm"
  complications: "First stent migrated fully into the stomach on deployment; retrieved with a snare and a longer stent inserted."

upper_gi_major_018:
  operation: "OGD + balloon dilatation of oesophageal stricture"
  description: "64-year-old woman with a radiation stricture of the upper oesophagus after radiotherapy for laryngeal cancer. Day case."
  implants: "Hanarostent fully covered oesophageal stent 18 x 100 mm"
  complications: "Oesophageal perforation after dilatation to 15 mm, with surgical emphysema; fully covered stent placed to seal it and admitted nil by mouth."

upper_gi_major_019:
  operation: "Emergency OGD + variceal banding"
  description: "55-year-old man with alcohol-related cirrhosis and massive haematemesis, intubated in ED, on terlipressin. Out of hours."
  complications: "Uncontrolled bleeding despite banding; Danis stent placed, 6 units red cells transfused under massive haemorrhage protocol and transferred for TIPS."

upper_gi_major_020:
  operation: "Gastroscopy, ESD of oesophageal squamous neoplasia"
  description: "61-year-old man, heavy drinker and smoker, with a 4 cm area of high-grade squamous dysplasia in the mid oesophagus. Elective."
  complications: "Full-thickness perforation with pneumomediastinum and tension pneumoperitoneum; needle decompression, clips, procedure abandoned and admitted to HDU."

upper_gi_major_021:
  operation: "OGD and planned EMR of Barrett's nodule"
  description: "69-year-old man with long-segment Barrett's oesophagus and a 1.5 cm nodule at 36 cm, referred from another trust. Elective."
  complications: "EMR taken from a flat area at 32 cm after a mismatch between the referral and the endoscopy report; recognised straight after and the correct nodule then resected. Datix completed."

upper_gi_major_022:
  operation: "PEG insertion"
  description: "80-year-old woman with dysphagia after a stroke and severe aortic stenosis. Inpatient."
  complications: "Bradycardia leading to PEA arrest during sedation; ROSC after 4 minutes of CPR and adrenaline, procedure abandoned."

upper_gi_major_023:
  operation: "Laparoscopic pyloromyotomy"
  description: "3-week-old boy, 3.4 kg, with hypertrophic pyloric stenosis on ultrasound, electrolytes corrected. Neonatal list."
  complications: "Ten-fold overdose of paracetamol prescribed and given intravenously; toxicology advice taken, acetylcysteine started and Datix raised."

upper_gi_major_024:
  operation: "Laparoscopic gastrojejunostomy"
  description: "69-year-old man with gastric outlet obstruction from an unresectable duodenal cancer, on TPN. Urgent inpatient."
  complications: "Post-closure X-ray for a missing needle count showed the needle in the left upper quadrant; the wound was reopened and the needle retrieved laparoscopically."

upper_gi_major_025:
  operation: "Open total gastrectomy and Roux-en-Y"
  description: "58-year-old woman with a signet ring gastric carcinoma of the body and fundus, after FLOT chemotherapy. Elective."
  complications: "Tail of the pancreas injured during splenic hilar dissection; distal pancreatectomy added with the HPB team."
