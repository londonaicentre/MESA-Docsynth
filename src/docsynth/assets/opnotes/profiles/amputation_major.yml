amputation_major_001:
  operation: "Right above-knee amputation"
  description: "79-year-old woman with ischaemic heart disease and an infected, non-viable right leg with rest pain. Palliative care involved."
  complications: "Femoral artery ligature slipped after closure of fascia with a rapidly expanding thigh; wound reopened, artery re-ligated and transfused 3 units."

amputation_major_002:
  operation: "Below-knee amputation L"
  description: "73-year-old man with diabetes, ischaemic cardiomyopathy and a gangrenous left foot."
  complications: "VF arrest at tourniquet release; defibrillated twice with ROSC, amputation completed and transferred to ICU."

amputation_major_003:
  operation: "Amputation of left 4th toe"
  description: "68-year-old woman with diabetes and a gangrenous fourth toe of the left foot. Day case podiatric surgery list."
  complications: "The third toe was prepared and marked in error; wrong-site amputation prevented only when the scrub nurse questioned it at incision, correct toe then amputated and incident reported."

amputation_major_004:
  operation: "Replantation of left hand at the wrist"
  description: "31-year-old woman with a traumatic amputation at the radiocarpal level from a factory roller, part cooled and brought with her."
  implants: "4 x 1.6 mm K-wires across radiocarpal and intercarpal joints (wrist fusion position), cut and buried"
  complications: "Hyperkalaemia with arrhythmia after reperfusion of the hand; treated with calcium, insulin-dextrose and bicarbonate before the vein repairs were completed."

amputation_major_005:
  operation: "Through-knee amputation, left"
  description: "84-year-old man with extensive gangrene of the left foot and leg; bedbound after a stroke."
  complications: "Planned through-knee level abandoned when muscle was non-viable at the knee; converted to above-knee amputation."

amputation_major_006:
  operation: "Refashioning of right transfemoral stump with femoral shortening"
  description: "64-year-old man with a prominent femoral end and stump pain, unable to use his prosthesis."
  complications: "Sciatic nerve divided inadvertently high during mobilisation of the posterior flap with haemorrhage from the accompanying artery; artery ligated, nerve buried in muscle and injury documented."

amputation_major_007:
  operation: "Replantation of right thumb"
  description: "46-year-old man with an avulsion thumb amputation at the MCPJ level from a rope injury while sailing."
  implants: "Synthes 2.0 mm locking plate 4-hole for MCPJ arthrodesis"
  complications: "Replant remained white despite vein-graft arterial reconstruction; after repeated revision failed it was judged non-viable and the thumb terminalised."
