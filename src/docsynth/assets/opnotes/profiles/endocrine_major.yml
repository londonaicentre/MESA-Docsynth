endocrine_major_001:
  operation: "Planned total thyroidectomy (right lobectomy performed)"
  description: "51-year-old woman with a large toxic multinodular goitre, euthyroid on carbimazole. Elective."
  complications: "Loss of signal on the right recurrent laryngeal nerve that did not come back; operation stopped after the right side, with the left lobe to be done later."

endocrine_major_002:
  operation: "Total thyroidectomy + central neck dissection"
  description: "46-year-old man with papillary thyroid carcinoma and bulky central nodal disease. Elective."
  complications: "Left recurrent laryngeal nerve cut by accident in the paratracheal nodes; repaired end to end with 9/0 nylon under the microscope."

endocrine_major_003:
  operation: "Completion thyroidectomy with bilateral central compartment clearance"
  description: "38-year-old woman with a 5 cm papillary carcinoma and central nodal disease; remaining lobe in situ. Elective."
  complications: "No viable parathyroid tissue could be identified on either side and PTH was undetectable at the end; two devascularised glands found in the specimen were autotransplanted into the forearm."

endocrine_major_004:
  operation: "Total thyroidectomy with median sternotomy"
  description: "73-year-old woman with a large retrosternal goitre, stridor on exertion and tracheal compression on CT."
  complications: "Awake fibreoptic intubation failed; airway secured by rigid bronchoscopy with a thoracic surgeon ready, then the case completed."

endocrine_major_005:
  operation: "Total thyroidectomy"
  description: "62-year-old man with a large multinodular goitre and tracheal deviation. Elective."
  complications: "Trachea perforated by the energy device; repaired with sutures and a strap muscle flap, with a planned return to ICU."

endocrine_major_006:
  operation: "Total thyroidectomy, central and left lateral neck dissection"
  description: "57-year-old woman with papillary carcinoma and left lateral nodal disease. Elective."
  complications: "Oesophageal muscle and mucosa injured during central dissection; repaired in two layers and an NG tube placed."

endocrine_major_007:
  operation: "Focused right inferior parathyroidectomy"
  description: "64-year-old woman with primary hyperparathyroidism and a right inferior adenoma on sestamibi and ultrasound."
  complications: "Left neck explored because the scan was misread; normal gland seen on frozen section, then the right-sided adenoma removed and duty of candour done."

endocrine_major_008:
  operation: "Bilateral neck exploration for parathyroid adenoma"
  description: "70-year-old man with primary hyperparathyroidism, calcium 3.0 and non-localising imaging."
  complications: "No adenoma found after a four-gland exploration and PTH did not fall; operation stopped, with further imaging planned."

endocrine_major_009:
  operation: "Laparoscopic right adrenalectomy converted to open"
  description: "59-year-old man with a 6 cm right adrenal tumour and Cushing's syndrome. Elective."
  complications: "IVC tear at the entry of the right adrenal vein; converted to open, repaired with 5/0 Prolene and 4 units transfused."

endocrine_major_010:
  operation: "Lap left adrenalectomy"
  description: "47-year-old woman with a 4.5 cm left adrenal adenoma and subclinical cortisol excess, with worsening diabetes and hypertension."
  complications: "Splenic flexure of the colon injured during mobilisation; repaired primarily with colorectal help."

endocrine_major_011:
  operation: "Laparoscopic right adrenalectomy (phaeochromocytoma)"
  description: "66-year-old man with a 5 cm right phaeochromocytoma found on CT for flank pain, alpha- and beta-blocked."
  complications: "VF arrest during tumour handling; defibrillated with return of circulation after two shocks and the operation completed."

endocrine_major_012:
  operation: "Total thyroidectomy"
  description: "35-year-old woman with relapsing Graves' disease and a rash on carbimazole, keen for definitive surgery. Elective."
  complications: "Anaphylaxis after rocuronium at induction; treated with adrenaline and surgery postponed."

endocrine_major_013:
  operation: "Urgent total thyroidectomy"
  description: "28-year-old woman with Graves' disease and agranulocytosis on carbimazole, prepared with Lugol's iodine and steroids."
  complications: "Thyroid storm during mobilisation with fever to 39.5 C, tachycardia and hypertension; treated with esmolol, cooling and hydrocortisone and moved to ICU."

endocrine_major_014:
  operation: "Open left adrenalectomy"
  description: "49-year-old woman with a 10 cm left adrenocortical carcinoma, virilising, with no distant disease on CT. Adrenal MDT."
  complications: "Tumour capsule ruptured with spillage into the retroperitoneum; bed washed out and the oncology team informed."
