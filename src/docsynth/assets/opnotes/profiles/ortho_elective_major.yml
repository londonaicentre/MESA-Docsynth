ortho_elective_major_001:
  operation: "Right knee arthroscopy, partial medial meniscectomy"
  description: "39-year-old man with a locked right knee from a bucket-handle medial meniscal tear. Urgent day-case list."
  complications: "At the team time-out the left knee was found to have been prepped and draped, with the site mark hidden under the tourniquet; stopped before incision, re-prepped and draped, and the right knee operated on. Datix completed and patient informed."

ortho_elective_major_002:
  operation: "Image-guided subtalar joint injection, right"
  description: "58-year-old woman with subtalar arthritis of the right hindfoot; diagnostic injection under image intensifier."
  complications: "Steroid and local anaesthetic injected into the left subtalar joint before the error was recognised; right side then injected, patient informed under duty of candour and a serious incident reported."

ortho_elective_major_003:
  operation: "ACL reconstruction (hamstring autograft), right knee"
  description: "23-year-old female footballer with a right ACL rupture and instability."
  implants: "TightRope RT; 9 mm BioComposite interference screw"
  complications: "Prepared graft dropped on the theatre floor; discarded, contralateral hamstrings harvested with the patient's prior consent, and extended antibiotics given."

ortho_elective_major_004:
  operation: "Medial opening wedge HTO, left (TomoFix)"
  description: "49-year-old man with left medial compartment OA and varus alignment, keen to continue skiing."
  implants: "TomoFix medial HTO plate; ChronOS wedge"
  complications: "Arterial bleeding from the posterior tibial cut; popliteal artery injury repaired by vascular surgeons with an interposition vein graft, 3 units transfused."

ortho_elective_major_005:
  operation: "Posterolateral corner reconstruction + ACLR, left knee"
  description: "31-year-old man with left knee posterolateral and ACL instability after a football tackle."
  implants: "TightRope RT x2; 3 x 7 mm interference screws; Achilles allograft"
  complications: "Common peroneal nerve found partly divided during fibular tunnel preparation; repaired by the plastic surgery team with a sural nerve graft."

ortho_elective_major_006:
  operation: "Open inferior capsular shift, left shoulder"
  description: "22-year-old woman with multidirectional instability of the left shoulder and failed rehabilitation."
  implants: "2 x Mitek anchors"
  complications: "Axillary nerve lacerated during the inferior capsular incision; primary repair by the peripheral nerve team under the microscope."

ortho_elective_major_007:
  operation: "Hip arthroscopy + labral repair, right"
  description: "34-year-old female runner with right hip FAI and a labral tear. Traction table."
  complications: "Abdominal distension with rising airway pressures and hypotension from intra-abdominal fluid extravasation; procedure abandoned, general surgeons performed a laparoscopic drainage and the patient went to ICU."

ortho_elective_major_008:
  operation: "Knee arthroscopy + HTO (arthroscopic assessment first), right"
  description: "44-year-old man with right medial compartment knee OA and varus malalignment."
  implants: "TomoFix medial HTO plate"
  complications: "Tense calf after arthroscopic pump fluid extravasation, compartment pressure 50 mmHg; two-incision four-compartment fasciotomy performed."

ortho_elective_major_009:
  operation: "MUA left shoulder"
  description: "74-year-old woman with osteoporosis and severe adhesive capsulitis of the left shoulder."
  complications: "Crack felt during manipulation; image intensifier showed an undisplaced surgical neck fracture of the humerus, manipulation stopped and managed in a sling."

ortho_elective_major_010:
  operation: "MUA right knee"
  description: "79-year-old man with a stiff right knee replacement, flexion to 60 degrees."
  complications: "Periprosthetic supracondylar femoral fracture during flexion; manipulation abandoned and the fracture fixed later with a distal femoral locking plate."

ortho_elective_major_011:
  operation: "Triple fusion, left (tourniquet)"
  description: "61-year-old woman with a rigid pes planovalgus and hindfoot arthritis, left."
  implants: "2 x 7.0 mm cannulated screws; 2 x compression staples"
  complications: "Thigh tourniquet inflated for 190 minutes because of a difficult coalition; full-thickness burn under the cuff from pooled skin prep found at the end, referred to plastics."

ortho_elective_major_012:
  operation: "Arthroscopic Bankart, right, converted to open"
  description: "25-year-old male rugby player with recurrent right anterior shoulder instability."
  implants: "3 x Mitek Gryphon anchors"
  complications: "Arthroscopic fluid pump failed with no backup available and view lost; converted to an open deltopectoral Bankart repair."

ortho_elective_major_013:
  operation: "Shoulder arthroscopy, SAD (right), beach chair"
  description: "58-year-old man with right shoulder impingement, listed for interscalene block and GA."
  complications: "Sudden bradycardia and asystole after sitting up in beach chair (Bezold-Jarisch reflex); 1 minute of CPR and adrenaline with ROSC, procedure abandoned."

ortho_elective_major_014:
  operation: "Arthroscopic partial medial meniscectomy, left"
  description: "63-year-old woman with a degenerate medial meniscal tear and locking."
  complications: "Tip of the arthroscopic punch broke off and could not be found in the joint on arthroscopy or image intensifier; left in situ, patient informed and plan made for review."

ortho_elective_major_015:
  operation: "Periacetabular osteotomy, left"
  description: "19-year-old woman with symptomatic left hip dysplasia."
  implants: "3 x 4.5 mm cortical screws"
  complications: "Anaphylaxis to gelatin colloid with hypotension and urticaria; treated with adrenaline, procedure completed and patient to HDU."

ortho_elective_major_016:
  operation: "Curettage of aneurysmal bone cyst + bone grafting, R proximal humerus"
  description: "11-year-old boy with an expansile aneurysmal bone cyst of the right proximal humerus."
  implants: "Allograft chips; Stimulan"
  complications: "Brisk bleeding from the cyst cavity with an estimated 1200 ml loss; controlled by packing and rapid curettage, 2 units transfused."

ortho_elective_major_017:
  operation: "Curettage, cementation and intramedullary nail, right femur (myeloma)"
  description: "72-year-old man with multiple myeloma and an impending pathological fracture of the right femoral shaft."
  implants: "Gamma3 long nail 11 x 360 mm; Palacos cement"
  complications: "Desaturation, hypotension and tachycardia during canal reaming, treated as fat embolism; case completed with inotropes and the patient went to ICU."

ortho_elective_major_018:
  operation: "Arthrotomy and washout left hip"
  description: "78-year-old man with septic arthritis of the left native hip and bacteraemia."
  complications: "Septic shock during the washout needing noradrenaline and fluid resuscitation; procedure shortened and patient to ICU."

ortho_elective_major_019:
  operation: "Anterior ankle arthroscopy + debridement, left"
  description: "35-year-old man with anterior ankle impingement after repeated sprains."
  complications: "Superficial peroneal nerve divided at the anterolateral portal; repaired primarily under the microscope."

ortho_elective_major_020:
  operation: "MPFL reconstruction + tibial tubercle osteotomy, right"
  description: "16-year-old girl with recurrent right patellar dislocations and a lateralised tubercle."
  implants: "2 x 3.5 mm SwiveLock (patella); 7 mm interference screw; tension band wire (tubercle)"
  complications: "Tibial tubercle fragment fractured on screw insertion; fixation changed to a tension band wire construct and weight bearing restricted."

ortho_elective_major_021:
  operation: "1st MTPJ fusion, left"
  description: "66-year-old woman with painful hallux rigidus and a documented penicillin anaphylaxis."
  complications: "Co-amoxiclav given at induction despite the allergy label, followed by bronchospasm and hypotension; treated with adrenaline, operation abandoned and patient to HDU."

ortho_elective_major_022:
  operation: "Open washout right hip (septic), paediatric"
  description: "2-year-old girl with a fever and a pseudoparalysis of the right leg; septic hip on ultrasound."
  complications: "Severe laryngospasm at induction with desaturation and bradycardia, needing suxamethonium, atropine and reintubation; washout then completed."

ortho_elective_major_023:
  operation: "Hip arthroscopy, left (FAI)"
  description: "41-year-old man with left cam FAI and a stiff muscular build."
  complications: "Joint could not be distracted despite maximal traction and capsular release; procedure abandoned and listed for open surgical dislocation."

ortho_elective_major_024:
  operation: "Arthroscopic ACL reconstruction, left (quadriceps graft)"
  description: "29-year-old female rugby player with a left ACL rupture."
  implants: "ULTRABUTTON femoral; 10 mm BIOSURE screw tibial; allograft tunnel dowel"
  complications: "Femoral tunnel found too anterior on post-fixation imaging; graft removed, tunnel filled with allograft and a new anatomical tunnel drilled."

ortho_elective_major_025:
  operation: "Curettage, phenol and cementation of giant cell tumour, left proximal tibia"
  description: "28-year-old man with a Campanacci grade 2 giant cell tumour of the left proximal tibia on denosumab."
  implants: "Palacos cement; 3.5 mm proximal tibial locking plate"
  complications: "Thin anterior cortex breached by the burr with spillage of tumour into the surrounding soft tissue; contaminated tissue excised, wound irrigated and sarcoma MDT informed."
