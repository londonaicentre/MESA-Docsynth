urology_andrology_major_001:
  operation: "Right inguinal orchidectomy"
  description: "24-year-old man with a right testicular tumour and a normal left testis on ultrasound. Urgent."
  complications: "Consent form and marking stated right, but the left groin was prepped and incised before a scrub nurse challenged it; the wound was closed and the correct right orchidectomy done, Duty of Candour completed."

urology_andrology_major_002:
  operation: "Left radical orchidectomy with testicular prosthesis"
  description: "38-year-old man with a 3 cm left testicular tumour on ultrasound and raised AFP, wanting a prosthesis. Urgent."
  implants: "Nagor testicular prosthesis, large"
  complications: "Prosthesis found to be too large and pushed through the scrotal wound at closure; replaced with a medium size after opening a new device."

urology_andrology_major_003:
  operation: "Bilateral orchidopexy (paediatric)"
  description: "2-year-old boy with bilateral high inguinal testes. Paediatric urology list."
  complications: "Right testicular vessels divided during dissection of a high testis; the testis was left in the scrotum on the vasal blood supply, with a real risk of atrophy."

urology_andrology_major_004:
  operation: "Scrotal exploration and bilateral orchidopexy"
  description: "12-year-old boy with sudden left scrotal pain. Emergency, out of hours."
  complications: "Laryngospasm on emergence with desaturation to 60 percent needing suxamethonium and reintubation; recovered fully in PACU."

urology_andrology_major_005:
  operation: "Micro-TESE (bilateral)"
  description: "35-year-old man with non-obstructive azoospermia and high FSH, partner going through IVF the same day. Elective."
  complications: "No sperm found in either testis after full microdissection, so the procedure was stopped with no sperm stored."

urology_andrology_major_006:
  operation: "Bilateral vasectomy"
  description: "39-year-old man with a completed family and a partner who cannot use hormonal contraception. Outpatient."
  complications: "Right testicular artery tied with the vas in error, found on reviewing the specimen; urgent scrotal exploration showed a well-perfused testis."

urology_andrology_major_007:
  operation: "Vasectomy reversal (bilateral vasoepididymostomy)"
  description: "48-year-old man and his partner wanting a child. Elective microsurgical list."
  complications: "Operating microscope failed and no spare was available; the procedure was abandoned after exploration and rebooked."

urology_andrology_major_008:
  operation: "Circumcision, paediatric"
  description: "7-year-old boy with recurrent balanoposthitis and phimosis. Day case."
  complications: "Glans injury with partial amputation of the glans tip from the clamp; repaired immediately by the paediatric urology consultant."

urology_andrology_major_009:
  operation: "Circumcision (adult, GA)"
  description: "70-year-old man with lichen sclerosus and phimosis, on warfarin (held). Day case."
  complications: "Persistent haemorrhage after closure causing a large penile haematoma; re-explored in theatre and a bleeding dorsal vessel tied."

urology_andrology_major_010:
  operation: "Inflatable penile prosthesis insertion (AMS 700)"
  description: "67-year-old man with erectile dysfunction after radiotherapy. Elective."
  implants: "AMS 700 CX 18 cm cylinders, 65 ml reservoir"
  complications: "Urethral injury during distal corporal dilation; the prosthesis was abandoned, the urethra repaired and a catheter placed."

urology_andrology_major_011:
  operation: "Coloplast Titan penile prosthesis insertion"
  description: "55-year-old man with type 1 diabetes and severe erectile dysfunction. Elective."
  implants: "Coloplast Titan Touch 20 cm cylinders, 100 ml reservoir"
  complications: "Cylinder crossover found on test inflation; the corporotomy was reopened and the cylinder moved into the right corpus."

urology_andrology_major_012:
  operation: "Three-piece penile prosthesis (AMS 700 LGX)"
  description: "60-year-old man with Peyronie's disease and erectile dysfunction. Elective."
  implants: "AMS 700 LGX 18 cm cylinders, 100 ml reservoir"
  complications: "Bladder injured while placing the reservoir in the space of Retzius, seen as haematuria; repaired and the reservoir moved to an ectopic submuscular position."

urology_andrology_major_013:
  operation: "Partial penectomy"
  description: "74-year-old man with penile squamous cell carcinoma of the glans. 2WW."
  complications: "Frozen section showed a positive urethral margin; went on to total penectomy and perineal urethrostomy."

urology_andrology_major_014:
  operation: "Hypospadias repair (proximal, staged, first stage)"
  description: "2-year-old boy with penoscrotal hypospadias and chordee. Paediatric urology list."
  complications: "Accidental injection of lidocaine with adrenaline into the glans instead of the planned plain lidocaine; glans blanched and was watched closely until it recovered."

urology_andrology_major_015:
  operation: "Insertion of inflatable penile prosthesis, penoscrotal (AMS 700 CX)"
  description: "71-year-old man with erectile dysfunction after pelvic radiotherapy for bladder cancer, failed injections. Elective."
  implants: "AMS 700 CX 16 cm cylinders, 2 cm RTE, 100 ml reservoir"
  complications: "Left cylinder punctured by a closing suture needle and leaked on test inflation; the whole device was replaced, adding an hour to the case."
