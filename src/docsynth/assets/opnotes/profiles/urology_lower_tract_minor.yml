urology_lower_tract_minor_001:
  operation: "TURBT"
  description: "74-year-old man with a 2.5 cm tumour on the left lateral wall and visible haematuria. 2WW pathway."
  complications: "Obturator jerk causing a small extraperitoneal bladder perforation; resection finished with less diathermy and catheter left for 5 days."

urology_lower_tract_minor_002:
  operation: "Transurethral resection of bladder tumour"
  description: "61-year-old woman with a 3 cm papillary tumour at the posterior wall. Elective."
  complications: "Resectoscope loop snapped and a fragment was lost in the bladder; found and removed with the Ellik evacuator and confirmed on X-ray."

urology_lower_tract_minor_003:
  operation: "TURBT + bladder biopsies"
  description: "79-year-old man with multifocal tumours and CIS on cytology. Elective."
  complications: "Brisk bleeding from a resection bed at the bladder neck, controlled with rollerball diathermy; three-way catheter and irrigation."

urology_lower_tract_minor_004:
  operation: "Blue light cystoscopy and TURBT"
  description: "67-year-old man with recurrent non-muscle-invasive bladder cancer and a positive cytology. Elective."
  complications: "Blue light camera system failed after induction; the case was completed under white light with extra random biopsies."

urology_lower_tract_minor_005:
  operation: "TURP"
  description: "73-year-old man with bothersome LUTS and a 60 ml prostate despite tamsulosin. Elective."
  complications: "Small capsular perforation at the 7 o'clock position; resection stopped early on that side, catheter traction for haemostasis."

urology_lower_tract_minor_006:
  operation: "Bipolar TURP"
  description: "81-year-old man with urinary retention and a 75 ml prostate, catheterised for 2 months. Elective."
  complications: "Venous sinus opened near the capsule with persistent bleeding; controlled with catheter traction and irrigation, no transfusion."

urology_lower_tract_minor_007:
  operation: "Monopolar TURP under spinal"
  description: "76-year-old man with chronic retention and a 70 ml prostate. Elective."
  complications: "Mild TUR syndrome with confusion and sodium 128 towards the end; resection stopped, furosemide given and sodium monitored."

urology_lower_tract_minor_008:
  operation: "HoLEP"
  description: "71-year-old man with a 150 ml prostate and recurrent retention. Elective."
  complications: "Morcellator blade jammed on a calcified adenoma; changed to a new blade and morcellation completed."

urology_lower_tract_minor_009:
  operation: "Holmium laser enucleation of prostate"
  description: "68-year-old man with a 120 ml prostate and recurrent retention. Elective."
  complications: "Superficial mucosal injury of the bladder from the morcellator, recognised straight away with no perforation; catheter kept a day longer."

urology_lower_tract_minor_010:
  operation: "GreenLight laser prostatectomy"
  description: "79-year-old man on apixaban with LUTS and a 60 ml prostate. Day case."
  complications: "Laser fibre tip burned out and was replaced with a second fibre to finish the vaporisation."

urology_lower_tract_minor_011:
  operation: "RARP with bilateral PLND"
  description: "63-year-old man with Gleason 4+3 prostate cancer. Elective robotic list."
  complications: "Inferior epigastric artery bleeding at a port site, controlled with a transfascial suture."

urology_lower_tract_minor_012:
  operation: "Robotic radical prostatectomy"
  description: "58-year-old man with intermediate-risk prostate cancer. Elective."
  complications: "Small bladder neck tear during dissection; repaired with 3-0 V-Loc before the anastomosis and the anastomosis tested watertight."

urology_lower_tract_minor_013:
  operation: "Robot-assisted laparoscopic prostatectomy"
  description: "66-year-old man with Gleason 3+4 prostate cancer and a BMI of 35. Elective."
  complications: "Widespread subcutaneous emphysema from CO2, with hypercapnia treated by ventilation changes and lower pneumoperitoneum pressure."

urology_lower_tract_minor_014:
  operation: "Open radical retropubic prostatectomy"
  description: "62-year-old man with intermediate-risk prostate cancer. Elective."
  complications: "Dorsal venous complex bleeding of about 900 ml before it was ligated; no transfusion."

urology_lower_tract_minor_015:
  operation: "Robotic radical cystectomy + ileal conduit"
  description: "68-year-old man with muscle-invasive bladder cancer after neoadjuvant chemotherapy. Elective."
  complications: "Small serosal tear of the sigmoid colon during mobilisation; oversewn with 3-0 PDS."

urology_lower_tract_minor_016:
  operation: "Open radical cystectomy and ileal conduit"
  description: "72-year-old woman with muscle-invasive bladder cancer. Elective."
  complications: "Swab count wrong at closure; X-ray showed no retained swab and the missing swab was found in the waste bin."

urology_lower_tract_minor_017:
  operation: "Partial cystectomy (open)"
  description: "60-year-old man with a solitary bladder dome urothelial tumour. Elective."
  complications: "A small amount of urine from the tumour-bearing bladder spilled into the wound when the bladder was opened; the field was washed out with sterile water."

urology_lower_tract_minor_018:
  operation: "Ileal conduit"
  description: "52-year-old woman with MS and intractable incontinence. Elective."
  complications: "Stapler cartridge misfired on the ileal anastomosis; anastomosis refashioned with a new cartridge."

urology_lower_tract_minor_019:
  operation: "Flexible cystoscopy and botox"
  description: "57-year-old woman with refractory overactive bladder symptoms despite medication. Day case."
  complications: "Vasovagal episode with bradycardia during injection; settled lying flat with IV fluids and the procedure was completed."

urology_lower_tract_minor_020:
  operation: "Rigid cystoscopy and cystolitholapaxy"
  description: "70-year-old man with a 4 cm bladder stone and a large bladder diverticulum. Elective."
  complications: "Lithoclast probe failed and the stone was fragmented with holmium laser; one fragment fell into a diverticulum and was retrieved."

urology_lower_tract_minor_021:
  operation: "Suprapubic catheter insertion"
  description: "83-year-old man with chronic retention and dementia, pulling at his urethral catheter. Day case."
  complications: "Guidewire kinked on the first pass and the trocar was re-sited 1 cm higher under cystoscopic view."

urology_lower_tract_minor_022:
  operation: "Cystoscopy and SPC insertion"
  description: "36-year-old man with a T4 spinal cord injury and a blocked urethral catheter. Elective."
  complications: "Autonomic dysreflexia on bladder filling with blood pressure 200/110; the bladder was emptied, GTN given and the procedure then completed."

urology_lower_tract_minor_023:
  operation: "Transperineal prostate biopsy"
  description: "67-year-old man with a PSA of 9 and a PI-RADS 4 lesion. Day case."
  complications: "Brisk bleeding from the perineal puncture sites, controlled with pressure; urethral catheter passed for haematuria clots."

urology_lower_tract_minor_024:
  operation: "Retropubic TVT"
  description: "52-year-old woman with urodynamic stress incontinence. Day case."
  implants: "Gynecare TVT"
  complications: "Right trocar perforated the bladder on check cystoscopy; withdrawn and repassed more laterally, catheter overnight."

urology_lower_tract_minor_025:
  operation: "Transobturator tape"
  description: "47-year-old woman with stress incontinence, mainly when running. Day case."
  implants: "TVT-O"
  complications: "Lateral vaginal sulcus perforated by the trocar; sling repositioned and vaginal epithelium closed."

urology_lower_tract_minor_026:
  operation: "Artificial urinary sphincter insertion"
  description: "73-year-old man with severe post-prostatectomy incontinence. Elective."
  implants: "AMS 800, 4.5 cm cuff, 61-70 cmH2O balloon"
  complications: "Cuff sizer showed that the planned 4.0 cm cuff was too tight; the 4.5 cm cuff was used instead after a new device was opened."

urology_lower_tract_minor_027:
  operation: "Optical urethrotomy"
  description: "55-year-old man with a short bulbar urethral stricture and a flow rate of 6 ml/s. Day case."
  complications: "False passage created during guidewire placement; the true lumen was found with a flexible cystoscope and the urethrotomy completed."

urology_lower_tract_minor_028:
  operation: "Bulbar urethroplasty (buccal mucosa graft)"
  description: "42-year-old man with a 5 cm bulbar stricture of unknown cause. Elective."
  complications: "Left fibular head found pressing on the stirrup post at a mid-case check; padding added and the leg repositioned."

urology_lower_tract_minor_029:
  operation: "Endoscopic PUV ablation"
  description: "5-day-old boy with posterior urethral valves on MCUG. Neonatal list."
  complications: "Neonatal resectoscope electrode failed; valves ablated with a 3Fr Bugbee electrode instead."

urology_lower_tract_minor_030:
  operation: "Cystoscopy and urethral bulking (Bulkamid)"
  description: "66-year-old woman with stress urinary incontinence and a lot of other health problems. Day case."
  implants: "Bulkamid 1.5 ml"
  complications: "Injection went too deep at one site with leakage of gel from the needle track; an extra injection was given at a new site."

urology_lower_tract_minor_031:
  operation: "Radical cystoprostatectomy, robotic, with neobladder"
  description: "58-year-old man with muscle-invasive bladder cancer, wanting to avoid a stoma. Elective."
  complications: "Core temperature fell to 34.8 degrees during a long case; active warming and warm fluids brought it back to 36."

urology_lower_tract_minor_032:
  operation: "Bipolar TURP"
  description: "69-year-old man with urinary retention and a 50 ml prostate, catheter for 6 weeks. Elective."
  complications: "Glycine given instead of saline for bipolar irrigation, picked up by the scrub nurse after 5 minutes; bags changed and no harm occurred."

urology_lower_tract_minor_033:
  operation: "Stage 1 sacral nerve stimulation (tined lead)"
  description: "41-year-old woman with refractory urge incontinence despite medication and bladder training. Day case."
  implants: "Medtronic InterStim tined lead"
  complications: "Lead first placed in S4 with poor motor response; repositioned to S3 with good bellows and toe response."

urology_lower_tract_minor_034:
  operation: "Prostatic urethral lift"
  description: "62-year-old man with a 35 ml prostate and LUTS, keen to preserve ejaculation. Day case."
  implants: "UroLift implants x4"
  complications: "One implant deployed poorly and sat in the bladder neck; removed with graspers and a fifth implant placed."
