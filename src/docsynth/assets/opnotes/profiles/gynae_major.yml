gynae_major_001:
  operation: "Total laparoscopic hysterectomy and bilateral salpingectomy"
  description: "46-year-old woman with a 16-week-size fibroid uterus with a large left broad ligament fibroid. Elective."
  complications: "Left ureter transected during control of the uterine artery, recognised on table; urology performed a ureteric reimplantation with a psoas hitch over a JJ stent."

gynae_major_002:
  operation: "Robotic radical hysterectomy + bilateral pelvic lymphadenectomy"
  description: "41-year-old woman with a stage IB1 squamous cell carcinoma of the cervix. Elective."
  complications: "Right obturator nerve transected during obturator fossa node dissection; primary epineural repair performed laparoscopically with 7/0 Prolene."

gynae_major_003:
  operation: "Radical hysterectomy (open) and pelvic node dissection"
  description: "48-year-old woman with a stage IB2 cervical squamous carcinoma. BMI 36. Elective."
  complications: "Laceration of the left external iliac vein during node dissection with 2.5 litres blood loss; vascular surgeons repaired it with a patch, 4 units of red cells and FFP given."

gynae_major_004:
  operation: "Cytoreductive surgery: TAH, BSO, total omentectomy, splenectomy and diaphragmatic stripping"
  description: "57-year-old woman with stage IIIC high-grade serous ovarian cancer with bulky omental and splenic hilar disease. Elective."
  complications: "Major haemorrhage from the splenic hilum during omental mobilisation requiring splenectomy; estimated blood loss 3.5 litres, 6 units red cells, 4 FFP and platelets transfused."

gynae_major_005:
  operation: "Total pelvic exenteration"
  description: "55-year-old woman with a central recurrence of cervical cancer after chemoradiation involving bladder and rectum. Multidisciplinary case."
  complications: "Uncontrolled presacral venous haemorrhage of around 6 litres; pelvis packed, damage-control closure with a laparostomy, massive transfusion protocol and transfer to ICU with a planned return in 48 hours."

gynae_major_006:
  operation: "Posterior exenteration with sacrectomy (abandoned)"
  description: "62-year-old woman with a locally recurrent endometrial cancer fixed to the lower sacrum. Joint case with colorectal and orthopaedics."
  complications: "Torrential bleeding from the internal iliac venous plexus led to cardiac arrest from haemorrhagic shock; despite massive transfusion and 40 minutes of resuscitation the patient died on the table."

gynae_major_007:
  operation: "Total abdominal hysterectomy + BSO"
  description: "60-year-old woman with bilateral complex ovarian masses and dense endometriosis on MRI. Elective."
  complications: "Full-thickness anterior rectal wall injury during dissection of the pouch of Douglas; colorectal surgeons repaired the rectum primarily and formed a defunctioning loop ileostomy."

gynae_major_008:
  operation: "Laparoscopic subtotal hysterectomy converted to open"
  description: "49-year-old woman with a bulky 18-week fibroid uterus and heavy periods. Elective."
  complications: "Brisk bleeding from the right uterine artery could not be controlled laparoscopically; converted to a Pfannenstiel incision, vessel ligated, 3 units of red cells transfused."

gynae_major_009:
  operation: "Laparoscopic myomectomy converted to laparotomy"
  description: "36-year-old woman with a 10 cm posterior intramural fibroid and subfertility. Elective."
  complications: "Heavy bleeding from the myometrial bed after enucleation not controlled laparoscopically; converted to open, defect closed in layers, 2 litres lost with cell salvage and 2 units transfused."

gynae_major_010:
  operation: "Operative hysteroscopy, resection of uterine septum"
  description: "33-year-old woman with recurrent miscarriage and a complete uterine septum on MRI. Day case."
  complications: "Sudden fall in end-tidal CO2, desaturation and hypotension consistent with gas embolism; procedure stopped, patient placed left side down, resuscitated with fluids and vasopressors, and transferred to ICU."

gynae_major_011:
  operation: "Transcervical resection of endometrium (monopolar, glycine)"
  description: "51-year-old woman with heavy menstrual bleeding and failed medical treatment. Mild heart failure. Elective."
  complications: "Glycine deficit of 1,800 mL with confusion under spinal and sodium of 119 on blood gas; procedure abandoned, furosemide given and admitted to HDU for sodium correction."

gynae_major_012:
  operation: "Suction evacuation of uterus → laparoscopy → laparotomy and small bowel resection"
  description: "35-year-old woman with a missed miscarriage at 12 weeks; two previous caesarean sections. Day case."
  complications: "Uterine perforation with the suction curette and small bowel drawn into the cannula; laparotomy with general surgeons, 15 cm of damaged ileum resected with primary anastomosis and the uterine defect repaired."

gynae_major_013:
  operation: "Laparoscopic sterilisation (Filshie clips) → laparotomy"
  description: "32-year-old slim woman requesting sterilisation. BMI 18. Day case."
  implants: "Filshie clips x2"
  complications: "Veress needle injured the right common iliac artery with haemoperitoneum and hypotension; emergency laparotomy, vascular surgeons repaired the artery, 5 units transfused."

gynae_major_014:
  operation: "Laparoscopic sacrocolpopexy (mesh removed)"
  description: "67-year-old woman with a stage 3 vault prolapse. Elective."
  complications: "The mesh was found to have perforated the vaginal vault at the anterior fixation sutures, so the whole mesh was removed to avoid contamination, the vault repaired and the procedure left incomplete."

gynae_major_015:
  operation: "Laparoscopic hysterectomy (abandoned at induction)"
  description: "43-year-old woman with adenomyosis and heavy menstrual bleeding. Penicillin allergy listed as rash. Elective."
  complications: "Anaphylaxis minutes after IV teicoplanin with bronchospasm, hypotension and angioedema; treated with IM and IV adrenaline, surgery abandoned before incision and admitted to ICU."

gynae_major_016:
  operation: "Laparoscopic left ovarian cystectomy"
  description: "30-year-old woman with a 6 cm left ovarian dermoid cyst on ultrasound and MRI. Elective."
  complications: "At the WHO time-out, the consent form and list stated right ovarian cystectomy, not matching the imaging; surgery paused, imaging and notes reviewed with the patient's earlier documented consent, left cystectomy performed and a Datix completed."

gynae_major_017:
  operation: "Laparoscopic total hysterectomy, BSO"
  description: "56-year-old woman with atypical endometrial hyperplasia, BMI 42. Elective."
  complications: "A 5 mm portion of a suture needle broke off during vault closure and could not be found despite a search and on-table X-ray; left in situ after consultant review, patient informed and Datix completed."

gynae_major_018:
  operation: "Open myomectomy"
  description: "38-year-old woman with a multifibroid uterus and anaemia, keen to conserve fertility. Elective."
  complications: "Sterilisation indicator in an instrument tray found to have failed midway through the case; all instruments exchanged, extended antibiotic prophylaxis given and a Datix completed."

gynae_major_019:
  operation: "Laparoscopic myomectomy"
  description: "34-year-old woman with a 7 cm fundal intramural fibroid and infertility. Elective."
  complications: "Vasopressin injected intravascularly into the fibroid pedicle, causing severe hypertension to 230/130 and ventricular ectopy; case paused, treated with GTN and labetalol, then completed without further vasopressin."

gynae_major_020:
  operation: "Laparoscopic sacrocolpopexy (abandoned)"
  description: "63-year-old woman with vault prolapse, BMI 39 and a short neck. Elective."
  complications: "Unanticipated failed intubation with desaturation; oxygenated through a second-generation supraglottic airway, patient woken and the procedure abandoned."

gynae_major_021:
  operation: "Robotic radical hysterectomy, BSO and pelvic and para-aortic lymphadenectomy"
  description: "52-year-old woman with a stage IB2 cervical adenocarcinoma. BMI 41. Elective."
  complications: "Tense, swollen left calf noticed at the end of a 7-hour case in lithotomy and steep Trendelenburg; well-leg compartment syndrome diagnosed and plastics performed four-compartment fasciotomies."

gynae_major_022:
  operation: "Laparotomy, biopsy only (interval debulking abandoned)"
  description: "70-year-old woman with stage IV ovarian cancer after four cycles of neoadjuvant chemotherapy. Elective."
  complications: "Extensive disease at the root of the small bowel mesentery found to be unresectable; debulking abandoned after omental biopsy."

gynae_major_023:
  operation: "Laparoscopic excision of deep endometriosis and left ureterolysis"
  description: "37-year-old woman with deep endometriosis involving the left uterosacral ligament and left hydroureter on MRI. Elective."
  complications: "Thermal injury to the left ureter from bipolar diathermy seen as blanching and a small defect; urology placed a JJ stent cystoscopically and the defect was repaired with interrupted 4/0 PDS."

gynae_major_024:
  operation: "Vaginal hysterectomy, anterior and posterior repair"
  description: "74-year-old woman with procidentia, a large cystocele and a history of pelvic radiotherapy for rectal cancer. Elective."
  complications: "Large cystotomy extending towards the trigone during anterior dissection; ureteric orifices catheterised by urology and the bladder repaired in two layers, catheter kept for 14 days."

gynae_major_025:
  operation: "Laparotomy, TAH/BSO, omentectomy and diaphragmatic peritonectomy (right)"
  description: "58-year-old woman with stage IIIC ovarian cancer and bulky right diaphragmatic disease. Elective."
  complications: "Full-thickness right diaphragmatic defect with a tension pneumothorax and hypotension; defect repaired, right chest drain inserted on table and haemodynamics recovered."

gynae_major_026:
  operation: "Laparoscopic hysterectomy (abandoned after cardiac arrest)"
  description: "47-year-old woman with fibroids and heavy menstrual bleeding. Elective."
  complications: "Sudden collapse soon after insufflation with loss of end-tidal CO2 and PEA arrest from presumed CO2 embolism; CPR for 6 minutes with return of circulation, procedure abandoned and admitted to ICU."

gynae_major_027:
  operation: "Radical vulvectomy with bilateral inguinofemoral lymphadenectomy"
  description: "77-year-old woman with a 5 cm midline vulval carcinoma and bulky right groin nodes on CT. Elective."
  complications: "Right common femoral vein torn during dissection of fixed nodes; vascular surgeons repaired it with a vein patch, 3 units transfused."

gynae_major_028:
  operation: "Laparoscopic right salpingectomy converted to laparotomy"
  description: "34-year-old woman with a right tubal ectopic pregnancy and free fluid on scan, haemodynamically stable in the emergency department. Emergency."
  complications: "Large haemoperitoneum with brisk bleeding from the ruptured tube and sudden hypotension; converted to laparotomy, salpingectomy completed, major haemorrhage protocol with 4 units transfused."

gynae_major_029:
  operation: "Knife cone biopsy of cervix"
  description: "40-year-old woman with a suspected early invasive adenocarcinoma of the cervix on punch biopsy. Elective."
  complications: "Persistent arterial bleeding from the cone bed not controlled with sutures or packing; interventional radiology performed bilateral uterine artery embolisation, 2 units transfused."

gynae_major_030:
  operation: "Laparoscopic excision of endometriosis and bowel shave converted to open anterior resection"
  description: "35-year-old woman with a 3 cm rectosigmoid endometriotic nodule causing cyclical rectal bleeding. Joint case with colorectal."
  complications: "Full-thickness rectal injury during shaving not suitable for laparoscopic repair; converted to open, segmental anterior resection with primary anastomosis by colorectal surgeons."

gynae_major_031:
  operation: "Hysteroscopy, attempted Mirena insertion, diagnostic laparoscopy and retrieval of IUS"
  description: "34-year-old woman six months after a vaginal delivery with heavy periods, requesting a Mirena under GA. Day case."
  complications: "Mirena inserter perforated the fundus and the device was not seen in the cavity; laparoscopy found it in the omentum, it was retrieved, and no new device was fitted."
