amputation_minor_001:
  operation: "Left below-knee amputation (skew flap)"
  description: "76-year-old man with diabetes, renal failure on dialysis and a gangrenous heel ulcer. Unreconstructable disease."
  complications: "Gigli saw snapped during fibular division; replaced with an oscillating saw and bone cut completed."

amputation_minor_002:
  operation: "Right AKA"
  description: "85-year-old woman with an acutely ischaemic, non-viable right leg after a saddle embolus. Frail; palliative intent."
  complications: "Brisk bleeding from the profunda femoris branch after tourniquet release; oversewn and haemostasis secured, no transfusion."

amputation_minor_003:
  operation: "Ray amputation left 2nd toe"
  description: "62-year-old man with diabetes and osteomyelitis of the second metatarsal head with a discharging sinus."
  complications: "Pus under pressure spilled into the plantar space on opening; extended incision, thorough washout and specimens sent."

amputation_minor_004:
  operation: "Transmetatarsal amputation, right foot"
  description: "69-year-old woman with dry gangrene of all five toes. Recent angioplasty of the anterior tibial artery."
  complications: "Marginal viability of the plantar flap edge noted; level taken back 1 cm with shorter metatarsal cuts to allow tension-free closure."

amputation_minor_005:
  operation: "Terminalisation of left thumb tip + nail bed ablation"
  description: "52-year-old man with a crush amputation of the thumb tip from a hydraulic press. Heavy manual worker."
  complications: "Digital tourniquet (glove finger) found still applied at the end of the procedure; removed at dressing check with good capillary refill."

amputation_minor_006:
  operation: "Refashioning of transtibial stump"
  description: "55-year-old man with a bony spur and painful adherent scar over the anterior tibia of his stump."
  complications: "Count discrepancy of a needle at closure; found on the floor using a magnet and count reconciled."

amputation_minor_007:
  operation: "Revision of fingertip amputation stumps x2, right"
  description: "38-year-old woman with painful, bulbous fingertip stumps of the middle and ring fingers limiting keyboard work."
  complications: "Digital nerve neuroma adherent to the flexor sheath; small breach of the sheath repaired and neuroma excised to healthy fascicles."

amputation_minor_008:
  operation: "Replantation of right ring finger (Tamai zone II)"
  description: "29-year-old man with a clean ring finger amputation from a meat slicer at work. Non-smoker."
  implants: "Single 1.1 mm longitudinal K-wire across the DIPJ, cut and buried; 26G interosseous wire"
  complications: "Arterial anastomosis thrombosed after release of the clamp; revised with a vein graft and flow restored."

amputation_minor_009:
  operation: "Hallux amputation (left) + closure over drain"
  description: "71-year-old man with type 1 diabetes and gangrene of the great toe; rest of the foot warm."
  complications: "Warfarin not stopped in error and INR 3.1 on the day; operated with extra haemostasis, oozing controlled with diathermy and a haemostatic matrix."
