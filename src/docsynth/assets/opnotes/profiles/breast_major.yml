breast_major_001:
  operation: "Right skin-sparing mastectomy, SLNB and immediate DIEP flap"
  description: "46-year-old woman with a 40 mm right breast cancer and a good abdominal pannus. Joint breast and plastics case."
  implants: "GEM coupler 3.0 mm"
  complications: "Pleural breach during removal of the 3rd costal cartilage with a significant pneumothorax; intercostal chest drain inserted and ventilation stabilised."

breast_major_002:
  operation: "Left SLNB (Patent Blue and Tc99m) + WLE"
  description: "54-year-old woman with a 15 mm left breast cancer, clinically N0. Elective."
  complications: "Anaphylaxis to Patent Blue dye with hypotension, urticaria and bronchospasm; treated with IM and IV adrenaline, surgery completed after stabilisation, referred to allergy clinic."

breast_major_003:
  operation: "Left mastectomy and axillary clearance"
  description: "58-year-old woman with a 48 mm left breast cancer and matted axillary nodes after chemotherapy."
  complications: "Axillary vein laceration during level III dissection with 1.5 L blood loss; vascular surgeons repaired the vein and 2 units of blood were transfused."

breast_major_004:
  operation: "Bilateral breast augmentation"
  description: "27-year-old woman requesting cosmetic breast augmentation, private list, day case."
  implants: "Motiva Ergonomix2 Round Full 350 cc x2"
  complications: "Bilateral implants inserted with the incorrect size (400 cc) due to a picking error; discovered at the implant record check, both removed and replaced with the planned 350 cc before closure."

breast_major_005:
  operation: "Right WLE (Magseed)"
  description: "65-year-old woman with a 12 mm screen-detected cancer of the right breast. Elective."
  complications: "Wrong lesion excised: a benign fibroadenoma in the upper quadrant; the Magseed remained in situ and a second excision of the correct lesion was performed at the same sitting."

breast_major_006:
  operation: "Left axillary node clearance"
  description: "70-year-old woman with a left breast cancer and axillary disease despite endocrine therapy. Elective."
  complications: "Long thoracic nerve divided during clearance of level I nodes; primary epineural repair performed with the plastics registrar."

breast_major_007:
  operation: "Bilateral risk-reducing mastectomies with immediate expander reconstruction"
  description: "38-year-old woman, PALB2 carrier with dense breasts, wishing risk reduction. Elective."
  implants: "Mentor CPX4 400 cc expanders bilaterally; Strattice 10 x 16 cm x2"
  complications: "Can't intubate, can't oxygenate event at induction; front-of-neck access avoided after successful rescue with a second-generation supraglottic airway and awake fibreoptic intubation; surgery proceeded."

breast_major_008:
  operation: "Immediate LD flap + implant reconstruction, left, after SSM"
  description: "53-year-old woman with a left breast cancer, keen on reconstruction, BMI 31. Elective."
  implants: "Mentor MemoryGel 275 cc"
  complications: "Thoracodorsal pedicle avulsed while tunnelling the flap into the chest; flap non-viable and discarded, reconstruction abandoned and mastectomy closed flat."

breast_major_009:
  operation: "Left DIEP flap reconstruction, delayed"
  description: "52-year-old woman wishing autologous reconstruction of the left breast, previous Pfannenstiel scar."
  complications: "Flap failed to perfuse despite three arterial revisions; flap abandoned and the chest wall closed primarily. Returned to ward for discussion of alternative options."

breast_major_010:
  operation: "Right mastectomy and SLNB"
  description: "77-year-old woman with ischaemic heart disease and a 40 mm right breast cancer. Elective."
  complications: "Ventricular fibrillation arrest during closure; ROSC after two shocks and 4 minutes of CPR, transferred to ICU intubated."

breast_major_011:
  operation: "Reduction mammaplasty bilateral"
  description: "40-year-old woman with symptomatic 38J breasts, BMI 32. Elective."
  complications: "Retained swab found on routine post-closure count reconciliation; left breast wound reopened and swab removed from the pedicle pocket before leaving theatre."

breast_major_012:
  operation: "Bilateral breast reduction with liposuction"
  description: "50-year-old woman with symptomatic macromastia and lateral chest fullness. Private."
  complications: "Sudden desaturation, tachycardia and petechiae after extensive liposuction; managed as fat embolism with high-flow oxygen and ICU transfer."

breast_major_013:
  operation: "Left WLE + SLNB"
  description: "63-year-old woman with a 17 mm left breast cancer. Elective day case."
  complications: "Local anaesthetic systemic toxicity after lidocaine and levobupivacaine infiltration with seizure and hypotension; Intralipid given, stabilised and admitted to HDU."

breast_major_014:
  operation: "Right breast implant exchange (capsulotomy)"
  description: "48-year-old woman with a palpable ripple and rotation of her right anatomical implant. Private list."
  implants: "Mentor CPG 322 355 cc right"
  complications: "New anatomical implant noted to have rotated 90 degrees after closure on sitting up; wound reopened, pocket tightened and implant re-orientated."

breast_major_015:
  operation: "Right SSM + immediate implant reconstruction with ADM"
  description: "44-year-old woman with a 30 mm right breast cancer, D-cup, non-smoker."
  implants: "Braxon ADM 0.6 mm; Motiva Ergonomix2 Full 400 cc"
  complications: "Implant punctured by a suture needle during ADM closure and deflated; removed and replaced with a new implant of the same size."

breast_major_016:
  operation: "Left mastectomy + ANC"
  description: "71-year-old woman with a 55 mm left breast cancer and axillary nodal disease. Elective."
  complications: "Anaphylaxis with hypotension and angio-oedema shortly after skin prep, treated with adrenaline and hydrocortisone; operation postponed and patient admitted to ICU."

breast_major_017:
  operation: "Excision biopsy of left axillary lymph node"
  description: "35-year-old woman with a 3 cm left axillary node and B symptoms, ?lymphoma. Elective."
  complications: "Axillary artery branch injured with brisk bleeding, conversion to a larger incision and vascular repair with transfusion of 1 unit."

breast_major_018:
  operation: "Left breast augmentation for asymmetry"
  description: "24-year-old woman with a hypoplastic left breast. Private list."
  implants: "Mentor MemoryGel 225 cc left"
  complications: "Surgical fire when alcohol prep pooled at the drape edge ignited on diathermy; extinguished immediately with a superficial burn to the flank, dressed and incident reported."
