plastics_minor_001:
  operation: "Excision of BCC left forehead + FTSG (postauricular donor)"
  description: "76-year-old woman with a 15 mm nodular BCC on the left forehead. Local anaesthetic list."
  complications: "Frozen section showed the deep margin involved; a further layer of frontalis was taken and was clear before grafting."

plastics_minor_002:
  operation: "Right ring finger trigger release"
  description: "55-year-old man with a painful locking right ring finger. WALANT, day case."
  complications: "Radial digital nerve seen crossing unusually close to the A1 pulley and was grazed by the scalpel; epineurium intact on loupe inspection and no repair needed."

plastics_minor_003:
  operation: "Primary flexor tendon repair zone II, right middle finger"
  description: "29-year-old man with a glass cut to the right middle finger, no active DIPJ or PIPJ flexion."
  complications: "Tourniquet failed to hold pressure at 30 minutes; replaced with a new cuff and the repair completed after a brief period of bleeding in the field."

plastics_minor_004:
  operation: "Split skin graft to left thigh wound"
  description: "71-year-old woman with a clean granulating 8 x 6 cm wound after a traumatic haematoma of the left thigh. Inpatient list."
  complications: "Electric dermatome jammed and cut an irregular graft; second dermatome used to harvest adequate skin from the adjacent donor area."

plastics_minor_005:
  operation: "Left palmar fasciectomy, little finger"
  description: "62-year-old man with Dupuytren's disease and a 60 degree PIPJ contracture of the left little finger. Elective."
  complications: "Ulnar digital artery of the little finger divided while freeing the spiral cord; finger remained well perfused on the radial artery, cut ends ligated."

plastics_minor_006:
  operation: "Excision of lipoma, right upper arm"
  description: "44-year-old woman with a soft 7 cm lump on the posterior right arm, lipoma on ultrasound. Local anaesthetic."
  complications: "Patient became anxious and vasovagal with bradycardia to 40 during infiltration; settled with leg elevation and atropine, procedure completed."

plastics_minor_007:
  operation: "Excision of ganglion right dorsal wrist"
  description: "34-year-old woman with a painful dorsal wrist ganglion interfering with yoga. Day case."
  complications: "Small breach of the scapholunate joint capsule where the stalk arose, closed with 4-0 PDS; ligament intact."

plastics_minor_008:
  operation: "Debridement and NPWT, sacral pressure sore"
  description: "79-year-old woman with a necrotic grade 4 sacral pressure sore and poor mobility. Inpatient list."
  complications: "NPWT unit alarmed for a persistent leak; seal reinforced with extra drape and hydrocolloid, and suction then held."

plastics_minor_009:
  operation: "Free ALT flap to left forearm"
  description: "33-year-old man with a large degloving wound of the left forearm exposing tendons after an industrial roller injury. Orthoplastic list."
  implants: "GEM coupler 2.5 mm"
  complications: "Operating microscope light source failed during the arterial anastomosis; switched to the backup microscope with a 20 minute delay and flap ischaemia time remained acceptable."

plastics_minor_010:
  operation: "Achilles tendon repair, left"
  description: "42-year-old man with an acute left Achilles rupture sustained playing badminton. Elective within 5 days."
  complications: "Sural nerve seen within the lateral wound and retracted; a small branch was divided and the ends buried in muscle."

plastics_minor_011:
  operation: "Muscle biopsy (right quadriceps, open)"
  description: "3-year-old girl with hypotonia and delayed motor milestones, ?congenital myopathy. Paediatric day case."
  complications: "Specimen fell off the clamp onto the floor; discarded and a second specimen taken from the same incision and placed in the proper medium."

plastics_minor_012:
  operation: "Extensor tendon repair (EDC) left index + ring, zone VI"
  description: "38-year-old woman with a knife laceration across the dorsum of the left hand, unable to extend index and ring fingers."
  complications: "The ring finger EDC proximal stump had retracted and could not be found through the wound; wound extended proximally and stump retrieved."

plastics_minor_013:
  operation: "Right carpal tunnel release + right little finger fasciectomy"
  description: "69-year-old man with carpal tunnel syndrome and Dupuytren's contracture of the right little finger. Elective day case."
  complications: "Tourniquet time exceeded 2 hours due to a slow dissection; released for 15 minutes and re-inflated to finish, no hand ischaemia."

plastics_minor_014:
  operation: "Right groin SLNB (Tc99m and blue dye) + WLE of melanoma scar right thigh"
  description: "39-year-old woman with a 1.2 mm Breslow melanoma of the right thigh. Elective."
  complications: "Gamma probe gave low and erratic counts; replaced with the spare probe and one hot, blue node was then found."

plastics_minor_015:
  operation: "Tendon transfer (EIP to EPL), right"
  description: "66-year-old man with an attritional EPL rupture of the right thumb. Elective."
  complications: "EIP tendon found to be absent; EDM harvested from the little finger instead and the transfer completed."

plastics_minor_016:
  operation: "Fasciotomy, left forearm (volar)"
  description: "24-year-old man with a compartment syndrome of the left forearm after a crush injury under a car. Emergency."
  complications: "Brisk bleeding from a muscular branch of the ulnar artery during the release; controlled with bipolar and ligation."

plastics_minor_017:
  operation: "Excision of SCC of left dorsum of hand + SSG"
  description: "84-year-old man with a 2.5 cm ulcerated SCC of the left dorsum of the hand fixed to the dermis. Elective."
  complications: "An extensor tendon paratenon was breached at the deep margin; covered by adjacent tissue before grafting to allow take."

plastics_minor_018:
  operation: "Tangential excision and SSG, 5% TBSA scald (right leg)"
  description: "18-month-old boy with a deep dermal scald to the right leg from a hot bath, unhealed at 2 weeks."
  complications: "Core temperature fell to 35.4 C; theatre warmed, forced air warming and warmed fluids applied, temperature recovered before the end."

plastics_minor_019:
  operation: "Wide local excision of left back melanoma + left axillary SLNB (Magtrace)"
  description: "53-year-old man with a 1.1 mm Breslow ulcerated melanoma of the left back. Elective."
  complications: "Intercostobrachial nerve branch divided while retrieving the sentinel node; ends left and patient to be warned about inner-arm numbness."

plastics_minor_020:
  operation: "Right gastrocnemius recession + tendo-Achilles lengthening"
  description: "10-year-old boy with right hemiplegic cerebral palsy and fixed equinus. Elective."
  complications: "Overlengthening of the tendo-Achilles noticed on intraoperative ankle testing; tendon re-tensioned with side-to-side repair."

plastics_minor_021:
  operation: "Distal biceps repair (right, single incision, cortical button)"
  description: "50-year-old man with an acute complete distal biceps rupture while lifting. Elective."
  implants: "Arthrex BicepsButton 7 mm and 8 mm tenodesis screw"
  complications: "Button deployed in soft tissue on the first attempt on fluoroscopy; retrieved and redeployed flush on the far cortex."

plastics_minor_022:
  operation: "Excision of epidermoid cyst, left cheek"
  description: "28-year-old woman with a 2 cm epidermoid cyst on the left cheek. Local anaesthetic."
  complications: "Cyst ruptured during dissection with spillage of keratin; the cavity was irrigated and the wall removed completely."

plastics_minor_023:
  operation: "Curettage and cautery x3, face and scalp"
  description: "90-year-old man with multiple crusting keratotic lesions, clinically SCC in situ. Local anaesthetic minor ops."
  complications: "Hyfrecator failed mid-procedure; switched to a spare unit and the remaining lesion treated."

plastics_minor_024:
  operation: "Bilateral hamstring lengthening"
  description: "12-year-old boy with spastic diplegia, crouch gait and popliteal angles of 70 degrees. Elective."
  complications: "Semitendinosus accidentally fully divided rather than lengthened on the left; ends repaired with a Pulvertaft weave."

plastics_minor_025:
  operation: "Muscle repair (right biceps brachii belly laceration)"
  description: "36-year-old man with a knife wound to the right upper arm and weak elbow flexion, brachial artery intact. Emergency."
  complications: "Musculocutaneous nerve found bruised in the wound but in continuity; left alone and noted."

plastics_minor_026:
  operation: "Keystone flap, left thigh, after excision of SCC"
  description: "80-year-old man with a 3 cm SCC on the anterior left thigh. Elective, spinal."
  complications: "Spinal anaesthetic wore off before closure; converted to GA with LMA to complete the flap inset."

plastics_minor_027:
  operation: "Excision of sebaceous cyst, back"
  description: "46-year-old man with a 4 cm sebaceous cyst on the upper back, recurrently infected. Local anaesthetic."
  complications: "Lidocaine with adrenaline and plain bupivacaine were mixed up on the tray and plain drawn instead of the intended mix; recognised before injection and redrawn."

plastics_minor_028:
  operation: "Split skin graft and NPWT, right forearm"
  description: "65-year-old woman with a large skin tear of the right forearm on steroids, not healing after 4 weeks. Day case."
  complications: "Graft harvested on the thick setting leaving a deep donor site; covered with Mepilex and noted."

plastics_minor_029:
  operation: "Washout and debridement of infected right prepatellar bursa"
  description: "44-year-old roofer with septic prepatellar bursitis of the right knee not settling on IV antibiotics. Emergency."
  complications: "Joint capsule breached during debridement; knee washed out through the defect and capsule closed, joint fluid clear."

plastics_minor_030:
  operation: "Pectoralis major repair (left)"
  description: "29-year-old weightlifter with an acute left pectoralis major insertion avulsion on MRI. Elective within 2 weeks."
  implants: "Smith & Nephew Twinfix anchors x3"
  complications: "One anchor pulled out on tensioning; replaced with a larger anchor in fresh bone and fixation held."

plastics_minor_031:
  operation: "Trigger thumb release, bilateral (paediatric)"
  description: "3-year-old boy with bilateral trigger thumbs locked in flexion. Day case."
  complications: "Oblique pulley partially divided on the right in addition to A1; left alone as no bowstringing on flexion."

plastics_minor_032:
  operation: "Excision biopsy lymph node, left posterior triangle"
  description: "31-year-old woman with a persistent left posterior triangle node and fatigue. Day case."
  complications: "Spinal accessory nerve seen adherent to the node and was stimulated but not divided; separated under the nerve stimulator."

plastics_minor_033:
  operation: "Right inguinal lymph node dissection"
  description: "61-year-old man with melanoma of the right heel and a biopsy-proven superficial inguinal nodal metastasis."
  complications: "Femoral vein side branch avulsed with brisk bleeding, controlled with a 5-0 Prolene suture without narrowing."

plastics_minor_034:
  operation: "Excision of soft tissue tumour, left gluteal region"
  description: "58-year-old woman with a 6 cm deep lipomatous gluteal mass on MRI, ?atypical lipomatous tumour. Sarcoma list."
  complications: "Capsule of the lipomatous tumour breached at the deep aspect with minor spillage; area irrigated and margins marked for pathology."

plastics_minor_035:
  operation: "Posterior tibial tendon transfer, left (for foot drop)"
  description: "51-year-old woman with left foot drop from a permanent common peroneal nerve palsy after an injury, full passive dorsiflexion."
  implants: "Arthrex Bio-Tenodesis 5.5 mm interference screw"
  complications: "Guidewire for the tunnel exited the plantar cuneiform too laterally on fluoroscopy; withdrawn and redirected before drilling."

plastics_minor_036:
  operation: "Right hand debridement + K-wire (buried) + local flap for fingertip amputation"
  description: "46-year-old man with a crush amputation of the right middle fingertip with exposed bone in a door. Trauma list."
  implants: "0.9 mm K-wire, buried"
  complications: "Second K-wire was placed into the DIPJ unintentionally; withdrawn and repositioned into the distal phalanx only."

plastics_minor_037:
  operation: "Dermofasciectomy + FTSG, left ring finger"
  description: "70-year-old man with recurrent Dupuytren's disease of the left ring finger and involved skin. Elective."
  complications: "PIPJ volar plate partly divided to gain extension; joint remained stable and splinting plan adjusted."

plastics_minor_038:
  operation: "Excision of right calf lesion and local flap"
  description: "67-year-old woman with a 1.8 cm pigmented lesion on the right calf, ?melanoma, biopsy not done. Local anaesthetic."
  complications: "Wrong skin marking corrected at the time-out: a nearby seborrhoeic keratosis had been marked, the correct lesion identified with dermoscopy and marked before incision."

plastics_minor_039:
  operation: "Fasciotomy (four compartments) right leg"
  description: "40-year-old man with a right tibial plateau fracture and compartment syndrome on clinical grounds. Emergency, out of hours."
  complications: "Superficial peroneal nerve seen in the lateral incision and protected, but a small cutaneous branch was divided; no repair."

plastics_minor_040:
  operation: "Right ALT flap + SSG for lower leg defect"
  description: "63-year-old woman with a large pretibial wound exposing the tibia after a fall on a step. Orthoplastic list."
  implants: "GEM coupler 2.5 mm"
  complications: "Perforator twisted on inset and the flap became dusky; pedicle de-rotated and flap colour returned promptly."

plastics_minor_041:
  operation: "Open muscle biopsy (left quadriceps)"
  description: "8-year-old boy with suspected Becker muscular dystrophy and raised CK. Paediatric day case, TIVA."
  complications: "Specimen too small on inspection by the neuromuscular technician; a second strip was taken through the same incision."

plastics_minor_042:
  operation: "Repair of lacerated right deltoid muscle"
  description: "41-year-old man with a deep right shoulder laceration from a fall onto a metal railing, weak abduction. Trauma list."
  complications: "Brisk bleeding from a branch of the posterior circumflex humeral artery in the wound; ligated and repair completed."

plastics_minor_043:
  operation: "Curettage and cautery x2, right cheek and nose"
  description: "83-year-old woman with two superficial BCCs of the face who declined excision. Local anaesthetic."
  complications: "Small flash fire from the hyfrecator near supplemental nasal oxygen; extinguished instantly with no burn, oxygen turned off for the rest of the procedure."

plastics_minor_044:
  operation: "Debridement + NPWT, right leg wound"
  description: "59-year-old man with an infected haematoma of the right lower leg on apixaban (held). Inpatient list."
  complications: "Bleeding from the wound bed on application of negative pressure; NPWT removed, haemostasis secured and VAC reapplied at lower pressure."
