neuro_spine_minor_001:
  operation: "Anterior cervical discectomy and fusion C5/6"
  description: "57-year-old woman with progressive hand clumsiness and unsteady gait; cervical myelopathy from a C5/6 disc-osteophyte complex."
  implants: "Medtronic Zevo plate 18 mm; PEEK cage 6 mm with allograft"
  complications: "Dural tear with CSF leak while removing the posterior osteophyte; sealed with DuraGen and fibrin sealant and a lumbar drain placed."

neuro_spine_minor_002:
  operation: "Left L5/S1 microdiscectomy"
  description: "46-year-old man with left S1 radiculopathy and a large disc fragment in the axilla of the S1 root. Elective."
  complications: "Small dural tear on removing the ligamentum flavum; closed with a 6-0 Prolene suture and DuraSeal, Valsalva test watertight."

neuro_spine_minor_003:
  operation: "L3-L5 decompression"
  description: "77-year-old woman on aspirin with severe lumbar canal stenosis and claudication at 20 metres."
  complications: "Brisk epidural venous bleeding at L4 controlled with Floseal and patties; blood loss 600 ml, no transfusion."

neuro_spine_minor_004:
  operation: "Open TLIF L4/5 with pedicle screws"
  description: "54-year-old man with a degenerative L4/5 spondylolisthesis and right L5 radiculopathy. Elective."
  implants: "Stryker Xia 3 screws x4, rods; Capstone cage 10 mm"
  complications: "Left L5 screw breached the medial pedicle wall on intraoperative O-arm; withdrawn and redirected with a clear second scan."

neuro_spine_minor_005:
  operation: "Balloon kyphoplasty L1"
  description: "79-year-old woman with a painful osteoporotic L1 fracture and poor mobility after 6 weeks. Day case."
  implants: "Kyphon HV-R cement 3 ml"
  complications: "Small cement leak into the L1/2 disc space seen on fluoroscopy; injection stopped with no further spread."

neuro_spine_minor_006:
  operation: "Vertebroplasty T9"
  description: "68-year-old man with multiple myeloma and a painful T9 deposit with early collapse. Day case, IR suite."
  implants: "PMMA cement 2.5 ml"
  complications: "Access trocar bent in dense sclerotic bone; exchanged for a new 11G needle and cement delivered."

neuro_spine_minor_007:
  operation: "C6/7 cervical disc replacement"
  description: "42-year-old woman with right C7 radiculopathy and a soft disc herniation. Elective."
  implants: "Mobi-C 15 x 17 mm, height 6 mm"
  complications: "Trial implant sat too far anteriorly on lateral screening; endplates re-prepared and the final implant centred."

neuro_spine_minor_008:
  operation: "Posterior spinal fusion T3-L2 for AIS"
  description: "15-year-old girl with a 58-degree right thoracic curve. Elective, full neuromonitoring."
  implants: "Medtronic Solera 5.5/6.0 screws x20, CoCr rods x2"
  complications: "Transient 60% drop in lower limb MEPs during correction; mean arterial pressure raised and correction eased, with full signal recovery."

neuro_spine_minor_009:
  operation: "Right carpal tunnel decompression"
  description: "63-year-old woman with severe carpal tunnel syndrome and thenar weakness. Day case, arm tourniquet."
  complications: "Tourniquet cuff deflated during the incision because of a failed connector; replaced and reinflated with the case completed."

neuro_spine_minor_010:
  operation: "Left ulnar nerve transposition"
  description: "44-year-old man with left cubital tunnel syndrome and a subluxing ulnar nerve. Day case."
  complications: "Posterior branch of the medial antebrachial cutaneous nerve divided on exposure; repaired primarily under loupes."

neuro_spine_minor_011:
  operation: "Bilateral endoscopic thoracic sympathectomy"
  description: "25-year-old male guitarist with severe palmar hyperhidrosis failing topical and oral treatment. Elective day case."
  complications: "Persistent left pneumothorax after lung re-expansion; 12 Fr chest drain placed at the end of the procedure."

neuro_spine_minor_012:
  operation: "Spinal cord stimulator implantation (percutaneous leads)"
  description: "49-year-old woman with failed back surgery syndrome and a successful stimulation trial. Elective."
  implants: "Medtronic Intellis IPG; Vectris SureScan leads x2"
  complications: "One lead damaged by the anchor during fixation, with high impedance; replaced with a new lead before tunnelling."

neuro_spine_minor_013:
  operation: "Intrathecal baclofen pump insertion"
  description: "11-year-old girl with spastic quadriplegic cerebral palsy and hip pain from spasm. Paediatric list."
  implants: "SynchroMed II 20 ml pump"
  complications: "CSF leak around the catheter at the lumbar fascia; purse-string suture placed and fibrin sealant applied."

neuro_spine_minor_014:
  operation: "XLIF L4/5 + percutaneous screws"
  description: "63-year-old woman with a degenerative lateral listhesis at L4/5 and left leg pain. Elective."
  implants: "CoRoent XL cage 10 x 18 x 55 mm; Reline screws x4"
  complications: "Small peritoneal tear during retroperitoneal access; closed with a running suture without bowel involvement."

neuro_spine_minor_015:
  operation: "Laminectomy L3 and excision of intradural dermoid cyst"
  description: "19-year-old woman with a dermal sinus tract and an intradural dermoid at the conus. Elective."
  complications: "Cyst capsule ruptured with spillage of keratinous debris into the thecal sac; irrigated thoroughly with saline and hydrocortisone."

neuro_spine_minor_016:
  operation: "Right L4/5 microdiscectomy"
  description: "39-year-old male courier with right L5 sciatica for 4 months and an L4/5 paracentral disc. Elective day case."
  complications: "One patty unaccounted for at the first closing count; localised on the table X-ray inside the wound and removed before closure."

neuro_spine_minor_017:
  operation: "ACDF C4/5 and C5/6"
  description: "60-year-old man with cervical myelopathy, bilateral arm paraesthesia and C4-C6 disc-osteophyte bars. Elective."
  implants: "Globus Xtend plate; PEEK cages x2"
  complications: "Burr tip fractured during endplate preparation; fragment retrieved from the disc space with a micro-pituitary and confirmed on fluoroscopy."

neuro_spine_minor_018:
  operation: "Percutaneous posterior fixation T12-L2 for L1 fracture"
  description: "35-year-old woman with an L1 Chance-type fracture from a seatbelt injury, neurologically intact. Trauma list."
  implants: "Viper Prime screws x4, rods (DePuy)"
  complications: "Guidewire advanced through the anterior cortex of L2 on lateral screening; pulled back before tapping, and the screw placed well."

neuro_spine_minor_019:
  operation: "Right index finger digital nerve repair"
  description: "28-year-old man with a glass laceration to the right index finger and numbness of the ulnar border. Hand trauma list."
  complications: "Operating microscope failed on warming up; repair completed with 4.5x loupes and 9-0 nylon."

neuro_spine_minor_020:
  operation: "L4/5 decompression"
  description: "70-year-old woman with lateral recess stenosis and bilateral leg pain. Elective."
  complications: "Right L4 inferior facet fractured during undercutting; pars intact, judged stable without fixation on screening."

neuro_spine_minor_021:
  operation: "ALIF L5/S1"
  description: "48-year-old man with L5/S1 degenerative disc disease and back pain. Joint with vascular access surgeon."
  implants: "Synthes SynFix-LR 12 mm cage"
  complications: "Small tear of the left iliolumbar vein during mobilisation; ligated with blood loss of 400 ml."

neuro_spine_minor_022:
  operation: "Posterior cervical laminectomy and fusion C3-C7"
  description: "72-year-old man with cervical myelopathy, multilevel stenosis and ischaemic heart disease. Elective."
  implants: "Lateral mass screws x10, 3.5 mm rods (Stryker Oasys)"
  complications: "Hypotension to 70/40 after turning prone, from a displaced arterial line and anaesthetic depth; line resited and vasopressor given."

neuro_spine_minor_023:
  operation: "Closure of thoracolumbar myelomeningocele"
  description: "1-day-old baby girl with an open thoracolumbar myelomeningocele. Neonatal emergency list."
  complications: "Core temperature dropped to 35.2 C; warmed with an incubator-style warming mattress and warmed irrigation."

neuro_spine_minor_024:
  operation: "Left thoracoscopic sympathectomy for hyperhidrosis"
  description: "30-year-old woman with severe palmar and axillary hyperhidrosis affecting her work as a pianist. Day case."
  complications: "Urticarial rash across the chest soon after induction, felt to be a latex reaction; antihistamine given, latex-free set-up and no progression."

neuro_spine_minor_025:
  operation: "Robotic L4-S1 posterior fusion"
  description: "58-year-old woman with L4/5 and L5/S1 degenerative disease and back pain. Robotic list."
  implants: "Globus Creo screws x6, rods; Sustain cages x2"
  complications: "Right S1 screw dropped on the floor while being loaded; discarded and a new screw of the same size opened."

neuro_spine_minor_026:
  operation: "Kyphoplasty L2 and L3"
  description: "83-year-old woman with two painful osteoporotic fractures and failure of oral analgesia. Day case."
  implants: "Kyphon Xpander II balloons; HV-R cement 6 ml total"
  complications: "Right L2 balloon ruptured on inflation; replaced with a new balloon tamp and cement delivered without leak."

neuro_spine_minor_027:
  operation: "Laminectomy and excision of T5 schwannoma"
  description: "55-year-old man with a T5 intradural extradural schwannoma and chest wall pain. Elective."
  complications: "Cefuroxime given to a patient labelled penicillin-allergic (rash only); recognised, no reaction occurred and allergy reviewed."

