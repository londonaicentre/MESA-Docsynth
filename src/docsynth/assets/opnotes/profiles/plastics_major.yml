plastics_major_001:
  operation: "Excision, debridement and SSG, 40% TBSA flame burns"
  description: "38-year-old man with 40% TBSA deep burns from a car fire, intubated in the burns ICU. Early excision list."
  complications: "Massive haemorrhage from the excised beds with 8 units of red cells, FFP and platelets transfused; excision limited to 20% and the rest dressed."

plastics_major_002:
  operation: "Radical debridement of necrotising fasciitis, abdominal wall and left flank"
  description: "71-year-old woman with diabetes and necrotising soft tissue infection of the abdominal wall, septic shock. Emergency, out of hours."
  complications: "Cardiac arrest (PEA) during debridement from septic shock; ROSC after 6 minutes of CPR and adrenaline, procedure truncated and transferred to ICU."

plastics_major_003:
  operation: "Debridement of burns, 85% TBSA"
  description: "82-year-old man with 85% TBSA full-thickness burns after a house fire, inhalational injury. Palliative discussion held with family."
  complications: "Refractory hypotension and asystolic arrest during debridement; resuscitation unsuccessful and patient died on the table."

plastics_major_004:
  operation: "Left ALT free flap to open tibial fracture wound"
  description: "29-year-old man with a Gustilo IIIB left tibial fracture and a 12 x 7 cm wound. Joint orthoplastic list."
  implants: "GEM coupler 3.0 mm"
  complications: "Descending branch of the lateral circumflex femoral artery found absent with inadequate perforators; flap abandoned and a free gracilis flap harvested instead."

plastics_major_005:
  operation: "Right flexor tendon repair zone II (FDP and FDS, middle finger)"
  description: "26-year-old man with a knife wound to the right middle finger and no active flexion. Trauma list."
  complications: "Repair performed on the right ring finger tendons after misreading the exploration; recognised at the end, the correct middle finger explored and repaired, and the ring finger tendons repaired."

plastics_major_006:
  operation: "Excision of right forearm soft tissue sarcoma"
  description: "47-year-old woman with a 6 cm high-grade sarcoma in the volar right forearm abutting the radial artery. Sarcoma MDT."
  complications: "Radial artery divided with the tumour; reconstructed with a reversed vein graft to maintain hand perfusion."

plastics_major_007:
  operation: "Right palmar fasciectomy, index to little fingers"
  description: "72-year-old man with extensive Dupuytren's disease of the right hand. Elective, regional block."
  complications: "Both digital nerves to the ring finger divided during dissection of a spiral cord; repaired under the microscope with 9-0 nylon."

plastics_major_008:
  operation: "Primary repair of lacerated hamstrings (semimembranosus, biceps femoris), left"
  description: "34-year-old man with a deep left posterior thigh laceration from falling onto a glass table. Emergency."
  complications: "Sciatic nerve partially lacerated in the wound bed found on exploration; repaired by the peripheral nerve team."

plastics_major_009:
  operation: "Free gracilis flap to left foot"
  description: "54-year-old woman with a large dorsal left foot wound exposing tendons after a crush injury. Orthoplastic list."
  implants: "GEM coupler 2.0 mm"
  complications: "Repeated venous anastomotic thrombosis despite revision; flap declared non-viable, removed and the wound dressed with NPWT."

plastics_major_010:
  operation: "Wide local excision of melanoma scar, left upper arm + left axillary SLNB"
  description: "45-year-old woman with a 2.5 mm Breslow melanoma of the left upper arm. Elective."
  complications: "Anaphylaxis after Patent Blue injection with hypotension and a widespread rash; adrenaline given and SLNB completed with isotope alone after stabilisation."

plastics_major_011:
  operation: "Split thickness skin grafts, bilateral lower legs (burns)"
  description: "6-year-old boy with 12% TBSA flame burns to both legs from a bonfire accident, not healing at 2 weeks. Paediatric burns list."
  complications: "Unanticipated difficult airway with a burnt oropharynx not previously noticed; intubation achieved with a videolaryngoscope on the third attempt after desaturation to 80%."

plastics_major_012:
  operation: "Abdominal wall reconstruction with bilateral component separation and mesh"
  description: "59-year-old man with a large abdominal wall hernia and loss of domain from an old gunshot injury. Joint plastics and general surgery case."
  implants: "Strattice 25 x 20 cm; Prolene mesh onlay 30 x 30 cm"
  complications: "Small bowel enterotomy during adhesiolysis; repaired by the general surgeons and the synthetic onlay mesh replaced by biological mesh only."

plastics_major_013:
  operation: "Left ilioinguinal lymphadenectomy"
  description: "67-year-old woman with melanoma of the left thigh and bulky inguinal and external iliac nodal disease. Elective."
  complications: "Bladder dome opened during pelvic node dissection; repaired in two layers by urology with a catheter for 10 days."

plastics_major_014:
  operation: "Fasciotomy + debridement, right lower leg"
  description: "40-year-old man with a crush injury to the right leg under a forklift. Emergency."
  complications: "Anterior tibial artery found transected; vascular surgeons performed an interposition vein graft and 3 units of blood were transfused."

plastics_major_015:
  operation: "Excision of right thigh lipoma"
  description: "58-year-old man with a 12 cm subcutaneous lipoma of the anterior right thigh. Elective under local anaesthetic."
  complications: "Seizure and ventricular ectopy from local anaesthetic toxicity after a large lidocaine volume; managed with Intralipid and benzodiazepine, procedure stopped and completed later."

plastics_major_016:
  operation: "Achilles tendon repair (open), right"
  description: "52-year-old man with an acute right Achilles rupture. Elective, prone."
  complications: "Tourniquet left inflated for 3 hours unnoticed after an equipment delay; subsequent leg swelling and tight compartments needed a four-compartment fasciotomy."

plastics_major_017:
  operation: "Tendon transfer (FDS4 opponensplasty), left"
  description: "40-year-old woman with a left low median nerve palsy and loss of thumb opposition. Elective."
  complications: "Swab count discrepancy unresolved at closure; X-ray on table showed a swab in the subcutaneous tunnel, wound reopened and swab retrieved."

plastics_major_018:
  operation: "Pedicled latissimus dorsi flap to posterior trunk defect"
  description: "35-year-old man with a large soft tissue defect of the upper back after resection of a DFSP. Elective."
  complications: "Pneumothorax from a pleural breach during flap elevation deep to the ribs; chest drain inserted on table."

plastics_major_019:
  operation: "Right calf muscle biopsy (open)"
  description: "9-year-old boy with suspected muscular dystrophy and a family history of malignant hyperthermia. Paediatric list, volatile-free anaesthetic planned."
  complications: "Volatile agent administered by error at induction; noticed within minutes and switched to TIVA, no signs of malignant hyperthermia developed."

plastics_major_020:
  operation: "Distal biceps tendon repair, left"
  description: "46-year-old man with an acute left distal biceps rupture. Elective."
  implants: "Synthes 2.7 mm LCP (4-hole); Arthrex Corkscrew FT 5.5 mm anchor"
  complications: "Fracture of the proximal radial cortex while drilling the button tunnel, seen on fluoroscopy; fixed with a 2.7 mm plate and the tendon secured with an anchor instead."

plastics_major_021:
  operation: "Free radial forearm flap to right hand"
  description: "37-year-old woman with a dorsal hand defect exposing extensor tendons after a friction burn. Elective."
  implants: "GEM coupler 2.0 mm"
  complications: "Venous air embolism during the donor vein dissection with a drop in end-tidal CO2 and hypotension; field flooded with saline, head-down tilt, recovered."

plastics_major_022:
  operation: "Excision of scalp BCC + SSG"
  description: "86-year-old man with a large recurrent BCC of the scalp. Local anaesthetic, elective."
  complications: "Deep excision breached the outer table of the skull and a small dural breach found; neurosurgery repaired it and a pericranial flap was turned over the bone before grafting."

plastics_major_023:
  operation: "Right fasciectomy, ring finger + PIPJ release"
  description: "74-year-old man with severe Dupuytren's contracture of the right ring finger, PIPJ 90 degrees. Elective."
  complications: "Finger remained white after tourniquet release from vasospasm and stretched digital arteries; papaverine and partial flexion failed, finger explored and a vein graft to the ulnar digital artery restored flow."

plastics_major_024:
  operation: "Washout and debridement right hand fight bite + extensor tendon repair"
  description: "22-year-old man with a clenched-fist injury over the right middle MCPJ and a partially divided extensor tendon. Emergency."
  complications: "Chlorhexidine anaphylaxis at skin prep with bronchospasm and hypotension; treated with adrenaline, procedure abandoned and patient admitted to ICU."

plastics_major_025:
  operation: "Right medial gastrocnemius muscle flap + SSG"
  description: "65-year-old man with an exposed patella and tendon from a pretibial wound breakdown after trauma. Orthoplastic list."
  complications: "Sterility breach when the flap was dropped on the drape edge touching the floor; flap irrigated, extra antibiotics given and case completed, incident reported."

plastics_major_026:
  operation: "Tendo-Achilles lengthening, bilateral, percutaneous"
  description: "14-year-old girl with Charcot-Marie-Tooth disease and fixed bilateral equinus limiting walking. Elective."
  complications: "Complete Achilles rupture on the left from over-release; converted to open and the tendon repaired end-to-end."

plastics_major_027:
  operation: "Repair of lacerated quadriceps muscle and tendon, left"
  description: "25-year-old man with a deep left anterior thigh laceration from a fall through a window, unable to straight-leg raise. Emergency."
  complications: "Femoral artery branch (descending lateral circumflex) bleeding with 1.8 L blood loss, controlled by vascular surgeons and 3 units transfused."

plastics_major_028:
  operation: "Forearm fasciotomy and carpal tunnel release, left"
  description: "19-year-old man with a left forearm compartment syndrome after a supracondylar-level crush injury. Emergency."
  complications: "Median nerve found divided within the carpal tunnel at release; primary repair performed under the microscope."

plastics_major_029:
  operation: "Tendon transfers for radial nerve palsy, right (PT to ECRB, FCU to EDC, PL to EPL)"
  description: "44-year-old woman with a permanent right radial nerve palsy. Elective."
  complications: "Operation performed on the wrong side up to incision; left forearm incised before the marking discrepancy was noticed, wound closed and correct right-sided operation performed."
