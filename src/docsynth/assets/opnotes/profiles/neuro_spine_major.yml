neuro_spine_major_001:
  operation: "ALIF L4/5 and L5/S1"
  description: "55-year-old woman with two-level degenerative disc disease and back pain. Joint with vascular access surgeon."
  implants: "Stryker Aero-AL cages x2"
  complications: "Laceration of the left common iliac vein during retraction with 2 litres of blood loss; repaired by the vascular surgeon and 4 units transfused."

neuro_spine_major_002:
  operation: "ACDF C4-C6"
  description: "64-year-old man with cervical myelopathy and large anterior osteophytes. Elective."
  implants: "Atlantis Vision Elite plate 40 mm; PEEK cages x2"
  complications: "Oesophageal perforation identified during retractor placement; repaired primarily by the upper GI surgeon with a muscle flap and nil by mouth."

neuro_spine_major_003:
  operation: "L4/5 microdiscectomy"
  description: "42-year-old male taxi driver with 3 months of right L5 radiculopathy from an L4/5 disc protrusion. Elective day case."
  complications: "Rongeur passed through the anterior annulus causing a right common iliac artery tear with hypotension; closed rapidly, turned supine and emergency laparotomy repair by vascular surgeons."

neuro_spine_major_004:
  operation: "Posterior spinal fusion T2-L3 for scoliosis"
  description: "13-year-old boy with a 75-degree Scheuermann's kyphosis and back pain. Paediatric spinal list."
  implants: "Pedicle screws x22 left in situ (rods removed)"
  complications: "Persistent loss of lower limb MEPs after osteotomy closure with an absent wake-up test; rods removed, operation abandoned and steroids given."

neuro_spine_major_005:
  operation: "L4/5 microdiscectomy"
  description: "51-year-old woman with left L5 sciatica and a large L4/5 disc herniation. Elective."
  complications: "Discectomy initially performed at L3/4; wrong level recognised on a check X-ray, the correct L4/5 disc then removed and a duty of candour discussion held."

neuro_spine_major_006:
  operation: "Vertebroplasty T7, T8, T10"
  description: "76-year-old woman with metastatic breast cancer and multiple painful vertebral deposits. IR list."
  implants: "PMMA cement 7 ml total"
  complications: "Sudden hypoxia and hypotension during cement injection with cement in the azygos system; oxygen and vasopressors given and the last level abandoned."

neuro_spine_major_007:
  operation: "Posterior instrumented fusion L3-S1"
  description: "80-year-old woman with severe osteoporosis and degenerative spondylolisthesis with stenosis. Elective."
  implants: "Fenestrated cement-augmented pedicle screws x8 (Stryker Xia), rods"
  complications: "L5 screws pulled out of osteoporotic bone on rod reduction; construct extended to L2 with cement augmentation at all levels."

neuro_spine_major_008:
  operation: "C5/6 cervical disc replacement converted to ACDF"
  description: "47-year-old man with right C6 radiculopathy and a soft disc. Motion preservation planned."
  implants: "PEEK cage 6 mm; Zevo plate"
  complications: "Disc prosthesis migrated anteriorly out of the disc space after insertion; removed and the level fused instead."

neuro_spine_major_009:
  operation: "Posterior C6-T2 stabilisation for fracture in ankylosing spondylitis"
  description: "73-year-old man with ankylosing spondylitis and a C7 extension fracture after a fall, fixed kyphotic neck. Trauma list."
  implants: "Lateral mass and pedicle screws x8, rods"
  complications: "Failed direct laryngoscopy with desaturation to 65%; front-of-neck access avoided with awake fibreoptic intubation after waking."

neuro_spine_major_010:
  operation: "T10-L2 posterior fixation and decompression for metastasis"
  description: "66-year-old man with lung cancer and a T12 metastasis causing cord compression. Emergency MSCC list."
  implants: "Pedicle screws x8, rods"
  complications: "Cardiac arrest (PEA) while prone after sudden blood loss; turned supine, CPR for 4 minutes with ROSC and operation completed after stabilisation."

neuro_spine_major_011:
  operation: "Lumbar decompression L4/5"
  description: "69-year-old woman with lumbar canal stenosis and claudication limiting her to 100 metres; asthma on inhalers. Elective."
  complications: "Severe hypotension, bronchospasm and a widespread rash after the gelatin haemostatic agent was applied; treated as anaphylaxis with adrenaline and the case finished quickly."

neuro_spine_major_012:
  operation: "Sacrectomy (en bloc, S2 and below) for chordoma"
  description: "62-year-old woman with a large sacral chordoma. Joint colorectal and plastics case."
  complications: "Rectal wall breached during anterior dissection; colorectal team repaired it and formed a defunctioning colostomy."

neuro_spine_major_013:
  operation: "ALIF L5/S1"
  description: "44-year-old woman with painful L5/S1 degenerative disc disease and Modic changes despite a year of physiotherapy. Elective."
  implants: "Synthes SynFix-LR cage"
  complications: "Left ureter transected during retroperitoneal exposure; urology repaired it over a JJ stent."

neuro_spine_major_014:
  operation: "TLIF L4/5"
  description: "57-year-old man with L4/5 isthmic spondylolisthesis, back pain and bilateral L5 leg pain. Elective."
  implants: "Pedicle screws x4, rods; PEEK cage"
  complications: "Final X-ray showed a retained radio-opaque patty in the paraspinal muscle; wound reopened and the patty retrieved."

neuro_spine_major_015:
  operation: "C4-C6 laminectomy and excision of intramedullary astrocytoma"
  description: "31-year-old woman with a cervical intramedullary tumour and progressive arm weakness. Elective with neuromonitoring."
  complications: "Loss of D-wave amplitude beyond 50% during tumour dissection; resection stopped and biopsy only taken."

neuro_spine_major_016:
  operation: "Right VATS sympathectomy converted to thoracotomy"
  description: "34-year-old female nurse with severe palmar hyperhidrosis despite topical treatment and botulinum toxin. Day case planned."
  complications: "Intercostal artery bleeding from the chain dissection not controllable thoracoscopically; converted to mini-thoracotomy with 1.2 litres blood loss and transfusion."

neuro_spine_major_017:
  operation: "Endoscopic left carpal tunnel release"
  description: "59-year-old male mechanic with left carpal tunnel syndrome, severe on nerve conduction studies. WALANT day case."
  complications: "Recurrent motor branch of the median nerve divided; converted to open and repaired under the microscope."

neuro_spine_major_018:
  operation: "Intrathecal baclofen pump replacement and refill"
  description: "38-year-old man with spinal cord injury spasticity and a baclofen pump at end of battery life. Day case."
  implants: "SynchroMed II 40 ml pump"
  complications: "Pump filled with 2000 mcg/ml instead of 500 mcg/ml baclofen; recognised at the end, reservoir emptied and refilled and the patient monitored in HDU."

