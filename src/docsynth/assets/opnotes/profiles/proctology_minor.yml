proctology_minor_001:
  operation: "Milligan-Morgan haemorrhoidectomy"
  description: "49-year-old man with grade IV haemorrhoids and recurrent prolapse. Elective day case."
  complications: "Brisk bleeding from the right anterior pedicle after excision; suture-ligated with 2-0 Vicryl and haemostasis secured."

proctology_minor_002:
  operation: "PPH stapled haemorrhoidopexy"
  description: "51-year-old woman with circumferential prolapsing haemorrhoids. Elective."
  complications: "Staple-line bleeding at 3 o'clock after firing the stapler, controlled with two figure-of-eight sutures."

proctology_minor_003:
  operation: "Lateral internal sphincterotomy"
  description: "30-year-old woman with a chronic anterior fissure unresponsive to GTN and diltiazem. Day case."
  complications: "Small breach of the anoderm at the sphincterotomy site, closed with a single absorbable suture."

proctology_minor_004:
  operation: "EUA and fistulotomy"
  description: "39-year-old man with a low intersphincteric fistula and intermittent discharge. Day case."
  complications: "Probe created a false passage at the apex of the tract; the true internal opening was found with hydrogen peroxide injection and the correct tract laid open."

proctology_minor_005:
  operation: "EUA + draining seton insertion"
  description: "27-year-old man with perianal Crohn's disease and a trans-sphincteric fistula. Elective."
  complications: "Count discrepancy of one swab at closure; located in the anal canal on re-examination and count then correct."

proctology_minor_006:
  operation: "I&D of perianal abscess"
  description: "35-year-old woman with a large tender perianal swelling and fever. Emergency list."
  complications: "Diathermy pencil failed mid-procedure and was replaced; brisk ooze from the cavity controlled with packing in the meantime."

proctology_minor_007:
  operation: "Excision of pilonidal sinus and Karydakis flap"
  description: "20-year-old man with recurrent pilonidal abscesses and chronic discharge. Elective."
  complications: "Minor diathermy burn to the skin edge from the pad contact; excised within the wound margin."

proctology_minor_008:
  operation: "Delorme's rectal mucosal sleeve resection"
  description: "79-year-old woman with a recurrent full-thickness rectal prolapse and faecal incontinence. Elective under spinal."
  complications: "Spinal-related hypotension on positioning in prone jack-knife, treated with metaraminol and fluids."

proctology_minor_009:
  operation: "EUA anus and cutting seton"
  description: "44-year-old man with a posterior trans-sphincteric fistula. Elective."
  complications: "Laryngospasm on LMA removal at the end, managed with CPAP and a small dose of propofol; recovered fully."

proctology_minor_010:
  operation: "THD (Doppler-guided haemorrhoidal dearterialisation) + mucopexy"
  description: "42-year-old woman with bleeding grade III haemorrhoids. Day case."
  complications: "Doppler probe failed to give a signal; replaced with a new probe from stock and the procedure completed."

proctology_minor_011:
  operation: "Drainage of perianal abscess"
  description: "2-year-old girl with a painful red swelling beside the anus. Paediatric emergency list."
  complications: "Pus spilled onto the drapes on incision; area cleaned, drapes changed and a swab sent for culture."

proctology_minor_012:
  operation: "Altemeier's procedure"
  description: "84-year-old woman with a large full-thickness rectal prolapse and ulceration. Elective under spinal anaesthesia."
  complications: "Bleeding from a mesorectal vessel during division of the mesentery, controlled with a transfixion suture."

proctology_minor_013:
  operation: "EUA, fistulotomy and excision of skin tags"
  description: "52-year-old man with a low perianal fistula and irritating skin tags. Day case."
  complications: "Scrub nurse's glove punctured on the fistula probe tip while passing it; glove and probe changed and the field re-covered."
