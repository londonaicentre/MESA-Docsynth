endocrine_minor_001:
  operation: "Total thyroidectomy with nerve monitoring"
  description: "47-year-old woman with Graves' disease and moderate thyroid eye disease, euthyroid on carbimazole. Elective."
  complications: "Loss of signal on the left after the first side; paused for 20 minutes, signal recovered and the right side then completed."

endocrine_minor_002:
  operation: "Total thyroidectomy"
  description: "59-year-old woman with a symptomatic multinodular goitre and a sensation of choking. Elective."
  complications: "Left inferior parathyroid devascularised during capsular dissection; minced and autotransplanted into the sternocleidomastoid."

endocrine_minor_003:
  operation: "Right hemithyroidectomy"
  description: "39-year-old man, lorry driver, with a 3.5 cm right thyroid nodule, Thy3f on FNA. Elective."
  complications: "Right superior parathyroid found on the specimen at the back table; confirmed on frozen section and reimplanted into the strap muscles."

endocrine_minor_004:
  operation: "Left thyroid lobectomy"
  description: "63-year-old woman, amateur choir singer, with a 4 cm left nodule of indeterminate cytology."
  complications: "External branch of the left superior laryngeal nerve caught in a superior pole tie; tie released and nerve seen intact but bruised."

endocrine_minor_005:
  operation: "TT + central neck dissection"
  description: "43-year-old man with papillary thyroid carcinoma and central nodal disease on ultrasound. Elective."
  complications: "Tie on the right superior thyroid artery slipped with brisk bleeding; controlled with clips and a new tie."

endocrine_minor_006:
  operation: "Bilateral subtotal thyroidectomy"
  description: "66-year-old woman with a large benign multinodular goitre causing difficulty swallowing tablets. Elective."
  complications: "Ultrasonic energy device failed mid-case; finished with clips and ties."

endocrine_minor_007:
  operation: "Completion thyroidectomy, right"
  description: "36-year-old woman with a 4 cm papillary carcinoma of the left lobe with lymphovascular invasion; right lobe in situ."
  complications: "Right inferior parathyroid removed with the specimen in dense tissue; found on inspection, confirmed on frozen section and autotransplanted."

endocrine_minor_008:
  operation: "Focused right inferior parathyroidectomy with methylene blue"
  description: "56-year-old woman with primary hyperparathyroidism and a right inferior adenoma on sestamibi; ultrasound unhelpful."
  complications: "IV methylene blue given despite her regular sertraline; recognised, drug stopped and monitored for serotonin syndrome, with none seen."

endocrine_minor_009:
  operation: "Parathyroidectomy (left superior) with intraoperative PTH"
  description: "68-year-old man with primary hyperparathyroidism, osteoporosis and a left superior adenoma on 4D-CT. Day case."
  complications: "Rapid PTH analyser failed; samples sent to the main lab and the case paused until the result came back."

endocrine_minor_010:
  operation: "Bilateral neck exploration, excision of right inferior parathyroid adenoma"
  description: "74-year-old woman with primary hyperparathyroidism and a calcium of 3.1, non-localising scans."
  complications: "Adenoma capsule ruptured during removal with spillage of parathyroid tissue; fragments picked out and the bed irrigated."

endocrine_minor_011:
  operation: "Laparoscopic left adrenalectomy"
  description: "53-year-old man with resistant hypertension, low potassium and a 4 cm left aldosterone-producing adenoma. Elective."
  complications: "Small splenic capsular tear during splenic mobilisation; controlled with a haemostatic agent and pressure."

endocrine_minor_012:
  operation: "Posterior retroperitoneoscopic right adrenalectomy"
  description: "44-year-old woman with a 3 cm right cortisol-secreting adenoma. Elective."
  complications: "Pleura opened near the 12th rib; small pneumothorax aspirated with a catheter under positive pressure at closure."

endocrine_minor_013:
  operation: "Lap left adrenalectomy for phaeochromocytoma"
  description: "58-year-old woman with a 5 cm left phaeochromocytoma, alpha-blocked with doxazosin."
  complications: "Systolic pressure rose to 240 mmHg during tumour handling; controlled with phentolamine and a GTN infusion before the adrenal vein was clipped."

endocrine_minor_014:
  operation: "Laparoscopic right adrenalectomy"
  description: "39-year-old woman with Conn's syndrome and a right-sided adenoma on AVS. Elective."
  complications: "Widespread subcutaneous emphysema with hypercarbia; pressure lowered and ventilation increased, then the case completed."

endocrine_minor_015:
  operation: "Total thyroidectomy"
  description: "31-year-old woman with Graves' disease, poorly controlled on carbimazole and propranolol. Semi-urgent."
  complications: "Fast AF during thyroid mobilisation treated with esmolol and magnesium, reverting to sinus rhythm."

endocrine_minor_016:
  operation: "Total thyroidectomy with partial sternal split"
  description: "77-year-old man with a large retrosternal goitre and superior vena cava obstruction. Joint case with cardiothoracics."
  complications: "Right pleura opened during mediastinal dissection; chest drain placed."
