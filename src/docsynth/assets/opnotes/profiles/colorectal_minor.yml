colorectal_minor_001:
  operation: "Extended right hemicolectomy, open, with end ileostomy and mucous fistula"
  description: "81-year-old man, frail, presenting with large bowel obstruction from a hepatic flexure tumour. Emergency."
  complications: "Serosal tear and faecal contamination from the distended caecum during mobilisation; washout performed."

colorectal_minor_002:
  operation: "Lap transverse colectomy"
  description: "66-year-old woman with a mid-transverse colon adenocarcinoma. Previous lower midline scar from hysterectomy."
  complications: "Capsular tear of the spleen during splenic flexure mobilisation, controlled with haemostatic agent and pressure."

colorectal_minor_003:
  operation: "Laparoscopic reversal of Hartmann's"
  description: "61-year-old woman with an end colostomy, keen for restoration of continuity. Contrast enema shows a healthy rectal stump."
  complications: "Incomplete anastomotic doughnut on the circular stapler; anastomosis oversewn and air leak test then negative."

colorectal_minor_004:
  operation: "Laparotomy, small bowel resection x2 and stricturoplasty x3"
  description: "35-year-old man with long-standing multifocal small bowel Crohn's and recurrent obstruction."
  complications: "Two enterotomies during adhesiolysis, repaired primarily in two layers."

colorectal_minor_005:
  operation: "Completion proctectomy + ileal pouch formation (IPAA), lap-assisted"
  description: "28-year-old man with ulcerative colitis and an end ileostomy, wanting restoration of continuity. Elective."
  complications: "Linear stapler misfire on the rectal stump; stump re-stapled with a new cartridge."

colorectal_minor_006:
  operation: "Lap appendicectomy + washout"
  description: "34-year-old man with perforated appendicitis on CT and localised peritonitis. Overnight."
  complications: "Faecolith dropped into the pelvis during extraction and retrieved; appendix base friable and oversewn."

colorectal_minor_007:
  operation: "Sigmoid colectomy, open, with primary anastomosis and on-table lavage"
  description: "79-year-old woman with sigmoid volvulus, second episode, gangrenous on endoscopy. Emergency."
  complications: "Atrial fibrillation with hypotension on reperfusion after untwisting, treated with amiodarone and vasopressors."

colorectal_minor_008:
  operation: "Laparoscopic right hemicolectomy"
  description: "69-year-old man with an ascending colon cancer and COPD. Elective."
  complications: "Bleeding from a torn middle colic vein branch, controlled laparoscopically with clips and a haemostatic patch."

colorectal_minor_009:
  operation: "Robotic right hemicolectomy"
  description: "62-year-old woman with a caecal adenocarcinoma found on screening. Elective."
  complications: "Robotic arm collision fault mid-case; system restarted and instruments re-docked with a 10-minute delay."

colorectal_minor_010:
  operation: "Right hemicolectomy (lap-assisted) with extracorporeal anastomosis"
  description: "75-year-old woman with a hepatic flexure cancer and obesity. Elective."
  complications: "Small serosal tear of the second part of the duodenum during flexure mobilisation, oversewn with interrupted sutures."

colorectal_minor_011:
  operation: "Open transverse colectomy"
  description: "82-year-old man with an obstructing transverse colon cancer. Urgent, same admission."
  complications: "Gastric serosal tear while dividing the gastrocolic ligament, repaired with a seromuscular suture."

colorectal_minor_012:
  operation: "Laparoscopic left hemicolectomy"
  description: "58-year-old woman with a descending colon cancer found after a positive FIT. Elective."
  complications: "Surgical emphysema of the chest wall and neck with rising end-tidal CO2; insufflation pressure reduced and case completed."

colorectal_minor_013:
  operation: "Lap L hemicolectomy + splenic flexure mobilisation"
  description: "71-year-old man with a splenic flexure adenocarcinoma. Elective."
  complications: "Ooze from the lower pole of the spleen after capsular avulsion, settled with Surgicel and a Floseal application."

colorectal_minor_014:
  operation: "Laparoscopic sigmoid colectomy"
  description: "47-year-old woman with recurrent diverticulitis and a narrowed sigmoid on CT colonography. Elective."
  complications: "Circular stapler anvil detached on firing; anastomosis inspected, completed with reinforcing sutures and leak test negative."

colorectal_minor_015:
  operation: "Robotic sigmoid colectomy"
  description: "64-year-old man with a sigmoid adenocarcinoma, T2 on CT. Elective."
  complications: "Needle count discrepancy at closure; the missing needle was found in the pelvis on laparoscopy and removed."

colorectal_minor_016:
  operation: "Laparoscopic subtotal colectomy and end ileostomy"
  description: "25-year-old woman with acute severe ulcerative colitis not responding to intravenous steroids and infliximab. Urgent."
  complications: "Perforation of the friable transverse colon during handling, with minor spillage; site clamped and peritoneum lavaged."

colorectal_minor_017:
  operation: "Total colectomy and ileorectal anastomosis (lap)"
  description: "38-year-old woman with slow-transit constipation after full physiology work-up. Elective."
  complications: "Bradycardia to 38 on insufflation; desufflated, given glycopyrrolate and restarted at lower pressure."

colorectal_minor_018:
  operation: "Panproctocolectomy and end ileostomy (open)"
  description: "57-year-old man with Crohn's colitis and a stricture in the sigmoid. Elective."
  implants: "Prophylactic parastomal mesh, Dynamesh IPST 15 x 15 cm"
  complications: "Presacral venous ooze during posterior rectal mobilisation, controlled with diathermy and a haemostatic sponge."

colorectal_minor_019:
  operation: "Laparoscopic panproctocolectomy + end ileostomy"
  description: "44-year-old woman with ulcerative colitis and a dysplastic rectal lesion, not wanting a pouch. Elective."
  complications: "Cefuroxime given at induction despite a documented penicillin-class rash allergy; noticed immediately, no reaction occurred and antibiotics were changed."

colorectal_minor_020:
  operation: "Hartmann's procedure"
  description: "74-year-old man with perforated sigmoid diverticulitis and purulent peritonitis. Emergency."
  complications: "Rectal stump staple line bled; oversewn with a running 3-0 PDS."

colorectal_minor_021:
  operation: "Laparoscopic Hartmann's procedure"
  description: "66-year-old woman with a perforated sigmoid diverticular abscess not responding to antibiotics. Emergency, weekend."
  complications: "Insufflator failed mid-case with loss of pneumoperitoneum; replaced from the neighbouring theatre and case continued."

colorectal_minor_022:
  operation: "Open reversal of Hartmann's"
  description: "59-year-old man with an end colostomy, a short rectal stump and dense pelvic adhesions on CT. Elective."
  complications: "Small serosal tear to the rectal stump during pelvic dissection, repaired with interrupted seromuscular sutures."

colorectal_minor_023:
  operation: "Laparoscopic anterior resection + loop ileostomy"
  description: "65-year-old man with a mid-rectal cancer after short-course radiotherapy. Elective."
  complications: "Positive air leak test at the stapled anastomosis; defect identified anteriorly and oversewn transanally, retest negative."

colorectal_minor_024:
  operation: "Robotic low anterior resection"
  description: "52-year-old woman with a mid-rectal adenocarcinoma, clear CRM on MRI. Elective."
  complications: "Contamination of the operating field when a gown was torn at the console assistant's sleeve; re-gowned and re-gloved, no further issue."

colorectal_minor_025:
  operation: "Anterior resection (open) with coloanal J-pouch"
  description: "73-year-old man with a low rectal cancer after long-course chemoradiotherapy. Elective."
  complications: "Core temperature fell to 34.8 degrees during the long pelvic phase; active warming increased and temperature recovered by the end."

colorectal_minor_026:
  operation: "Laparoscopic APER"
  description: "68-year-old man with a low rectal cancer involving the sphincter complex. Elective."
  complications: "Small tear in the posterior bladder wall serosa during anterior dissection, repaired in one layer; cystoscopy not needed."

colorectal_minor_027:
  operation: "Abdominoperineal excision of rectum"
  description: "63-year-old woman with a recurrent anal cancer after chemoradiotherapy. Elective."
  implants: "Biological perineal mesh (Strattice 16 x 20 cm)"
  complications: "Tumour breached at the perineal dissection with minor spillage; area irrigated and margin marked for pathology."

colorectal_minor_028:
  operation: "ELAPE, prone position"
  description: "56-year-old man with a T4 low rectal cancer involving the levators. Elective."
  complications: "Pressure area over the left forehead noticed when turning prone after a headrest slip; repositioned, skin intact."

colorectal_minor_029:
  operation: "TAMIS excision of rectal adenoma"
  description: "70-year-old woman with a 4 cm anterior rectal adenoma at 9 cm. Day case."
  complications: "Full-thickness defect entered the peritoneal cavity; closed transanally with a V-Loc suture and pneumoperitoneum settled."

colorectal_minor_030:
  operation: "Transanal endoscopic microsurgery"
  description: "77-year-old man on clopidogrel with a 3 cm posterior rectal adenoma at 7 cm. Elective, clopidogrel stopped 7 days earlier."
  complications: "Bleeding from the resection bed controlled with diathermy and a haemostatic clip."

colorectal_minor_031:
  operation: "Laparoscopic ileocaecal resection"
  description: "27-year-old man with stricturing terminal ileal Crohn's and an inflammatory mass. Elective."
  complications: "Inadvertent enterotomy of an adherent loop of sigmoid colon, repaired primarily."

colorectal_minor_032:
  operation: "Ileocolic resection (open)"
  description: "14-year-old girl with fistulating terminal ileal Crohn's disease. Paediatric surgery list."
  complications: "Abscess cavity entered during mobilisation with pus spillage; drained, swabbed for culture and washed out."

colorectal_minor_033:
  operation: "Laparotomy, adhesiolysis and small bowel resection"
  description: "72-year-old man with an obstructing small bowel adhesive mass and strangulation on CT. Emergency."
  complications: "Three serosal tears during adhesiolysis, oversewn."

colorectal_minor_034:
  operation: "Laparoscopic small bowel resection (Meckel's diverticulum)"
  description: "10-year-old boy with small bowel obstruction from a band to a Meckel's diverticulum. Paediatric emergency."
  complications: "10 mm port dislodged and intra-abdominal gas leaked; port resited and fixed with a purse-string."

colorectal_minor_035:
  operation: "Heineke-Mikulicz stricturoplasty x2"
  description: "26-year-old woman with jejunal Crohn's strictures and anaemia. Elective."
  complications: "Bleeding from an ulcer within the stricture, controlled with an under-running suture."

colorectal_minor_036:
  operation: "Laparoscopic formation of end colostomy"
  description: "52-year-old man with a complex rectourethral fistula after radiotherapy. Elective."
  complications: "Colostomy initially brought out under tension; extra mobilisation of the descending colon then allowed a tension-free stoma."

colorectal_minor_037:
  operation: "Trephine loop ileostomy"
  description: "80-year-old woman with a malignant rectovaginal fistula from cervical cancer, frail. Palliative."
  complications: "Intermittent desaturation from laryngeal mask displacement; airway replaced with an endotracheal tube."

colorectal_minor_038:
  operation: "Laparotomy + loop ileostomy formation"
  description: "4-week-old boy with Hirschsprung's disease and enterocolitis not controlled with washouts. Neonatal list."
  complications: "Hypothermia to 35.2 degrees on the table; forced-air warming increased and theatre temperature raised."

colorectal_minor_039:
  operation: "Closure of loop ileostomy"
  description: "62-year-old woman with a covering loop ileostomy; distal contrast study normal. Elective."
  complications: "Small enterotomy of the efferent limb during dissection from the rectus sheath, included in the resected segment."

colorectal_minor_040:
  operation: "Reversal of loop colostomy (transverse)"
  description: "70-year-old man with a transverse loop colostomy whose colovesical fistula has now healed. Elective."
  complications: "Linear stapler jammed on firing; stapler removed, the partial line inspected and the anastomosis completed by hand."

colorectal_minor_041:
  operation: "Ileostomy closure with prophylactic mesh"
  description: "68-year-old woman with a loop ileostomy, obese and diabetic. Elective."
  implants: "Phasix ST 10 x 15 cm"
  complications: "Swab count incorrect at closure; the swab was found within the subcutaneous wound and removed before skin closure."

colorectal_minor_042:
  operation: "Restorative proctocolectomy and IPAA"
  description: "30-year-old man with ulcerative colitis resistant to three biologics. Elective."
  complications: "Pouch would not reach the anus; extra length gained by releasing the SMA peritoneum and scoring the mesentery."

colorectal_minor_043:
  operation: "Lap appendicectomy"
  description: "22-year-old woman with right iliac fossa pain and a raised white cell count. Emergency."
  complications: "Right ovarian cyst ruptured during inspection of the pelvis; fluid suctioned and ovary left in situ."

colorectal_minor_044:
  operation: "Open appendicectomy"
  description: "7-year-old girl with 4 days of pain and a right iliac fossa mass. Paediatric CEPOD list."
  complications: "Perforated appendix with pus spilled into the wound on delivery; wound irrigated and pelvis washed out."

colorectal_minor_045:
  operation: "Laparoscopic adhesiolysis"
  description: "51-year-old woman with recurrent adhesional obstruction and chronic pain. Elective."
  complications: "Small serosal injury to the jejunum on entry via Palmer's point, repaired laparoscopically."

colorectal_minor_046:
  operation: "Laparotomy, extensive adhesiolysis"
  description: "76-year-old man with recurrent small bowel obstruction and a hostile abdomen on CT. Emergency."
  complications: "Two enterotomies during dense adhesiolysis, repaired with 3-0 PDS."

colorectal_minor_047:
  operation: "Colonoscopy + EMR of 30 mm transverse colon polyp"
  description: "71-year-old woman referred from screening with a large flat transverse colon polyp. Complex polyp list."
  complications: "Intraprocedural bleeding from the EMR base, controlled with coagulation forceps and three clips."

colorectal_minor_048:
  operation: "Colonoscopy and SEMS insertion"
  description: "85-year-old woman with malignant large bowel obstruction at the descending colon. Palliative, unfit for surgery."
  implants: "WallFlex colonic stent 25 x 90 mm; second WallFlex 25 x 60 mm overlapping"
  complications: "First stent deployed too distally and did not cover the proximal end of the stricture; a second overlapping stent was placed."

colorectal_minor_049:
  operation: "Colonoscopy with polypectomy"
  description: "58-year-old man with a family history of bowel cancer, due screening. Day case."
  complications: "Colonoscopy incomplete to the hepatic flexure due to poor bowel preparation; polyps removed distally and CT colonography requested."

colorectal_minor_050:
  operation: "Flexible sigmoidoscopy and decompression of sigmoid volvulus"
  description: "92-year-old woman from a care home with sigmoid volvulus on CT. Emergency."
  complications: "Oxygen saturation fell during sedation; midazolam reversed with flumazenil and oxygen increased."

colorectal_minor_051:
  operation: "Laparoscopic ventral mesh rectopexy"
  description: "71-year-old woman with an external rectal prolapse and faecal incontinence. Elective."
  implants: "Biodesign biological graft 4 x 20 cm, tacked to promontory"
  complications: "Bleeding from a presacral vein while exposing the promontory, controlled with pressure and a haemostatic matrix."

colorectal_minor_052:
  operation: "Soave transanal pull-through"
  description: "6-month-old girl with short-segment Hirschsprung's disease. Paediatric surgery list."
  complications: "Mucosal tear of the muscular cuff during endorectal dissection, repaired with fine absorbable sutures."

colorectal_minor_053:
  operation: "Laparoscopic sigmoid colectomy + cystoscopy and ureteric stents"
  description: "60-year-old woman with a large diverticular phlegmon close to the left ureter. Elective."
  complications: "Mild urticarial rash and hypotension after indocyanine green was given, settled with chlorphenamine and fluids."
