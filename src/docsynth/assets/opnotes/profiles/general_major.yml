general_major_001:
  operation: "Trauma laparotomy, splenectomy and packing"
  description: "44-year-old woman, pedestrian hit by a van, hypotensive with a grade V splenic injury on CT. Major trauma."
  complications: "Massive haemorrhage with 12 units of red cells, FFP and platelets under MHP; persistent coagulopathy so abdomen packed and left open for relook."

general_major_002:
  operation: "Damage control laparotomy"
  description: "72-year-old man with multiple injuries after a fall from height and pelvic fracture. Major trauma call."
  complications: "Cardiac arrest from exsanguination on opening the abdomen; resuscitation failed and death was confirmed on table."

general_major_003:
  operation: "Diagnostic laparoscopy converted to laparotomy"
  description: "47-year-old woman with right iliac fossa pain and a normal appendix on imaging. Emergency."
  complications: "Right common iliac artery injured by the umbilical trocar on entry with rapid haemoperitoneum; converted to midline laparotomy and repaired by vascular surgeons, 4 units transfused."

general_major_004:
  operation: "Laparoscopic appendicectomy"
  description: "35-year-old man with acute appendicitis on CT. Emergency list."
  complications: "Bladder perforation from the suprapubic port, recognised by gas in the catheter bag; repaired laparoscopically in two layers and catheter left for 7 days."

general_major_005:
  operation: "Laparotomy, adhesiolysis and small bowel resection"
  description: "78-year-old man with small bowel obstruction and a poorly enhancing loop on CT. Emergency."
  complications: "Rising peak airway pressures and oliguria on attempted fascial closure due to bowel oedema; abdomen left open with a laparostomy and NPWT."

general_major_006:
  operation: "Incision and drainage of right groin abscess"
  description: "34-year-old man who injects into the femoral vein, with a large right groin abscess. Emergency."
  complications: "Pulsatile bleeding on incision from an unrecognised infected femoral artery pseudoaneurysm; controlled with pressure and a vascular team performed ligation."

general_major_007:
  operation: "Examination under anaesthesia and drainage of deep neck abscess"
  description: "52-year-old man with a large left neck abscess, trismus and stridor. Emergency."
  complications: "Failed intubation with a cannot-intubate situation; emergency awake fibreoptic intubation by ENT/anaesthesia, then drainage completed."

general_major_008:
  operation: "Laparoscopy and peritoneal biopsy"
  description: "61-year-old woman with ascites and an omental cake on CT, no primary identified. Elective."
  complications: "Sudden fall in end-tidal CO2 with hypotension shortly after insufflation, suspected CO2 embolism; insufflation stopped, patient placed head down left lateral and procedure abandoned."

general_major_009:
  operation: "Laparoscopic appendicectomy"
  description: "13-year-old boy with appendicitis. Paediatric emergency list."
  complications: "Rising end-tidal CO2, tachycardia and temperature of 39.5 C after suxamethonium; malignant hyperthermia treated with dantrolene, procedure completed and transferred to PICU."

general_major_010:
  operation: "Laparotomy and removal of foreign body from sigmoid colon"
  description: "50-year-old man with a large rectal object that migrated proximally and could not be retrieved transanally. Emergency."
  complications: "Endobag containing the object left in the abdomen found missing at the count; X-ray on table located it in the pelvis and it was retrieved before closure."

general_major_011:
  operation: "Laparotomy, washout and drainage of pelvic abscess"
  description: "62-year-old man with a large pelvic abscess from diverticular disease, not amenable to radiological drainage. Urgent."
  complications: "Prolonged Lloyd-Davies positioning; well-leg compartment syndrome of the right calf recognised at the end of surgery and four-compartment fasciotomy performed."
