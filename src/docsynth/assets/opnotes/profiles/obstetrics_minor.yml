obstetrics_minor_001:
  operation: "Category 2 LSCS"
  description: "29-year-old primigravida at 40+5 with obstructed labour at full dilatation and a deeply impacted head. Epidural topped up."
  complications: "Left lateral extension of the uterine incision into the broad ligament during delivery of the head; uterine vessels identified and the extension repaired, estimated blood loss 1,300 mL."

obstetrics_minor_002:
  operation: "Caesarean section, category 3"
  description: "37-year-old woman at 38 weeks with an unstable lie and dense adhesions expected from a previous perforated appendix. Spinal."
  complications: "Small laceration of the bladder dome while dissecting the adherent bladder, repaired in two layers with 3/0 Vicryl; catheter kept for 10 days."

obstetrics_minor_003:
  operation: "Cat 3 caesarean section converted to general anaesthesia"
  description: "31-year-old woman at 39 weeks with a footling breech in early labour. Spinal anaesthetic."
  complications: "Inadequate spinal block with pain on skin incision; converted to general anaesthesia by rapid sequence induction and the section completed uneventfully."

obstetrics_minor_004:
  operation: "Elective caesarean section (combined spinal-epidural)"
  description: "34-year-old woman at 39 weeks with a major placenta praevia. BMI 45. Elective."
  complications: "Accidental dural puncture with the Tuohy needle during CSE with free flow of CSF; epidural re-sited at the level above and the section proceeded under spinal."

obstetrics_minor_005:
  operation: "Ventouse → forceps delivery (sequential instruments)"
  description: "26-year-old primigravida with a prolonged second stage and a direct OA head at +1. Epidural."
  complications: "Kiwi pump failed to hold vacuum after two applications with a new cup; changed to Neville-Barnes forceps and delivered with one pull."

obstetrics_minor_006:
  operation: "Repair of second-degree perineal tear"
  description: "24-year-old woman after a spontaneous vaginal delivery with a deep second-degree tear. Delivery suite under local infiltration."
  complications: "Swab count discrepancy at the end of the repair; vaginal examination found the tampon swab high in the vagina, it was removed and the count then correct."

obstetrics_minor_007:
  operation: "Manual removal of placenta"
  description: "33-year-old woman with a retained placenta after a vaginal birth at 40 weeks. Theatre under spinal."
  complications: "Uterine atony after removal with 1,600 mL blood loss; treated with bimanual compression, oxytocin infusion, ergometrine and carboprost, no transfusion needed."

obstetrics_minor_008:
  operation: "McDonald cerclage"
  description: "30-year-old woman at 15 weeks with a history of preterm prelabour rupture of membranes at 22 weeks. History-indicated."
  implants: "Mersilene 5 mm tape (replacement tape)"
  complications: "The first Mersilene tape frayed and broke while being tied; removed and a new tape placed and tied without difficulty."

obstetrics_minor_009:
  operation: "Caesarean section + Filshie sterilisation"
  description: "36-year-old para 3 at 39 weeks with a persistent transverse lie, consented for sterilisation in pregnancy. Elective."
  implants: "Filshie clips x3"
  complications: "Right Filshie clip found on inspection to be across the mesosalpinx rather than the tube; a second clip applied correctly to the isthmic tube."

obstetrics_minor_010:
  operation: "Category 2 emergency caesarean section"
  description: "28-year-old woman at 39 weeks with failure to progress at 5 cm despite oxytocin. Epidural top-up."
  complications: "Oxytocin 10 units given as a rapid IV bolus instead of 5 units slowly after delivery; transient hypotension treated with phenylephrine and fluid, no further effect."

obstetrics_minor_011:
  operation: "Forceps delivery (Neville-Barnes), repair of vaginal sulcus tears"
  description: "32-year-old woman with a prolonged second stage and a suspicious CTG, head OA at +1. Delivery room, epidural."
  complications: "Bilateral deep vaginal sulcal tears with brisk bleeding, 1,100 mL total; moved to theatre, tears sutured and a vaginal pack left for 24 hours."

obstetrics_minor_012:
  operation: "LSCS at full dilatation with J-extension"
  description: "33-year-old woman with a prolonged second stage and a deeply engaged OP head; trial of instrumental not attempted. Category 2."
  complications: "Head could not be delivered through the transverse incision, which was extended as a J-incision; extension repaired in two layers, blood loss 1,000 mL."

obstetrics_minor_013:
  operation: "Elective caesarean section"
  description: "35-year-old woman at 39 weeks with a breech presentation. Spinal anaesthetic."
  complications: "Pooled alcoholic chlorhexidine ignited from diathermy, with a small flash fire at the drape edge; put out at once with no skin burn, drapes changed and a Datix completed."
