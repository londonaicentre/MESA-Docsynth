upper_gi_minor_001:
  operation: "Minimally invasive Ivor Lewis oesophagectomy"
  description: "62-year-old man with a distal oesophageal adenocarcinoma after neoadjuvant chemotherapy. Elective."
  complications: "Small tear in the thoracic duct during mediastinal dissection with chyle leak; duct ligated at the hiatus and leak stopped."

upper_gi_minor_002:
  operation: "McKeown oesophagectomy, three-stage"
  description: "66-year-old woman with a squamous cell carcinoma of the mid oesophagus after chemoradiotherapy. Elective."
  complications: "Left pleura opened during the transhiatal dissection; left chest drain placed at the end."

upper_gi_minor_003:
  operation: "Transhiatal oesophagectomy"
  description: "70-year-old man with a lower oesophageal adenocarcinoma and ischaemic heart disease. Elective."
  complications: "Transient hypotension from cardiac compression during blind mediastinal dissection; resolved on withdrawing the hand and a fluid bolus."

upper_gi_minor_004:
  operation: "Lap Heller myotomy and Dor fundoplication"
  description: "42-year-old man with type II achalasia on manometry, dysphagia and 6 kg weight loss. Elective."
  complications: "Small mucosal perforation at the distal end of the myotomy seen on the air leak test; closed with 4/0 PDS and covered by the Dor wrap."

upper_gi_minor_005:
  operation: "POEM"
  description: "50-year-old woman with type I achalasia, night-time regurgitation and an Eckardt score of 8. Elective under GA."
  complications: "Mucosotomy enlarged by a small inadvertent tear at the tunnel entry; closed completely with additional clips."

upper_gi_minor_006:
  operation: "Peroral endoscopic myotomy"
  description: "36-year-old man with type III achalasia, chest pain and dysphagia, not wanting laparoscopic surgery. Elective, under GA."
  complications: "Capnoperitoneum with rising airway pressures; decompressed with a 14G needle in the right upper quadrant and procedure completed."

upper_gi_minor_007:
  operation: "Laparoscopic Nissen fundoplication + hiatal repair"
  description: "47-year-old woman with refractory GORD, a small hiatus hernia and an abnormal 24-hour pH study. Elective."
  complications: "Left pleural breach during hiatal dissection causing a capnothorax; insufflation pressure reduced, anaesthetist aware, resolved at the end without a drain."

upper_gi_minor_008:
  operation: "Lap Toupet fundoplication"
  description: "55-year-old man with reflux and grade B oesophagitis despite twice-daily PPI, weak peristalsis. Elective."
  complications: "Short gastric vessel bled after the energy device jaw failed to seal; controlled with clips and the device replaced."

upper_gi_minor_009:
  operation: "Laparoscopic para-oesophageal hernia repair with mesh and Nissen"
  description: "73-year-old woman with a large type III hiatus hernia, iron deficiency anaemia and postprandial breathlessness. Elective."
  implants: "Bio-A 7 x 10 cm U-shaped mesh"
  complications: "Small capsular tear of the spleen from traction on the fundus; controlled with Surgicel and pressure."

upper_gi_minor_010:
  operation: "Laparoscopic Nissen fundoplication"
  description: "8-year-old boy with cerebral palsy and recurrent aspiration pneumonia from reflux. Paediatric list."
  complications: "Liver retractor caused a small laceration of the left lobe, controlled with diathermy and a haemostatic pad."

upper_gi_minor_011:
  operation: "Laparoscopic LINX insertion"
  description: "44-year-old man with PPI-dependent reflux, regurgitation and normal manometry, keen to stop medication. Day case."
  implants: "LINX 16 beads"
  complications: "Sizing tool gave inconsistent readings and the first device chosen was too tight; exchanged for a 16-bead device before closure."

upper_gi_minor_012:
  operation: "Laparoscopic hiatus hernia repair and Toupet fundoplication"
  description: "61-year-old woman with a 6 cm sliding hiatus hernia and regurgitation. Elective."
  complications: "Small anterior gastric serosal tear from the bougie; oversewn with 3/0 Vicryl and a negative leak test."

upper_gi_minor_013:
  operation: "Lap Graham patch repair of perforated DU"
  description: "41-year-old man with a perforated duodenal ulcer on CT and 8 hours of pain, smoker. Emergency CEPOD list."
  complications: "Omental patch tied under too much tension and tore; replaced with a fresh omental pedicle and the leak test was negative."

upper_gi_minor_014:
  operation: "Laparotomy and oversew of perforated gastric ulcer"
  description: "79-year-old woman taking ibuprofen for back pain, with a perforated gastric ulcer, peritonitis and AKI. Emergency."
  complications: "Hypotension at induction needing metaraminol and a noradrenaline infusion; stable for the rest of the case."

upper_gi_minor_015:
  operation: "Laparoscopic total gastrectomy with Roux-en-Y"
  description: "60-year-old man with a cT3 gastric body adenocarcinoma after four cycles of FLOT. Elective."
  complications: "Linear stapler misfired on the jejunal limb; defect oversewn and a new cartridge used."

upper_gi_minor_016:
  operation: "Open total gastrectomy D2"
  description: "68-year-old woman with a proximal gastric carcinoma after perioperative chemotherapy, no peritoneal disease on staging. Elective."
  complications: "Small tear of the transverse mesocolon during omentectomy; repaired with 3/0 Vicryl, colon viable."

upper_gi_minor_017:
  operation: "Laparoscopic distal gastrectomy, Billroth II"
  description: "74-year-old man with a cT2 antral adenocarcinoma, ex-smoker with controlled COPD. Elective."
  complications: "Ooze from the lesser curve node bed after lymphadenectomy, controlled with Surgicel and a haemostatic matrix."

upper_gi_minor_018:
  operation: "Laparoscopic wedge resection of gastric GIST"
  description: "50-year-old woman with a 5 cm exophytic GIST of the fundus found on CT for vague abdominal pain. Elective."
  complications: "Tumour capsule breached by the grasper with a small spill; tumour bagged immediately and the area washed out."

upper_gi_minor_019:
  operation: "Laparoscopic gastrojejunostomy"
  description: "72-year-old man with gastric outlet obstruction from a pancreatic head cancer. Urgent."
  complications: "Swab count discrepancy at closure; missing swab found under the left lobe of the liver before closure."

upper_gi_minor_020:
  operation: "Laparoscopic pyloromyotomy"
  description: "4-week-old boy with hypertrophic pyloric stenosis, pyloric muscle 5 mm on ultrasound, alkalosis corrected. Neonatal list."
  complications: "Duodenal mucosal perforation at the distal end of the myotomy, repaired with 5/0 PDS and omentum; nil by mouth for 24 hours."

upper_gi_minor_021:
  operation: "Open pyloromyotomy"
  description: "5-week-old girl, 3.1 kg, with projectile vomiting and pyloric stenosis on ultrasound. Urgent, after fluid resuscitation."
  complications: "Core temperature fell to 35.4 C during the case; active warming increased and temperature recovered before extubation."

upper_gi_minor_022:
  operation: "Laparoscopic sleeve gastrectomy"
  description: "43-year-old woman with BMI 48, type 2 diabetes on metformin and hypertension. Elective bariatric list."
  complications: "Staple line bleeding along the greater curve, controlled with clips and oversewing."

upper_gi_minor_023:
  operation: "Laparoscopic Roux-en-Y gastric bypass"
  description: "35-year-old man with BMI 51, sleep apnoea on CPAP and gastro-oesophageal reflux. Elective bariatric list."
  complications: "Small enterotomy of the alimentary limb from a grasper; closed with a 3/0 barbed suture."

upper_gi_minor_024:
  operation: "Laparoscopic adjustable gastric band insertion"
  description: "50-year-old woman with BMI 39, hypertension and knee osteoarthritis, who prefers an adjustable band. Elective day case."
  implants: "Lap-Band AP Standard, subcutaneous port"
  complications: "Port tubing kinked at the first attempt at connection; tubing re-cut and connected with a new connector."

upper_gi_minor_025:
  operation: "Laparoscopic OAGB"
  description: "29-year-old woman with BMI 45 and PCOS, trying for a family in the future. Elective bariatric list."
  complications: "Difficult bag-mask ventilation at induction, intubated at the second attempt with a videolaryngoscope; no desaturation below 90%."

upper_gi_minor_026:
  operation: "OGD + PEG"
  description: "68-year-old woman with bulbar-onset motor neurone disease, 8% weight loss and FVC 65%. Elective, under sedation."
  complications: "Oversedation with oxygen saturation of 84%; midazolam reversed with flumazenil and procedure completed."

upper_gi_minor_027:
  operation: "PEG insertion"
  description: "74-year-old man with persistent dysphagia after a brainstem stroke, NG-fed for 3 weeks. Inpatient endoscopy list."
  complications: "First needle puncture went through a loop of transverse colon on aspiration test; site moved and colon not breached on repeat test."

upper_gi_minor_028:
  operation: "RIG insertion"
  description: "60-year-old man with a T3 laryngeal cancer before chemoradiotherapy, needing prophylactic feeding access. IR list."
  complications: "One T-fastener deployed outside the stomach; left in the abdominal wall and a further fastener placed correctly."

upper_gi_minor_029:
  operation: "Emergency OGD + variceal banding"
  description: "49-year-old man with alcohol-related cirrhosis and haematemesis, on terlipressin and antibiotics. Out of hours."
  complications: "Banding device misfired twice; replaced with a new multi-band ligator and variceal banding completed."

upper_gi_minor_030:
  operation: "OGD, adrenaline injection and clipping of duodenal ulcer"
  description: "82-year-old woman on aspirin with melaena, Hb 71 and a Glasgow-Blatchford score of 13. Emergency bleed list."
  complications: "Rebleeding after the first clip slipped off the vessel; re-clipped with two more clips and haemostasis secured."

upper_gi_minor_031:
  operation: "OGD and balloon dilatation of oesophageal stricture"
  description: "58-year-old man with a tight peptic stricture at the GOJ and dysphagia to solids. Day case."
  complications: "Deep mucosal split after dilatation with no perforation on inspection; procedure stopped at 12 mm."

upper_gi_minor_032:
  operation: "OGD, oesophageal stent insertion"
  description: "83-year-old man with an inoperable oesophageal cancer and dysphagia to liquids. Palliative."
  implants: "Ultraflex partially covered oesophageal stent 18 mm x 10 cm"
  complications: "Stent deployed 2 cm too distal; pulled back into position with forceps under fluoroscopy."

upper_gi_minor_033:
  operation: "Gastroscopy, ESD of early gastric cancer"
  description: "70-year-old man with an intramucosal gastric antral adenocarcinoma. Elective under GA."
  complications: "Small muscle-layer perforation during dissection, closed with clips and the ESD completed."

upper_gi_minor_034:
  operation: "EMR of Barrett's nodule"
  description: "66-year-old woman with Barrett's and a 1 cm nodule of high-grade dysplasia. Elective."
  complications: "Brisk bleeding from the resection base controlled with coagulation forceps."

upper_gi_minor_035:
  operation: "OGD and removal of food bolus"
  description: "29-year-old man with eosinophilic oesophagitis and a food bolus impaction. Emergency."
  complications: "Laryngospasm with desaturation at the start under deep sedation; managed with jaw thrust and bag-mask ventilation, then converted to GA."

upper_gi_minor_036:
  operation: "Laparoscopic hiatus hernia repair with mesh"
  description: "69-year-old man with a symptomatic mixed hiatus hernia, postprandial chest pain and anaemia. Elective."
  implants: "Phasix ST 7 x 10 cm mesh"
  complications: "Mesh packaging found opened and the mesh touched the non-sterile drape; discarded and a new mesh opened."

upper_gi_minor_037:
  operation: "OGD under GA with biopsies"
  description: "7-year-old girl with suspected coeliac disease and abdominal pain. Paediatric list."
  complications: "Amoxicillin drawn up in error was noticed before injection in a child with a documented penicillin allergy; not given, Datix completed."

upper_gi_minor_038:
  operation: "Right thoracotomy and repair of oesophageal atresia with TOF"
  description: "Day-1 neonate, boy, with oesophageal atresia and distal fistula, 2.6 kg. Neonatal surgery."
  complications: "Transient desaturation from ventilation through the fistula before ligation; resolved once the fistula was controlled."
