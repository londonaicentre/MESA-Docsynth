ophthalmology_minor_001:
  operation: "Right phaco + IOL"
  description: "80-year-old woman with a brunescent cataract and deep-set eyes. Day case under topical anaesthesia."
  implants: "Alcon AcrySof SN60WF +23.0D in the bag"
  complications: "Small posterior capsule rupture during cortical clean-up with intact anterior hyaloid; no vitreous loss, dispersive OVD tamponade and IOL placed in the bag uneventfully."

ophthalmology_minor_002:
  operation: "Phacoemulsification and IOL, left"
  description: "70-year-old man with a dense cataract and pseudoexfoliation. Elective day case, sub-Tenon's block."
  implants: "Morcher 14C capsular tension ring; Tecnis ZCB00 +21.0D"
  complications: "Two clock hours of zonular dialysis noted during nucleus rotation; capsular tension ring inserted and surgery completed in the bag."

ophthalmology_minor_003:
  operation: "L cataract extraction (phaco) + PCIOL"
  description: "74-year-old man on tamsulosin with a moderately dense cataract. Day case list."
  implants: "Rayner RayOne Aspheric +22.0D"
  complications: "Iris prolapse through the main incision from floppy iris syndrome; iris reposited, intracameral phenylephrine given and a Malyugin ring inserted."

ophthalmology_minor_004:
  operation: "Right phaco + IOL"
  description: "67-year-old woman with a cortical cataract causing glare. Day case, topical."
  implants: "Clareon SY60WF +20.0D"
  complications: "Phaco machine stopped mid-case with a fluidics error; handpiece and cassette changed, chamber maintained with OVD, and surgery completed."

ophthalmology_minor_005:
  operation: "Phaco/IOL, left eye"
  description: "83-year-old woman with a cataract, hypertension and anxiety. Day case under sub-Tenon's."
  implants: "Tecnis ZCB00 +19.5D"
  complications: "Initial IOL folded with a torn optic in the cartridge; lens explanted through a widened wound and a second lens of the same power implanted."

ophthalmology_minor_006:
  operation: "Right phacoemulsification with intraocular lens"
  description: "72-year-old man with diabetes and a posterior subcapsular cataract. Day case."
  implants: "Alcon AcrySof SN60WF +21.5D"
  complications: "Pharmacy check before injection found the intracameral cefuroxime had been drawn at the wrong dilution; discarded and correctly prepared before use, no drug given."

ophthalmology_minor_007:
  operation: "Left trabeculectomy with MMC"
  description: "59-year-old man with progressive POAG despite three drops. Elective."
  complications: "Conjunctival buttonhole near the limbus during flap dissection; closed with a 10-0 nylon purse-string and the bleb was watertight at the end."

ophthalmology_minor_008:
  operation: "Trabeculectomy (right)"
  description: "73-year-old woman with pseudoexfoliation glaucoma, IOP 30. Elective under peribulbar."
  complications: "Choroidal ooze with a shallowing chamber on opening the sclerostomy; chamber reformed with OVD, extra flap sutures placed, and chamber deep at the end."

ophthalmology_minor_009:
  operation: "Left Baerveldt 350 tube with pericardial patch"
  description: "49-year-old woman with uveitic glaucoma and failed maximal therapy. Elective GA."
  implants: "Baerveldt BG101-350 superotemporal; Tutoplast pericardium patch"
  complications: "Tube entered too close to the corneal endothelium; withdrawn and re-inserted through a new, more posterior track."

ophthalmology_minor_010:
  operation: "PreserFlo MicroShunt insertion, right"
  description: "62-year-old man with moderate POAG and dry eye from preservatives. Day case."
  implants: "Santen PreserFlo MicroShunt"
  complications: "Small hyphaema from the needle track on insertion; cleared by AC washout and the shunt was confirmed to be draining."

ophthalmology_minor_011:
  operation: "Right 23G vitrectomy, cryo and gas"
  description: "54-year-old man with a macula-off superior rhegmatogenous retinal detachment. Urgent list."
  complications: "Small iatrogenic retinal break made during vitreous base shaving; treated with endolaser and covered by the gas tamponade."

ophthalmology_minor_012:
  operation: "Left PPV + ERM peel"
  description: "71-year-old woman with symptomatic epiretinal membrane and distortion. Elective, peribulbar."
  complications: "Infusion cannula found to be suprachoroidal at the start; stopped and repositioned into the vitreous cavity before continuing."

ophthalmology_minor_013:
  operation: "Scleral buckle (encircling band) + cryotherapy, right"
  description: "19-year-old myopic man with an inferior retinal detachment from dialysis. Urgent GA."
  implants: "Labtician 240 silicone band with 277 tyre"
  complications: "Subretinal fluid drainage site bled; controlled by raising IOP and tamponade, with no submacular extension."

ophthalmology_minor_014:
  operation: "Bilateral medial rectus recession"
  description: "3-year-old boy with fully accommodative-plus esotropia uncontrolled by glasses. Paediatric list, GA."
  complications: "Profound bradycardia from the oculocardiac reflex on traction of the right medial rectus; released traction and IV glycopyrrolate given, rhythm recovered."

ophthalmology_minor_015:
  operation: "Left lateral rectus recession and medial rectus resection"
  description: "9-year-old girl with a large-angle intermittent exotropia. Day case GA."
  complications: "Partial-thickness scleral needle pass when reattaching the medial rectus; indirect ophthalmoscopy showed no retinal break and cryotherapy was not needed."

ophthalmology_minor_016:
  operation: "Squint surgery (R IR recession, adjustable)"
  description: "67-year-old man with thyroid eye disease and vertical diplopia, disease inactive. Elective GA."
  complications: "Laryngospasm on LMA removal at the end; managed with CPAP and a small dose of propofol, saturations recovered."

ophthalmology_minor_017:
  operation: "DMEK, right eye"
  description: "72-year-old woman with Fuchs endothelial dystrophy and corneal oedema. Elective, peribulbar."
  implants: "Donor Descemet membrane graft 8.0 mm"
  complications: "Graft initially inverted after unfolding; recognised with the Moutsouris sign, re-scrolled and correctly orientated before the air fill."

ophthalmology_minor_018:
  operation: "Left penetrating keratoplasty"
  description: "42-year-old man with keratoconus and a central scar after hydrops. Elective GA."
  implants: "Donor corneal graft 8.0 mm"
  complications: "Trephine blade dulled and cut unevenly; replaced with a new single-use trephine and host bed completed with scissors."

ophthalmology_minor_019:
  operation: "Right upper lid blepharoplasty + ptosis repair"
  description: "71-year-old woman with bilateral dermatochalasis and right aponeurotic ptosis. Local anaesthetic list."
  complications: "Brisk bleed from a branch of the peripheral arcade; controlled with bipolar diathermy and pressure, lid position checked with the patient sitting up."

ophthalmology_minor_020:
  operation: "Left lateral tarsal strip"
  description: "88-year-old man with involutional ectropion and a red, watery eye. Local anaesthetic minor op."
  complications: "Needle count one short at closure; found on the drape after a search, count correct."

ophthalmology_minor_021:
  operation: "Bilateral upper blepharoplasty"
  description: "60-year-old woman with heavy upper lids restricting her visual field. Day case, local with sedation."
  complications: "Vasovagal episode with hypotension on local infiltration; treated with leg elevation and IV fluids, surgery resumed."

ophthalmology_minor_022:
  operation: "Evisceration + orbital implant (R)"
  description: "58-year-old man with a blind painful right eye from chronic retinal detachment. Elective GA."
  implants: "MEDPOR sphere 20 mm"
  complications: "Glove tear on the scrub nurse noticed while handling the implant; implant re-soaked in antibiotic and gloves changed before insertion."

ophthalmology_minor_023:
  operation: "YAG capsulotomy (L)"
  description: "73-year-old man with posterior capsule opacification in a pseudophakic left eye, glare and reduced contrast."
  complications: "Two small pits in the IOL optic from laser shots; defocus corrected and the capsulotomy completed without further marks."

ophthalmology_minor_024:
  operation: "EUA and diode laser for ROP, bilateral"
  description: "Preterm boy born at 24 weeks, now 35 weeks corrected, with aggressive posterior ROP. NICU procedure."
  complications: "Desaturation and bradycardia during treatment of the second eye; paused, bag-mask ventilation given, and laser completed after recovery."

ophthalmology_minor_025:
  operation: "Endoscopic DCR, right"
  description: "57-year-old woman with a right nasolacrimal duct obstruction and recurrent sticky eye. Elective GA."
  implants: "Crawford bicanalicular silicone tubes"
  complications: "Troublesome mucosal bleeding in the nose obscured the view; controlled with adrenaline-soaked patties and suction diathermy."

ophthalmology_minor_026:
  operation: "Laser photocoagulation for ROP (right) + EUA left"
  description: "Preterm girl born at 23 weeks weighing 540 g, now 34 weeks corrected, with type 1 ROP in the right eye. Treated on NICU."
  complications: "Core temperature fell to 35.1 degrees during the procedure; warming mattress and forced-air blanket used and temperature normalised by the end."

ophthalmology_minor_027:
  operation: "Right enucleation with orbital implant"
  description: "2-year-old girl with unilateral advanced retinoblastoma and buphthalmos. Paediatric ocular oncology list."
  implants: "Silicone sphere 18 mm"
  complications: "Brisk bleeding from the central retinal vessels after optic nerve transection; controlled with firm orbital pressure and a warm pack for five minutes."
