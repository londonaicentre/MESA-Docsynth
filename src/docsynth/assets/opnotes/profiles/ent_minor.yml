ent_minor_001:
  operation: "Bilateral myringotomy and grommet insertion"
  description: "3-year-old boy with bilateral glue ear and delayed speech, persistent over three months. Day case."
  implants: "Shah grommets x2"
  complications: "Left grommet slipped through the myringotomy into the middle ear; retrieved with a hook and a new grommet placed."

ent_minor_002:
  operation: "Adenoidectomy + bilateral grommets"
  description: "4-year-old girl with snoring, mouth breathing and bilateral OME with a 35 dB loss. Day case."
  implants: "Shepard grommets x2"
  complications: "Brisk bleeding from the adenoid bed controlled with a post-nasal pack for 10 minutes and suction diathermy."

ent_minor_003:
  operation: "Right M&G"
  description: "62-year-old woman with a persistent right middle ear effusion and aural fullness. Day case."
  implants: "Shah grommet, right"
  complications: "Bleeding from the myringotomy site obscured the view; settled with adrenaline-soaked cotton wool before the grommet was placed."

ent_minor_004:
  operation: "Left myringoplasty (underlay temporalis fascia)"
  description: "35-year-old man with a dry central left perforation and recurrent discharge after swimming."
  complications: "Chorda tympani nerve stretched and divided during elevation of the tympanomeatal flap; ends laid back together and patient to be warned of taste change."

ent_minor_005:
  operation: "Tympanoplasty with ossiculoplasty, right"
  description: "47-year-old woman with right chronic otitis media and a 40 dB conductive hearing loss. Elective."
  implants: "Kurz TTP-VARIO TORP 4.5 mm"
  complications: "Surgeon's glove punctured while handling the prosthesis; prosthesis discarded, gloves changed and a new sterile prosthesis opened."

ent_minor_006:
  operation: "Endoscopic tympanoplasty, left"
  description: "15-year-old girl with a persistent left drum perforation and recurrent wet ears. Day case."
  complications: "Endoscope light source failed mid-procedure; replacement stack brought in and case completed after a 15-minute delay."

ent_minor_007:
  operation: "Canal wall up mastoidectomy, left"
  description: "34-year-old man with left attic cholesteatoma and intermittent foul discharge. Elective."
  complications: "Small tegmen dural exposure with a pinhole CSF leak, sealed with temporalis fascia and fibrin glue."

ent_minor_008:
  operation: "Right modified radical mastoidectomy"
  description: "58-year-old woman with extensive right cholesteatoma and a dead ear. Elective."
  complications: "Sigmoid sinus nicked by the diamond burr; bleeding controlled with Surgicel and gentle pressure."

ent_minor_009:
  operation: "Cortical mastoidectomy + grommet, right"
  description: "5-year-old boy with acute mastoiditis and a subperiosteal abscess not responding to IV antibiotics. Emergency."
  implants: "Shepard grommet, right"
  complications: "Drill handpiece failed mid-case; replacement handpiece opened and the case finished without delay to the patient."

ent_minor_010:
  operation: "Left stapedotomy"
  description: "41-year-old woman with left otosclerosis and a 30 dB conductive loss. Elective."
  implants: "Kurz CliP piston 0.4 x 4.25 mm"
  complications: "The first piston was too long on palpation and caused vertigo on the table; swapped for a 4.25 mm piston."

ent_minor_011:
  operation: "Right stapedectomy"
  description: "55-year-old man with advanced right otosclerosis and a 40 dB air-bone gap. Elective."
  implants: "Teflon piston 0.6 x 4.5 mm with vein graft"
  complications: "Footplate fractured during fenestration; fragments removed, oval window covered with vein graft and piston placed."

ent_minor_012:
  operation: "Right cochlear implant"
  description: "63-year-old man with bilateral profound sensorineural loss after years of progressive decline. Elective."
  implants: "Cochlear Nucleus CI622 with Slim Straight electrode"
  complications: "Electrode tip fold-over seen on intraoperative X-ray; array withdrawn and reinserted with a good final position."

ent_minor_013:
  operation: "Left CI via posterior tympanotomy"
  description: "2-year-old boy with bilateral profound congenital hearing loss, poor progress with hearing aids."
  implants: "MED-EL SYNCHRONY 2 with FLEX28 electrode"
  complications: "Brisk bleeding from a mastoid emissary vein controlled with bone wax and bipolar."

ent_minor_014:
  operation: "Bilateral cochlear implantation"
  description: "14-month-old girl with Pendred syndrome and bilateral profound hearing loss. Paediatric list."
  implants: "Cochlear Nucleus CI624 x2"
  complications: "Facial nerve monitor failed to record on the left; new electrodes placed and working before drilling continued."

ent_minor_015:
  operation: "Right BAHA (BI300 + abutment)"
  description: "51-year-old woman with right conductive hearing loss and chronic otitis externa with aids."
  implants: "Cochlear Baha BI300 4 mm with BA400 abutment 9 mm"
  complications: "Implant spun in soft bone without seating; removed and a wider 4.5 mm Ponto Wide implant placed at the same site."

ent_minor_016:
  operation: "Ponto implant, left, linear incision"
  description: "8-year-old girl with Goldenhar syndrome and left canal atresia. Elective."
  implants: "Oticon Ponto 3 mm implant with 6 mm abutment"
  complications: "Dura exposed at 3 mm depth with a small CSF weep; sealed with bone wax and a new site drilled 1 cm posteriorly."

ent_minor_017:
  operation: "Bilateral pinnaplasty"
  description: "10-year-old boy with bilateral prominent ears and teasing at school; keen himself. Day case."
  complications: "Brisk bleeding from a posterior auricular artery branch controlled with bipolar before closure."

ent_minor_018:
  operation: "Right otoplasty under local anaesthetic"
  description: "29-year-old woman, hairdresser, with a single prominent right ear she hides under her hair. Day case."
  complications: "Lidocaine with 1:80,000 adrenaline drawn up in place of the prescribed 1:200,000; caught after a small volume given, mild tachycardia settled without treatment."

ent_minor_019:
  operation: "Septoplasty (Killian incision)"
  description: "40-year-old man with left nasal obstruction from a caudal septal deviation. Day case."
  complications: "Opposing bilateral mucosal flap tears at the same level repaired with 4/0 Vicryl Rapide and silastic splints placed."

ent_minor_020:
  operation: "Septoplasty + bilateral turbinate reduction"
  description: "26-year-old woman with long-standing nasal blockage and poor sleep. Elective."
  complications: "Count short one patty before extubation; found in the nasopharynx on re-inspection and removed."

ent_minor_021:
  operation: "B/L ESS (uncinectomy, antrostomy, ethmoidectomy)"
  description: "49-year-old man with chronic rhinosinusitis with polyps and asthma. Elective."
  complications: "Left lamina papyracea breached with orbital fat exposed; dissection stopped at that site, eye checked and ophthalmology review arranged."

ent_minor_022:
  operation: "Image-guided FESS with frontal sinusotomy"
  description: "57-year-old woman with bilateral frontal sinus disease and headaches. Elective."
  complications: "Navigation system would not register after several attempts; completed without image guidance using endoscopic landmarks."

ent_minor_023:
  operation: "Right FESS (anterior and posterior ethmoidectomy, sphenoidotomy)"
  description: "61-year-old man with right-sided chronic rhinosinusitis and recurrent infections. Elective."
  complications: "Small skull base defect at the fovea ethmoidalis with CSF leak recognised; repaired with a free mucosal graft and fibrin glue."

ent_minor_024:
  operation: "FESS + polypectomy"
  description: "44-year-old woman with recurrent nasal polyps, anosmia and asthma. Elective."
  complications: "Bleeding from the anterior ethmoidal artery controlled with suction bipolar."

ent_minor_025:
  operation: "Bilateral tonsillectomy (cold steel dissection)"
  description: "22-year-old man with recurrent tonsillitis, six episodes a year. Elective."
  complications: "Chipped upper left central incisor from the Boyle-Davis gag; fragment retrieved and dental referral made."

ent_minor_026:
  operation: "Adenotonsillectomy"
  description: "5-year-old girl with obstructive sleep apnoea and enlarged tonsils. Day case."
  complications: "Laryngospasm on extubation with desaturation to 80%; treated with CPAP and a small dose of propofol."

ent_minor_027:
  operation: "Coblation tonsillectomy"
  description: "17-year-old boy with recurrent tonsillitis missing school during his A-level year. Elective."
  complications: "Coblation wand failed during the right side; replaced and the case completed."

ent_minor_028:
  operation: "Bilateral tonsillectomy (bipolar)"
  description: "33-year-old woman with recurrent tonsillitis and a previous quinsy. Elective."
  complications: "Brisk bleeding from the left lower pole controlled with a tie and bipolar."

ent_minor_029:
  operation: "Tonsillectomy and adenoidectomy"
  description: "6-year-old boy with recurrent tonsillitis, five episodes this year, and loud snoring. Day case."
  complications: "Throat pack not removed at the end of surgery; count query raised before extubation and pack removed."

ent_minor_030:
  operation: "Curettage adenoidectomy"
  description: "3-year-old boy with persistent nasal obstruction, hyponasal speech and snoring. Day case."
  complications: "Loose deciduous upper incisor dislodged by the gag; retrieved from the oropharynx and parents informed."

ent_minor_031:
  operation: "Microlaryngoscopy + CO2 laser excision of vocal fold lesion"
  description: "60-year-old man with persistent hoarseness and a left vocal fold lesion. Urgent."
  complications: "Laser struck the endotracheal tube cuff causing a leak; laser stopped, tube exchanged over a bougie and case completed."

ent_minor_032:
  operation: "Microlaryngoscopy and biopsy"
  description: "70-year-old man with a hoarse voice and a right vocal cord lesion. 2WW."
  complications: "Chipped crown on the upper left canine from the laryngoscope; noted and patient informed."

ent_minor_033:
  operation: "Microlaryngoscopy under jet ventilation, excision of vocal cord polyp"
  description: "51-year-old woman, call-centre worker, with a hoarse voice for eight months and a right vocal fold polyp. Elective."
  complications: "Desaturation to 84% during jet ventilation; paused, reintubated briefly, then case completed."

ent_minor_034:
  operation: "Total laryngectomy with primary TEP"
  description: "68-year-old man with a T4a glottic SCC and cartilage invasion. Elective."
  implants: "Provox Vega 22.5 Fr 6 mm"
  complications: "The 8 mm prosthesis was too long for the party wall; swapped for a 6 mm prosthesis."

ent_minor_035:
  operation: "Total laryngectomy and left neck dissection"
  description: "63-year-old woman with a T3 N1 glottic SCC with a fixed left cord, declining chemoradiotherapy. Elective."
  complications: "Chyle leak seen at left level IV; thoracic duct tributary oversewn and Valsalva confirmed no further leak."

ent_minor_036:
  operation: "Percutaneous tracheostomy"
  description: "65-year-old man on ICU with prolonged ventilation after a cardiac arrest."
  complications: "Tube cuff ruptured on insertion; tube changed over a guide under bronchoscopic view."

ent_minor_037:
  operation: "Open tracheostomy"
  description: "42-year-old woman on ICU with ARDS from influenza pneumonia, day 10 of ventilation and slow to wean."
  complications: "Bleeding from an anterior jugular vein tied off; minimal blood loss."

ent_minor_038:
  operation: "Paediatric tracheostomy"
  description: "5-month-old boy with subglottic stenosis on PICU after prolonged neonatal intubation."
  complications: "Small right pneumothorax on post-procedure X-ray in theatre; chest drain inserted."

ent_minor_039:
  operation: "Left superficial parotidectomy"
  description: "53-year-old woman with a left parotid pleomorphic adenoma. Elective."
  complications: "Small capsular breach with minor tumour spillage; field irrigated with sterile water and noted for the MDT."

ent_minor_040:
  operation: "Right superficial parotidectomy"
  description: "39-year-old man with a right parotid lump, indeterminate on FNA. Elective."
  complications: "Retromandibular vein torn during dissection; ligated with 3/0 Vicryl."

ent_minor_041:
  operation: "Excision of right submandibular gland"
  description: "48-year-old woman with a submandibular gland stone and recurrent swelling. Elective."
  complications: "Hilar stone dislodged into the floor of mouth; retrieved through the wound."

ent_minor_042:
  operation: "Left selective neck dissection levels II-IV"
  description: "59-year-old man with a left level II nodal metastasis from an oropharyngeal SCC. Elective."
  complications: "Small tear in the internal jugular vein repaired with 6/0 Prolene."

ent_minor_043:
  operation: "Right selective neck dissection levels II-V"
  description: "68-year-old man, organ transplant recipient on tacrolimus, with nodal metastases from a scalp SCC. Elective."
  complications: "Apical pleura breached at the root of the neck; small pneumothorax treated with a chest drain."

ent_minor_044:
  operation: "Segmental mandibulectomy, neck dissection and fibula free flap"
  description: "62-year-old woman with an SCC of the right lower alveolus. Joint case with plastics."
  implants: "KLS Martin 2.4 mm mandible reconstruction plate"
  complications: "Thigh tourniquet time reached 120 minutes; deflated for 10 minutes then reinflated to finish the harvest."

ent_minor_045:
  operation: "Excision of thyroglossal duct cyst (Sistrunk procedure)"
  description: "32-year-old woman with a midline neck lump that has become infected twice. Elective."
  complications: "Cyst ruptured during dissection; contents suctioned and area irrigated."
