ortho_arthroplasty_major_001:
  operation: "Left cemented total hip replacement"
  description: "87-year-old woman with severe left hip OA, aortic sclerosis and ischaemic heart disease."
  implants: "Exeter V40 no.1 37.5 mm offset; Contemporary 48 mm cup; 28 mm head; Palacos R+G x2"
  complications: "Profound hypotension and desaturation on stem cementation (bone cement implantation syndrome) progressing to PEA arrest; ROSC after 3 minutes of CPR and adrenaline, operation completed and transferred to ICU."

ortho_arthroplasty_major_002:
  operation: "Uncemented THR right, direct anterior approach"
  description: "71-year-old woman with right hip osteoarthritis and slender femoral canal on templating."
  implants: "Corail KA size 11 (revision length 220 mm); Pinnacle 50 mm cup; 32 mm Biolox head; 3 x cerclage cables"
  complications: "Displaced periprosthetic femoral fracture below the lesser trochanter on broaching; extended exposure, cables and a long revision stem used."

ortho_arthroplasty_major_003:
  operation: "Right TKR"
  description: "73-year-old man with right knee OA and a severe fixed flexion deformity."
  implants: "Attune PS femur 6, tibia 6, 10 mm insert; SmartSet x2"
  complications: "Pulsatile bleeding from the back of the knee after posterior capsular release; popliteal artery laceration repaired by vascular surgeons with a vein patch, 2 units transfused."

ortho_arthroplasty_major_004:
  operation: "Left THR, posterior approach"
  description: "56-year-old man with left hip dysplasia and a 2 cm short left leg."
  implants: "Corail KA size 12; Pinnacle 54 mm cup with 2 screws; 36 mm head -2"
  complications: "Leg found to be 22 mm long on intraoperative measurement with a tight sciatic nerve; neck re-cut and short head used, correcting to 6 mm; sciatic nerve checked and intact."

ortho_arthroplasty_major_005:
  operation: "Right total hip replacement"
  description: "80-year-old man with right hip OA, lumbar fusion and a stiff spine."
  implants: "Exeter V40 no.2; Trident 52 mm dual mobility cup; Simplex P x2"
  complications: "Hip dislocated repeatedly on trial reduction despite trial adjustments; cup revised to a dual mobility bearing, now stable."

ortho_arthroplasty_major_006:
  operation: "Revision right THR (acetabular) with removal of intrapelvic cement"
  description: "79-year-old woman with a migrated right cemented cup protruding into the pelvis."
  implants: "TMARS 62 mm revision shell with 4 screws, augment; cemented X3 liner; 32 mm head"
  complications: "Bladder wall breached during retrieval of intrapelvic cement; urology repaired it in two layers and a catheter was left in for 10 days."

ortho_arthroplasty_major_007:
  operation: "Left THR with supplementary acetabular screws"
  description: "64-year-old woman with protrusio acetabuli and inflammatory arthritis of the left hip."
  implants: "Pinnacle 54 mm Gription cup with 2 screws; Corail size 10; 32 mm ceramic head; femoral head autograft"
  complications: "Major haemorrhage from the external iliac vein after an anterior-quadrant screw; packed, vascular surgeons repaired it via a retroperitoneal approach, 4 units red cells transfused."

ortho_arthroplasty_major_008:
  operation: "Hip resurfacing converted to total hip replacement, right"
  description: "49-year-old man with right hip osteoarthritis, planned for Birmingham resurfacing."
  implants: "Corail KA 12; Pinnacle 56 mm cup; 36 mm Biolox Delta head"
  complications: "Superior femoral neck notched during head preparation; resurfacing abandoned and converted to an uncemented THR."

ortho_arthroplasty_major_009:
  operation: "Birmingham hip resurfacing, left"
  description: "53-year-old man with left hip OA, planned resurfacing in a large-framed patient."
  implants: "Exeter V40 no.3; Contemporary 58 mm cup (cemented); 36 mm head; Simplex x2"
  complications: "Femoral neck fractured on impaction of the femoral component; converted to a cemented THR."

ortho_arthroplasty_major_010:
  operation: "Reverse shoulder replacement left"
  description: "80-year-old woman with osteoporosis and cuff arthropathy of the left shoulder."
  implants: "Delta Xtend 38 mm glenosphere, long cemented stem 150 mm, +3 poly; 2 x cerclage cables"
  complications: "Spiral humeral shaft fracture during reaming; fixed with cerclage cables and a long cemented stem."

ortho_arthroplasty_major_011:
  operation: "Bilateral simultaneous TKR"
  description: "68-year-old man with bilateral knee OA, BMI 35, consented for one-stage bilateral surgery."
  implants: "Right: Triathlon CR femur 6, tibia 6, 11 mm insert; Simplex x2"
  complications: "Sudden desaturation, tachycardia and petechial rash after intramedullary instrumentation of the first knee, treated as fat embolism; second side abandoned and patient ventilated on ICU."

ortho_arthroplasty_major_012:
  operation: "Right TKR"
  description: "66-year-old woman with right knee OA. Listed for spinal anaesthesia with sedation."
  complications: "Anaphylaxis after teicoplanin at induction with bronchospasm and hypotension; treated with adrenaline, procedure postponed and patient to HDU."

ortho_arthroplasty_major_013:
  operation: "Right TKR (Triathlon CR)"
  description: "62-year-old man with right knee osteoarthritis and a short stature."
  implants: "Triathlon CR femur 5 (right), tibia 5, 11 mm insert; Simplex x2"
  complications: "Left-sided femoral component cemented on the right knee, noticed when the empty box was checked; component removed, bone preserved, correct right-sided implant cemented, Datix and duty of candour."

ortho_arthroplasty_major_014:
  operation: "Revision left THR (femoral)"
  description: "84-year-old man with a loose left femoral stem and cortical thinning."
  implants: "Restoration Modular 200 mm stem; 36 mm head"
  complications: "Drill bit tip broke off in the femoral canal and could not be retrieved; left in situ, patient informed and documented."

ortho_arthroplasty_major_015:
  operation: "Revision TKR (right) with tibial tubercle osteotomy"
  description: "76-year-old woman with a stiff, loose right knee replacement and patella baja."
  implants: "Triathlon TS femur 5, tibia 5 with stems, 16 mm insert; 2 x 2.0 FiberWire anchors; semitendinosus augmentation; 3 x tubercle screws; Simplex x3"
  complications: "Patellar tendon avulsed from the tibial tubercle during exposure; repaired with suture anchors and semitendinosus augmentation, flexion limited post-op."

ortho_arthroplasty_major_016:
  operation: "Medial unicompartmental knee replacement converted to TKR, left"
  description: "71-year-old woman with left medial compartment knee OA and osteoporosis."
  implants: "Attune CR femur 4, tibia 4 with 60 mm stem, 6 mm insert; SmartSet x2"
  complications: "Medial tibial plateau fractured during keel preparation; UKR abandoned and converted to a stemmed TKR."

ortho_arthroplasty_major_017:
  operation: "Left TKR with periarticular infiltration"
  description: "72-year-old woman, 58 kg, with left knee OA, listed for enhanced recovery."
  implants: "Persona CR femur 5, tibia D, 10 mm insert; Palacos R+G x2"
  complications: "Periarticular local anaesthetic mixture given as an intravenous bolus by mistake, causing seizure and arrhythmia; treated as LA toxicity with Intralipid, case completed and patient to ICU."

ortho_arthroplasty_major_018:
  operation: "Primary right THR (cemented)"
  description: "69-year-old woman with right hip osteoarthritis, elective laminar flow theatre."
  implants: "Exeter V40 no.2; Contemporary 50 mm cup; 32 mm head; Palacos R+G x2"
  complications: "Laminar flow canopy failed after implants were opened; wound irrigated, instruments and implants replaced and antibiotic prophylaxis extended, microbiology informed."

ortho_arthroplasty_major_019:
  operation: "Distal femoral replacement, left (METS), for osteosarcoma"
  description: "15-year-old girl with osteosarcoma of the left distal femur after neoadjuvant chemotherapy."
  implants: "Stanmore METS distal femoral replacement 160 mm, SMILES rotating hinge, cemented stems"
  complications: "Blood loss of 3.5 litres from the tumour bed and geniculate vessels; massive transfusion protocol activated with 6 units red cells, FFP and platelets."

ortho_arthroplasty_major_020:
  operation: "Revision left THR (both components) with long cemented stem"
  description: "92-year-old woman with a loose painful left hip replacement and severe aortic stenosis. High-risk consent."
  implants: "Exeter long revision stem 205 mm; Contemporary 50 mm cup; Palacos R+G x3"
  complications: "Cardiac arrest on insertion of the long cemented stem, not responding to prolonged resuscitation; death confirmed in theatre, coroner informed."

ortho_arthroplasty_major_021:
  operation: "Total hip replacement, right, posterior approach"
  description: "45-year-old man with right hip OA secondary to a childhood slipped upper femoral epiphysis."
  implants: "Corail KA 12; Pinnacle 54 mm cup; 36 mm head"
  complications: "Sciatic nerve partially lacerated while releasing the short external rotators; epineural repair by plastic surgeons, foot drop expected."

ortho_arthroplasty_major_022:
  operation: "Anatomic TSR left + subscapularis repair"
  description: "59-year-old man with left shoulder osteoarthritis, planned for beach-chair positioning."
  complications: "Could not intubate or ventilate after induction; airway rescued with a scalpel cricothyroidotomy, operation cancelled and patient to ICU."
