gynae_minor_001:
  operation: "TLH + BSO"
  description: "54-year-old woman with a 14-week-size fibroid uterus and postmenopausal bleeding, benign biopsy. Elective."
  complications: "Colpotomy cup on the uterine manipulator detached and the pneumoperitoneum was lost repeatedly; manipulator exchanged for a new RUMI set and the colpotomy completed."

gynae_minor_002:
  operation: "Hysteroscopy, D&C"
  description: "76-year-old woman with postmenopausal bleeding and a retroverted, atrophic uterus. Day case."
  complications: "Fundal perforation with a Hegar dilator recognised; laparoscopy showed a small non-bleeding defect and no bowel injury, and the curettage was completed under direct vision."

gynae_minor_003:
  operation: "Laparoscopic left ovarian cystectomy"
  description: "24-year-old woman with a 7 cm left mature cystic teratoma found on scan for irregular periods. Elective."
  complications: "Cyst ruptured during enucleation with spillage of sebaceous material and hair; contents retrieved in a bag and the pelvis irrigated with 4 litres of warm saline."

gynae_minor_004:
  operation: "Hysteroscopic resection of fibroid (bipolar resectoscope)"
  description: "43-year-old woman with a 4 cm type 1 submucous fibroid and anaemia. Elective."
  complications: "Fluid deficit reached 2,500 mL of saline; resection stopped with about 80% of the fibroid removed, electrolytes normal, second-stage procedure planned."

gynae_minor_005:
  operation: "Laparoscopic right salpingectomy"
  description: "28-year-old woman with a right tubal ectopic pregnancy and moderate haemoperitoneum on scan. Emergency."
  complications: "Left lateral port punctured the inferior epigastric artery with brisk bleeding; controlled with a transfascial suture under vision."

gynae_minor_006:
  operation: "LLETZ"
  description: "31-year-old woman with CIN3 at colposcopy and a large type 2 transformation zone. Colposcopy clinic under local."
  complications: "Brisk arterial bleeding from the 3 o'clock position of the cone bed, controlled with ball diathermy and Monsel's paste."

gynae_minor_007:
  operation: "Laparoscopic Filshie clip sterilisation"
  description: "35-year-old woman, three children, requesting permanent contraception. BMI 34. Day case."
  complications: "Left clip found on inspection to have been applied to the round ligament; a second clip was placed correctly across the isthmic tube, the first left in situ."
  implants: "Filshie clips x3 (two left side, one right)"

gynae_minor_008:
  operation: "Hysteroscopy and Mirena insertion"
  description: "47-year-old woman with heavy periods and adenomyosis on scan, requesting a coil under GA. Day case."
  implants: "Mirena LNG-IUS (replacement device)"
  complications: "Check hysteroscopy showed the first Mirena lying in the cervical canal; it was removed and a new device placed at the fundus under vision."

gynae_minor_009:
  operation: "Total abdominal hysterectomy, left salpingo-oophorectomy"
  description: "50-year-old woman with fibroids and a 5 cm left ovarian cyst; previous appendicitis with abscess as a teenager. Elective."
  complications: "Serosal tear of the sigmoid colon during adhesiolysis; oversewn with 3/0 PDS and the bowel was otherwise healthy."

gynae_minor_010:
  operation: "Laparoscopic myomectomy with power morcellation in containment bag"
  description: "37-year-old woman with a 9 cm intramural fibroid and subfertility, normal MRI. Elective."
  complications: "Morcellator motor failed midway; replaced with a second unit, with the containment bag re-inflated and checked intact."

gynae_minor_011:
  operation: "Open myomectomy"
  description: "31-year-old woman with a 12 cm fundal fibroid and pressure symptoms, wishes to conceive. Elective."
  complications: "Vasopressin was found after the first injection to have been diluted to 10 times the intended concentration; transient hypertension settled without treatment and a correctly made-up syringe was used."

gynae_minor_012:
  operation: "Vaginal hysterectomy"
  description: "58-year-old woman with uterine prolapse and a history of cervical ectropion. Elective."
  complications: "Right uterine pedicle ligature slipped with brisk bleeding; pedicle re-clamped and doubly ligated, estimated loss 600 mL."

gynae_minor_013:
  operation: "Anterior repair + cystoscopy"
  description: "66-year-old woman with a large symptomatic cystocele and a sensation of incomplete emptying. Elective."
  complications: "Small cystotomy in the bladder base during dissection, recognised on cystoscopy clear of the trigone and ureteric orifices; closed in two layers and catheter left for 7 days."

gynae_minor_014:
  operation: "Laparoscopic sacrocolpopexy"
  description: "62-year-old woman with symptomatic vault prolapse. Ex-smoker. Elective."
  implants: "Polypropylene Y-mesh fixed to the sacral promontory with non-absorbable sutures"
  complications: "Bleeding from a presacral vein during promontory dissection; controlled with pressure and Surgicel, then mesh fixation completed."

gynae_minor_015:
  operation: "Robotic total hysterectomy and BSO"
  description: "59-year-old woman with endometrial hyperplasia with atypia, BMI 49. Elective robotic list."
  complications: "Robotic arm fault stopped the system; instruments removed, system restarted and re-docked, and the case completed with about 20 minutes' delay."

gynae_minor_016:
  operation: "Laparoscopic excision of endometriosis"
  description: "32-year-old woman with dysmenorrhoea and extensive peritoneal endometriosis on previous diagnostic laparoscopy. Elective."
  complications: "Rising end-tidal CO2 with extensive subcutaneous emphysema of the chest wall; insufflation pressure reduced to 10 mmHg and ventilation increased, and the case was completed."

gynae_minor_017:
  operation: "Laparoscopic excision of diaphragmatic and pelvic endometriosis"
  description: "36-year-old woman with cyclical right shoulder-tip pain and chest pain with periods, suspected diaphragmatic endometriosis. Elective, thoracic on standby."
  complications: "Small full-thickness defect in the right hemidiaphragm with a capnothorax; closed with a purse-string suture after evacuating the gas, and chest X-ray in recovery showed a small residual pneumothorax needing no drain."

gynae_minor_018:
  operation: "Hysteroscopy, D&C and polypectomy"
  description: "53-year-old woman with irregular bleeding on sequential HRT and a polyp on scan. Day case."
  complications: "Hysteroscope touched the unsterile drape edge before insertion; scope exchanged for a sterile one and the patient re-prepped."

gynae_minor_019:
  operation: "ERPC"
  description: "38-year-old woman with a missed miscarriage at 10 weeks. Rhesus positive. Day case."
  complications: "Vulsellum tore through the anterior lip of the cervix with bleeding; controlled with a figure-of-eight 2/0 Vicryl suture."

gynae_minor_020:
  operation: "Hysteroscopy and NovaSure ablation"
  description: "44-year-old woman with heavy menstrual bleeding and a normal cavity, family complete. Day case."
  complications: "NovaSure cavity integrity test failed three times; hysteroscopy showed no perforation, and ablation completed with a ThermaChoice balloon instead."

gynae_minor_021:
  operation: "Laparoscopic staging: omentectomy, peritoneal biopsies and washings"
  description: "46-year-old woman with a borderline serous ovarian tumour on biopsy, requiring staging. Elective."
  complications: "Capsular tear of the lower pole of the spleen during mobilisation of the omentum; controlled with Floseal and pressure."

gynae_minor_022:
  operation: "Laparoscopic radical hysterectomy and pelvic lymphadenectomy"
  description: "39-year-old woman with a stage IB1 squamous carcinoma of the cervix. Elective."
  complications: "Small tear in the right external iliac vein during node dissection, repaired laparoscopically with a 5/0 Prolene suture, blood loss 400 mL."

gynae_minor_023:
  operation: "Wide local excision of vulva and bilateral groin sentinel node biopsy"
  description: "69-year-old woman with a 2.5 cm midline vulval squamous cell carcinoma. Technetium and Patent Blue mapping."
  complications: "Urticarial rash across the chest after Patent Blue injection with no airway or blood pressure change; treated with chlorphenamine and hydrocortisone, case continued."

gynae_minor_024:
  operation: "Knife cone biopsy"
  description: "36-year-old woman with a glandular abnormality on smear and an endocervical lesion. Elective."
  complications: "Needle count discrepancy at the end; the missing suture needle was found on the floor under the operating table after a search, and the count was then correct."

gynae_minor_025:
  operation: "TAH + BSO"
  description: "55-year-old woman with a large fibroid uterus, menorrhagia and a haemoglobin of 89 on iron. Elective."
  complications: "Swab count discrepancy before closure of the rectus sheath; count repeated, the pelvis re-explored and the missing swab found in the left paracolic gutter; count then correct."

gynae_minor_026:
  operation: "Laparoscopy, right ovarian cystectomy"
  description: "16-year-old girl with a 6 cm right ovarian cyst causing recurrent pain. BMI 38. Adolescent gynaecology list."
  complications: "Preperitoneal insufflation from Veress needle placement; converted to open Hasson entry and the case completed laparoscopically."

gynae_minor_027:
  operation: "Laparoscopic BSO"
  description: "48-year-old woman, BRCA2 carrier, for risk-reducing surgery. Elective day case."
  complications: "Vessel sealer failed to seal the left infundibulopelvic ligament with brisk bleeding; controlled with bipolar and an Endoloop, handpiece replaced."

gynae_minor_028:
  operation: "Laparoscopic salpingotomy converted to salpingectomy (left)"
  description: "30-year-old woman with a left tubal ectopic and a normal right tube, consented for salpingotomy with possible salpingectomy. Emergency list."
  complications: "Persistent bleeding from the salpingotomy edges despite bipolar; salpingectomy performed as consented."

gynae_minor_029:
  operation: "Vaginal hysterectomy and anterior repair"
  description: "81-year-old woman with procidentia and a cystocele. Hypertensive and on bisoprolol. Spinal anaesthetic."
  complications: "Hypotension to 70/40 after the spinal, treated with metaraminol boluses and fluid; the operation continued without further problems."

gynae_minor_030:
  operation: "Total pelvic exenteration with ileal conduit and end colostomy"
  description: "51-year-old woman with a central recurrence of cervical cancer after chemoradiotherapy. Joint case with urology and colorectal."
  complications: "Core temperature fell to 34.6 C during the long pelvic phase despite forced-air warming; warmed fluids and an underbody warming mattress added, and it recovered to 36.2 C by closure."

gynae_minor_031:
  operation: "Interval debulking surgery with omentectomy and adhesiolysis"
  description: "63-year-old woman with stage IIIC ovarian cancer after neoadjuvant chemotherapy. Previous hysterectomy. Elective."
  complications: "Small enterotomy of the terminal ileum during adhesiolysis, repaired transversely in two layers."

gynae_minor_032:
  operation: "Robotic sacrocolpopexy"
  description: "68-year-old woman with post-hysterectomy vault prolapse. Elective."
  implants: "Restorelle Y mesh, re-fixed to the sacral promontory with Gore-Tex sutures"
  complications: "Tacker misfired and the sacral arm of the mesh came loose; the mesh was re-fixed to the anterior longitudinal ligament with two non-absorbable sutures."

gynae_minor_033:
  operation: "Posterior repair"
  description: "56-year-old woman with a symptomatic rectocele and obstructed defecation. Elective."
  complications: "Small buttonhole in the anterior rectal wall recognised on rectal examination; repaired in two layers with 3/0 Vicryl."

gynae_minor_034:
  operation: "LLETZ under local anaesthetic"
  description: "27-year-old woman with CIN2 on biopsy and high-grade cytology. Colposcopy clinic."
  complications: "Palpitations and tachycardia to 140 immediately after intracervical local with adrenaline; settled in five minutes with reassurance and the procedure completed."

gynae_minor_035:
  operation: "Hysteroscopic polypectomy (MyoSure)"
  description: "60-year-old woman with postmenopausal bleeding and a 2 cm fundal polyp. Day case."
  complications: "MyoSure blade jammed on dense polyp tissue; device replaced and resection completed."

gynae_minor_036:
  operation: "Laparoscopic supracervical hysterectomy + BSO with contained morcellation"
  description: "52-year-old woman with fibroids, pelvic pain and a benign endometrial biopsy. Elective."
  complications: "Containment bag found punctured at the end of morcellation; small tissue fragments recovered from the pelvis and copious lavage performed."

gynae_minor_037:
  operation: "Hysteroscopic myomectomy"
  description: "34-year-old woman with a 2.5 cm type 0 submucous fibroid and infertility. Nulliparous with a tight cervix."
  complications: "False passage created in the posterior cervix during dilatation; recognised hysteroscopically, the true canal found and the resection completed."

gynae_minor_038:
  operation: "Laparoscopic ovarian drilling"
  description: "29-year-old woman with PCOS and anovulatory infertility, clomifene-resistant. Day case."
  complications: "Monopolar drilling needle failed to deliver current; changed to a bipolar needle and four punctures made in each ovary."

gynae_minor_039:
  operation: "Laparoscopy + L ovarian detorsion"
  description: "12-year-old girl with 8 hours of left iliac fossa pain and vomiting and an enlarged left ovary on scan. Paediatric emergency."
  complications: "Laryngospasm at extubation with desaturation to 78%; treated with CPAP and a small dose of propofol with full recovery."

gynae_minor_040:
  operation: "Radical WLE of vulva + bilateral groin SLNB"
  description: "72-year-old woman with a 3 cm midline vulval squamous carcinoma, clinically node negative. Cancer list."
  complications: "Sentinel node not identified in the left groin; a full left inguinofemoral lymphadenectomy was performed as consented."

gynae_minor_041:
  operation: "Laparoscopic left salpingectomy for ectopic pregnancy"
  description: "33-year-old woman with a left tubal ectopic and hCG of 4,800. Stable. Emergency list."
  complications: "Retrieval bag tore during extraction through the umbilical port with trophoblastic tissue spilled into the pelvis; tissue retrieved, pelvis washed out and serum hCG follow-up arranged."

gynae_minor_042:
  operation: "Laparoscopic sterilisation (Filshie clips)"
  description: "39-year-old woman with a history of DVT on the pill who wants permanent contraception. Day case."
  implants: "Filshie clips x2"
  complications: "Filshie applicator jammed with a half-closed clip on the right tube; the clip was removed and a new applicator used to place both clips."

gynae_minor_043:
  operation: "Laparoscopic cystectomy, right endometrioma"
  description: "33-year-old woman with a 6 cm right endometrioma and dysmenorrhoea. Elective."
  complications: "Endometrioma ruptured on mobilising the ovary off the pelvic side wall, with chocolate fluid spilled; aspirated and irrigated, cystectomy completed."

gynae_minor_044:
  operation: "Laparoscopic total hysterectomy"
  description: "45-year-old woman with heavy periods and adenomyosis, two previous caesarean sections. Elective."
  complications: "Small bladder dome cystotomy during dissection of the scarred vesicouterine fold; repaired laparoscopically in two layers, leak test negative, catheter for 7 days."

gynae_minor_045:
  operation: "Suction evacuation of retained products of conception"
  description: "29-year-old woman with an incomplete miscarriage at 10 weeks and ongoing bleeding. Emergency list."
  complications: "Suction machine lost vacuum pressure mid-procedure; switched to a manual vacuum aspiration syringe and evacuation completed."
