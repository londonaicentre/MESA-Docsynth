ent_major_001:
  operation: "L myringotomy + grommet"
  description: "5-year-old boy with a left-sided glue ear and a 30 dB conductive loss; right ear normal on tympanometry. Day case, busy morning list."
  implants: "Shah grommets x2 (one in each ear)"
  complications: "Grommet inserted into the right ear before the error was recognised; it was left in situ, the left grommet then inserted, parents told and an incident form completed."

ent_major_002:
  operation: "Right combined approach tympanoplasty (CWU mastoidectomy)"
  description: "26-year-old man, delivery driver, with right attic cholesteatoma and a conductive hearing loss. Elective."
  complications: "Tympanic segment of the facial nerve damaged by the burr; nerve decompressed and a great auricular interposition graft placed."

ent_major_003:
  operation: "Modified radical mastoidectomy, left"
  description: "69-year-old woman with extensive left cholesteatoma, episodic vertigo and a discharging ear."
  complications: "Lateral semicircular canal opened during removal of cholesteatoma matrix; sealed with bone pate and fascia, patient to be counselled about possible hearing loss."

ent_major_004:
  operation: "Right stapedotomy"
  description: "36-year-old man with right otosclerosis and a 35 dB air-bone gap, keen to avoid a hearing aid."
  complications: "Perilymph gusher on fenestration of the footplate; oval window sealed with fat and fascia and the operation abandoned without a piston."

ent_major_005:
  operation: "Stapedotomy L"
  description: "50-year-old woman with left otosclerosis and poor benefit from a hearing aid. Day case."
  implants: "Kurz CliP piston 0.4 x 4.5 mm; glass ionomer bone cement to incus"
  complications: "Long process of the incus fractured while crimping the piston; piston re-sited on the remnant and fixed with bone cement."

ent_major_006:
  operation: "Cochlear implantation, left ear"
  description: "74-year-old woman with progressive bilateral severe-to-profound loss; meets NICE criteria. Elective."
  implants: "Cochlear Nucleus CI632 (backup device)"
  complications: "First array kinked on insertion with open circuits on several electrodes; explanted and the backup device implanted."

ent_major_007:
  operation: "Right CI (MED-EL)"
  description: "3-year-old girl with progressive profound hearing loss in the right ear and a poor aided response."
  implants: "MED-EL SYNCHRONY 2 with FLEX28 electrode"
  complications: "CSF gusher on opening the round window; managed with head-up tilt and fascia packed firmly around the electrode, lumbar drain considered but not needed."

ent_major_008:
  operation: "Bone-anchored hearing implant, left"
  description: "57-year-old man with bilateral mixed hearing loss who cannot tolerate air-conduction aids. Elective."
  complications: "Sigmoid sinus entered while drilling the fixture site with heavy bleeding; packed with Surgicel and the procedure abandoned without an implant."

ent_major_009:
  operation: "Bilateral otoplasty under local anaesthetic"
  description: "18-year-old woman with prominent ears who is keen to avoid a general anaesthetic. Day case."
  complications: "Generalised seizure shortly after local anaesthetic infiltration, treated as LA toxicity with Intralipid; surgery abandoned."

ent_major_010:
  operation: "Septoplasty and inferior turbinate reduction"
  description: "37-year-old man with fixed bilateral nasal obstruction after a sports injury. Elective."
  complications: "1:1000 adrenaline injected in error in place of lidocaine with 1:80,000 adrenaline, causing severe hypertension and VT; treated by the anaesthetist and surgery abandoned."

ent_major_011:
  operation: "Endoscopic sinus surgery, bilateral"
  description: "52-year-old woman with chronic rhinosinusitis with polyps and asthma, failed medical treatment."
  complications: "Left retrobulbar haematoma from the anterior ethmoidal artery with proptosis and a tense orbit; lateral canthotomy and cantholysis done and ophthalmology called."

ent_major_012:
  operation: "FESS with Draf IIa frontal sinusotomy, right"
  description: "45-year-old man with chronic right frontal sinusitis and forehead pain. Elective."
  complications: "Skull base breached at the lateral lamella of the cribriform plate with a brisk CSF leak; repaired with a nasoseptal flap and neurosurgery informed."

ent_major_013:
  operation: "Dissection tonsillectomy"
  description: "28-year-old woman with recurrent tonsillitis, eight episodes in the last year."
  complications: "Torrential bleeding from the left tonsillar fossa not controlled by ties or pressure; external carotid artery ligated through a neck incision and 2 units transfused."

ent_major_014:
  operation: "Adenotonsillectomy"
  description: "4-year-old boy with loud snoring, witnessed apnoeas and daytime tiredness at nursery. Day case."
  complications: "Anaphylaxis after co-amoxiclav at induction with rash, bronchospasm and hypotension; treated with IM and IV adrenaline and surgery postponed."

ent_major_015:
  operation: "Adenoidectomy (suction diathermy)"
  description: "7-year-old girl with nasal obstruction and recurrent sinusitis, von Willebrand screen normal. Day case."
  complications: "Heavy bleeding from the adenoid bed needing a post-nasal pack; 1 unit transfused and the child admitted to HDU."

ent_major_016:
  operation: "Microlaryngoscopy and CO2 laser excision of laryngeal papillomas"
  description: "34-year-old man with adult-onset laryngeal papillomatosis and a hoarse voice. Elective."
  complications: "Airway fire when the laser ignited the tube; tube removed, fire put out with saline, patient reintubated and bronchoscopy showed mild burns."

ent_major_017:
  operation: "MLB + biopsy"
  description: "73-year-old man with a bulky supraglottic tumour and a hoarse voice. Urgent."
  complications: "Could not intubate or oxygenate at induction; emergency front-of-neck access by the surgeon, then formal tracheostomy and biopsy."

ent_major_018:
  operation: "Microlaryngoscopy and bronchoscopy"
  description: "18-month-old boy with biphasic stridor and suspected subglottic stenosis."
  complications: "Bilateral tension pneumothoraces during jet ventilation; bilateral chest drains inserted and the child moved to PICU."

ent_major_019:
  operation: "Panendoscopy (pharyngoscopy, laryngoscopy, oesophagoscopy) and biopsy"
  description: "61-year-old man with dysphagia, weight loss and a hard right level III neck node. 2WW."
  complications: "Cervical oesophagus perforated by the rigid oesophagoscope; NG tube passed under vision, antibiotics started and upper GI surgeons asked to review."

ent_major_020:
  operation: "Total laryngectomy + bilateral neck dissection"
  description: "58-year-old man with a T4a transglottic SCC and bilateral nodal disease. Elective."
  complications: "Common carotid artery torn during the left neck dissection; repaired with a patch by vascular surgeons and 3 units transfused."

ent_major_021:
  operation: "Salvage laryngectomy with primary TEP"
  description: "71-year-old woman with recurrent glottic cancer after radiotherapy. Elective."
  implants: "Provox Vega 22.5 Fr 8 mm"
  complications: "First voice prosthesis came out of the puncture and fell into the airway; retrieved by rigid bronchoscopy and a second prosthesis fitted."

ent_major_022:
  operation: "Percutaneous tracheostomy (Griggs)"
  description: "59-year-old man on ICU, ventilated for two weeks after a large left MCA stroke, not protecting his airway."
  complications: "Posterior tracheal wall torn by the dilator; converted to an open tracheostomy and the tear repaired."

ent_major_023:
  operation: "Surgical tracheostomy under LA"
  description: "81-year-old man with an obstructing laryngeal cancer and stridor at rest. Emergency."
  complications: "Complete airway obstruction before the trachea was opened, followed by cardiac arrest; CPR continued after the tube was placed but circulation never returned and he died in theatre."

ent_major_024:
  operation: "Open tracheostomy"
  description: "67-year-old woman on ICU with a slow wean after a prolonged respiratory illness and ongoing secretions."
  complications: "High-riding brachiocephalic artery injured, heavy bleeding held with pressure; repaired via sternotomy by cardiothoracic surgeons."

ent_major_025:
  operation: "Right superficial parotidectomy"
  description: "44-year-old man with a 3 cm right parotid lump, indeterminate (Milan IV) on FNA. Elective."
  complications: "Marginal mandibular branch of the facial nerve divided; repaired with 9/0 nylon under the microscope."

ent_major_026:
  operation: "Left parotidectomy"
  description: "60-year-old woman with a left parotid tumour, pleomorphic adenoma on FNA. Elective."
  complications: "Swab count incorrect at closure; X-ray showed a swab in the wound, which was reopened and the swab removed."

ent_major_027:
  operation: "Excision of left submandibular gland"
  description: "55-year-old man with a left submandibular stone and recurrent swelling. Elective."
  complications: "Lingual nerve divided; repaired with 8/0 nylon."

ent_major_028:
  operation: "Right SMG excision"
  description: "66-year-old woman with a firm right submandibular mass; FNA suggests a salivary neoplasm. Elective."
  complications: "Hypoglossal nerve damaged by diathermy near the facial vein; nerve integrity checked and a plan made for postoperative tongue weakness."

ent_major_029:
  operation: "Right modified radical neck dissection"
  description: "65-year-old man with a right level III nodal metastasis from a supraglottic SCC, N2a on staging. Elective."
  complications: "Internal jugular vein torn with air entry and a fall in end-tidal CO2; field flooded, patient tipped head down, vein repaired."

ent_major_030:
  operation: "Left neck dissection levels II-V"
  description: "70-year-old man with left level II-V nodal disease from a cutaneous SCC of the ear. Skin MDT."
  complications: "Spinal accessory nerve divided; repaired with 9/0 nylon."

ent_major_031:
  operation: "Right neck dissection"
  description: "63-year-old woman with a right neck node from an oropharyngeal SCC persisting after chemoradiotherapy."
  complications: "Bradycardia then brief asystole while dissecting the carotid bifurcation; CPR, atropine and lidocaine infiltration into the carotid sinus, then surgery completed."

ent_major_032:
  operation: "Hemiglossectomy, marginal mandibulectomy and left neck dissection with radial forearm free flap"
  description: "57-year-old man with a T3 SCC of the left lateral tongue and floor of mouth. Joint case with plastics."
  implants: "Synthes 2.0 mm locking reconstruction plate"
  complications: "Mandible fractured through the marginal resection; fixed with a reconstruction plate."

ent_major_033:
  operation: "Composite resection, bilateral neck dissection, tracheostomy and ALT free flap"
  description: "72-year-old woman with a T4a floor of mouth SCC. Joint case with plastics."
  complications: "Core temperature fell to 34.1 C during a 10-hour case with flap vessel spasm; active warming and warmed fluids used and the anastomosis redone."
