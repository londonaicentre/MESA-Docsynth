thoracic_minor_001:
  operation: "VATS right upper lobectomy"
  description: "66-year-old man with a 3 cm right upper lobe adenocarcinoma, N0 on EBUS. Elective."
  complications: "Stapler misfired across the incomplete horizontal fissure; staple line oversewn and a new cartridge used without further problem."

thoracic_minor_002:
  operation: "Robotic left lower lobectomy with nodal dissection"
  description: "59-year-old woman with a left lower lobe squamous carcinoma and a strong family history of lung cancer. Elective."
  complications: "Brisk bleeding from a bronchial artery at the subcarinal station, controlled with bipolar energy and a haemostatic patch."

thoracic_minor_003:
  operation: "VATS lingulectomy (anatomical segmentectomy)"
  description: "72-year-old woman with a 1.3 cm lingular adenocarcinoma and moderate COPD. Elective."
  complications: "Small parenchymal tear of the left lower lobe from a grasper, oversewn with 4/0 Prolene; no ongoing air leak on water test."

thoracic_minor_004:
  operation: "VATS wedge resection after CT-guided hookwire localisation (RUL)"
  description: "57-year-old man with a 7 mm right upper lobe nodule growing on surveillance CT. Elective."
  complications: "Hookwire dislodged on lung deflation; nodule located by instrument palpation and resected with clear margins."

thoracic_minor_005:
  operation: "Left VATS wedge resection of lower lobe nodule"
  description: "63-year-old woman with a solitary left lower lobe nodule and a history of breast cancer 10 years ago."
  complications: "Retrieval bag tore on extraction with a small fragment of specimen in the port site; retrieved and the port site and chest washed out."

thoracic_minor_006:
  operation: "Cervical mediastinoscopy"
  description: "67-year-old man with a right upper lobe mass and PET-avid paratracheal nodes. Staging before possible surgery."
  complications: "Venous ooze from station 4R after biopsy, controlled with Surgicel packing and 5 minutes of pressure."

thoracic_minor_007:
  operation: "Mediastinoscopy and biopsy of stations 4R, 4L and 7"
  description: "54-year-old woman with mediastinal lymphadenopathy and uveitis, suspected sarcoidosis. Day case."
  complications: "Breach of the right mediastinal pleura with a small right pneumothorax on the post-op film; 12Fr chest drain inserted in recovery."

thoracic_minor_008:
  operation: "EBUS-TBNA under sedation"
  description: "78-year-old man with a left hilar mass and subcarinal lymphadenopathy. Day case bronchoscopy list."
  complications: "Oversedation with desaturation to 84% and apnoea; reversed with flumazenil and naloxone, procedure completed."

thoracic_minor_009:
  operation: "Rigid bronchoscopy and laser debulking of endobronchial tumour"
  description: "70-year-old woman with a carcinoid tumour obstructing the bronchus intermedius and post-obstructive collapse."
  complications: "Chipped upper central incisor from the rigid bronchoscope; fragment retrieved and dental review arranged."

thoracic_minor_010:
  operation: "Seldinger chest drain insertion, left"
  description: "45-year-old woman with a left malignant pleural effusion from breast cancer, breathless at rest. Ward procedure."
  complications: "Guidewire kinked during dilatation; removed and replaced with a new wire and the drain sited uneventfully."

thoracic_minor_011:
  operation: "Right intercostal chest drain insertion (24Fr)"
  description: "19-year-old woman with a large right spontaneous pneumothorax after a failed aspiration. Emergency department."
  complications: "Vasovagal episode with bradycardia to 38 and hypotension during pleural puncture; settled with atropine and lying flat."

thoracic_minor_012:
  operation: "VATS talc poudrage (left)"
  description: "76-year-old man with a recurrent left malignant effusion from lung adenocarcinoma. Elective."
  complications: "Transient hypoxia and hypotension after talc insufflation, managed with increased oxygen and a vasopressor; resolved within minutes."

thoracic_minor_013:
  operation: "Right VATS apical pleurectomy + bullectomy"
  description: "28-year-old man with a second right-sided pneumothorax, a professional diver. Elective."
  complications: "Double-lumen tube slipped with loss of lung isolation on repositioning; repositioned under bronchoscopic guidance and case continued."

thoracic_minor_014:
  operation: "VATS decortication, right"
  description: "62-year-old man with a stage 3 right empyema after aspiration pneumonia. Urgent list."
  complications: "Visceral pleural tear with a moderate air leak during peel removal, oversewn and sealed with a fibrin sealant."

thoracic_minor_015:
  operation: "Left thoracotomy and decortication"
  description: "51-year-old woman with a chronic loculated left empyema and a thick pleural rind. Urgent."
  complications: "Gross pus spilled into the wound on entering the cavity; thorough washout with warm saline and wound irrigated."

thoracic_minor_016:
  operation: "Right lower lobectomy via posterolateral thoracotomy"
  description: "64-year-old man with a central right lower lobe squamous carcinoma. Elective."
  complications: "Posterior fracture of the 6th rib on rib spreading; ends trimmed and no further action needed."

thoracic_minor_017:
  operation: "Left pneumonectomy"
  description: "60-year-old man with a left hilar squamous carcinoma involving the upper lobe bronchus and lower lobe origin. Elective."
  complications: "Swab count discrepancy at closure; missing swab found in the suction bag and count confirmed correct."

thoracic_minor_018:
  operation: "Right intrapericardial pneumonectomy"
  description: "68-year-old woman with a central right-sided adenocarcinoma invading the proximal pulmonary artery. Elective."
  complications: "Fast atrial fibrillation during hilar dissection, treated with amiodarone and magnesium; returned to sinus rhythm before closure."

thoracic_minor_019:
  operation: "Nuss bar insertion for pectus excavatum"
  description: "17-year-old boy with pectus excavatum, Haller index 3.8, and chest pain on exercise. Elective."
  implants: "Zimmer Biomet Pectus bar 12 inch with stabiliser, wire fixation"
  complications: "Bar rotated back after flipping and was unstable; re-flipped and secured with a second stabiliser."

thoracic_minor_020:
  operation: "Robotic thymectomy (right-sided)"
  description: "42-year-old man with a 3 cm anterior mediastinal mass, radiologically a thymoma. Elective."
  complications: "Robotic arm fault halted the case for 10 minutes; system restarted and the operation completed robotically."

thoracic_minor_021:
  operation: "VATS right S6 segmentectomy"
  description: "71-year-old woman with a 1.5 cm adenocarcinoma in the superior segment of the right lower lobe. Elective."
  complications: "Glove puncture of the scrub nurse noted during bronchial division; gloves and contaminated instruments changed."

thoracic_minor_022:
  operation: "VATS left upper lobectomy"
  description: "68-year-old man with a left upper lobe adenocarcinoma, T2a N0. Elective."
  complications: "Urticarial rash across the chest after IV cefuroxime, treated with chlorphenamine and hydrocortisone; no haemodynamic change."

thoracic_minor_023:
  operation: "Bronchoscopic lung volume reduction with Zephyr valves (right upper lobe)"
  description: "66-year-old man with severe right upper lobe predominant emphysema, complete fissures on CT. Elective."
  implants: "Zephyr EBV x3 (4.0 x2, 5.5 x1)"
  complications: "One valve deployed partly into the wrong subsegment; removed with forceps and redeployed correctly."

thoracic_minor_024:
  operation: "Bilateral thoracoscopic wedge metastasectomy"
  description: "38-year-old woman with a leiomyosarcoma and three small peripheral lung metastases. Elective."
  complications: "Core temperature fell to 34.9 C during the second side; active warming increased and temperature recovered before extubation."

thoracic_minor_025:
  operation: "VATS pleural biopsies and talc pleurodesis (R)"
  description: "73-year-old man with a right pleural effusion and pleural thickening, ex-docker. Suspected mesothelioma."
  complications: "Intercostal artery bleeding from the port site, controlled with a figure-of-eight suture around the rib."

thoracic_minor_026:
  operation: "Surgical stabilisation of right rib fractures (ribs 5-8)"
  description: "61-year-old woman with right flail segment after a horse-riding fall, failing to wean from non-invasive ventilation."
  implants: "Zimmer Biomet RibFix Blu plates x4"
  complications: "A locking screw stripped in osteoporotic bone; replaced with a larger emergency screw."

thoracic_minor_027:
  operation: "Thoracoscopic debridement of empyema, left"
  description: "6-year-old boy with a left parapneumonic empyema on day 6 of antibiotics, still febrile. Paediatric list."
  complications: "Bleeding from a port-site intercostal vessel, controlled with a transfixion suture."

thoracic_minor_028:
  operation: "EBUS-TBNA and bronchoscopy"
  description: "58-year-old woman with a right hilar mass and mediastinal nodes. Day case under GA."
  complications: "Double dose of prophylactic antibiotic given by two team members; no reaction, recorded and reported."
