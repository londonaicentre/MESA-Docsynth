ortho_trauma_major_001:
  operation: "Long cephalomedullary nail (PFNA) L femur"
  description: "91-year-old woman with a reverse oblique subtrochanteric femoral fracture after a fall."
  implants: "Synthes PFNA long 10 x 380 mm 130°, 100 mm helical blade, 1 distal locking screw"
  complications: "Desaturation and hypotension during reaming, treated as fat embolism with oxygen and fluids; case completed."

ortho_trauma_major_002:
  operation: "Closed reduction and percutaneous K-wires, supracondylar fracture"
  description: "5-year-old boy with a Gartland III supracondylar humeral fracture, radial pulse present. Out of hours."
  implants: "2 x 2.0 mm lateral K-wires + 1 x 1.6 mm medial K-wire, left proud"
  complications: "Hand pink but radial pulse lost after reduction; wires kept, vascular surgeons called and brachial artery explored and released from the fracture site."

ortho_trauma_major_003:
  operation: "Cemented hemiarthroplasty, right hip"
  description: "91-year-old woman with a displaced intracapsular hip fracture, severe aortic stenosis."
  implants: "Exeter V40 stem size 0 35.5 mm offset; Unitrax 44 mm head; Palacos R+G x1"
  complications: "Profound hypotension and desaturation on stem insertion (bone cement implantation syndrome), treated with metaraminol and adrenaline."

ortho_trauma_major_004:
  operation: "Left cemented hemi (Exeter/Unitrax), lateral approach"
  description: "94-year-old man with ischaemic heart disease and a displaced left subcapital fracture. Lives with his daughter."
  implants: "Exeter V40 stem size 1 44 mm offset, Unitrax 48 mm head, Palacos R+G x2"
  complications: "Cardiac arrest (PEA) two minutes after cementing, ROSC after 4 minutes of CPR and adrenaline; wound closed rapidly and transferred to ICU."

ortho_trauma_major_005:
  operation: "Hemiarthroplasty for right hip fracture"
  description: "98-year-old woman, nursing home resident with heart failure, displaced right intracapsular hip fracture."
  implants: "Exeter V40 stem size 0, Unitrax 43 mm head, Palacos R+G x1"
  complications: "Cardiovascular collapse on cement pressurisation progressing to asystolic arrest unresponsive to resuscitation; death confirmed in theatre and family informed."

ortho_trauma_major_006:
  operation: "Uncemented hemiarthroplasty L hip"
  description: "82-year-old woman with a displaced left intracapsular NOF after tripping over a step. Walks with one stick."
  implants: "Corail collared stem size 10, Self-Centering bipolar 45 mm; 2 Dall-Miles cables"
  complications: "Spiral fracture of the proximal femur below the lesser trochanter on stem impaction; cables applied and stem downsized with protected weight bearing."

ortho_trauma_major_007:
  operation: "Right hemiarthroplasty converted to total hip replacement"
  description: "75-year-old man with a displaced right intracapsular fracture after a fall off a ladder. Active and drives."
  implants: "Exeter V40 stem size 2 44 mm, 32 mm head; Exeter Contemporary cup 50 mm with 10° hood; Palacos R+G x3"
  complications: "Hemiarthroplasty dislocated repeatedly at 70 degrees flexion despite head changes; posterior acetabular wall deficiency found and converted to cemented THR."

ortho_trauma_major_008:
  operation: "Left IM nail femur"
  description: "31-year-old woman, pedestrian in a road traffic collision, closed left femoral shaft fracture with a chest contusion."
  implants: "Stryker T2 femoral nail 10 x 380 mm, static locking"
  complications: "About 30 degrees of internal malrotation noted on post-locking clinical check; distal screws removed, femur derotated and relocked."

ortho_trauma_major_009:
  operation: "Tibial nail R + fasciotomies"
  description: "25-year-old man, motorbike crash, closed segmental right tibial fracture. Compartments soft on admission."
  implants: "Synthes Expert tibial nail 10 x 360 mm, 3 proximal and 3 distal locking screws"
  complications: "Leg tense with high pressures (delta P 18 mmHg) at the end of nailing; four-compartment fasciotomy performed and wounds left open with VAC."

ortho_trauma_major_010:
  operation: "ORIF humeral shaft, posterior approach"
  description: "35-year-old man with a distal-third humeral shaft (Holstein-Lewis) fracture after a skiing fall. Radial nerve intact preop."
  implants: "Synthes 3.5 mm LCP extra-articular distal humerus plate, 9 screws"
  complications: "Radial nerve found trapped under the plate on final inspection with a partial crush; plate removed and re-seated and nerve decompressed, neurapraxia expected."

ortho_trauma_major_011:
  operation: "ORIF pelvis (symphysis plate) + iliosacral screw"
  description: "44-year-old man who fell 6 m onto his side from scaffolding, unstable APC pelvic fracture."
  implants: "Synthes 3.5 mm symphysis plate 6-hole; 7.3 mm iliosacral screw 90 mm"
  complications: "Bladder dome tear found during retropubic dissection; repaired in two layers by urology with a catheter left for 10 days."

ortho_trauma_major_012:
  operation: "ORIF acetabulum anterior intrapelvic (Stoppa) approach"
  description: "63-year-old woman with an anterior column posterior hemitransverse acetabular fracture after a car crash."
  implants: "Stryker Pro Pelvis infrapectineal plate, 3.5 mm screws x 10"
  complications: "Laceration of the external iliac vein during reduction with 2.5 L blood loss; repaired by vascular surgeons and 4 units of red cells transfused."

ortho_trauma_major_013:
  operation: "Percutaneous iliosacral screw fixation, left"
  description: "71-year-old woman with a displaced left sacral fracture after a fall downstairs, unable to mobilise."
  implants: "7.3 mm partially threaded cannulated screw 100 mm with washer"
  complications: "Screw found breaching the S1 foramen on post-placement CT with new L5 weakness; screw removed and redirected, nerve injury documented."

ortho_trauma_major_014:
  operation: "Revision THR for periprosthetic fracture (Vancouver B2)"
  description: "84-year-old man with a loose cemented stem and a displaced fracture of the proximal femur after a fall."
  implants: "Stryker Restoration Modular stem 19 x 195 mm, 36 mm head; 3 Dall-Miles cables"
  complications: "Second fracture of the femoral diaphysis distal to the tip during reaming; bypassed with a longer stem and additional cables."

ortho_trauma_major_015:
  operation: "Distal femoral plating above TKR (periprosthetic)"
  description: "86-year-old woman with a displaced supracondylar fracture above a stable total knee replacement."
  implants: "Zimmer NCB distal femur plate 11-hole, 4 cables proximally, 7 locking screws"
  complications: "Major bleeding of 2 L from the femoral wound requiring 3 units of blood and tranexamic acid; source a perforating vessel, ligated."

ortho_trauma_major_016:
  operation: "ORIF left ankle"
  description: "66-year-old man with a bimalleolar left ankle fracture after falling off a garden wall. Diabetic."
  implants: "3.5 mm one-third tubular plate 7-hole, 6 screws; 2 x 4.0 mm cannulated screws"
  complications: "Skin prep and incision begun on the right ankle; error noticed after a 1 cm skin incision, which was closed, and the correct left side then operated; duty of candour followed."

ortho_trauma_major_017:
  operation: "Volar plating distal radius, right"
  description: "60-year-old right-handed woman with a displaced right distal radius fracture after a fall while walking the dog."
  implants: "Synthes 2.4 mm VA-LCP volar rim plate, 8 locking screws"
  complications: "Final count one small swab short; not found on search or X-ray in theatre, reported as a retained item incident and patient informed."

ortho_trauma_major_018:
  operation: "Retrograde femoral nail right + ORIF patella"
  description: "38-year-old woman in a car crash with an ipsilateral distal femoral and patellar fracture ('floating knee' variant)."
  implants: "Stryker T2 SCN retrograde nail 11 x 280 mm, 4 locking screws; patella 2 cannulated screws with tension band"
  complications: "Nail found proud in the intercondylar notch by 4 mm on final lateral; not accepted, nail exchanged for a shorter length and seated below cartilage."

ortho_trauma_major_019:
  operation: "Open reduction and plate fixation of clavicle, right"
  description: "45-year-old man with a comminuted, displaced right clavicle fracture after a cycling crash."
  implants: "Synthes superior anterior clavicle plate 8-hole, 8 screws"
  complications: "Pulsatile bleeding after inferior drilling suggested subclavian vein injury; packed, vascular surgeons attended and repaired via a supraclavicular approach, 1.5 L blood loss."

ortho_trauma_major_020:
  operation: "Removal of broken tibial nail and exchange nailing"
  description: "40-year-old man with a hypertrophic tibial non-union and fatigue failure of the nail at the distal locking hole."
  implants: "Stryker T2 tibial nail 11 x 345 mm, 2 proximal and 2 distal locking screws"
  complications: "Distal fragment of the broken nail could not be retrieved with hooks; window made in the distal tibia to remove it, then exchange nailing completed."

ortho_trauma_major_021:
  operation: "Anterior pelvic external fixator + laparotomy (joint case)"
  description: "27-year-old woman, fall from a bridge, unstable pelvic fracture and splenic injury. Haemodynamically unstable on arrival."
  complications: "Anaphylaxis to teicoplanin with bronchospasm and hypotension; treated with adrenaline and fluids, procedure shortened to external fixation only and tryptase sent."

ortho_trauma_major_022:
  operation: "Closed reduction of posterior hip dislocation"
  description: "36-year-old man, driver in a car crash, posterior left hip dislocation with no fracture. Full stomach."
  complications: "Difficult intubation with grade 4 view; failed attempts and desaturation to 70%, rescued with a second-generation supraglottic airway and fibreoptic intubation, then reduction performed."

ortho_trauma_major_023:
  operation: "Distal femoral traction pin + closed reduction of femoral fracture"
  description: "59-year-old man with a femoral shaft fracture, polytrauma, awaiting stabilisation of chest injuries."
  complications: "Pin placement abandoned after a rapidly expanding medial thigh swelling; CT angiogram showed a superficial femoral artery branch injury, embolised by IR and traction applied via a tibial pin."

ortho_trauma_major_024:
  operation: "ORIF distal radius under axillary block"
  description: "52-year-old woman with a displaced intra-articular left distal radius fracture after a fall from a horse."
  implants: "Medartis APTUS 2.5 volar plate, 9 screws"
  complications: "Seizure and bradycardia shortly after the block (local anaesthetic toxicity); treated with midazolam and Intralipid, converted to GA and operation completed."

ortho_trauma_major_025:
  operation: "Bipolar hemiarthroplasty, left, cemented"
  description: "86-year-old woman with Alzheimer's disease and a displaced left intracapsular fracture after a fall at night."
  implants: "CPT stem size 1 cemented (Palacos R+G x2); 28 mm +3.5 head, 45 mm bipolar shell"
  complications: "Bipolar shell disassociated from the inner head on reduction; locking ring found defective, construct exchanged for a new bipolar and reported to MHRA."

ortho_trauma_major_026:
  operation: "Long Gamma nail R femur for pathological fracture"
  description: "69-year-old man with metastatic prostate cancer and a pathological right subtrochanteric fracture."
  implants: "Gamma3 long nail 11 x 400 mm 125°, 95 mm lag screw, 2 distal screws"
  complications: "Sudden drop in end-tidal CO2 with hypotension during reaming, treated as venous air/fat embolism with FiO2 1.0, fluids and vasopressors; unreamed technique used for the rest of the case."

ortho_trauma_major_027:
  operation: "ORIF bicondylar tibial plateau (L) + fibular head osteotomy"
  description: "53-year-old man with a Schatzker V tibial plateau fracture after a fall from a quad bike."
  implants: "Synthes 3.5 mm LCP proximal tibial plate 7-hole lateral + 3.5 mm medial buttress plate, 14 screws"
  complications: "Tourniquet left inflated for 190 minutes during a prolonged reduction; released with rhabdomyolysis precautions and patient observed on HDU."
