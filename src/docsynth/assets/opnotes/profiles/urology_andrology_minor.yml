urology_andrology_minor_001:
  operation: "Right radical inguinal orchidectomy"
  description: "31-year-old man with a solid right testicular mass and raised AFP. Urgent 2WW list."
  complications: "Ilioinguinal nerve found stretched across the cord and at risk; freed, tagged away from the clamp and preserved."

urology_andrology_minor_002:
  operation: "Left inguinal orchidectomy with testicular prosthesis"
  description: "27-year-old man with a left testicular tumour and a raised beta-hCG, asking for a prosthesis. Urgent."
  implants: "Nagor testicular prosthesis, medium"
  complications: "The first prosthesis touched the patient's skin before insertion; it was discarded and a second sterile prosthesis used."

urology_andrology_minor_003:
  operation: "Bilateral subcapsular orchidectomy"
  description: "79-year-old man with metastatic prostate cancer who does not want 3-monthly injections. Day case."
  complications: "Brisk bleeding from a cord vessel after the ligature slipped; the cord was re-clamped and transfixed."

urology_andrology_minor_004:
  operation: "Left orchidopexy"
  description: "13-month-old boy with a left undescended testis in the inguinal canal. Paediatric day case."
  complications: "Small tear in the vas during separation of the hernia sac, a partial-thickness injury repaired with 9-0 nylon under loupes."

urology_andrology_minor_005:
  operation: "Laparoscopic Fowler-Stephens orchidopexy (right)"
  description: "20-month-old boy with an impalpable right testis. Paediatric urology list."
  complications: "Port-site bleeding from an umbilical vessel, controlled with diathermy."

urology_andrology_minor_006:
  operation: "Scrotal exploration and bilateral fixation"
  description: "14-year-old boy with 5 hours of right scrotal pain and a tender, high-riding testis. Emergency."
  complications: "Needle count discrepancy at closure; the needle was found on the floor under the table."

urology_andrology_minor_007:
  operation: "Right hydrocelectomy (Jaboulay)"
  description: "66-year-old man with a large right hydrocele that makes it hard to wear trousers. Day case."
  complications: "Oozing from the everted sac edges, controlled with diathermy and a running haemostatic suture; scrotal support applied."

urology_andrology_minor_008:
  operation: "Excision of left epididymal cyst"
  description: "49-year-old man with a large left epididymal cyst causing a dragging ache. Day case."
  complications: "Cyst ruptured during dissection with clear fluid spilt; the cyst wall was then excised completely."

urology_andrology_minor_009:
  operation: "Microsurgical varicocelectomy, left"
  description: "28-year-old man with a left varicocele and low sperm count. Elective."
  complications: "Operating microscope light failed; switched to a spare microscope after a 20-minute delay."

urology_andrology_minor_010:
  operation: "Bilateral vasectomy under local"
  description: "37-year-old man with a completed family, counselled and consented. Outpatient under local."
  complications: "Vasovagal collapse during the second side with a short loss of consciousness; recovered flat and the procedure was completed."

urology_andrology_minor_011:
  operation: "No-scalpel vasectomy"
  description: "43-year-old man wanting sterilisation after the birth of his fourth child. Clinic."
  complications: "Left vas could not be delivered through the puncture; a second small incision was made and the vasectomy completed."

urology_andrology_minor_012:
  operation: "Vasectomy under GA"
  description: "32-year-old man with a very tight scrotum and needle phobia. Day case."
  complications: "Rash and flushing after cefuroxime, settled with chlorphenamine; no airway or blood pressure problem."

urology_andrology_minor_013:
  operation: "Microsurgical vasovasostomy (bilateral)"
  description: "44-year-old man wanting to start a family with his new partner. Elective."
  complications: "Tension on the right anastomosis needed extra mobilisation of the convoluted vas; anastomosis redone without tension."

urology_andrology_minor_014:
  operation: "Circumcision (paediatric)"
  description: "4-year-old boy with balanitis xerotica obliterans and a scarred foreskin. Day case."
  complications: "Frenular artery bleeding after release of the tourniquet; ligated with 5-0 Vicryl Rapide."

urology_andrology_minor_015:
  operation: "Adult circumcision under LA"
  description: "52-year-old man with phimosis, type 2 diabetes and recurrent balanitis. Day case."
  complications: "Local anaesthetic mixed with adrenaline drawn up in error but noticed before injection; replaced with plain lidocaine."

urology_andrology_minor_016:
  operation: "Circumcision + frenuloplasty"
  description: "24-year-old man with a tight foreskin and short frenulum. Day case."
  complications: "Diathermy plate not fully in contact, causing a small burn mark on the thigh noticed at the end; dressed, Datix completed."

urology_andrology_minor_017:
  operation: "Inflatable penile prosthesis (AMS 700 LGX)"
  description: "64-year-old man with erectile dysfunction refractory to medication. Elective."
  implants: "AMS 700 LGX 18 cm cylinders, 2 cm RTE, 100 ml reservoir"
  complications: "Proximal corporal perforation during dilation on the right; the cylinder was seated against a windsock of Prolene and the case completed."

urology_andrology_minor_018:
  operation: "Coloplast Titan penile prosthesis"
  description: "58-year-old man with diabetic erectile dysfunction not helped by tablets or injections. Elective."
  implants: "Coloplast Titan 18 cm cylinders, 1 cm RTE, 75 ml reservoir"
  complications: "Reservoir tubing kinked on the cycling test; repositioned and the device worked well."

urology_andrology_minor_019:
  operation: "Nesbit procedure"
  description: "60-year-old man with Peyronie's disease and a 60-degree ventral curvature. Elective."
  complications: "Buck's fascia bleeding from a dorsal vein during mobilisation; ligated and the neurovascular bundle kept intact."

urology_andrology_minor_020:
  operation: "Distal hypospadias repair (TIP)"
  description: "18-month-old boy with coronal hypospadias. Paediatric urology list."
  complications: "Tourniquet time went beyond 45 minutes, the planned limit; released for reperfusion and reapplied to finish."

urology_andrology_minor_021:
  operation: "Repair of penile fracture"
  description: "42-year-old man with a fractured penis after intercourse. Emergency."
  complications: "Partial urethral tear found; repaired over a catheter in two layers."
