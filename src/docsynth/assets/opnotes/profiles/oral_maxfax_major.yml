oral_maxfax_major_001:
  operation: "Bilateral sagittal split osteotomy (advancement)"
  description: "18-year-old woman with mandibular retrognathia and a class II occlusion after pre-surgical orthodontics. Elective."
  implants: "KLS Martin 2.0 mm plates x2 plus additional 2.0 mm 6-hole plate and three bicortical screws on the right"
  complications: "Unfavourable (bad) split of the right mandible with a buccal plate fracture; fragments reduced and fixed with an additional plate and bicortical screws."

oral_maxfax_major_002:
  operation: "BSSO setback"
  description: "28-year-old man with a class III occlusion and mandibular prognathism. Elective."
  implants: "Synthes 2.0 mm orthognathic plates bilaterally"
  complications: "Left inferior alveolar nerve transected during the split; primary epineural repair performed under the microscope and the patient to be counselled."

oral_maxfax_major_003:
  operation: "Le Fort I osteotomy and advancement"
  description: "19-year-old man with a repaired unilateral cleft and severe maxillary hypoplasia. Elective."
  implants: "KLS Martin Le Fort I plates x4"
  complications: "Heavy bleeding from the pterygoid venous plexus at pterygomaxillary disjunction with estimated loss of 1.6 litres; packed, tranexamic acid and two units of blood given."

oral_maxfax_major_004:
  operation: "Surgical removal of LL8 and ORIF left mandibular angle"
  description: "64-year-old man with a deeply impacted, symptomatic lower left wisdom tooth in an atrophic mandible. Elective GA."
  implants: "Synthes 2.0 mm 4-hole miniplate at the external oblique ridge, 2.4 mm locking reconstruction plate at the lower border"
  complications: "Iatrogenic fracture of the left mandibular angle during tooth delivery; reduced and fixed with plates through a transbuccal approach."

oral_maxfax_major_005:
  operation: "Dental extractions under GA"
  description: "7-year-old girl with carious lower first permanent molars and primary teeth, planned for LL6 and LR6 extraction."
  complications: "Healthy LL7 extracted in error instead of the LL6; recognised immediately, tooth reimplanted and splinted, LL6 then extracted, and duty of candour discussion held."

oral_maxfax_major_006:
  operation: "Left total TMJ replacement (custom)"
  description: "51-year-old woman with bony ankylosis of the left TMJ and mouth opening of 8 mm. Elective, custom prosthesis."
  implants: "TMJ Concepts custom fossa and mandibular components, left"
  complications: "Perforation of the glenoid fossa into the middle cranial fossa during ankylosis resection with a CSF leak; dura sealed with a temporalis fascia graft and neurosurgical review."

oral_maxfax_major_007:
  operation: "Right TMJ gap arthroplasty and total joint replacement"
  description: "39-year-old man with post-traumatic right TMJ ankylosis, heterotopic bone around the joint. Elective."
  implants: "Zimmer Biomet stock fossa medium, condyle 50 mm"
  complications: "Arterial bleeding from the internal maxillary artery during medial condylar resection; packed and controlled, then urgent embolisation by interventional radiology."

oral_maxfax_major_008:
  operation: "Left partial glossectomy + SND"
  description: "70-year-old woman with a T2 left lateral tongue SCC. Elective head and neck list."
  complications: "Throat pack found still in the oropharynx after the swab count had been signed off, discovered at laryngoscopy before extubation; removed and incident reported."

oral_maxfax_major_009:
  operation: "Hemiglossectomy, neck dissection and ALT flap with emergency tracheostomy"
  description: "58-year-old man with a bulky T3 right tongue carcinoma and reduced mouth opening. Elective; awake fibreoptic intubation planned."
  implants: "Synovis GEM coupler 3.0 mm"
  complications: "Failed awake fibreoptic intubation with bleeding from the tumour and desaturation; emergency surgical tracheostomy under local anaesthetic, then resection completed."

oral_maxfax_major_010:
  operation: "Bimaxillary osteotomy with re-plating of both mandibular segments"
  description: "26-year-old woman with a class II open bite deformity. Elective, virtual surgical planning."
  implants: "KLS Martin Le Fort I plates x4; 2.0 mm BSSO plates bilateral (re-sited)"
  complications: "Condylar sag with the condyles out of the fossa causing a malocclusion on release of IMF; mandibular plates removed, condyles seated and segments re-plated."

oral_maxfax_major_011:
  operation: "Right total TMJ replacement (stock)"
  description: "67-year-old woman with osteoporosis and end-stage TMJ degenerative disease. Elective."
  implants: "Zimmer Biomet fossa component medium; condylar component 55 mm, extra screws"
  complications: "Fracture of the thin posterior ramus through the screw holes while fixing the condylar component; component changed to a longer size and fixed with additional screws below the fracture."
