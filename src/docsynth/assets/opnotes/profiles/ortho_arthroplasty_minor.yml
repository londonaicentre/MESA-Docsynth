ortho_arthroplasty_minor_001:
  operation: "Uncemented right THR, posterior approach"
  description: "66-year-old woman with right hip osteoarthritis and osteopenia on DEXA."
  implants: "Corail KA size 11; Pinnacle 52 mm cup, Marathon liner; 32 mm Biolox Delta head; 1 x Dall-Miles cable"
  complications: "Undisplaced calcar crack on final broach; cerclage cable passed and the same size stem seated with good stability."

ortho_arthroplasty_minor_002:
  operation: "Left TKR (Triathlon PS)"
  description: "74-year-old man with bilateral knee OA, left worse, and peripheral vascular disease with palpable pulses."
  implants: "Triathlon PS femur 6, tibia 6, 13 mm insert, 35 mm patella; Simplex P x2"
  complications: "Tourniquet would not hold pressure after inflation; cuff and tubing exchanged, re-inflated and procedure completed."

ortho_arthroplasty_minor_003:
  operation: "Robotic (MAKO) right total knee replacement"
  description: "60-year-old female dental nurse with right knee valgus OA and a fixed flexion deformity."
  implants: "Triathlon CR femur 3, tibia 3, 9 mm CS insert; Simplex cement"
  complications: "Femoral array loosened after bone registration; pins reinserted, registration repeated and robotic cuts completed."

ortho_arthroplasty_minor_004:
  operation: "Left THR, anterolateral approach"
  description: "58-year-old man with left hip OA and a previous right hip replacement that works well."
  implants: "Polarstem size 5 high offset; R3 54 mm cup, XLPE 36 mm liner; 36 mm Oxinium head"
  complications: "Acetabular trial sat too vertical on image intensifier; re-reamed and final cup inserted at 42 degrees inclination."

ortho_arthroplasty_minor_005:
  operation: "Cemented THR, right (Exeter/Contemporary)"
  description: "86-year-old woman with a painful right hip from OA, on antihypertensives."
  implants: "Exeter V40 no.1 37.5 mm offset; Contemporary 46 mm cup; 28 mm head; Palacos R+G x2"
  complications: "Hypotension to 70 systolic after spinal anaesthetic, responded to metaraminol and fluids before incision."

ortho_arthroplasty_minor_006:
  operation: "Right total knee arthroplasty (Attune)"
  description: "79-year-old man with severe right knee OA and chronic kidney disease stage 3."
  implants: "Attune CR femur 7, tibia 7, 7 mm insert; SmartSet GHV x2"
  complications: "Transient drop in oxygen saturations to 90% on cement pressurisation, settled with increased oxygen; tourniquet released uneventfully."

ortho_arthroplasty_minor_007:
  operation: "Reverse TSR left (Delta Xtend)"
  description: "81-year-old female with cuff tear arthropathy of the left shoulder and night pain."
  implants: "Delta Xtend 38 mm glenosphere, metaglene with 4 screws (inferior screw 42 mm rescue), cemented size 10 stem, +3 poly"
  complications: "Inferior locking screw stripped on tightening; replaced with a larger-diameter rescue screw with good purchase."

ortho_arthroplasty_minor_008:
  operation: "Oxford medial UKR, left"
  description: "63-year-old man with anteromedial OA of the left knee, ACL intact."
  implants: "Oxford Partial Knee medium femur, size C tibia, 5 mm bearing"
  complications: "4 mm trial bearing dislocated on flexion; gaps rebalanced and 5 mm bearing used, stable through full range."

ortho_arthroplasty_minor_009:
  operation: "Hip resurfacing, right (BHR)"
  description: "52-year-old woman, keen tennis player, with right hip OA and a large femoral head on templating."
  implants: "BHR 48 mm femoral component, 54 mm cup"
  complications: "Femoral guide pin placed in varus on checking with stylus; removed and re-sited in neutral before reaming."

ortho_arthroplasty_minor_010:
  operation: "Revision left THR (cup only)"
  description: "73-year-old woman with a loose uncemented cup and pelvic osteolysis, left hip."
  implants: "Trident Tritanium 58 mm revision shell with 3 screws; X3 36 mm liner; 36 mm Biolox head; allograft chips"
  complications: "Brisk bleeding from a branch of the superior gluteal artery during exposure, controlled with clips and diathermy."

ortho_arthroplasty_minor_011:
  operation: "Total ankle replacement, right (Infinity)"
  description: "65-year-old man with right ankle OA after a childhood ankle fracture, neutral alignment."
  implants: "Infinity talus size 4, tibia 4 long, 6 mm poly; 1 x 4.0 mm cannulated screw medial malleolus"
  complications: "Medial malleolus cracked on tibial resection; stabilised with a prophylactic cannulated screw and implant seated."

ortho_arthroplasty_minor_012:
  operation: "Trapeziectomy + FCR sling suspension, right"
  description: "58-year-old female hairdresser with painful basal thumb OA of the dominant right hand."
  complications: "Small branch of the superficial radial nerve divided in the approach; repaired primarily under loupes."

ortho_arthroplasty_minor_013:
  operation: "Left cemented TKR"
  description: "70-year-old woman with left knee OA and obesity (BMI 38)."
  implants: "Persona PS femur 6, tibia F, 11 mm insert; Palacos R+G x2"
  complications: "Swab count discrepancy of one at closure; swab found in the kick bucket on recount and closure completed."

ortho_arthroplasty_minor_014:
  operation: "Anatomic TSR, right, deltopectoral approach"
  description: "68-year-old man with right glenohumeral osteoarthritis, rotator cuff intact on ultrasound."
  implants: "Stryker Tornier Perform 48 mm head, stemless; cemented pegged glenoid medium"
  complications: "Humeral head trial dropped on the floor; set replaced from the sterile store and the case continued."

ortho_arthroplasty_minor_015:
  operation: "Primary right TKR (NexGen)"
  description: "75-year-old man with varus knee OA, walking limited to 50 metres."
  implants: "NexGen CR-Flex femur E, tibia 5, 12 mm insert; Palacos cement"
  complications: "Size F femoral component opened instead of size E; picked up at the implant check before cementing and the correct size used."

ortho_arthroplasty_minor_016:
  operation: "Second stage revision R TKR"
  description: "68-year-old man with a static cement spacer in the right knee for periprosthetic infection; cultures now negative."
  implants: "Legion revision femur 6 with stem, tibia 6 with 120 mm stem, 18 mm constrained insert; Copal G+C x4"
  complications: "Core temperature fell to 35.1 degrees during a long case; active warming increased and temperature normalised by closure."

ortho_arthroplasty_minor_017:
  operation: "Right medial unicompartmental knee replacement (fixed bearing)"
  description: "69-year-old woman with medial compartment OA, right knee."
  implants: "Persona Partial Knee femur 4, tibia 3, 9 mm insert; cemented"
  complications: "Superficial MCL nicked by the saw blade; repaired with sutures, knee stable to valgus stress and implants unchanged."

ortho_arthroplasty_minor_018:
  operation: "Left THR, cemented dual mobility"
  description: "77-year-old woman with rheumatoid arthritis and left hip destruction."
  implants: "Exeter V40 no.2 44 mm offset; Avantage 51 mm cup; Palacos R+G x2"
  complications: "Urticarial rash across the chest after chlorhexidine skin prep without haemodynamic change; chlorphenamine given and skin re-prepped with povidone iodine."

ortho_arthroplasty_minor_019:
  operation: "Proximal femoral replacement (R) for metastatic breast cancer"
  description: "59-year-old woman with a destructive right peritrochanteric breast metastasis at risk of fracture."
  implants: "GMRS proximal femur 100 mm, bipolar head 46 mm; Palacos R+G x2; Trevira tube"
  complications: "Persistent ooze from the tumour bed after resection; controlled with Floseal and packing, no transfusion needed."

ortho_arthroplasty_minor_020:
  operation: "Revision TKR, left, tibial component"
  description: "71-year-old woman with a loose tibial component of her left knee replacement, infection screen negative."
  implants: "Triathlon TS tibia 5 with 100 mm stem, 10 mm lateral augment; 13 mm insert; Simplex x2"
  complications: "Tibial osteotome broke on cement removal; all fragments retrieved and confirmed on image intensifier."

ortho_arthroplasty_minor_021:
  operation: "Bilateral trapeziectomies"
  description: "66-year-old woman with bilateral symptomatic thumb base arthritis, keen to have both done together."
  complications: "Tourniquet time on the second side exceeded 2 hours because of a delay in changeover; deflated for 15 minutes before re-inflation."

ortho_arthroplasty_minor_022:
  operation: "Uncemented THR left (MAKO)"
  description: "54-year-old man with left hip arthritis secondary to DDH."
  implants: "Accolade II size 5; Trident II 56 mm with 2 screws; X3 36 mm liner; 36 mm Biolox Delta head -2.5"
  complications: "Trial leg length 11 mm long on robotic check; changed to a -2.5 mm head, final lengthening 4 mm."

ortho_arthroplasty_minor_023:
  operation: "Right THR, ceramic-on-ceramic"
  description: "47-year-old woman with right hip OA secondary to Perthes disease."
  implants: "Corail KA 10; Pinnacle 50 mm cup; Biolox Delta ceramic liner 32 mm (second liner); 32 mm Biolox Delta head"
  complications: "Ceramic liner chipped at the rim on seating; removed and a new liner inserted without damage to the shell."

ortho_arthroplasty_minor_024:
  operation: "Reverse shoulder replacement, right"
  description: "76-year-old woman with a massive rotator cuff tear and anterosuperior escape of the right shoulder."
  implants: "Aequalis Ascend Flex 39 mm glenosphere, 25 mm baseplate, stem size 3, +6 mm insert"
  complications: "Shoulder dislocated anteriorly on trial reduction; polyethylene thickness increased and stable through full range."

ortho_arthroplasty_minor_025:
  operation: "Total elbow replacement, right (Latitude)"
  description: "69-year-old woman with rheumatoid arthritis and severe right elbow destruction."
  implants: "Tornier Latitude EV, humeral size 3, ulnar size 2, linked; Palacos cement"
  complications: "Cefazolin prophylaxis not given before tourniquet inflation; given 10 minutes after knife-to-skin once noted, Datix submitted."
