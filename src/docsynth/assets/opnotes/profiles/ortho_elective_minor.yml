ortho_elective_minor_001:
  operation: "Right knee arthroscopy, partial medial meniscectomy"
  description: "56-year-old female shop worker with a painful catching right knee and a medial meniscal flap tear."
  complications: "Shaver handpiece stopped working mid-case; replacement console and handpiece brought in and the meniscectomy completed."

ortho_elective_minor_002:
  operation: "Arthroscopic ACL reconstruction (hamstrings), left knee"
  description: "20-year-old male basketball player with a left ACL rupture and instability on pivoting."
  implants: "Arthrex TightRope RT; 8 mm BioComposite interference screw"
  complications: "Semitendinosus cut short by the harvester; gracilis added to form an 8.5 mm graft and the reconstruction completed."

ortho_elective_minor_003:
  operation: "ACLR (BTB), right"
  description: "26-year-old female hockey player with a right ACL rupture and recurrent giving way."
  implants: "Arthrex FiberTag TightRope femoral; 9 x 25 mm titanium interference screw"
  complications: "Posterior wall of the femoral tunnel blew out on drilling; fixation changed from interference screw to a cortical suspensory button."

ortho_elective_minor_004:
  operation: "ACL reconstruction L + medial meniscal repair"
  description: "18-year-old male footballer with a left ACL rupture and a medial meniscal ramp lesion on MRI."
  implants: "TightRope RT; 9 mm interference screw; FAST-FIX 360 x3"
  complications: "Femoral button seen not flipped on image intensifier with soft tissue interposed; re-tensioned and deployed on the cortex."

ortho_elective_minor_005:
  operation: "Arthroscopic Bankart repair, left"
  description: "19-year-old male rugby union player with recurrent left anterior dislocations."
  implants: "Arthrex SutureTak x4"
  complications: "Middle anchor pulled out of soft glenoid bone on tensioning; removed and a new anchor placed 3 mm away."

ortho_elective_minor_006:
  operation: "Arthroscopic subacromial decompression, left shoulder"
  description: "57-year-old male plumber with left shoulder impingement not settling after two injections."
  complications: "Brisk bleeding from the acromial branch of the thoracoacromial artery obscured the view; controlled with radiofrequency and raised pump pressure."

ortho_elective_minor_007:
  operation: "ASAD + ACJ excision (R), beach chair"
  description: "62-year-old woman with right shoulder impingement and ACJ arthritis, on amlodipine."
  complications: "Systolic blood pressure fell to 75 mmHg after positioning in beach chair; treated with metaraminol and the head lowered."

ortho_elective_minor_008:
  operation: "Arthroscopic rotator cuff repair + SAD, right"
  description: "66-year-old man with a traumatic full-thickness right supraspinatus tear. Interscalene block and GA."
  implants: "2 x 5.5 mm Healix Advance anchors; 2 x 4.75 mm SwiveLock"
  complications: "Desaturation after interscalene block; small apical pneumothorax on on-table chest X-ray managed with oxygen, no drain needed."

ortho_elective_minor_009:
  operation: "Scarf osteotomy + Akin, left hallux valgus"
  description: "49-year-old woman with a painful left bunion and lesser toe crowding."
  implants: "2 x 2.5 mm headless screws + 1 x 2.0 mm screw (scarf); 1 x staple (Akin)"
  complications: "Dorsal fragment fractured at the proximal cut on translation; fixed with an additional 2.0 mm screw."

ortho_elective_minor_010:
  operation: "Opening wedge HTO (TomoFix), right knee"
  description: "46-year-old male gamekeeper with right medial compartment OA and 8 degrees of varus."
  implants: "TomoFix medial HTO plate; 1 x extra lateral hinge 3.5 mm screw"
  complications: "Undisplaced lateral hinge crack seen on opening; stabilised by the plate and an additional screw, correction maintained."

ortho_elective_minor_011:
  operation: "Hip arthroscopy + cam resection (L)"
  description: "32-year-old female dancer with left hip FAI and groin pain on flexion."
  complications: "Femoral head cartilage scuffed during portal placement; small area only, debrided smooth and procedure completed."

ortho_elective_minor_012:
  operation: "Knee arthroscopy + all-inside meniscal repair, left"
  description: "17-year-old boy, rugby player, with a longitudinal tear of the left lateral meniscus."
  implants: "FAST-FIX 360 x3"
  complications: "One FAST-FIX implant broke on deployment; loose fragment retrieved with a grasper and a new device placed."

ortho_elective_minor_013:
  operation: "Open reduction and fixation of OCD fragment, left knee"
  description: "14-year-old boy with an unstable OCD fragment of the left medial femoral condyle."
  implants: "3 x Arthrex bio-compression screws"
  complications: "One screw head left proud of the articular surface; countersunk further under direct vision."

ortho_elective_minor_014:
  operation: "Arthroscopic ankle arthrodesis, left"
  description: "70-year-old man with end-stage left ankle arthritis and diabetes."
  implants: "3 x 7.0 mm cannulated screws"
  complications: "Guidewire broke on advancing through the talus; fragment removed through a small incision under image intensifier."

ortho_elective_minor_015:
  operation: "1st MTPJ arthrodesis, right"
  description: "60-year-old woman with hallux rigidus and failed conservative treatment, right."
  implants: "Dorsal locking plate (Wright Ortholoc) + 1 x 3.5 mm lag screw"
  complications: "Needle count short by one at closure; needle found on the floor under the table and confirmed on recount."

ortho_elective_minor_016:
  operation: "Brostrom repair, right ankle, + arthroscopy"
  description: "22-year-old female dancer with chronic lateral ankle instability, right."
  implants: "2 x 3.0 mm Mini-Mitek anchors"
  complications: "Thigh tourniquet deflated unexpectedly after 40 minutes; re-inflated after limb re-exsanguination and repair completed."

ortho_elective_minor_017:
  operation: "Curettage + bone grafting enchondroma, little finger metacarpal (L)"
  description: "31-year-old man with an expanding enchondroma of the left little finger metacarpal."
  implants: "Allograft cancellous chips"
  complications: "Thin volar cortex cracked on curettage; stable, treated with a splint and no fixation needed."

ortho_elective_minor_018:
  operation: "Curettage and bone graft substitute, unicameral bone cyst, L proximal femur"
  description: "9-year-old girl with a large proximal femoral unicameral bone cyst."
  implants: "Cerament BVF 10 ml"
  complications: "Bone graft substitute leaked into the hip joint on screening; injection stopped and the joint irrigated through a small arthrotomy."

ortho_elective_minor_019:
  operation: "Arthroscopic synovectomy right knee"
  description: "36-year-old woman with rheumatoid knee synovitis resistant to intra-articular steroid."
  complications: "Bleeding from the superior lateral geniculate artery at the lateral gutter; coagulated with the radiofrequency wand."

ortho_elective_minor_020:
  operation: "Arthroscopic washout, right knee (septic)"
  description: "44-year-old man with septic arthritis of the right knee, Staph aureus on aspiration."
  complications: "Inflow cannula slipped out of the joint, causing fluid extravasation into the thigh; repositioned, thigh compartments checked and soft."

ortho_elective_minor_021:
  operation: "MUA right knee"
  description: "71-year-old woman with a stiff right total knee replacement, flexion to 75 degrees."
  complications: "Bradycardia to 38 on forced flexion, responded to atropine; manipulation completed to 110 degrees."

ortho_elective_minor_022:
  operation: "Hip aspiration under GA, left (image guided)"
  description: "6-year-old boy with a limp and left hip pain; ultrasound shows a small effusion."
  complications: "Dry tap on two passes; arthrogram confirmed intra-articular needle position and saline lavage sent for culture instead."

ortho_elective_minor_023:
  operation: "Lateral ankle ligament reconstruction (InternalBrace), left"
  description: "30-year-old man, rugby player, with recurrent inversion instability of the left ankle."
  implants: "Arthrex InternalBrace, 2 x 3.5 mm SwiveLock"
  complications: "Drill bit broke in the fibula; fragment retrieved under image intensifier and a new drill hole made."

ortho_elective_minor_024:
  operation: "Wrist fusion, right"
  description: "55-year-old man with post-traumatic radiocarpal arthritis and a painful right wrist."
  implants: "Synthes 2.4/2.7 wrist fusion plate"
  complications: "Contaminated glove puncture of the scrub nurse noticed during plating; gloves changed and field re-draped."

ortho_elective_minor_025:
  operation: "Open Latarjet (R)"
  description: "24-year-old male boxer with recurrent right anterior instability and bone loss."
  implants: "2 x 3.5 mm Latarjet screws, 1 x washer"
  complications: "Coracoid graft cracked on drilling the second hole; fixed with one screw and a washer with good compression."

ortho_elective_minor_026:
  operation: "Injection of right hip under image intensifier"
  description: "63-year-old woman with right hip OA; diagnostic and therapeutic injection."
  complications: "Local anaesthetic drawn up at the wrong concentration, picked up at the pre-injection check; discarded and correct drug drawn up."

ortho_elective_minor_027:
  operation: "Arthroscopic washout, left knee, in a child"
  description: "4-year-old boy with a swollen, hot left knee and fever. Emergency paediatric list."
  complications: "Laryngospasm at extubation with desaturation to 80%; resolved with CPAP and propofol."

ortho_elective_minor_028:
  operation: "Knee arthroscopy + debridement, left"
  description: "48-year-old man with mechanical symptoms and an unstable chondral flap of the left medial femoral condyle."
  complications: "Portal skin burn from the radiofrequency probe noted at the end; dressed and plastics advice not needed."

ortho_elective_minor_029:
  operation: "Periacetabular osteotomy, right"
  description: "20-year-old woman with right symptomatic acetabular dysplasia and a high-demand lifestyle."
  implants: "3 x 4.5 mm cortical screws"
  complications: "Branch of the lateral femoral cutaneous nerve divided in the approach; ends buried in muscle."

ortho_elective_minor_030:
  operation: "Arthroscopic MUA + capsular release, right shoulder"
  description: "53-year-old woman with refractory adhesive capsulitis of the right shoulder."
  complications: "Transient hypotension and bradycardia on positioning in beach chair (vasovagal); treated with glycopyrronium and the case continued."

ortho_elective_minor_031:
  operation: "Arthroscopic partial lateral meniscectomy (L) + removal of loose body"
  description: "61-year-old man with left knee locking and a loose body on radiographs."
  complications: "Cefuroxime given despite a documented mild penicillin allergy; noticed after the dose, observed with no reaction and Datix completed."

ortho_elective_minor_032:
  operation: "Hip arthroscopy + labral repair (R)"
  description: "27-year-old man with right pincer impingement and a labral tear."
  implants: "3 x 1.4 mm Q-FIX anchors"
  complications: "Arthroscope light source failed; replacement stack brought in and the procedure completed after a 15-minute delay."
