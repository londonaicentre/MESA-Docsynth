thoracic_major_001:
  operation: "Right video-assisted thoracoscopic upper lobectomy, converted to thoracotomy"
  description: "68-year-old woman with a right upper lobe adenocarcinoma, 3.2 cm, N0 on staging. Elective."
  complications: "Tear of the truncus anterior branch of the pulmonary artery with major bleeding; sponge-stick pressure, conversion to thoracotomy, proximal control and repair with 5/0 Prolene; 3 units transfused."

thoracic_major_002:
  operation: "Left pneumonectomy"
  description: "65-year-old man with a central left hilar tumour extending to the inferior pulmonary vein. Elective."
  complications: "Tear of the left atrium at the inferior pulmonary vein origin with major bleeding; clamped and repaired with pledgeted Prolene, 4 units of blood transfused."

thoracic_major_003:
  operation: "Cervical mediastinoscopy converted to median sternotomy"
  description: "71-year-old man with a left upper lobe tumour and bulky right paratracheal lymphadenopathy. Staging."
  implants: "Sternal wires x6"
  complications: "Injury to the innominate artery during biopsy at station 4R with torrential bleeding; packed, emergency sternotomy and repair, 5 units transfused."

thoracic_major_004:
  operation: "Mediastinoscopy and biopsy of station 4L"
  description: "55-year-old woman with a left upper lobe mass and a PET-avid left paratracheal node. Elective staging."
  complications: "Left recurrent laryngeal nerve divided during 4L node biopsy; recognised on table and ENT informed for early vocal cord assessment."

thoracic_major_005:
  operation: "Median sternotomy and extended thymectomy"
  description: "46-year-old woman with a 6 cm thymoma adherent to the left brachiocephalic vein on MRI. Elective."
  implants: "Sternal wires x7"
  complications: "Laceration of the left brachiocephalic vein during tumour dissection with brisk bleeding; repaired with 5/0 Prolene, 2 units transfused."

thoracic_major_006:
  operation: "VATS right lower lobectomy with mediastinal lymphadenectomy"
  description: "62-year-old man with a right lower lobe squamous carcinoma and bulky subcarinal nodes after induction chemotherapy."
  complications: "Full-thickness injury to the oesophagus during subcarinal node dissection; repaired in two layers with upper GI surgeons and buttressed with an intercostal muscle flap."

thoracic_major_007:
  operation: "Right chest drain insertion"
  description: "79-year-old man with a right pleural effusion and heart failure, breathless on the medical ward."
  complications: "Drain inserted too low into the liver, recognised by blood-stained output; left clamped in situ and removed later under IR and surgical cover."

thoracic_major_008:
  operation: "Left intercostal chest drain insertion"
  description: "58-year-old woman with a large right-sided malignant effusion from ovarian cancer. Ward procedure."
  complications: "Skin incision started on the left chest, the wrong side; recognised before pleural entry, wound closed, incident reported and the drain then placed on the right."

thoracic_major_009:
  operation: "Rigid bronchoscopy and debulking of tracheal tumour"
  description: "74-year-old man with a haemorrhagic tumour in the distal trachea and near-total occlusion of the left main bronchus. Urgent."
  complications: "Massive haemorrhage from the tumour bed with loss of oxygenation and PEA arrest; ROSC after 6 minutes of CPR, bleeding controlled with adrenaline-soaked packs and argon plasma coagulation."

thoracic_major_010:
  operation: "VATS left upper lobectomy converted to thoracotomy"
  description: "70-year-old woman with a left upper lobe adenocarcinoma and COPD. Elective."
  complications: "Unanticipated difficult intubation; double-lumen tube could not be placed and a bronchial blocker was used, with poor isolation forcing conversion to thoracotomy."

thoracic_major_011:
  operation: "VATS wedge resection (abandoned)"
  description: "53-year-old man with a 1.5 cm right upper lobe nodule, previous smoker. Diagnostic wedge planned."
  complications: "Anaphylaxis to rocuronium at induction with bronchospasm and hypotension, treated with adrenaline; procedure abandoned."

thoracic_major_012:
  operation: "Left thoracotomy, open and close"
  description: "59-year-old man with a large left upper lobe tumour abutting the aortic arch on CT. Elective, planned lobectomy."
  complications: "Tumour found to invade the aortic adventitia and subclavian artery, unresectable; procedure abandoned after biopsy."

thoracic_major_013:
  operation: "Right pneumonectomy via thoracotomy"
  description: "63-year-old man with a right hilar squamous carcinoma involving the upper lobe and bronchus intermedius. Elective."
  complications: "Closing count incorrect and chest X-ray on table showed a retained swab in the posterior costophrenic recess; chest reopened and swab removed."

thoracic_major_014:
  operation: "Open decortication (left) for chronic empyema"
  description: "48-year-old man with chronic left empyema and a thick cortex, poorly controlled diabetes. Urgent."
  complications: "Major bleeding from the chest wall and lung surface after peel removal, around 2.5 litres; 4 units red cells and FFP given, packs and argon beam used."

thoracic_major_015:
  operation: "VATS right lower lobectomy, converted to open"
  description: "67-year-old woman with a right lower lobe adenocarcinoma, 2.5 cm, N0. Elective."
  complications: "Vascular stapler misfired across the inferior pulmonary vein causing bleeding; controlled with pressure, converted to thoracotomy and the vein oversewn."

thoracic_major_016:
  operation: "Nuss procedure with emergency median sternotomy"
  description: "16-year-old boy with severe pectus excavatum, Haller index 6.2, and a displaced heart. Elective."
  implants: "Biomet Pectus bar 13 inch with stabiliser; sternal wires x5"
  complications: "Right ventricular perforation by the introducer during bar passage; emergency sternotomy and repair with pledgeted sutures by the cardiac team, 3 units transfused."

thoracic_major_017:
  operation: "Robotic left S6 segmentectomy converted to left lower lobectomy"
  description: "69-year-old man with a 1.7 cm superior segment adenocarcinoma, borderline lung function. Elective."
  complications: "Basal segmental artery divided in error instead of the A6 branch; completion lower lobectomy was needed."

thoracic_major_018:
  operation: "Left pneumonectomy"
  description: "72-year-old man with a central left squamous carcinoma involving the main pulmonary artery. Elective."
  complications: "Proximal pulmonary artery tore behind the clamp with uncontrollable bleeding despite pericardial opening; cardiac arrest and death on the table."

thoracic_major_019:
  operation: "VATS wedge resection of left upper lobe nodule"
  description: "60-year-old woman with a 1 cm left upper lobe nodule and a previous colon cancer. Elective."
  complications: "Sudden ST elevation and hypotension from suspected systemic air embolism; Trendelenburg, 100% oxygen and vasopressors, resolved and case completed."

thoracic_major_020:
  operation: "Right VATS lobectomy (RML)"
  description: "65-year-old man with emphysema and a right middle lobe carcinoid. Elective."
  complications: "Left tension pneumothorax during one-lung ventilation with cardiovascular collapse; needle decompression and left chest drain, case completed."
