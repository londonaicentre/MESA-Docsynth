vascular_minor_001:
  operation: "EVAR (Endurant II) with proximal Palmaz stent"
  description: "76-year-old man with a 6.4 cm AAA and a conical, angulated infrarenal neck. Elective."
  implants: "Medtronic Endurant II bifurcated 32 x 16 x 166 mm, contralateral limb 16 x 13 x 124 mm; Palmaz XL 10 x 40 mm balloon-expandable stent to proximal seal zone"
  complications: "Type Ia endoleak on completion angiogram, treated with a proximal balloon-expandable Palmaz stent with resolution."

vascular_minor_002:
  operation: "Percutaneous EVAR (Gore Excluder)"
  description: "81-year-old woman with a 5.7 cm AAA and moderate aortic stenosis. Elective, local anaesthetic and sedation."
  implants: "Gore Excluder C3 23 mm trunk with 12 mm and 14.5 mm iliac legs"
  complications: "Failure of the right ProGlide closure with groin bleeding; converted to a small cut-down and direct arteriotomy repair."

vascular_minor_003:
  operation: "Open AAA repair, bifurcated Dacron graft"
  description: "68-year-old man with a 6.5 cm AAA extending into both common iliacs. Elective."
  implants: "Vascutek Gelsoft 18 x 9 mm bifurcated graft"
  complications: "Small tear of the left renal vein during neck dissection, oversewn with 5-0 Prolene."

vascular_minor_004:
  operation: "TEVAR, left femoral access"
  description: "74-year-old man with a 6.0 cm saccular descending thoracic aneurysm. Elective."
  implants: "Cook Zenith Alpha thoracic 36 x 157 mm"
  complications: "Urticarial rash and flushing after contrast, treated with chlorphenamine and hydrocortisone; procedure completed."

vascular_minor_005:
  operation: "Open repair of 7 cm AAA (tube graft)"
  description: "72-year-old man, retired builder, with a large asymptomatic AAA. Elective."
  implants: "Dacron 20 mm tube graft"
  complications: "Core temperature fell to 34.6 degrees during the case; active warming with forced air and warmed fluids restored normothermia before extubation."

vascular_minor_006:
  operation: "Right carotid endarterectomy with shunt and patch"
  description: "69-year-old man with right-sided amaurosis fugax and a 90% right ICA stenosis. Urgent."
  implants: "Bovine pericardial patch"
  complications: "Loss of shunt flow on Doppler after shunt kinked; shunt replaced with a new Pruitt-Inahara shunt without neurological change."

vascular_minor_007:
  operation: "L carotid endarterectomy under local anaesthetic"
  description: "78-year-old woman with recurrent right arm weakness episodes and a critical left ICA stenosis. Awake CEA."
  implants: "Dacron patch"
  complications: "Confusion and right arm weakness on test clamping; shunt inserted with immediate recovery and the case completed."

vascular_minor_008:
  operation: "Right CEA (eversion technique)"
  description: "73-year-old man with a right hemisphere TIA and an 80% stenosis. Urgent."
  complications: "Profound bradycardia on carotid sinus handling, treated with glycopyrrolate and local anaesthetic infiltration of the sinus."

vascular_minor_009:
  operation: "Left CFA endarterectomy + bovine patch"
  description: "62-year-old woman with left calf claudication at 30 metres and a CFA stenosis. Elective."
  implants: "XenoSure bovine pericardial patch 1 x 10 cm"
  complications: "Small tear at the profunda femoris origin during endarterectomy, repaired with interrupted 6-0 Prolene."

vascular_minor_010:
  operation: "Right femoral to anterior tibial bypass with reversed GSV (thigh tourniquet for distal anastomosis)"
  description: "66-year-old diabetic woman with heel necrosis and heavily calcified tibial arteries. Urgent."
  complications: "Thigh tourniquet failed to hold pressure; replaced with a new cuff and the distal anastomosis completed."

vascular_minor_011:
  operation: "Left fem-distal (peroneal) bypass with composite vein"
  description: "70-year-old man with left forefoot gangrene; limited vein requiring arm and leg vein splicing. Urgent."
  complications: "Vein graft twisted during tunnelling, found on completion angiogram; re-tunnelled with good flow."

vascular_minor_012:
  operation: "Aortobifemoral bypass (Dacron)"
  description: "57-year-old female smoker with bilateral short-distance claudication from aortoiliac occlusive disease. Elective."
  implants: "Gelsoft Plus 14 x 7 mm bifurcated graft"
  complications: "Right graft limb kinked at the inguinal ligament on completion; graft limb shortened and re-anastomosed."

vascular_minor_013:
  operation: "Left SFA angioplasty, bail-out stent"
  description: "72-year-old man with rest pain and a long SFA stenosis. Day case."
  implants: "Zilver PTX 6 x 100 mm"
  complications: "Flow-limiting dissection after balloon angioplasty, treated with a bail-out drug-eluting stent."

vascular_minor_014:
  operation: "Right external iliac stenting"
  description: "63-year-old man with right calf and thigh claudication and a tight EIA stenosis. Day case."
  implants: "Two Absolute Pro 8 x 60 mm self-expanding stents"
  complications: "First stent deployed short of the lesion; second overlapping stent placed to cover it."

vascular_minor_015:
  operation: "Antegrade below-knee angioplasty, right"
  description: "82-year-old woman with diabetes, CKD 3 and a non-healing ulcer on the right lateral foot. Inpatient."
  complications: "Distal embolisation into the peroneal artery, cleared with aspiration thrombectomy."

vascular_minor_016:
  operation: "Right femoral embolectomy"
  description: "76-year-old woman with AF and a 4-hour history of a cold right leg. Emergency."
  complications: "Fogarty balloon ruptured during a pass; replaced and embolectomy completed."

vascular_minor_017:
  operation: "Left brachial embolectomy under local anaesthetic"
  description: "91-year-old woman from a nursing home with acute left arm ischaemia. Emergency, local anaesthetic only."
  complications: "Perioral tingling and dizziness after a large volume of local anaesthetic, treated as early LA toxicity; infiltration stopped and she settled."

vascular_minor_018:
  operation: "Left radiocephalic fistula formation"
  description: "54-year-old man with IgA nephropathy, CKD 5. Day case."
  complications: "Radial artery spasm after arteriotomy with poor inflow, relieved with topical papaverine."

vascular_minor_019:
  operation: "Right upper arm AV graft"
  description: "69-year-old woman on haemodialysis with no usable veins in the left arm. Elective."
  implants: "Gore Acuseal 6 mm graft"
  complications: "Graft touched a non-sterile surface before implantation; discarded and a new graft opened."

vascular_minor_020:
  operation: "EVLA left GSV + phlebectomies"
  description: "49-year-old woman with symptomatic left leg varicose veins. Day case."
  complications: "Laser generator fault mid-case; completed with a radiofrequency ablation catheter."

vascular_minor_021:
  operation: "Right SFJ ligation, GSV stripping and avulsions"
  description: "44-year-old man with large right thigh and calf varicosities and skin changes. GA day case."
  complications: "Small tear in the common femoral vein at the junction, repaired with 5-0 Prolene."

vascular_minor_022:
  operation: "Foam sclerotherapy, left leg"
  description: "53-year-old woman with residual below-knee varicosities. Outpatient."
  complications: "Transient visual disturbance after foam injection; lay flat, resolved within 20 minutes."

vascular_minor_023:
  operation: "IVC filter insertion, femoral route"
  description: "67-year-old man with a proximal DVT two days after a subdural haemorrhage; anticoagulation contraindicated."
  implants: "Cook Günther Tulip IVC filter"
  complications: "Filter deployed with marked tilt against the caval wall; recaptured and redeployed centrally."

vascular_minor_024:
  operation: "Insertion of right IJ Hickman line"
  description: "3-year-old boy with neuroblastoma starting chemotherapy. Paediatric list."
  implants: "Hickman 6.6 Fr double-lumen catheter"
  complications: "Runs of SVT when the guidewire entered the right atrium; resolved on withdrawing the wire."

vascular_minor_025:
  operation: "Implantable port insertion (left subclavian approach)"
  description: "47-year-old woman with rectal cancer; right IJ unusable. Day case."
  implants: "BardPort titanium port with 8 Fr catheter"
  complications: "Small left apical pneumothorax on screening after subclavian puncture, aspirated with no recurrence."

vascular_minor_026:
  operation: "PICC line insertion, right arm"
  description: "71-year-old woman needing long-term IV antibiotics for endocarditis. Radiology procedure room."
  complications: "Catheter tip passed up into the right IJV on screening; withdrawn and repositioned to the cavoatrial junction."

vascular_minor_027:
  operation: "Tunnelled dialysis line, right IJV"
  description: "39-year-old man with rapidly progressive glomerulonephritis needing urgent haemodialysis."
  implants: "Tesio twin 10 Fr catheters"
  complications: "Inadvertent carotid artery needle puncture; needle withdrawn, pressure for 10 minutes, then jugular access regained."

vascular_minor_028:
  operation: "Removal of tunnelled central venous catheter"
  description: "34-year-old woman who has finished a year of chemotherapy for sarcoma. Day case, local anaesthetic."
  complications: "Line snapped at the cuff during traction; retained segment retrieved via a small cut-down over the cuff."

vascular_minor_029:
  operation: "Laparoscopic left donor nephrectomy"
  description: "46-year-old woman donating to her sister. Elective."
  complications: "Small splenic capsular tear during mobilisation of the splenic flexure, controlled with a haemostatic agent."

vascular_minor_030:
  operation: "Deceased donor liver and kidney retrieval (DBD)"
  description: "55-year-old male donor after brainstem death from an intracerebral haemorrhage. Out of hours."
  complications: "Accessory right renal artery divided during mobilisation; recorded and flagged for back-table reconstruction."

vascular_minor_031:
  operation: "Right transaxillary first rib resection"
  description: "27-year-old man, weightlifter, with venous thoracic outlet syndrome. Elective."
  complications: "Small pleural breach; air evacuated through a catheter under positive pressure before closure."

vascular_minor_032:
  operation: "Left fem-pop (AK) bypass, PTFE"
  description: "77-year-old man with left rest pain and no usable vein. Inpatient."
  implants: "Gore Propaten 6 mm graft"
  complications: "Only 3000 units of heparin given before clamping instead of the planned 5000; noticed on a low ACT and a top-up bolus given."

vascular_minor_033:
  operation: "Carotid endarterectomy, left, GA with shunt"
  description: "64-year-old man with a left hemisphere TIA and 70-99% stenosis. Urgent."
  implants: "Hemashield Dacron patch"
  complications: "Swab count one short at closure; swab found in the kick bucket and count reconciled."

vascular_minor_034:
  operation: "Retrieval of IVC filter"
  description: "43-year-old man with a filter in situ, now fully anticoagulated. Day case."
  complications: "Filter hook embedded in the caval wall; snare retrieval failed and completed with endobronchial forceps."

vascular_minor_035:
  operation: "Iliac vein stenting, left"
  description: "41-year-old woman with post-thrombotic left leg swelling and a chronic iliac vein occlusion. Elective."
  implants: "Vici venous stent 16 x 120 mm and 14 x 90 mm"
  complications: "Stent migrated slightly caudally on deployment; a second overlapping stent was placed to cover the confluence."
