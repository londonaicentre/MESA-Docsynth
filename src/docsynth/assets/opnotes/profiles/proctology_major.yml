proctology_major_001:
  operation: "Open haemorrhoidectomy x3"
  description: "63-year-old man on clopidogrel (withheld 7 days) with prolapsing grade IV haemorrhoids. Elective."
  complications: "Major bleeding from a retracted pedicle at the anorectal junction needing suture ligation, tamponade with an anal sponge and 2 units transfused."

proctology_major_002:
  operation: "Stapled haemorrhoidopexy"
  description: "46-year-old woman with circumferential grade III haemorrhoids. Elective."
  complications: "Posterior vaginal wall caught in the purse-string and staple line, recognised on vaginal examination; stapled ring taken down and the rectovaginal septum repaired with gynaecology."

proctology_major_003:
  operation: "Lateral internal sphincterotomy"
  description: "32-year-old woman with a chronic posterior fissure. Day case."
  complications: "Sphincterotomy performed on the right side despite consent and marking for left; recognised at sign-out, Datix completed and the patient informed."

proctology_major_004:
  operation: "EUA + fistulotomy"
  description: "58-year-old woman with a recurrent anterior perianal fistula. Elective."
  complications: "Tract found to be trans-sphincteric only after partial division of the external sphincter; divided muscle repaired with PDS and a loose seton placed instead."

proctology_major_005:
  operation: "EUA anus and seton insertion"
  description: "68-year-old man with COPD and a complex posterior fistula. Elective."
  complications: "Difficult airway after LMA displacement in lithotomy with desaturation to 78%; intubated with videolaryngoscope and procedure completed."

proctology_major_006:
  operation: "Examination under anaesthesia and drainage of ischiorectal abscess"
  description: "74-year-old man with diabetes, sepsis and a large horseshoe perianal abscess. Emergency."
  complications: "Cardiac arrest (PEA) after induction from septic shock; ROSC after 4 minutes of CPR and adrenaline, abscess drained rapidly and transferred to ICU."

proctology_major_007:
  operation: "Delorme's procedure"
  description: "86-year-old woman with a full-thickness rectal prolapse, living in a care home. Elective under spinal."
  complications: "Bupivacaine for the anal field block drawn up at a higher dose than intended and given, with perioral tingling and a brief arrhythmia; treated with Intralipid and procedure completed."

proctology_major_008:
  operation: "Excision of pilonidal sinus + Limberg flap"
  description: "24-year-old man with extensive chronic pilonidal disease. Elective."
  complications: "Swab count incorrect at closure and radiograph confirmed a retained swab under the flap; flap reopened and the swab removed."
