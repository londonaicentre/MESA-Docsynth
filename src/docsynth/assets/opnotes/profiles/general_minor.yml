general_minor_001:
  operation: "Diagnostic laparoscopy and appendicectomy"
  description: "19-year-old woman with right iliac fossa pain and raised inflammatory markers. Emergency list."
  complications: "Appendix tore at the base during retrieval with spillage of faecolith into the pelvis; faecolith retrieved, pelvis irrigated and stump secured with an extra Endoloop."

general_minor_002:
  operation: "Lap adhesiolysis for small bowel obstruction"
  description: "64-year-old man with adhesional small bowel obstruction failing to settle after 72 hours. Urgent."
  complications: "Serosal tear of a dilated jejunal loop during adhesiolysis, oversewn with 3-0 PDS."

general_minor_003:
  operation: "Staging laparoscopy + washings"
  description: "58-year-old woman with a pancreatic head adenocarcinoma, borderline resectable on CT. Elective."
  complications: "Bleeding from the left lateral port site from a rectus sheath vessel, controlled with a transfixion suture via a suture passer."

general_minor_004:
  operation: "Laparotomy, adhesiolysis and division of band"
  description: "71-year-old woman with a small bowel obstruction and a virgin abdomen. Emergency."
  complications: "Small capsular tear of the spleen from retraction, controlled with Surgicel and pressure."

general_minor_005:
  operation: "Trauma laparotomy and repair of small bowel"
  description: "33-year-old man with a stab wound to the upper abdomen, peritonitic. Emergency."
  complications: "Small diaphragmatic laceration found with a left pneumothorax on ventilation; diaphragm repaired and left chest drain inserted on table."

general_minor_006:
  operation: "Laparoscopic PD catheter insertion"
  description: "63-year-old woman with CKD stage 5 starting peritoneal dialysis. Elective."
  complications: "Laparoscope camera stack failed after pneumoperitoneum; replaced from the adjacent theatre and procedure continued after a 15-minute delay."

general_minor_007:
  operation: "Incision and drainage of left breast abscess"
  description: "31-year-old lactating woman with a 4 cm abscess in the upper outer quadrant of the left breast. Emergency list."
  complications: "Brisk arterial bleeding from a vessel in the cavity wall, controlled with diathermy and packing."

general_minor_008:
  operation: "Drainage of palmar space abscess, right hand"
  description: "45-year-old man who cut his hand on a fishing hook, with a swollen right palm. Hand trauma list."
  complications: "Arm tourniquet cuff failed to hold pressure mid-case; replaced with a new cuff and re-exsanguinated."

general_minor_009:
  operation: "Removal of glass foreign body, left index finger"
  description: "29-year-old woman with a painful left index finger after dropping a glass, fragment seen on X-ray. Hand trauma list."
  complications: "Partial (about 20%) laceration of FDP to the index finger found while retrieving the fragment; repaired with a 4-0 epitendinous suture."

general_minor_010:
  operation: "Exploration and removal of needle fragment from buttock"
  description: "37-year-old woman with a broken intramuscular injection needle in the right buttock. Urgent."
  complications: "Needle fragment could not be found initially and fluoroscopy was brought in; fragment localised and removed."

general_minor_011:
  operation: "EUA and debridement of perineal wound"
  description: "55-year-old man with an infected non-healing perineal wound. Urgent."
  complications: "Instrument count wrong at the end with a missing artery forceps; found in the bedding and count reconciled."

general_minor_012:
  operation: "Examination under anaesthesia and incision and drainage of submandibular abscess"
  description: "2-year-old boy with a fluctuant neck swelling unresponsive to antibiotics. Paediatric emergency list."
  complications: "Desaturation to 85% at induction from laryngospasm, managed with CPAP and suxamethonium, then intubated uneventfully."

general_minor_013:
  operation: "Laparoscopic appendicectomy"
  description: "8-year-old girl with 2 days of abdominal pain, vomiting and right-sided tenderness. Paediatric emergency list."
  complications: "Cefuroxime prescribed for prophylaxis was not given before incision; noted at the pause point and given before the appendix was divided."

general_minor_014:
  operation: "Laparotomy, washout and drainage of subphrenic abscess"
  description: "50-year-old man with a large left subphrenic collection and sepsis. Urgent."
  complications: "Temperature fell to 34.8 C during a prolonged washout with room-temperature fluid; warmed with a forced-air blanket and warmed irrigation."

general_minor_015:
  operation: "Removal of foreign body, left sole of foot"
  description: "10-year-old boy who stepped on a nail in a garden with a retained fragment on X-ray. Paediatric day case."
  complications: "Surgeon's glove torn on the fragment edge; glove changed and the instrument tray kept from contact."

general_minor_016:
  operation: "Diagnostic laparoscopy"
  description: "25-year-old woman with recurrent right iliac fossa pain and normal imaging. Elective."
  complications: "Preperitoneal insufflation from the Veress needle; recognised by high pressures, needle withdrawn and open Hasson entry used."
