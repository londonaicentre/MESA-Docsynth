urology_upper_tract_minor_001:
  operation: "Laparoscopic right radical nephrectomy"
  description: "69-year-old man with an 8 cm right renal mass found on CT for weight loss. Elective."
  complications: "Small tear in a lumbar vein during hilar dissection, controlled with Hem-o-lok clips; blood loss 300 ml."

urology_upper_tract_minor_002:
  operation: "Lap left radical nephrectomy"
  description: "57-year-old woman with a 7 cm left renal tumour and hypertension. Elective."
  complications: "Small splenic capsular tear during mobilisation of the splenic flexure, controlled with Surgicel and pressure."

urology_upper_tract_minor_003:
  operation: "Robotic partial nephrectomy, left"
  description: "48-year-old man with a 3.8 cm left mid-pole renal mass. Elective robotic list."
  complications: "Collecting system entered during tumour excision; closed with a running V-Loc suture and watertight on methylene blue test."

urology_upper_tract_minor_004:
  operation: "RAPN right"
  description: "66-year-old woman with a 3 cm right interpolar renal tumour and type 2 diabetes. Elective."
  complications: "Warm ischaemia exceeded plan at 28 minutes because of renorrhaphy difficulty; clamp released and bed haemostasis confirmed with Floseal."

urology_upper_tract_minor_005:
  operation: "Open partial nephrectomy (R)"
  description: "72-year-old man with a solitary right kidney and a 3.2 cm lower pole renal mass. Elective."
  complications: "Pleura opened at the tip of the 11th rib during the flank approach; repaired over a catheter with the lungs inflated, no drain needed."

urology_upper_tract_minor_006:
  operation: "Laparoscopic partial nephrectomy, left"
  description: "51-year-old woman with a 2.8 cm exophytic left renal lesion. Elective."
  complications: "Tumour capsule breached at one point during excision; margin re-excised and extra tissue sent separately."

urology_upper_tract_minor_007:
  operation: "Lap simple nephrectomy, right"
  description: "56-year-old woman with a non-functioning, chronically infected right kidney. Elective."
  complications: "Pus spilled from the renal pelvis during hilar dissection; suctioned, area irrigated and swab sent for culture."

urology_upper_tract_minor_008:
  operation: "Laparoscopic live donor nephrectomy (L)"
  description: "43-year-old woman donating a kidney to her brother. Elective transplant list."
  complications: "Gonadal vein avulsed from the renal vein during dissection, controlled with a clip without narrowing the renal vein."

urology_upper_tract_minor_009:
  operation: "Laparoscopic nephroureterectomy, left"
  description: "74-year-old man with a high-grade left renal pelvic urothelial carcinoma. Elective."
  complications: "Harmonic scalpel stopped working mid-case; replaced with a new handpiece and the case continued."

urology_upper_tract_minor_010:
  operation: "Robotic nephroureterectomy (R) + bladder cuff"
  description: "61-year-old man with a right lower ureteric tumour. Elective robotic list."
  complications: "Bladder cuff closure leaked on filling; oversewn with a second layer and watertight on repeat fill."

urology_upper_tract_minor_011:
  operation: "Renal transplant (DBD), right iliac fossa"
  description: "54-year-old man with IgA nephropathy on haemodialysis for 5 years. Called in overnight."
  implants: "6Fr 12 cm JJ stent"
  complications: "Bleeding from a small unligated hilar vessel after reperfusion, oversewn with 6-0 Prolene."

urology_upper_tract_minor_012:
  operation: "Live donor kidney transplant, left iliac fossa"
  description: "37-year-old woman with reflux nephropathy, pre-emptive transplant from her mother. Elective."
  implants: "6Fr 14 cm JJ stent"
  complications: "Hypotension on reperfusion (systolic 80), treated with fluids and metaraminol; the graft pinked up well."

urology_upper_tract_minor_013:
  operation: "Lap pyeloplasty, right"
  description: "26-year-old woman with right PUJ obstruction and loin pain. Elective."
  implants: "6Fr 26 cm JJ stent"
  complications: "Antegrade JJ stent found curled in the distal ureter on fluoroscopy; repositioned over a guidewire into the bladder."

urology_upper_tract_minor_014:
  operation: "Robotic pyeloplasty left"
  description: "34-year-old man with left PUJ obstruction and a crossing vessel. Elective."
  implants: "6Fr 26 cm JJ stent"
  complications: "Robotic arm fault stopped the case for 15 minutes; the system was restarted and the case completed."

urology_upper_tract_minor_015:
  operation: "Left percutaneous nephrostomy"
  description: "70-year-old woman with an infected obstructed left kidney. Emergency out of hours."
  complications: "Guidewire passed outside the collecting system on the first puncture; withdrawn and a second puncture into a lower pole calyx was successful."

urology_upper_tract_minor_016:
  operation: "Right percutaneous nephrostomy"
  description: "81-year-old man with right hydronephrosis from bladder cancer and AKI. Urgent."
  complications: "Transient haematuria through the nephrostomy after insertion, settled with the tube clamped for 15 minutes."

urology_upper_tract_minor_017:
  operation: "Left PCNL, prone"
  description: "49-year-old man with a 3 cm left renal pelvic stone and recurrent loin pain. Elective."
  implants: "6Fr 26 cm JJ stent"
  complications: "Supracostal (11th intercostal) access breached the pleura, causing a small pneumothorax seen on fluoroscopy; a chest drain was placed at the end."

urology_upper_tract_minor_018:
  operation: "Supine PCNL (right)"
  description: "58-year-old woman with a 2.5 cm right lower pole stone. Elective."
  complications: "Venous bleeding from the tract obscured vision; tamponaded with the Amplatz sheath and a large-bore nephrostomy, and the stone cleared at a second look."

urology_upper_tract_minor_019:
  operation: "Percutaneous nephrolithotomy, left"
  description: "63-year-old man with a partial left staghorn calculus. Elective."
  complications: "Stone fragments migrated down the ureter; retrieved with flexible ureteroscopy and a basket in the same sitting."

urology_upper_tract_minor_020:
  operation: "Mini-PCNL right"
  description: "41-year-old woman with a 2 cm right renal stone and recurrent UTIs. Elective."
  complications: "Ultrasonic lithotripter probe failed; switched to holmium laser to finish."

urology_upper_tract_minor_021:
  operation: "Left rigid ureteroscopy and laser lithotripsy"
  description: "44-year-old man with an 8 mm left distal ureteric stone. Day case."
  implants: "6Fr 26 cm JJ stent"
  complications: "Small mucosal perforation of the ureter at the stone site, with no contrast leak beyond it; stented for 2 weeks."

urology_upper_tract_minor_022:
  operation: "Flexible ureteroscopy + laser, right"
  description: "55-year-old woman with a 13 mm right renal pelvic stone. Day case."
  implants: "6Fr 24 cm JJ stent"
  complications: "Laser fibre fractured inside the scope's working channel; the fibre was replaced and the scope checked for damage before continuing."

urology_upper_tract_minor_023:
  operation: "FURS left, basket extraction"
  description: "38-year-old man with a 7 mm left lower pole stone who works offshore. Day case."
  complications: "Nitinol basket became stuck around a fragment in the lower pole calyx; the stone was freed by lasering it inside the basket."

urology_upper_tract_minor_024:
  operation: "Ureteroscopy and biopsy, right upper tract"
  description: "69-year-old woman with a right renal pelvis filling defect. Elective."
  implants: "6Fr 26 cm JJ stent"
  complications: "Ureteric access sheath could not be passed; ureteroscopy completed without a sheath after gentle balloon dilatation."

urology_upper_tract_minor_025:
  operation: "Cystoscopy and left JJ stent insertion"
  description: "68-year-old man with an obstructing left ureteric stone and fever. Emergency."
  implants: "6Fr 26 cm JJ stent"
  complications: "Stent placed too distal on the check X-ray, with the upper coil in the ureter; repositioned with a grasper under fluoroscopy."

urology_upper_tract_minor_026:
  operation: "Cystoscopy, retrograde pyelogram and right stent"
  description: "29-year-old woman with right obstructive pyelonephritis. Emergency."
  implants: "6Fr 24 cm JJ stent"
  complications: "Rigors and hypotension soon after contrast injection into the obstructed system; treated with fluids and escalated antibiotics."

urology_upper_tract_minor_027:
  operation: "Rigid cystoscopy and stent exchange, left"
  description: "75-year-old woman with a long-term left ureteric stent for malignant obstruction. Routine change."
  implants: "7Fr 26 cm JJ stent"
  complications: "Old stent heavily encrusted at the bladder coil and would not come out whole; the encrustation was lasered and the stent removed intact."

urology_upper_tract_minor_028:
  operation: "Flexible cystoscopy and stent removal"
  description: "50-year-old man with a right ureteric stent in situ; stone clearance confirmed. Clinic procedure."
  complications: "Stent fragment broke off at the lower coil; retrieved with graspers at the same sitting."

urology_upper_tract_minor_029:
  operation: "Bilateral ureteric stent insertion"
  description: "65-year-old woman with bilateral obstruction from recurrent ovarian cancer. Urgent."
  implants: "Bilateral 6Fr 26 cm JJ stents"
  complications: "Contrast extravasated at the site of the left narrowing on retrograde study; the guidewire had passed beyond it and the stent sat well."

urology_upper_tract_minor_030:
  operation: "Open left ureteric reimplantation with psoas hitch"
  description: "47-year-old woman with a left distal ureteric stricture. Elective."
  implants: "6Fr 26 cm JJ stent"
  complications: "Genitofemoral nerve seen close to the psoas hitch sutures; the suture was removed and re-sited more laterally."

urology_upper_tract_minor_031:
  operation: "Cohen ureteric reimplantation (bilateral)"
  description: "5-year-old boy with bilateral grade IV reflux and scarring. Paediatric list."
  complications: "Peritoneum opened during bladder mobilisation; closed primarily with no bowel involvement."

urology_upper_tract_minor_032:
  operation: "Endoscopic Deflux injection, right"
  description: "6-year-old girl with right grade III reflux and breakthrough UTIs. Day case."
  implants: "Deflux 0.7 ml"
  complications: "The first injection needle clogged and some material extruded; the needle was changed and the mound was completed."

urology_upper_tract_minor_033:
  operation: "Laparoscopic right radical nephrectomy"
  description: "60-year-old man with a 6 cm right renal tumour and a BMI of 34. Elective."
  complications: "Serosal tear of the duodenum during Kocherisation, oversewn with 3-0 Vicryl; no mucosal breach on leak check."

urology_upper_tract_minor_034:
  operation: "Robot-assisted partial nephrectomy, left"
  description: "45-year-old woman with a 3 cm left upper pole renal mass. Elective."
  complications: "Subcutaneous emphysema across the chest wall and neck from CO2, with rising end-tidal CO2; pressure lowered and case finished safely."

urology_upper_tract_minor_035:
  operation: "PCNL right, prone"
  description: "72-year-old man with a 3.5 cm right renal stone burden. Elective."
  complications: "Temperature dropped to 35.1 degrees during a long irrigation phase; warmed irrigant and forced air warming started."

urology_upper_tract_minor_036:
  operation: "URS left + laser lithotripsy"
  description: "32-year-old woman with a 6 mm left proximal ureteric stone. Day case."
  implants: "6Fr 26 cm JJ stent"
  complications: "Swab count discrepancy at the end; the missing swab was found in the drape and the count confirmed correct."

urology_upper_tract_minor_037:
  operation: "Lap left nephroureterectomy"
  description: "67-year-old woman with a high-grade left ureteric tumour. Elective."
  complications: "Rash and wheeze after co-amoxiclav at induction, treated with chlorphenamine and hydrocortisone; the case went ahead."
