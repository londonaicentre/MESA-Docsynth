ophthalmology_major_001:
  operation: "Phaco + IOL, L eye"
  description: "79-year-old man on tamsulosin with a dense brunescent cataract and a poorly dilating pupil. Day case under topical anaesthesia."
  implants: "Alcon MA50BM +19.5D three-piece IOL in the ciliary sulcus"
  complications: "Posterior capsule rupture with vitreous loss during quadrant removal; bimanual anterior vitrectomy performed and a three-piece IOL placed in the sulcus."

ophthalmology_major_002:
  operation: "Right phacoemulsification with planned IOL"
  description: "76-year-old woman with a hard mature cataract and high myopia. Day case, sub-Tenon's block."
  complications: "Posterior capsule rupture with a nuclear fragment dropped into the vitreous; anterior vitrectomy done, eye left aphakic and urgent vitreoretinal referral made for fragment removal."

ophthalmology_major_003:
  operation: "Phacotrabeculectomy, left eye (trabeculectomy deferred)"
  description: "70-year-old man with advanced pseudoexfoliation glaucoma and a dense cataract, IOP 29 on three agents. Elective."
  implants: "Alcon MA60AC +20.5D in the sulcus"
  complications: "Posterior capsule rupture with vitreous prolapse into the AC; anterior vitrectomy and sulcus IOL, and the trabeculectomy was abandoned given the vitreous at the wound."

ophthalmology_major_004:
  operation: "Right penetrating keratoplasty"
  description: "82-year-old man with a failed opaque cornea from bullous keratopathy, hypertensive and on apixaban. Elective GA."
  complications: "Suprachoroidal haemorrhage with the eye open sky; donor button sutured rapidly with posterior sclerotomies to drain blood, and vision outcome guarded."

ophthalmology_major_005:
  operation: "Left phaco + IOL (abandoned)"
  description: "78-year-old woman with a cataract, on aspirin. Day case under peribulbar anaesthesia."
  complications: "Tense retrobulbar haemorrhage with proptosis after the peribulbar block; urgent lateral canthotomy and cantholysis performed and surgery cancelled."

ophthalmology_major_006:
  operation: "Secondary sulcus IOL, right"
  description: "65-year-old man with right aphakia and high axial myopia (axial length 29 mm). Elective under peribulbar block."
  complications: "Globe perforation by the peribulbar needle, recognised by soft eye and vitreous haemorrhage; IOL insertion abandoned and same-day vitreoretinal review arranged."

ophthalmology_major_007:
  operation: "Left phaco + IOL, with IOL exchange"
  description: "69-year-old woman with a cataract and previous corneal refractive surgery for myopia. Day case, topical."
  implants: "Tecnis ZCB00 +23.5D (exchanged lens)"
  complications: "IOL of the power for the other eye implanted after the wrong biometry printout was used; noticed at the end-of-case check, lens explanted and the correct power implanted, incident reported."

ophthalmology_major_008:
  operation: "Right medial rectus recession"
  description: "5-year-old girl with right esotropia and amblyopia treated with patching. Paediatric day case, GA."
  complications: "Left eye prepped and draped in error; wrong side identified at the second time-out before any incision, re-draped on the right and a Datix completed."

ophthalmology_major_009:
  operation: "Bilateral lateral rectus recession"
  description: "7-year-old boy with intermittent exotropia and poor control. Day case GA."
  complications: "Asystole from the oculocardiac reflex on traction of the right lateral rectus; traction released, atropine and brief CPR given with return of circulation, surgery completed after discussion."

ophthalmology_major_010:
  operation: "Left pars plana vitrectomy and silicone oil (not performed)"
  description: "52-year-old man with proliferative vitreoretinopathy and a recurrent retinal detachment. Elective GA."
  complications: "Anaphylaxis at induction with bronchospasm and hypotension, likely to rocuronium; treated with adrenaline and fluids, surgery abandoned and patient to ICU, tryptase sent."

ophthalmology_major_011:
  operation: "Right inferior oblique myectomy"
  description: "4-year-old boy with Goldenhar syndrome, mandibular hypoplasia and right inferior oblique overaction. Paediatric GA."
  complications: "Unanticipated difficult intubation with two failed attempts and desaturation; airway secured with a fibreoptic scope through an LMA, surgery then completed."

ophthalmology_major_012:
  operation: "Right phaco + IOL"
  description: "75-year-old woman with a nuclear cataract and glaucoma on drops. Day case."
  implants: "Clareon SY60WF +22.0D"
  complications: "Intracameral cefuroxime given at ten times the intended concentration after a reconstitution error; recognised immediately and AC washout performed, with ophthalmology follow-up planned for toxicity."

ophthalmology_major_013:
  operation: "PPV, lensectomy and scleral-fixated Carlevale IOL, left"
  description: "73-year-old woman with Marfan-type lens subluxation and no capsular support. Elective, GA."
  implants: "Soleko Carlevale FIL SSF +20.5D"
  complications: "IOL dropped onto the retina during haptic externalisation; retrieved with forceps under perfluorocarbon liquid and refixated, with a small retinal haemorrhage lasered."

ophthalmology_major_014:
  operation: "Artisan iris-claw IOL, right (IOL exchanged)"
  description: "80-year-old man with right aphakia and no capsular support. Elective."
  implants: "Ophtec Artisan Aphakia 205 +18.5D (second lens)"
  complications: "Haptic of the first Artisan lens fractured during enclavation; lens removed through an enlarged wound and replaced with a second lens, wound resutured."

ophthalmology_major_015:
  operation: "Left upper lid wedge excision and direct closure"
  description: "70-year-old man with a lid margin nodular lesion suspicious for BCC. Local anaesthetic."
  complications: "6-0 suture needle broke with the tip embedded in the tarsal plate; not retrieved despite a search and fluoroscopy, left in situ and the patient informed."

ophthalmology_major_016:
  operation: "Bilateral orbital decompression (medial wall and floor)"
  description: "44-year-old woman with thyroid eye disease and compressive optic neuropathy despite IV steroids. Urgent GA."
  complications: "CSF leak from a defect in the ethmoid roof during the left medial wall decompression; repaired with a fascia lata graft by neurosurgery on table."

ophthalmology_major_017:
  operation: "Right DSAEK"
  description: "76-year-old man with pseudophakic bullous keratopathy. Elective, peribulbar block."
  implants: "Pre-cut DSAEK donor graft 8.5 mm"
  complications: "Instrument tray found to have an unchanged sterilisation indicator after the graft was inserted; case completed with a fresh set, intracameral and subconjunctival antibiotics given and incident reported."

ophthalmology_major_018:
  operation: "Left medial rectus resection and lateral rectus recession"
  description: "46-year-old man with a large consecutive exotropia and diplopia on lateral gaze. Elective GA."
  complications: "Medial rectus slipped from the hook and retracted into the orbit after disinsertion; retrieved via posterior orbital exploration along Tenon's and reattached, with the resection reduced."

ophthalmology_major_019:
  operation: "Left enucleation with orbital implant"
  description: "74-year-old woman with a large choroidal melanoma and a blind eye, not suitable for brachytherapy. Ocular oncology list."
  implants: "MEDPOR sphere 20 mm"
  complications: "Thin sclera ruptured over the tumour during traction on the globe with spillage of tumour cells into the orbit; orbit irrigated and ocular oncology to plan adjuvant orbital radiotherapy."
