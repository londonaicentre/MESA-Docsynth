hernia_major_001:
  operation: "Open right inguinal hernia repair (Lichtenstein)"
  description: "63-year-old man with a large right indirect inguinal hernia. Elective."
  complications: "Anaphylaxis at induction with widespread urticaria, bronchospasm and hypotension; treated with IM and infusion adrenaline, surgery abandoned before incision and patient transferred to ICU."

hernia_major_002:
  operation: "Lap TEP repair of right inguinal hernia converted to TAPP"
  description: "56-year-old man with a symptomatic right inguinal hernia and a lower midline laparotomy scar from trauma surgery. Elective."
  implants: "Bard 3DMax mesh, large"
  complications: "Bladder injury during dissection of the space of Retzius, recognised by blood in the catheter bag; repaired in two layers with 3-0 Vicryl by urology and catheter left for 10 days."

hernia_major_003:
  operation: "Left femoral hernia repair (Lockwood)"
  description: "79-year-old woman with a painful irreducible left femoral hernia. Urgent."
  implants: "Polypropylene mesh plug"
  complications: "Laceration of the femoral vein on placing the lateral suture, with brisk bleeding; controlled by pressure and repaired with 5-0 Prolene by the vascular surgeon."

hernia_major_004:
  operation: "Laparoscopic IPOM repair of incisional hernia converted to open"
  description: "71-year-old man with a 10 cm midline incisional hernia and COPD. Elective."
  implants: "Symbotex composite mesh 30 x 20 cm, ProTack fixation"
  complications: "Unrecognised full-thickness small bowel injury found on inspection after adhesiolysis with spillage of enteric content; converted to laparotomy, small bowel resection performed and mesh placement deferred."

hernia_major_005:
  operation: "Bilateral inguinal herniotomy"
  description: "2-month-old ex-premature boy with bilateral inguinal hernias, born at 29 weeks. Paediatric list."
  complications: "Right vas deferens divided while separating the sac; recognised on table and repaired primarily under magnification by the paediatric urologist."

hernia_major_006:
  operation: "Lichtenstein repair, right inguinal hernia"
  description: "48-year-old man with bilateral inguinal hernias, the left symptomatic. Consented and marked for left-sided repair. Day case."
  implants: "Prolene mesh 7.5 x 15 cm"
  complications: "Repair performed on the right side instead of the marked left; error identified in recovery, patient informed under duty of candour and incident reported."

hernia_major_007:
  operation: "Open repair of incarcerated umbilical hernia with small bowel resection"
  description: "58-year-old woman with cirrhosis, tense ascites and an incarcerated umbilical hernia with skin ulceration. Emergency."
  complications: "Major haemorrhage from abdominal wall varices and coagulopathy, around 2 litres lost; transfused 4 units of red cells, FFP and platelets with major haemorrhage protocol."
