oral_maxfax_minor_001:
  operation: "Extraction UL6"
  description: "55-year-old man with a heavily restored, fractured upper left first molar and recurrent abscesses. Local anaesthetic."
  complications: "Palatal root apex displaced into the maxillary sinus; retrieved through the socket with suction and the small oroantral communication closed with a buccal advancement flap."

oral_maxfax_minor_002:
  operation: "Surgical removal of UR8 and LR8"
  description: "26-year-old woman with recurrent pericoronitis and a carious upper wisdom tooth. IV sedation list."
  complications: "Oroantral communication after the UR8 extraction; closed with a buccal advancement flap and sinus precautions advised."

oral_maxfax_minor_003:
  operation: "Surgical extraction LL8 (bone removal and sectioning)"
  description: "30-year-old man with a horizontally impacted lower left wisdom tooth and distal caries in LL7. Day case GA."
  complications: "Tip of the surgical bur fractured in the bone; fragment located and retrieved with an intraoperative radiograph confirming removal."

oral_maxfax_minor_004:
  operation: "Paediatric dental GA: extraction of 6 primary molars"
  description: "5-year-old boy with multiple carious primary teeth and facial swelling last month. Paediatric dental list."
  complications: "Throat pack not recorded as removed at the end; confirmed out by direct laryngoscopy before emergence and the count reconciled."

oral_maxfax_minor_005:
  operation: "Extraction of LR6 under local anaesthetic"
  description: "11-year-old girl with a hypomineralised, painful lower right first molar, orthodontic plan for space closure."
  complications: "Articaine cartridge used in place of the prescribed lidocaine; recognised by the nurse, total dose within safe limits and no adverse effect."

oral_maxfax_minor_006:
  operation: "Excision of plunging ranula with sublingual gland (transoral)"
  description: "24-year-old man with a soft left submandibular and floor of mouth swelling, ranula on MRI. Elective GA."
  complications: "Ranula ruptured during dissection with spillage of mucus; cavity irrigated and the sublingual gland excised completely."

oral_maxfax_minor_007:
  operation: "Excision of ventral tongue lesion"
  description: "47-year-old woman with a persistent 1 cm red patch on the ventral tongue. Elective day case."
  complications: "Brisk bleeding from a ranine vein; controlled with bipolar diathermy and a transfixion suture."

oral_maxfax_minor_008:
  operation: "Left hemiglossectomy + SND + RFFF"
  description: "60-year-old man with a T2 N1 left lateral tongue SCC. Elective head and neck list."
  implants: "GEM coupler 2.5 mm"
  complications: "Venous coupler failed to engage on the first attempt; device replaced with a new coupler and the flap had good flow."

oral_maxfax_minor_009:
  operation: "Frenotomy (tongue tie division)"
  description: "5-week-old boy with a tight anterior tongue tie and poor breastfeeding. Infant feeding clinic."
  complications: "More bleeding than usual from the frenotomy site; stopped with pressure over a gauze swab for five minutes before feeding."

oral_maxfax_minor_010:
  operation: "Le Fort I osteotomy with advancement and impaction"
  description: "21-year-old man with vertical maxillary excess, gummy smile and class II occlusion. Elective."
  implants: "Synthes MatrixORTHOGNATHIC 1.5 mm L-plates x4"
  complications: "Bleeding from the left descending palatine artery during down-fracture; controlled with bipolar diathermy and a haemostatic clip."

oral_maxfax_minor_011:
  operation: "BSSO advancement + genioplasty"
  description: "23-year-old woman with a class II division 1 skeletal pattern and weak chin. Elective."
  implants: "KLS Martin 2.0 mm sagittal split plates bilaterally; KLS Martin genioplasty plate 8 mm"
  complications: "Right sagittal split plate cracked on bending; replaced with a new plate and fixation completed."

oral_maxfax_minor_012:
  operation: "Bimaxillary orthognathic surgery"
  description: "25-year-old man with class III dentofacial deformity after pre-surgical orthodontics. Elective."
  implants: "Stryker Le Fort I plates x4; 2.0 mm BSSO plates"
  complications: "Troublesome epistaxis after nasotracheal intubation; nasal cavity packed with adrenaline-soaked ribbon gauze and bleeding stopped."

oral_maxfax_minor_013:
  operation: "Right TMJ arthroscopy (converted to arthrocentesis)"
  description: "43-year-old woman with painful clicking and intermittent locking of the right TMJ. Day case."
  complications: "Unable to enter the superior joint space with the arthroscope because of adhesions; procedure changed to arthrocentesis and lavage."

oral_maxfax_minor_014:
  operation: "Left total TMJ replacement (Zimmer Biomet stock)"
  description: "62-year-old man with severe left TMJ osteoarthritis and limited opening. Elective."
  implants: "Zimmer Biomet fossa component small; condylar component 45 mm"
  complications: "Condylar component dislocated anteriorly out of the fossa on testing mouth opening; repositioned with a shorter component and a coronoidectomy performed."

oral_maxfax_minor_015:
  operation: "Right TMJ discectomy"
  description: "39-year-old woman with a displaced, non-reducing disc and pain despite conservative treatment. Elective GA."
  complications: "Urticarial rash over the chest after chlorhexidine skin prep; treated with IV chlorphenamine and hydrocortisone, haemodynamically stable."

oral_maxfax_minor_016:
  operation: "Dental implant placement LL6"
  description: "52-year-old woman with a missing lower left first molar and good bone height. Private implant list, local."
  implants: "Straumann BLT 4.1 x 10 mm"
  complications: "First implant touched the patient's lip before insertion; discarded and a new sterile implant of the same size placed."

oral_maxfax_minor_017:
  operation: "Right TMJ gap arthroplasty with costochondral graft reconstruction"
  description: "11-year-old girl with right TMJ ankylosis, facial asymmetry and restricted opening. Elective, paediatric maxillofacial list."
  implants: "Costochondral graft, 2.0 mm bicortical screws x3"
  complications: "Small pleural tear during rib harvest; closed over a catheter under positive pressure ventilation and the chest X-ray on table showed no pneumothorax."

oral_maxfax_minor_018:
  operation: "Lingual frenuloplasty"
  description: "15-year-old girl with ankyloglossia causing speech difficulty and social embarrassment. Day case GA."
  complications: "Left submandibular duct orifice cut during release of the frenulum; duct identified, cannulated and sutured open (sialodochoplasty)."
