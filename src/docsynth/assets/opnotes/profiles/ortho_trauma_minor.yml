ortho_trauma_minor_001:
  operation: "Left DHS"
  description: "84-year-old woman, fall at home, left intertrochanteric (stable) neck of femur fracture. Day 1 of admission."
  implants: "DHS 135° 4-hole plate, 85 mm lag screw, 4 x 4.5 mm cortical screws"
  complications: "Guidewire placed too superior in the head on the lateral view; removed and repositioned before reaming."

ortho_trauma_minor_002:
  operation: "Total hip replacement for fractured neck of femur"
  description: "71-year-old man, keen golfer, displaced right intracapsular neck of femur fracture after falling off a kerb."
  implants: "DePuy Corail uncemented stem size 12 KA, 36 mm Biolox Delta head; Pinnacle 54 mm shell with Marathon liner"
  complications: "Undisplaced calcar crack on broaching; cerclage wire placed and stem size unchanged."

ortho_trauma_minor_003:
  operation: "Volar locking plate L distal radius"
  description: "41-year-old man who fell from a ladder; intra-articular left distal radius fracture. Regional block planned."
  implants: "Medartis APTUS 2.5 volar plate, 6 distal locking pegs, 3 shaft screws"
  complications: "Distal screw seen penetrating the radiocarpal joint on screening; exchanged for a shorter screw."

ortho_trauma_minor_004:
  operation: "Removal of metalwork (plate and screws) left forearm"
  description: "29-year-old man with prominent, symptomatic forearm plates; fractures united."
  complications: "Stripped screw heads on two screws; removed with an extraction set."

ortho_trauma_minor_005:
  operation: "Cemented hemiarthroplasty, left hip"
  description: "87-year-old woman with a displaced left intracapsular hip fracture, found on the floor at home."
  implants: "Exeter V40 stem size 1 37.5 mm offset, Unitrax 45 mm head, Palacos R+G x2"
  complications: "Hip dislocated on trial reduction with a +0 neck; stable with a +4 head and final components used without incident."

ortho_trauma_minor_006:
  operation: "Hemiarthroplasty R hip (cemented, bipolar)"
  description: "80-year-old man with a displaced subcapital fracture of the right hip after a mechanical fall."
  implants: "Stryker Exeter V40 stem size 2, 44 mm; UHR bipolar 49 mm; Simplex P cement x2"
  complications: "Leg lengthened by about 1 cm with the trial head; neck length reduced and length restored against the other knee."

ortho_trauma_minor_007:
  operation: "Gamma nail right intertrochanteric fracture"
  description: "90-year-old woman with dementia from a care home, comminuted right intertrochanteric fracture."
  implants: "Gamma3 nail 11 x 180 mm 125°, 100 mm lag screw, no distal locking"
  complications: "Lag screw tip-apex distance over 30 mm on first pass; guidewire reinserted more centrally and screw placed at 18 mm."

ortho_trauma_minor_008:
  operation: "Tibial intramedullary nail"
  description: "30-year-old man with a closed tibial shaft fracture from a five-a-side football tackle."
  implants: "Stryker T2 tibial nail 10 x 345 mm, 2 proximal and 2 distal locking screws"
  complications: "Guidewire advanced through the posterior cortex and broke during reaming; fragment retrieved and wire replaced."

ortho_trauma_minor_009:
  operation: "Antegrade IMN L femur"
  description: "22-year-old man with a closed midshaft left femoral fracture after a motorbike crash. Stable, isolated injury."
  implants: "Synthes Expert femoral nail 11 x 400 mm, 2 proximal and 2 distal locking screws"
  complications: "First distal locking screw missed the nail hole on freehand technique; redirected under perfect-circle views and nail engaged."

ortho_trauma_minor_010:
  operation: "Humeral nail, right, antegrade"
  description: "76-year-old woman with a segmental humeral shaft fracture after a fall at a bus stop."
  implants: "Synthes MultiLoc humeral nail 8 x 220 mm, 3 proximal and 2 distal screws"
  complications: "Proximal targeting arm loosened and jig drilling missed; jig retightened, check wire used and screws placed correctly."

ortho_trauma_minor_011:
  operation: "ORIF left ankle (Weber B), fibular plate"
  description: "48-year-old woman with a displaced Weber B left ankle fracture after slipping on stairs."
  implants: "Synthes 3.5 mm one-third tubular plate 6-hole, 5 screws, 1 lag screw"
  complications: "Thigh tourniquet failed at 20 minutes; replaced with a new cuff and procedure continued with total tourniquet time 75 minutes."

ortho_trauma_minor_012:
  operation: "Clavicle ORIF, left (superior plating)"
  description: "29-year-old mountain biker with a comminuted, shortened left midshaft clavicle fracture."
  implants: "Synthes 3.5 mm superior anterior clavicle LCP 7-hole, 7 screws"
  complications: "Drill plunged past the inferior cortex; small apical pneumothorax on table screen treated with oxygen and a check film, no drain needed."

ortho_trauma_minor_013:
  operation: "SSRF right ribs 5-8"
  description: "58-year-old woman with multiple displaced right rib fractures and failure to wean from non-invasive ventilation."
  implants: "DePuy Synthes MatrixRIB plates x4, 24 screws"
  complications: "Parietal pleura breached during reduction of rib 6; pneumothorax managed with an intercostal drain placed under direct vision."

ortho_trauma_minor_014:
  operation: "ORIF distal radius, volar plate, right"
  description: "58-year-old woman with a displaced extra-articular right distal radius fracture after tripping over a dog lead."
  implants: "Acumed Acu-Loc 2 volar plate narrow, 7 locking pegs, 3 shaft screws"
  complications: "Drill bit broke in the distal fragment; tip left buried in the metaphysis away from the joint and a new peg placed alongside."

ortho_trauma_minor_015:
  operation: "Dorsal plating distal radius (L) + EPL inspection"
  description: "39-year-old man, fall from a scooter, dorsally comminuted left distal radius fracture with dorsal die-punch fragment."
  implants: "Synthes 2.4 mm dorsal L-plate + radial column plate, 10 screws"
  complications: "Partial (about 30%) laceration of EPL during exposure; tendon repaired with a 4-0 epitendinous suture and transposed out of the third compartment."

ortho_trauma_minor_016:
  operation: "ORIF olecranon with precontoured plate"
  description: "72-year-old woman with a comminuted olecranon fracture after a fall from a bus step."
  implants: "Acumed olecranon plate 3-hole long, 9 x 3.5 mm screws incl. home-run screw"
  complications: "Home-run screw breached the anterior ulnar cortex on lateral view; exchanged for a shorter screw."

ortho_trauma_minor_017:
  operation: "Closed reduction and K-wire fixation, supracondylar humerus"
  description: "7-year-old boy with an extension-type Gartland III supracondylar fracture after falling off a trampoline."
  implants: "3 x 1.6 mm lateral K-wires, left proud"
  complications: "Medial wire considered but ulnar nerve felt subluxing in flexion; medial wire withdrawn and third lateral wire used instead."

ortho_trauma_minor_018:
  operation: "Cannulated screws for intracapsular NOF, right"
  description: "62-year-old woman with an undisplaced right intracapsular hip fracture after falling off a step. Independent."
  implants: "3 x 7.3 mm Synthes cannulated screws 90-100 mm, washers"
  complications: "Posterior screw breached the posterior neck on lateral view; withdrawn and redirected within bone."

ortho_trauma_minor_019:
  operation: "In situ fixation of SUFE, right"
  description: "13-year-old boy with a chronic stable right slipped upper femoral epiphysis and a waddling gait."
  implants: "Single 7.3 mm cannulated screw 85 mm"
  complications: "Guidewire penetrated the joint on live screening; withdrawn 5 mm, screw length reduced and screw confirmed intraosseous on approach-withdraw."

ortho_trauma_minor_020:
  operation: "MUA and K-wiring left distal radius"
  description: "67-year-old woman with a redisplaced left distal radial fracture in plaster, lives alone, right-handed."
  implants: "2 x 1.6 mm K-wires, left proud"
  complications: "Superficial radial nerve branch seen tented over the wire on a mini-open check; wire withdrawn and reinserted through a protected incision."

ortho_trauma_minor_021:
  operation: "External fixation of open tibial fracture + debridement"
  description: "33-year-old cyclist hit by a van, Gustilo IIIA open right tibial fracture. BOAST 4 pathway; plastics present."
  complications: "Proximal Schanz pin found through the posterior cortex into soft tissue; withdrawn and pin repositioned bicortically."

ortho_trauma_minor_022:
  operation: "Pelvic external fixator (iliac crest pins)"
  description: "47-year-old man, crushed under a tractor, open-book pelvic injury with haemodynamic instability. Major trauma centre."
  complications: "Pin exited the inner table of the ilium on inlet view; replaced along a better trajectory."

ortho_trauma_minor_023:
  operation: "Closed reduction of both-bone forearm fracture under GA"
  description: "9-year-old girl who fell off a horse, displaced left midshaft radius and ulna fractures. Paediatric trauma list."
  complications: "Ceftriaxone given at induction despite a documented cephalosporin rash; noticed at sign-out, monitored and no reaction occurred, incident reported."

ortho_trauma_minor_024:
  operation: "MUA ankle fracture-dislocation + backslab"
  description: "79-year-old woman with a trimalleolar fracture-dislocation of the right ankle, skin tented medially."
  complications: "Hypotension to 70 systolic after spinal anaesthetic; treated with fluids and metaraminol and manipulation completed."

ortho_trauma_minor_025:
  operation: "Closed reduction of dislocated hip replacement under GA"
  description: "73-year-old man, posterior dislocation of his right total hip replacement while bending to tie shoelaces. Out of hours."
  complications: "Hip unstable after reduction, re-dislocating at 60 degrees of flexion; placed in a hip brace."

ortho_trauma_minor_026:
  operation: "Reduction of shoulder dislocation under GA"
  description: "83-year-old woman with a 3-day-old anterior shoulder dislocation found by her carer. Osteoporotic."
  complications: "Laryngospasm on emergence treated with CPAP and propofol, settling within a minute."

ortho_trauma_minor_027:
  operation: "Skeletal traction via distal femoral pin"
  description: "68-year-old man with a comminuted femoral shaft fracture, awaiting transfer to a major trauma centre."
  complications: "Pin passed too anterior and exited through the patellofemoral region on screening; withdrawn and reinserted proximal to the adductor tubercle."

ortho_trauma_minor_028:
  operation: "Removal of IM nail and locking screws, left tibia"
  description: "45-year-old man with anterior knee pain and a prominent tibial nail, fracture united."
  complications: "Extraction bolt failed to engage the nail thread; universal extraction hook passed and nail removed."

ortho_trauma_minor_029:
  operation: "ROM right DHS"
  description: "56-year-old man with lateral thigh pain from a prominent hip screw plate; fracture united."
  complications: "Count discrepancy of one swab at closure; found in the drape on search and X-ray not required."

ortho_trauma_minor_030:
  operation: "ORIF tibial plateau, lateral, via anterolateral approach"
  description: "46-year-old woman, split-depression right lateral tibial plateau after a cycling fall."
  implants: "Stryker AxSOS 3 proximal lateral tibial plate, 8 screws; Norian SRS 10 ml"
  complications: "Glove perforation noted with the plate in hand; plate rinsed, gloves and gown changed, extra antibiotic dose given."

ortho_trauma_minor_031:
  operation: "ORIF acetabulum via ilioinguinal approach"
  description: "52-year-old man, fall from a roof, both-column acetabular fracture on the left."
  implants: "3.5 mm pelvic reconstruction plate 14-hole, 2 x 3.5 mm column screws"
  complications: "Brisk bleeding from a corona mortis vessel during dissection; clipped and ligated with 300 ml blood loss."

ortho_trauma_minor_032:
  operation: "ORIF Lisfranc injury, right foot"
  description: "35-year-old woman who stepped off a kerb awkwardly, displaced Lisfranc fracture-dislocation."
  implants: "3 x 3.5 mm solid screws (medial column), 1 x 3.5 mm Lisfranc screw, 2 x 1.6 mm K-wires lateral column left proud"
  complications: "Core temperature fell to 35.0°C during a long case; forced-air warming and warmed fluids restored normothermia."

ortho_trauma_minor_033:
  operation: "Circular frame application, left tibial pilon"
  description: "57-year-old man with diabetes and neuropathy, comminuted distal tibial pilon fracture, not a candidate for plating."
  complications: "Fine wire passed close to the anterior tibial artery with brisk pulsatile ooze; wire removed, pressure applied and bleeding stopped, wire re-sited."

ortho_trauma_minor_034:
  operation: "Skin traction replaced with tibial pin traction, right"
  description: "90-year-old woman with a right acetabular fracture, unfit for surgery, pain uncontrolled in skin traction."
  complications: "Rash and mild bronchospasm after chlorhexidine skin prep; washed off, treated with chlorphenamine and salbutamol, procedure completed."
