bladder_cancer_001:
  modality: PET-CT
  diagnosis: Non-Muscle-Invasive Bladder Cancer (NMIBC)
  description: 47-year-old female presenting with flank pain and hematuria. Completed
    neoadjuvant chemotherapy, for restaging. Assessment of treatment response.
bladder_cancer_002:
  modality: CT Abdomen and Pelvis
  diagnosis: Urothelial Carcinoma of Bladder
  description: 81-year-old male presenting with pelvic pain and weight loss. Prior
    history of NMIBC, now presenting with recurrent hematuria. Staging evaluation
    to rule out metastasis.
