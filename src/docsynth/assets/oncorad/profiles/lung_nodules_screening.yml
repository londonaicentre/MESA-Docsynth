lung_nodule_001:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "59-year-old male, current smoker with a 32 pack-year history. Medical background is notable for chronic obstructive pulmonary disease (COPD) managed on dual bronchodilators, and diet-controlled type 2 diabetes. He reports a chronic morning cough, unchanged for the past five years, but denies hemoptysis, unexplained weight loss, or night sweats. He is currently attending his routine baseline NHS Targeted Lung Health Check screening."

lung_nodule_002:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "66-year-old female, ex-smoker with a 28 pack-year history who quit 6 years ago following a myocardial infarction. Her cardiovascular health is now stable post-stenting, and she maintains an active lifestyle. She occasionally experiences mild exertional dyspnea, which her cardiologist attributes to mild diastolic dysfunction. She has no acute respiratory symptoms and is participating in the baseline NHS Targeted Lung Health Check screening."

lung_nodule_003:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Benign Granuloma"
  description: "62-year-old male, 35 pack-year ex-smoker with a complex respiratory past, including a history of treated pulmonary tuberculosis in adolescence during his time living abroad. He frequently requires brief courses of oral corticosteroids during winter exacerbations of chronic bronchitis. He is now attending his baseline targeted lung cancer screening."

lung_nodule_004:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "71-year-old male, active smoker with a 45 pack-year history. His past medical history includes an appendectomy in his 20s and mild hypertension. He has noticed increasing fatigue over the past few months but attributes it to his age. He is attending round 2 of annual surveillance in the national lung cancer screening programme."

lung_nodule_005:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "54-year-old female, lifetime non-smoker, with a recent history of acute right lower quadrant abdominal pain that led to a diagnosis of acute appendicitis and subsequent laparoscopic appendectomy. Her recovery was uneventful. She is now undergoing a 12-month Fleischner surveillance CT following findings initially discovered during her pre-operative abdominal CT scan."

lung_nodule_006:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "64-year-old female, current smoker with a 30 pack-year history. She has been experiencing mild, intermittent chest tightness which was evaluated by cardiology and deemed non-cardiac in origin. She is currently undergoing a 6-month short-interval follow-up low-dose CT after prior baseline screening results."

lung_nodule_007:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "48-year-old male, lifetime non-smoker, who was involved in a high-speed cycling accident two years ago resulting in multiple rib fractures and a clavicle fracture. He underwent extensive rehabilitation and has since returned to baseline physical activity. He is now undergoing a 24-month definitive stability CT evaluation."

lung_nodule_008:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "68-year-old male, 40 pack-year ex-smoker, who recently recovered from a severe bout of community-acquired pneumonia that required a brief hospitalization and IV antibiotics. His cough has mostly resolved, but he still feels easily fatigued. He is undergoing a 3-month interval low-dose CT surveillance."

lung_nodule_009:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "63-year-old female, 15 pack-year ex-smoker, who presented with postmenopausal bleeding three months ago and was diagnosed with early-stage endometrial adenocarcinoma following a hysteroscopy and biopsy. She is scheduled for a total abdominal hysterectomy and bilateral salpingo-oophorectomy next month. Currently undergoing pre-operative staging CT."

lung_nodule_010:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "57-year-old female, active smoker with a 26 pack-year history. She works as a high school teacher and reports a high-stress lifestyle, but generally good health other than medically managed hypothyroidism. She has no respiratory symptoms and is presenting for her initial round 1 targeted lung health check mobile unit screening."

lung_nodule_011:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Benign Granuloma"
  description: "69-year-old male, lifetime non-smoker. He suffers from severe osteoarthritis of the right hip, significantly limiting his mobility over the past two years. He has a documented childhood history of primary histoplasmosis from growing up on a farm in the Midwest. He is currently undergoing pre-operative thoracic assessment prior to an elective total hip arthroplasty."

lung_nodule_012:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "56-year-old male, light ex-smoker with a 10 pack-year history. He recently underwent comprehensive cardiac evaluation due to a strong family history of early coronary artery disease, which included a coronary artery calcium scoring scan. He remains asymptomatic from a respiratory standpoint and is undergoing a 6-month follow-up CT."

lung_nodule_013:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "65-year-old male, ex-smoker with a 38 pack-year history who quit 3 years ago following the birth of his grandchild. He has a history of gastroesophageal reflux disease (GERD) for which he takes a daily PPI, but is otherwise healthy. He is attending round 3 of his biennial lung health check screening."

lung_nodule_014:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "51-year-old female, non-smoker, who was admitted to the ICU four months ago with severe sepsis secondary to a right lower lobe community-acquired pneumonia. She required brief non-invasive ventilation but ultimately made a full recovery with oral antibiotics at home. She is undergoing a 3-month follow-up CT chest to ensure complete clinical resolution."

lung_nodule_015:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "60-year-old male, 20 pack-year ex-smoker, suffering from chronic intractable sciatica and lumbar spinal stenosis. He recently underwent epidural steroid injections with moderate relief. Following a lumbar spine CT performed last year, he is now undergoing 12-month follow-up imaging."

lung_nodule_016:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "67-year-old female, 34 pack-year current smoker. She has been losing weight intentionally over the past year through diet and exercise, though she admits to persistent morning smoker's cough. She is attending a 3-month recall low-dose CT to assess volume doubling time following her initial screening."

lung_nodule_017:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Benign Granuloma"
  description: "72-year-old male, 15 pack-year ex-smoker, who underwent an emergency endovascular aneurysm repair (EVAR) for a ruptured abdominal aortic aneurysm two years ago. His postoperative course was complicated by acute kidney injury, which has since resolved. He is undergoing contrast-enhanced CT chest as part of routine post-EVAR surveillance."

lung_nodule_018:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "61-year-old male, active smoker with a 35 pack-year history. He has been diagnosed with mild chronic bronchitis and uses a salbutamol inhaler as needed, especially during the colder months. He has no history of occupational hazard exposures. He is attending his routine baseline NHS Targeted Lung Health Check screening."

lung_nodule_019:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "46-year-old female, lifetime non-smoker, who has a history of recurrent nephrolithiasis and underwent extracorporeal shock wave lithotripsy (ESWL) for a large obstructing stone last year. She has remained stone-free since. She is now undergoing a 3-year surveillance CT following findings initially noted on her renal colic imaging."

lung_nodule_020:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "63-year-old female, 30 pack-year ex-smoker who quit 8 years ago. She is actively involved in community theatre and maintains a very active lifestyle, swimming three times a week. She reports no chest pain, cough, or shortness of breath. She is attending round 2 of her annual lung health check screening."

lung_nodule_021:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "58-year-old male, non-smoker. He presented to the emergency department earlier today with acute, sharp, right-sided pleuritic chest pain and mild tachycardia after returning from a long-haul flight from Australia. D-dimer was elevated. He is undergoing CT pulmonary angiography to exclude pulmonary embolism."

lung_nodule_022:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "62-year-old female, 22 pack-year smoker. She is scheduled for a laparoscopic cholecystectomy next week due to recurrent biliary colic and symptomatic gallstones. During her pre-operative assessment, a routine chest radiograph prompted further investigation. She is undergoing baseline dedicated thin-section volumetric chest CT."

lung_nodule_023:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Benign Granuloma"
  description: "70-year-old male, ex-smoker with a 40 pack-year history. He worked for 35 years as a coal miner and has a known clinical history of remote occupational dust exposure as well as a documented episode of severe fungal pneumonitis in his 40s. He is currently attending baseline targeted lung screening."

lung_nodule_024:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "53-year-old female, non-smoker. Five years ago, she experienced atypical chest pain leading to a comprehensive cardiac workup, including a cardiac CT, which ruled out coronary artery disease but identified a finding requiring long-term follow-up. She is now undergoing her 5-year final surveillance CT."

lung_nodule_025:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "58-year-old male, current smoker with a 29 pack-year history. He works in construction and has occasional exposure to asbestos, though he always wears PPE. He denies any recent cough, hemoptysis, or changes in his exercise tolerance. He is attending baseline community lung cancer screening."

lung_nodule_026:
  modality: "CT Chest with Contrast"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "65-year-old male, 35 pack-year ex-smoker. He was diagnosed with localized bladder transitional cell carcinoma two years ago, treated with transurethral resection and intravesical BCG therapy. He recently reported microscopic hematuria during a routine follow-up. He is undergoing a CT chest with contrast for restaging."

lung_nodule_027:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Benign Granuloma"
  description: "66-year-old female, lifetime non-smoker. She has a documented history of severe chickenpox pneumonia in her early adulthood which required a brief hospital admission. Recently, she has been experiencing mild progressive dyspnea when climbing stairs. She is undergoing high-resolution thoracic CT for further evaluation."

lung_nodule_028:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "68-year-old male, ex-smoker with a 42 pack-year history who successfully stopped smoking 10 years ago using nicotine replacement therapy. He manages his mild benign prostatic hyperplasia with medication and has no respiratory complaints. He is attending round 2 of his annual lung cancer screening."

lung_nodule_029:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "44-year-old male, non-smoker. He recently returned from a prolonged backpacking trip in Southeast Asia and subsequently developed a persistent dry cough and mild eosinophilia, treated symptomatically with suspected parasitic or inflammatory etiology. He is now undergoing a 6-week follow-up CT."

lung_nodule_030:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "61-year-old female, 27 pack-year active smoker. She has a history of recurrent sinusitis and occasional mild asthma exacerbations triggered by cold weather. Following her round 2 screening, she is attending a 6-month interval screening CT to monitor interval changes."

lung_nodule_031:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "57-year-old female, non-smoker. Three years ago, she presented with ptosis and generalized muscle weakness, leading to a diagnosis of myasthenia gravis and subsequent discovery and complete surgical excision of a benign thymoma. Her myasthenia symptoms are well-controlled. She is undergoing a routine 12-month follow-up CT chest."

lung_nodule_032:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "73-year-old male, ex-smoker with a 50 pack-year history. He is a retired dockworker with a history of bilateral knee replacements. He remains independent and active, gardening daily without significant shortness of breath. He is participating in annual surveillance round 3 of the targeted lung health check programme."

lung_nodule_033:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Benign Granuloma"
  description: "64-year-old female, lifetime non-smoker. She was involved in a minor low-speed rear-end road traffic collision two weeks ago. She presented to the ER with neck stiffness and underwent a cervical spine CT, which incidentally captured the lung apices. She is now undergoing a dedicated non-contrast thoracic CT."

lung_nodule_034:
  modality: "CT Chest with Contrast"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "69-year-old male, 38 pack-year ex-smoker. He has been under surveillance for a known descending thoracic aortic aneurysm which has recently reached the threshold size for surgical intervention. He denies any chest or back pain. He is undergoing contrast-enhanced chest CT for pre-operative workup and surgical planning."

lung_nodule_035:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "60-year-old female, active smoker with a 31 pack-year history. She has a history of well-controlled rheumatoid arthritis on methotrexate. She denies any new cough, hemoptysis, or increased susceptibility to respiratory infections. She is attending her baseline NHS Targeted Lung Health Check screening."

lung_nodule_036:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "52-year-old male, lifetime non-smoker. He is a keen marathon runner who underwent a chest CT two years ago as part of a private executive health screening package. He remains entirely asymptomatic with excellent exercise tolerance. He is undergoing a 2-year Fleischner follow-up CT."

lung_nodule_037:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "66-year-old male, 44 pack-year current smoker. He suffers from peripheral arterial disease and experiences bilateral calf claudication after walking short distances. He was recently started on clopidogrel and a high-dose statin. He is attending a 3-month follow-up low-dose CT."

lung_nodule_038:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Benign Granuloma"
  description: "71-year-old female, 10 pack-year ex-smoker. She presented to her GP with a recent change in bowel habits and unexplained iron deficiency anemia. A subsequent colonoscopy revealed a lesion in the ascending colon, confirmed as early colonic adenocarcinoma. She is now undergoing a staging CT chest, abdomen, and pelvis."

lung_nodule_039:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "62-year-old male, 33 pack-year active smoker. He has a history of type 2 diabetes complicated by mild peripheral neuropathy, but his HBA1c has been improving with lifestyle changes. He was identified as high-risk during a primary care consultation. He is attending his baseline targeted lung screening."

lung_nodule_040:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "55-year-old female, non-smoker. A year ago, she experienced severe right upper quadrant abdominal pain and was diagnosed with acute cholecystitis, managed conservatively with antibiotics. Her gallbladder has been asymptomatic since. She is now undergoing a 12-month interval surveillance CT."

lung_nodule_041:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "67-year-old female, ex-smoker with a 36 pack-year history who quit 5 years ago. She has a history of mild osteoporosis managed with oral bisphosphonates. She enjoys daily walks with her dog and has no limitations in her exercise capacity. She is attending round 2 annual screening in the targeted lung health check programme."

lung_nodule_042:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "61-year-old male, 20 pack-year ex-smoker. Three months ago, he was diagnosed with organizing pneumonia following a protracted illness characterized by dry cough, low-grade fevers, and malaise. He was treated with a prolonged course of oral macrolides and systemic steroids. He is now undergoing a 3-month follow-up CT chest."

lung_nodule_043:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "59-year-old female, 18 pack-year ex-smoker. She underwent a CT abdomen and pelvis six months ago for investigation of unexplained weight loss and altered bowel habits, which ultimately yielded no malignant etiology, diagnosing irritable bowel syndrome instead. She is now undergoing a 6-month interval Fleischner surveillance CT."

lung_nodule_044:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Benign Granuloma"
  description: "65-year-old male, 30 pack-year ex-smoker. He has a history of extensive international travel in his youth, during which he contracted a severe pulmonary fungal infection that required prolonged antifungal therapy. He is currently asymptomatic and attending round 1 of targeted lung cancer screening."

lung_nodule_045:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "49-year-old female, lifetime non-smoker. She has a strong family history of hypertrophic cardiomyopathy and underwent a comprehensive cardiac MRI and CT workup two years ago. Her cardiac function remains normal and she is asymptomatic. She is undergoing a 2-year stability surveillance CT."

lung_nodule_046:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "63-year-old male, current smoker with a 40 pack-year history. He has a known history of severe sleep apnea, for which he uses CPAP nightly. He recently complained of increased daytime somnolence and a worsening, productive morning cough. He is undergoing a 3-month short-interval follow-up low-dose CT."

lung_nodule_047:
  modality: "CT Chest with Contrast"
  diagnosis: "None - Benign Granuloma"
  description: "68-year-old male, lifetime non-smoker. He immigrated from a region with high endemic tuberculosis rates and was treated for primary tuberculosis in childhood. He has developed a large symptomatic ventral hernia and is undergoing pre-operative CT evaluation prior to an elective abdominal wall hernia repair."

lung_nodule_048:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "70-year-old female, ex-smoker with a 32 pack-year history who quit 12 years ago. She has well-controlled essential hypertension and hyperlipidemia. She reports no new pulmonary symptoms and has been faithfully attending all her medical check-ups. She is attending round 2 biennial screening in the NHS Targeted Lung Health Check programme."

lung_nodule_049:
  modality: "Volumetric CT Thorax without Contrast"
  diagnosis: "None - Incidental Pulmonary Nodule"
  description: "58-year-old male, non-smoker. One year ago, he sustained a minor fall from a ladder resulting in mid-back pain. A CT of his thoracic spine revealed minor compression fractures, which have since healed with conservative management and physiotherapy. He is now undergoing a 12-month follow-up CT scan."

lung_nodule_050:
  modality: "Low-Dose CT Thorax"
  diagnosis: "None - Lung Cancer Screening"
  description: "64-year-old male, active smoker with a 37 pack-year history. His medical history includes a transient ischemic attack (TIA) five years ago, since which he has been strictly compliant with aspirin and blood pressure medications. He denies any cough, dyspnea, or chest pain, and is presenting for baseline NHS Targeted Lung Health Check screening."

lung_nodule_051:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "66-year-old male with a 40 pack-year smoking history who initially enrolled in the screening program but now reports newly developed right shoulder pain radiating down the ulnar nerve distribution. His clinical presentation raises concern for a superior sulcus tumor, prompting further evaluation of previously stable nodules."

lung_nodule_052:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "72-year-old female ex-smoker undergoing lung cancer screening. She recently completed a course of thoracic radiation for a different malignancy and has developed a persistent dry cough and mild exertional dyspnea. The clinical team is evaluating her for radiation pneumonitis versus a new primary lesion."

lung_nodule_053:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "60-year-old male current smoker in the screening program who was recently started on immunotherapy for concurrent melanoma. He presents with acute shortness of breath and profound fatigue. He is being assessed for immune-mediated pneumonitis alongside his routine nodule surveillance."

lung_nodule_054:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "68-year-old female with a significant smoking history presenting for follow-up of a known lung nodule. She has concurrently developed left-sided ptosis, miosis, and severe left shoulder pain, highly suspicious for an apical thoracic malignancy (Pancoast tumor) requiring urgent workup."

lung_nodule_055:
  modality: "Low-Dose CT Thorax"
  diagnosis: "Indeterminate Pulmonary Nodule"
  description: "65-year-old male undergoing annual screening who also received prior chest radiotherapy for lymphoma. He now complains of progressive dysphagia, low-grade fevers, and worsening chronic cough, raising the possibility of late treatment-related toxicities such as chronic radiation pneumonitis."
