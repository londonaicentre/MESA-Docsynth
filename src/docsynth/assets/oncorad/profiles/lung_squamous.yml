lung_scc_001:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "68-year-old male, 45 pack-year smoking history. Presented to primary care with progressive fatigue, a persistent dry cough for 6 months, and recent onset of frank hemoptysis. Scheduled for initial diagnostic evaluation."

lung_scc_002:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "62-year-old female with known severe COPD. Admitted following a 3-week history of blood-tinged sputum and worsening exertional dyspnea. Bronchoscopic biopsy confirmed moderately differentiated squamous cell carcinoma. Baseline workup for treatment planning."

lung_scc_003:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "71-year-old male presenting with a 4-month history of progressive right shoulder and periscapular pain, initially treated as musculoskeletal. Recently developed right-hand weakness and ipsilateral ptosis, prompting urgent oncologic evaluation."

lung_scc_004:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "59-year-old male ex-smoker. Initially treated for a right-sided pneumonia that failed to resolve despite multiple courses of antibiotics. Bronchoscopy visualized a suspicious endobronchial abnormality. Further staging required."

lung_scc_005:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "66-year-old female admitted with confusion, lethargy, and symptomatic hypercalcemia. Laboratory workup showed elevated PTHrP, raising high clinical suspicion for a paraneoplastic syndrome secondary to an underlying malignancy."

lung_scc_006:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "74-year-old male with significant occupational asbestos exposure and tobacco use. Presented acutely to the emergency department with facial plethora, bilateral neck vein engorgement, and severe orthopnea, clinically consistent with superior vena cava syndrome."

lung_scc_007:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "64-year-old female smoker presenting with a new-onset persistent hoarseness over the past month. ENT evaluation revealed left vocal cord paralysis. Referred for extensive staging to investigate a suspected central thoracic malignancy."

lung_scc_008:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "70-year-old male with a recent biopsy confirming squamous cell carcinoma. Patient has experienced recurrent lower respiratory tract infections and progressive weight loss. Currently undergoing workup ahead of a scheduled multidisciplinary tumor board review."

lung_scc_009:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "67-year-old male smoker presenting with episodes of hemoptysis and localized right-sided pleuritic chest pain. Reports an unintentional 8 kg weight loss over the past 3 months. Referred for complete initial staging."

lung_scc_010:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "57-year-old female complaining of a localized persistent wheeze and chronic cough. Sputum cytology recently returned positive for malignant squamous cells. Admitted for comprehensive baseline staging to determine local tumor extent."

lung_scc_011:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "73-year-old male with an incidental finding on a chest radiograph performed for routine pre-operative clearance for an elective hernia repair. Patient is currently asymptomatic. Referred for metabolic characterization of the finding."

lung_scc_012:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "69-year-old female with a 50 pack-year smoking history. Noted to have progressive anorexia, shortness of breath, and recurrent minor hemoptysis. Undergoing a complete diagnostic pathway for a suspected primary bronchogenic process."

lung_scc_013:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "63-year-old male recently diagnosed with squamous cell carcinoma via bronchoscopy. Currently being evaluated by thoracic surgery to determine anatomical feasibility for lung-sparing resection versus pneumonectomy."

lung_scc_014:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "60-year-old male with early-stage clinical squamous cell carcinoma undergoing definitive pre-operative workup. Scheduled for a left upper lobectomy and requires exclusion of occult advanced disease prior to surgical intervention."

lung_scc_015:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "65-year-old female with biopsy-proven peripheral squamous cell carcinoma. Preparing for video-assisted thoracoscopic surgery (VATS). Requires final pre-operative confirmation of no intra-abdominal spread or major vascular anomalies."

lung_scc_016:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "72-year-old male with confirmed squamous cell carcinoma being considered for surgical resection. Patient has borderline pulmonary function tests; surgical team requires detailed anatomical mapping to assess resectability and margin clearance."

lung_scc_017:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "58-year-old female, deemed a candidate for curative-intent surgery for a biopsy-confirmed squamous cell carcinoma. Admitted for complete systemic staging to rule out synchronous primary lesions before proceeding to the operating room."

lung_scc_018:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "67-year-old male with a localized, biopsy-proven squamous cell carcinoma. Planned for an open thoracotomy next week. Routine pre-operative assessment to definitively exclude adrenal or abdominal nodal involvement."

lung_scc_019:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "64-year-old male with borderline resectable squamous cell carcinoma. Recently underwent a staging mediastinoscopy. Currently requiring a metabolic scan to re-evaluate indeterminate lymph nodes prior to making a final surgical decision."

lung_scc_020:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "75-year-old male with an early-stage squamous cell carcinoma, deemed medically unfit for surgical resection due to severe ischemic heart disease. Referred to radiation oncology for pre-treatment planning for stereotactic body radiotherapy."

lung_scc_021:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "70-year-old female with confirmed squamous cell carcinoma. Planned for stereotactic ablative radiotherapy (SABR) as she declined surgery. Requires a final scan to strictly rule out regional nodal metastasis before treatment initiation."

lung_scc_022:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "66-year-old male currently scheduled for a robotic-assisted lobectomy for clinical stage IB squamous cell carcinoma. Routine immediate pre-operative scan requested to ensure disease stability over the 6-week waiting period."

lung_scc_023:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "61-year-old male with locally advanced stage IIIA squamous cell carcinoma. Just completed 3 cycles of neoadjuvant chemo-immunotherapy. Scheduled for surgical resection pending evidence of metabolic response on this restaging scan."

lung_scc_024:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "68-year-old female with stage IIIB squamous cell carcinoma. Has completed 6 weeks of definitive concurrent platinum-based chemoradiotherapy. Presenting for initial assessment of therapeutic response and treatment tolerance."

lung_scc_025:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "65-year-old male recovering from chemoradiotherapy for a central squamous cell lung cancer. Now 3 months post-treatment, asymptomatic. Scan requested to differentiate post-radiation pneumonitis from residual active malignancy."

lung_scc_026:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "72-year-old male with metastatic squamous cell carcinoma. Currently tolerating first-line carboplatin, paclitaxel, and pembrolizumab. Presenting for mid-treatment restaging after completing 4 cycles of systemic therapy."

lung_scc_027:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "56-year-old female with superior sulcus squamous cell carcinoma. Has completed induction chemoradiation with significant improvement in her radicular arm pain. Referred for restaging to determine if the tumor is now surgically resectable."

lung_scc_028:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "70-year-old male with locally advanced squamous cell carcinoma treated with definitive chemoradiation. Originally presented with severe post-obstructive atelectasis, now being monitored for clinical and anatomical resolution."

lung_scc_029:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "63-year-old female with advanced squamous cell lung cancer, currently maintained on single-agent immunotherapy. Clinically well with no new symptoms. Attending for a routine 3-month therapeutic response assessment."

lung_scc_030:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "69-year-old male with stage III squamous cell carcinoma. Now 12 weeks post-completion of stereotactic body radiotherapy. Follow-up requested to evaluate treatment efficacy and investigate persistent indeterminate symptoms."

lung_scc_031:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "64-year-old male with advanced squamous cell carcinoma causing severe airway compromise. Recently underwent rigid bronchoscopy with endobronchial stent placement and palliative radiotherapy. Scan requested to verify symptom control."

lung_scc_032:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "76-year-old female with metastatic squamous cell carcinoma, currently receiving second-line docetaxel after progression on first-line agents. Experiencing manageable fatigue. Presenting for a mid-cycle disease control assessment."

lung_scc_033:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "67-year-old male, recovering well post curative-intent right upper lobectomy and adjuvant chemotherapy for pathological stage IIA squamous cell carcinoma. Attending for routine 6-month surveillance; currently asymptomatic."

lung_scc_034:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "71-year-old female, exactly 12 months post-operative from a left lower lobectomy for squamous cell carcinoma. Patient is highly active and reports no respiratory complaints. Routine annual oncologic surveillance."

lung_scc_035:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "62-year-old male, 1-year surveillance following definitive concurrent chemoradiotherapy and consolidation durvalumab for stage IIIA squamous cell lung cancer. Lung function is stable, no new clinical concerns."

lung_scc_036:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "68-year-old male, 18-month follow-up post stereotactic radiotherapy for early-stage squamous cell carcinoma. Developing minor cough. Scan requested to evaluate the ablation site for possible recurrence versus benign fibrosis."

lung_scc_037:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "73-year-old female, 24-month oncology follow-up following a right pneumonectomy for central squamous cell carcinoma. Patient has adapted well to single lung function. Routine surveillance to rule out distant metastasis."

lung_scc_038:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "59-year-old male, attending for a 2-year routine surveillance scan post right middle lobectomy. Patient remains in clinical remission, actively working, and has successfully maintained smoking cessation."

lung_scc_039:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "66-year-old female, presenting for a 3-year disease-free surveillance scan following radical chemoradiotherapy for locally advanced squamous cell carcinoma. No new palpable lymphadenopathy or systemic symptoms on examination."

lung_scc_040:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "70-year-old male, 3-year post-operative surveillance following a complex sleeve resection for squamous cell carcinoma. Patient has chronic mild wheeze but no acute changes. Monitoring for long-term surgical complications or relapse."

lung_scc_041:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "65-year-old male with a history of surgically resected squamous cell carcinoma 18 months prior. Presents urgently with new-onset hemoptysis and a worsening chronic cough, raising high clinical suspicion for local recurrence."

lung_scc_042:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "72-year-old female treated with definitive chemoradiotherapy 1 year ago. Recently developed progressive dyspnea at rest and generalized fatigue. Admitted for evaluation of suspected disease progression or severe late radiation toxicity."

lung_scc_043:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "64-year-old male with previously treated squamous cell carcinoma. Complaining of new, dull right upper quadrant abdominal pain, anorexia, and recently documented elevated transaminases. Investigating for potential distant metastatic spread."

lung_scc_044:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "69-year-old male with a history of stage IIB squamous cell carcinoma in remission. Now presenting with persistent, unremitting thoracic back pain that wakes him at night, alongside elevated serum alkaline phosphatase levels."

lung_scc_045:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "61-year-old female, 14 months post-lobectomy for squamous cell carcinoma. Noted by her general practitioner to have an unexplained 5 kg weight loss, worsening fatigue, and night sweats over the last 4 weeks. Restaging indicated."

lung_scc_046:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "75-year-old male, previously treated for squamous cell carcinoma. Routine follow-up identified new, indeterminate clinical symptoms. Referred for comprehensive metabolic restaging to assess for oligometastatic recurrence."

lung_scc_047:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "67-year-old male with recurrent squamous cell carcinoma on second-line immunotherapy. Presented to the acute medical unit with acute dyspnea, dry cough, and low-grade fevers. Urgent evaluation required to rule out immune-mediated pneumonitis."

lung_scc_048:
  modality: "CT TAP"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "70-year-old female with advanced squamous cell carcinoma on palliative chemotherapy. Noted to have new, rapidly progressive abdominal distension, early satiety, and bilateral lower extremity edema. Assessing for abdominal disease progression."

lung_scc_049:
  modality: "PET-CT"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "63-year-old male with a history of curative-intent chemoradiotherapy for squamous cell carcinoma 2 years ago. Noticed a new, firm, non-tender palpable mass in the right supraclavicular fossa. Undergoing full restaging."

lung_scc_050:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "68-year-old male with known active squamous cell carcinoma currently on systemic therapy. Admitted via emergency services with acute, worsening hemoptysis and severe localized chest wall pain. Urgent scan for complication management."

lung_scc_051:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "65-year-old male with a heavy smoking history presenting with severe, unrelenting right shoulder pain radiating down the ulnar aspect of his arm. He has noticed recent drooping of his right eyelid and decreased sweating on the right side of his face. He is referred for evaluation of a suspected superior sulcus process."

lung_scc_052:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "71-year-old female who completed a curative-intent course of thoracic radiation therapy for squamous cell carcinoma two months ago. Over the past two weeks, she has developed a progressive dry cough, low-grade fevers, and worsening exertional dyspnea that is refractory to standard antibiotics. Evaluated for suspected radiation-induced pulmonary toxicity."

lung_scc_053:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "58-year-old male with advanced squamous cell carcinoma currently responding well to immunotherapy. He presents to the acute care clinic with acute onset of severe shortness of breath, fatigue, and a non-productive cough. Oxygen saturation is depressed on room air. The clinical picture is highly suspicious for immune-mediated pneumonitis."

lung_scc_054:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "62-year-old female presenting with progressive weakness in her left hand, specifically difficulty gripping objects, accompanied by shooting pain down the medial aspect of her left arm. She also reports an unintentional 5 kg weight loss over the past three months. Referred for evaluation of a potential apical thoracic lesion."

lung_scc_055:
  modality: "CT Thorax & Abdomen with Contrast"
  diagnosis: "Squamous Cell Carcinoma of Lung"
  description: "69-year-old male who received definitive stereotactic body radiation therapy for a localized squamous cell carcinoma six weeks ago. He now complains of significant retrosternal discomfort when swallowing solid foods, as well as a new, persistent hacking cough. The clinical team suspects treatment-related esophagitis and associated pneumonitis."
