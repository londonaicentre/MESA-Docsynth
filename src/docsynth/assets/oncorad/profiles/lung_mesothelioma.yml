  description: "69-year-old male, retired pipefitter. Presents with a persistent, dry cough and unintentional 10 lb weight loss over the last six months. He describes a constant, dull ache in his left lower chest. This is a baseline pre-treatment assessment to map all disease sites prior to initiating therapy."

