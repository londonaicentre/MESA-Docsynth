lung_meso_001:
  modality: "CT Thorax with Contrast"
  diagnosis: "Pleural Mesothelioma"
  description: "68-year-old male, retired shipyard worker with confirmed heavy asbestos exposure in his 20s. He presents with a 4-month history of progressive shortness of breath and a dull, aching pain in his right posterior chest wall. A recent chest X-ray showed an abnormality, and he has undergone one therapeutic thoracentesis which provided only temporary relief. This scan is for initial diagnostic evaluation."

lung_meso_002:
  modality: "CT Thorax with Contrast"
  diagnosis: "Pleural Mesothelioma"
  description: "72-year-old male with a history of working in construction and insulation during his 20s. He complains of a persistent, dry cough and unintentional 10 lb weight loss over the last six months. He describes a constant, dull ache in his left lower chest. This scan is ordered to evaluate his symptoms."

lung_meso_003:
  modality: "PET-CT"
  diagnosis: "Pleural Mesothelioma"
  description: "65-year-old male, former boiler room operator. He reports worsening exertional dyspnea and right-sided pleuritic chest pain. He has a history of recurrent unilateral pleural effusions requiring multiple thoracenteses. Cytology has been non-diagnostic so far. This scan is for systemic staging prior to definitive biopsy."

lung_meso_004:
  modality: "CT TAP"
  diagnosis: "Pleural Mesothelioma"
  description: "59-year-old female, secondary exposure from her spouse who was a pipefitter. Presents with increasing shortness of breath and a sensation of chest tightness. She reports night sweats and fatigue. Referred for definitive evaluation and staging of the unresolved, suspicious condition."

lung_meso_005:
  modality: "CT Thorax with Contrast"
  diagnosis: "Pleural Mesothelioma"
  description: "76-year-old male, retired naval mechanic. He presents with a heavy, aching sensation in the right hemithorax that worsens with deep inspiration. He has noticed a 15 lb weight loss over 4 months. This scan is ordered for initial diagnostic evaluation."

lung_meso_006:
  modality: "CT Thorax without Contrast"
  diagnosis: "Pleural Mesothelioma"
  description: "81-year-old male, former automotive mechanic who frequently worked with brake linings. Presents with recent onset of hoarseness and a persistent cough, along with significant right-sided shoulder pain. This contrast-enhanced thoracic scan is ordered as the primary diagnostic investigation."

lung_meso_007:
  modality: "PET-CT"
  diagnosis: "Pleural Mesothelioma"
  description: "64-year-old male, retired factory worker with occupational asbestos exposure. Presents with severe, unremitting chest pain that frequently wakes him at night, requiring escalating doses of analgesics. This comprehensive systemic staging scan is ordered prior to surgical consultation."

lung_meso_008:
  modality: "CT TAP"
  diagnosis: "Pleural Mesothelioma"
  description: "70-year-old female, lived near an asbestos mine in childhood. Presents with progressive fatigue, anorexia, and a 15 lb weight loss over 4 months, accompanied by worsening breathlessness. This scan is for initial systemic staging to evaluate the extent of suspected malignancy."

lung_meso_009:
  modality: "CT Thorax with Contrast"
  diagnosis: "Pleural Mesothelioma"
  description: "67-year-old male, retired construction worker. Presents with new onset of left-sided chest pain radiating to the back, with associated mild exertional dyspnea. This scan is ordered to evaluate the underlying cause of rapidly reaccumulating pleural fluid."

lung_meso_010:
  modality: "CT Thorax with Contrast"
  diagnosis: "Pleural Mesothelioma"
  description: "71-year-old male, former electrician. Presents with a 2-month history of worsening dyspnea on exertion and low-grade fevers, initially treated as pneumonia without improvement. This scan is ordered for initial diagnostic evaluation."

lung_meso_011:
  modality: "CT TAP"
  diagnosis: "Pleural Mesothelioma"
  description: "62-year-old male, former roofer. Presents with progressive exertional dyspnea and right-sided chest wall pain over the past 3 months. This is a routine treatment response evaluation to confirm ongoing clinical benefit."

