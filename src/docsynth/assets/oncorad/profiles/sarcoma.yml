sarcoma_001:
  modality: "MRI Left Thigh with and without contrast"
  diagnosis: "Suspected soft tissue sarcoma of thigh (unconfirmed)"
  description: "Referred by GP on the 2WW sarcoma pathway: a 47-year-old woman with an enlarging painless lump at the back of the left thigh. Community US showed a large deep mass; local staging before biopsy."

sarcoma_002:
  modality: "US-guided core biopsy Right Thigh mass"
  diagnosis: "Suspected myxoid liposarcoma (unconfirmed)"
  description: "MDT request for core biopsy. 39-year-old man with a slowly enlarging right anterior thigh mass on recent MRI; biopsy tract to be agreed with the operating surgeon."

sarcoma_003:
  modality: "MRI Whole Spine"
  diagnosis: "Myxoid liposarcoma of right thigh"
  description: "Myxoid liposarcoma of the right thigh diagnosed on biopsy last month in a 39-year-old man, staging CT clear. Mild low back pain; spine MRI to complete staging as this subtype can spread to bone."

sarcoma_004:
  modality: "CT Abdomen Pelvis with contrast"
  diagnosis: "Suspected retroperitoneal liposarcoma (unconfirmed)"
  description: "Seen in surgical clinic, a 71-year-old man with diabetes and months of abdominal distension and early satiety. Community US showed a large echogenic right flank mass, ?lipoma; ?retroperitoneal fatty tumour."

sarcoma_005:
  modality: "CT-guided biopsy Left Retroperitoneal mass"
  diagnosis: "Suspected dedifferentiated liposarcoma (unconfirmed)"
  description: "MDT request from the retroperitoneal sarcoma unit. 63-year-old woman with a large fatty left retroperitoneal mass on staging CT containing a separate solid nodule; please biopsy the solid component."

sarcoma_006:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Dedifferentiated liposarcoma of retroperitoneum"
  description: "Post-op surveillance. 58-year-old man, 18 months after en bloc resection of a right retroperitoneal liposarcoma with nephrectomy and hemicolectomy. Asymptomatic; ?local recurrence."

sarcoma_007:
  modality: "MRI Left Humerus with contrast (whole bone)"
  diagnosis: "Suspected osteosarcoma of proximal humerus (unconfirmed)"
  description: "A 16-year-old girl with 2 months of left shoulder pain, now waking her at night. Local X-ray showed an aggressive proximal humeral bone lesion; whole-bone MRI for local staging before biopsy."

sarcoma_008:
  modality: "X-ray Left Knee AP and Lateral"
  diagnosis: "Suspected primary bone tumour (unconfirmed)"
  description: "A&E attendance. 14-year-old boy with 6 weeks of worsening night pain above the left knee and a firm swelling over the distal thigh, told by GP it was growing pains. ?Bony lesion."

sarcoma_009:
  modality: "MRI Left Femur and Knee with contrast"
  diagnosis: "Conventional osteosarcoma of distal femur"
  description: "Pre-surgical planning. 18-year-old man with osteosarcoma of the left distal femur on neoadjuvant MAP, complicated by a pathological fracture through the tumour; limb salvage surgery planned."

sarcoma_010:
  modality: "CT Chest (thin-section, non-contrast)"
  diagnosis: "Osteosarcoma of right distal femur, treated"
  description: "Known osteosarcoma of the right distal femur, treated with chemotherapy and endoprosthetic replacement 18 months ago. Now 19, well; tiny lung nodules on the last scan, surveillance for lung metastases."

sarcoma_011:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Ewing sarcoma of left iliac bone"
  description: "Staging before chemotherapy. 22-year-old man with biopsy-proven Ewing sarcoma of the left iliac bone after months of buttock pain and fevers. Whole-body staging ahead of VIDE."

sarcoma_012:
  modality: "MRI Pelvis with contrast"
  diagnosis: "Ewing sarcoma of left iliac bone"
  description: "Response assessment after VIDE induction for Ewing sarcoma of the left ilium in a 22-year-old man, now pain free. MDT deciding between surgery and radical radiotherapy; comparison with baseline MRI."

sarcoma_013:
  modality: "CT Chest with contrast"
  diagnosis: "Ewing sarcoma of right 8th rib with pulmonary metastases"
  description: "Seen in the TYA clinic: 17-year-old girl with Ewing sarcoma of a right rib and lung metastases at diagnosis, now after induction VIDE. Response of the lung disease; MDT considering whole-lung radiotherapy."

sarcoma_014:
  modality: "X-ray Right Femur (full length) AP and Lateral"
  diagnosis: "Metastatic breast cancer to bone"
  description: "Metastatic breast cancer to bone on letrozole and palbociclib. This 64-year-old woman has weeks of right thigh pain on weight-bearing; ?risk of fracture for orthopaedic planning."

sarcoma_015:
  modality: "CT Left Humerus (non-contrast)"
  diagnosis: "Metastatic clear cell renal cell carcinoma to bone"
  description: "MDT request: pre-operative planning. 58-year-old man with metastatic renal cell carcinoma and a painful destructive left humeral shaft metastasis; nailing planned after embolisation."

sarcoma_016:
  modality: "X-ray Pelvis and Right Hip"
  diagnosis: "Metastatic prostate adenocarcinoma to bone"
  description: "81-year-old man with prostate cancer and known sclerotic bone metastases, on enzalutamide. Low-energy fall at home, now unable to weight-bear. ?Pathological hip fracture."

sarcoma_017:
  modality: "X-ray Left Humerus"
  diagnosis: "Metastatic non-small cell lung cancer"
  description: "Sudden pain in the upper arm lifting a kettle. 69-year-old woman with metastatic lung cancer and a known left humeral lesion. Please assess."

sarcoma_018:
  modality: "X-ray Right Femur AP and Lateral"
  diagnosis: "Metastatic breast cancer to bone"
  description: "Post-op check 2 weeks after prophylactic nailing of the right femur for a painful breast cancer metastasis judged at high risk of fracture in a 64-year-old woman. Radiotherapy to follow."

sarcoma_019:
  modality: "MRI Right Thigh with contrast"
  diagnosis: "Undifferentiated pleomorphic sarcoma of right thigh, resected"
  description: "Post-op. 66-year-old man, 10 weeks after pre-operative radiotherapy and wide excision of a UPS of the right thigh, with a recurrent seroma at the resection site despite two aspirations. ?Seroma ?Early recurrence."

sarcoma_020:
  modality: "US Left Calf"
  diagnosis: "Myxofibrosarcoma of left calf, resected"
  description: "Frail 78-year-old woman with heart failure, 3 months after excision of a left calf myxofibrosarcoma with a close margin. New soft swelling at the scar; ?collection ?recurrence, aspirate if fluid."

sarcoma_021:
  modality: "CT Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Leiomyosarcoma of the inferior vena cava, resected"
  description: "Inpatient, 4 weeks after resection of an IVC leiomyosarcoma with graft reconstruction. The 52-year-old woman has fevers, rising CRP and high drain output; ?collection or lymphocoele, graft patency."

sarcoma_022:
  modality: "MRI Right Knee with contrast"
  diagnosis: "Suspected synovial sarcoma (unconfirmed)"
  description: "2WW referral via orthopaedics. 29-year-old woman with a slowly enlarging painful lump behind the right knee, thought to be a Baker's cyst, but local US showed a solid and cystic mass. Characterisation."

sarcoma_023:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Metastatic synovial sarcoma"
  description: "Restaging on pazopanib for synovial sarcoma of the left forearm that relapsed in the lungs after doxorubicin and ifosfamide. 35-year-old man, new mild breathlessness; response of lung metastases."

sarcoma_024:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Metastatic uterine leiomyosarcoma"
  description: "55-year-old woman with uterine leiomyosarcoma relapsed in the lungs and liver, midway through first-line doxorubicin. Mid-treatment response scan compared with the pre-chemotherapy baseline."

sarcoma_025:
  modality: "RT Planning CT Left Thigh (non-contrast, immobilisation)"
  diagnosis: "Undifferentiated pleomorphic sarcoma of left thigh"
  description: "Treatment planning. 53-year-old man with a newly diagnosed UPS of the left adductor compartment, staging clear. MDT agreed pre-operative radiotherapy then limb-sparing surgery; planning CT for MRI fusion."

sarcoma_026:
  modality: "CT-guided biopsy Right Pelvis (ilium and acetabulum)"
  diagnosis: "Suspected chondrosarcoma of right pelvis (unconfirmed)"
  description: "Biopsy request from the bone tumour MDT. 61-year-old man with months of right groin ache and a chondroid-looking lesion in the supra-acetabular ilium on X-ray and MRI. ?Chondrosarcoma."

sarcoma_027:
  modality: "CT Chest (non-contrast)"
  diagnosis: "Chondrosarcoma of left proximal humerus, treated"
  description: "Routine annual surveillance for lung metastases. 50-year-old woman, 3 years after resection and endoprosthetic replacement for chondrosarcoma of the left proximal humerus. Well."

sarcoma_028:
  modality: "Whole-body MRI (non-contrast)"
  diagnosis: "No known malignancy: TP53 germline variant carrier (Li-Fraumeni syndrome) surveillance"
  description: "Annual whole-body MRI under the Li-Fraumeni surveillance protocol for a 34-year-old woman with a germline TP53 variant. Small tibial lesion last year, thought to be an enchondroma. Asymptomatic."

sarcoma_029:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Undifferentiated pleomorphic sarcoma of right upper arm, suspected pulmonary relapse"
  description: "Candidate for lung metastasectomy. 44-year-old woman, 2 years after surgery for UPS of the right upper arm, with a new solitary lung nodule on surveillance CT; exclude other disease before surgery."

sarcoma_030:
  modality: "MRI Left Forearm with contrast"
  diagnosis: "Leiomyosarcoma of left forearm, unplanned excision"
  description: "Unplanned excision of a presumed forearm lipoma at a community clinic in a 37-year-old man; histology showed leiomyosarcoma with involved margins. Residual disease before re-excision?"
