gynae_cervix_endometrial_001:
  modality: "MRI Pelvis with contrast (cervix protocol)"
  diagnosis: "Cervical squamous cell carcinoma (diagnosed on LLETZ)"
  description: "Referred from colposcopy after an abnormal cervical screening result; LLETZ last month showed early invasive squamous carcinoma with an involved margin. 34-year-old woman keen to preserve fertility. Staging MRI before possible trachelectomy."

gynae_cervix_endometrial_002:
  modality: "PET-CT skull base to mid-thigh"
  diagnosis: "Cervical squamous cell carcinoma, locally advanced"
  description: "47-year-old woman, never screened, with a large cervical squamous carcinoma found in the 2WW clinic. Staging MRI showed spread towards the left pelvic sidewall with left hydronephrosis. PET-CT for nodal and distant staging before chemoradiotherapy."

gynae_cervix_endometrial_003:
  modality: "MRI Pelvis with contrast (cervix protocol)"
  diagnosis: "Cervical adenocarcinoma, HPV-associated usual type"
  description: "Referred by GP on the 2WW pathway with intermenstrual bleeding; colposcopic biopsy confirmed cervical adenocarcinoma in this 41-year-old smoker. Local staging MRI to guide choice between radical hysterectomy and chemoradiotherapy, including parametrial spread."

gynae_cervix_endometrial_004:
  modality: "CT-guided biopsy para-aortic lymph node"
  diagnosis: "Cervical squamous cell carcinoma with suspected para-aortic nodal disease"
  description: "MDT request: 52-year-old woman with cervical cancer and parametrial invasion; staging PET-CT showed an avid para-aortic node. Confirmation would extend the radiotherapy field. For CT-guided biopsy; apixaban held."

gynae_cervix_endometrial_005:
  modality: "MRI Pelvis brachytherapy planning (applicator in situ)"
  diagnosis: "Cervical squamous cell carcinoma"
  description: "First brachytherapy fraction for a 44-year-old with cervical cancer and bilateral parametrial involvement at diagnosis, having finished pelvic chemoradiotherapy last week. Tandem and ring with interstitial needles in situ; MRI for applicator position and target contouring."

gynae_cervix_endometrial_006:
  modality: "MRI Pelvis brachytherapy planning (applicator in situ)"
  diagnosis: "Cervical squamous cell carcinoma with pelvic nodal disease"
  description: "63-year-old woman with cervical cancer and a positive pelvic node, treated with radiotherapy alone as cisplatin was withheld for CKD. Third brachytherapy insertion today was difficult; MRI with applicator in situ to check position and ?uterine perforation before dosing."

gynae_cervix_endometrial_007:
  modality: "MRI Pelvis with contrast"
  diagnosis: "Cervical squamous cell carcinoma with pelvic nodal disease"
  description: "Seen in follow-up clinic 3 months after chemoradiotherapy and brachytherapy for cervical cancer with parametrial and pelvic nodal disease. 38 years old, well apart from mild proctitis. Response MRI: residual tumour or post-radiotherapy change only?"

gynae_cervix_endometrial_008:
  modality: "PET-CT skull base to mid-thigh"
  diagnosis: "Cervical squamous cell carcinoma, locally advanced"
  description: "56-year-old diabetic woman 3 months after chemoradiotherapy for cervical cancer, whose hydronephrosis at diagnosis was stented. Recent MRI was equivocal at the left fornix. PET-CT to distinguish residual disease from treatment change and restage nodes."

gynae_cervix_endometrial_009:
  modality: "US and fluoroscopy-guided right nephrostomy insertion"
  diagnosis: "Recurrent cervical adenocarcinoma, right pelvic sidewall"
  description: "49-year-old with pelvic sidewall recurrence of cervical adenocarcinoma, on palliative chemotherapy, admitted with AKI and right loin pain. Recent CT showed right hydronephrosis from ureteric encasement and retrograde stenting failed. For right nephrostomy."

gynae_cervix_endometrial_010:
  modality: "US Renal Tract"
  diagnosis: "Cervical squamous cell carcinoma, locally advanced"
  description: "Week 3 of chemoradiotherapy for cervical cancer extending to the right pelvic sidewall; 58-year-old with mild right hydronephrosis on staging MRI. Creatinine now rising and cisplatin held. Renal US: degree of hydronephrosis, need for decompression?"

gynae_cervix_endometrial_011:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Cervical adenocarcinoma, post radical hysterectomy"
  description: "Two years after radical hysterectomy and adjuvant chemoradiotherapy for node-positive cervical adenocarcinoma, this 45-year-old has new left leg swelling and buttock pain; Doppler negative. Last CT showed a stable pelvic lymphocoele. ?Sidewall recurrence."

gynae_cervix_endometrial_012:
  modality: "MRI Pelvis without contrast (pregnancy protocol)"
  diagnosis: "Cervical squamous cell carcinoma in pregnancy"
  description: "33-year-old woman at 20 weeks' gestation with contact bleeding; colposcopic biopsy of a cervical lesion showed squamous carcinoma. The MDT is considering neoadjuvant chemotherapy. Non-contrast MRI to stage tumour, parametria and nodes."

gynae_cervix_endometrial_013:
  modality: "PET-CT skull base to mid-thigh"
  diagnosis: "Recurrent cervical squamous cell carcinoma, central pelvic"
  description: "Fit 61-year-old with biopsy-proven central vault recurrence 3 years after chemoradiotherapy for cervical cancer; MRI margins were hard to separate from post-radiotherapy change. PET-CT to exclude extrapelvic disease before exenteration."

gynae_cervix_endometrial_014:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Metastatic cervical squamous cell carcinoma, lung and para-aortic nodal metastases"
  description: "Known metastatic cervical cancer, now on pembrolizumab and bevacizumab maintenance after chemotherapy, with good response on last CT. 50-year-old with 2 weeks of dry cough and breathlessness. Restaging CT: ?progression ?pneumonitis."

gynae_cervix_endometrial_015:
  modality: "US-guided core biopsy left groin node"
  diagnosis: "Cervical squamous cell carcinoma with lower vaginal involvement, suspected inguinal nodal recurrence"
  description: "67-year-old woman with a new left groin lump 18 months after chemoradiotherapy for cervical cancer involving the lower vagina. Ultrasound last week showed an abnormal inguinal node. For US-guided core biopsy."

gynae_cervix_endometrial_016:
  modality: "US Pelvis transvaginal and transabdominal"
  diagnosis: "Suspected endometrial cancer (unconfirmed)"
  description: "Referred by GP under the 2WW pathway with recurrent postmenopausal bleeding. 62-year-old, obese, with type 2 diabetes, never on HRT. TVUS for endometrial thickness and focal lesion before sampling."

gynae_cervix_endometrial_017:
  modality: "US Pelvis transvaginal"
  diagnosis: "Postmenopausal bleeding on tamoxifen; history of breast cancer"
  description: "Four years into adjuvant tamoxifen for left breast cancer, this 55-year-old has two months of postmenopausal spotting. Rapid access PMB clinic referral; TVUS to assess the endometrium and adnexa."

gynae_cervix_endometrial_018:
  modality: "MRI Pelvis with contrast (endometrial protocol)"
  diagnosis: "Endometrioid endometrial carcinoma, MMR-deficient"
  description: "68-year-old woman with endometrioid endometrial cancer on hysteroscopic biopsy; TVUS showed a thickened endometrium. MRI pelvis for myometrial and cervical stromal invasion and nodes before planned laparoscopic hysterectomy."

gynae_cervix_endometrial_019:
  modality: "PET-CT skull base to mid-thigh"
  diagnosis: "Uterine carcinosarcoma"
  description: "71-year-old with heavy postmenopausal bleeding and biopsy-proven uterine carcinosarcoma; MRI showed a large uterine mass and a pelvic node, and CT noted small indeterminate lung nodules. PET-CT to complete staging before surgery."

gynae_cervix_endometrial_020:
  modality: "MRI Pelvis with contrast (endometrial protocol)"
  diagnosis: "Endometrioid endometrial carcinoma, on fertility-sparing treatment"
  description: "31-year-old with PCOS on progestogen treatment (LNG-IUS plus oral) for early endometrial cancer, hoping to start IVF. Baseline MRI showed no myometrial invasion. Follow-up MRI after 6 months of treatment."

gynae_cervix_endometrial_021:
  modality: "US Pelvis transvaginal"
  diagnosis: "No known malignancy: Lynch syndrome (MSH6 carrier) gynaecological surveillance"
  description: "Asymptomatic 42-year-old MSH6 carrier whose mother had endometrial cancer, attending annual gynaecological surveillance until risk-reducing surgery. Previous scan normal. Surveillance TVUS."

gynae_cervix_endometrial_022:
  modality: "US Pelvis transvaginal"
  diagnosis: "No known malignancy: PTEN hamartoma tumour syndrome surveillance"
  description: "Annual endometrial surveillance for a 38-year-old woman with Cowden syndrome, no abnormal bleeding. Known small uterine fibroid on last year's scan."

gynae_cervix_endometrial_023:
  modality: "RT planning CT Pelvis with contrast"
  diagnosis: "Endometrioid endometrial carcinoma, high-risk features"
  description: "Post-op: 59-year-old woman 6 weeks after laparoscopic hysterectomy and sentinel node biopsy for high-risk endometrioid cancer with deep myometrial invasion, nodes negative. Planning CT for adjuvant pelvic chemoradiotherapy."

gynae_cervix_endometrial_024:
  modality: "MRI Pelvis brachytherapy planning (applicator in situ)"
  diagnosis: "Endometrioid endometrial carcinoma, medically inoperable"
  description: "88-year-old woman with early endometrial cancer, unfit for surgery due to severe aortic stenosis, for primary radiotherapy. Intrauterine brachytherapy applicator inserted today; MRI for applicator position and contouring."

gynae_cervix_endometrial_025:
  modality: "MRI Pelvis with contrast"
  diagnosis: "Recurrent endometrioid endometrial carcinoma, vaginal vault"
  description: "Seen in follow-up clinic with vaginal spotting 4 years after hysterectomy for early endometrial cancer; a vault nodule was biopsied. 77-year-old, active. MRI to assess the vault lesion and nodes before salvage radiotherapy."

gynae_cervix_endometrial_026:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Recurrent endometrioid endometrial carcinoma, MMR-deficient"
  description: "64-year-old with recurrent MMR-deficient endometrial cancer involving para-aortic nodes and peritoneum, on dostarlimab maintenance after chemotherapy with good response last time. Routine restaging CT; raised ALT."

gynae_cervix_endometrial_027:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Recurrent serous endometrial carcinoma, p53-abnormal, MMR-proficient"
  description: "73-year-old woman with recurrent serous endometrial cancer, 3 months into lenvatinib and pembrolizumab. Known left hydronephrosis from a sidewall mass, with a JJ stent. Restaging CT, including stent position."

gynae_cervix_endometrial_028:
  modality: "CT Thorax with contrast"
  diagnosis: "Uterine leiomyosarcoma, post hysterectomy"
  description: "48-year-old woman 18 months after hysterectomy for what proved to be uterine leiomyosarcoma. Last CT showed tiny lung nodules too small to characterise. Surveillance CT thorax."

gynae_cervix_endometrial_029:
  modality: "US-guided core biopsy omental deposit"
  diagnosis: "Suspected serous endometrial carcinoma with peritoneal disease"
  description: "Frail 81-year-old with postmenopausal bleeding, raised CA125, and omental cake with ascites on CT; pipelle non-diagnostic and unfit for hysteroscopy under GA. For US-guided omental biopsy to confirm the primary."

gynae_cervix_endometrial_030:
  modality: "US Pelvis transvaginal and transabdominal"
  diagnosis: "Thickened endometrium on CT (no confirmed malignancy)"
  description: "GP letter: 'CT says thickened endometrium, please scan.' 71-year-old woman had CT in ED for renal colic; no postmenopausal bleeding, on warfarin. TVUS to reassess the endometrium."
