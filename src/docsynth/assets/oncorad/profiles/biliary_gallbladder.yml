biliary_gallbladder_001:
  modality: "US Abdomen (RUQ)"
  diagnosis: "Suspected distal cholangiocarcinoma (unconfirmed)"
  description: "Referred by GP on the 2WW jaundice pathway: 71-year-old man with 3 weeks of painless jaundice, itch and weight loss. Cholecystectomy for gallstones years ago. ?Level of biliary obstruction ?retained duct stone ?mass."

biliary_gallbladder_002:
  modality: "MRI Liver with MRCP"
  diagnosis: "Perihilar cholangiocarcinoma (Klatskin tumour)"
  description: "66-year-old woman, jaundiced, with a hilar stricture on staging CT and a raised CA19-9. HPB MDT request before any drainage: ductal extent and relationship to the portal vein and hepatic arteries."

biliary_gallbladder_003:
  modality: "CT Pancreas Protocol (pancreatic and portal venous phase)"
  diagnosis: "Distal cholangiocarcinoma"
  description: "Man aged 59, recently stented at ERCP for a distal bile duct stricture; brushings showed adenocarcinoma. Fit and keen for surgery. Staging for possible Whipple, including SMV and portal vein involvement."

biliary_gallbladder_004:
  modality: "Percutaneous Transhepatic Cholangiogram and Biliary Drainage (fluoroscopy)"
  diagnosis: "Perihilar cholangiocarcinoma (Klatskin tumour)"
  description: "Urgent inpatient list. 78-year-old man with unresectable hilar cholangiocarcinoma; ERCP failed yesterday and he is now septic with rigors and deepening jaundice. For PTC drainage."

biliary_gallbladder_005:
  modality: "ERCP with Biliary Stent Insertion (fluoroscopy)"
  diagnosis: "Distal cholangiocarcinoma"
  description: "Frail 86-year-old woman from a nursing home with a distal bile duct stricture and probable liver metastases on recent CT. Best supportive care agreed; jaundiced with severe itch. For palliative ERCP and metal stent."

biliary_gallbladder_006:
  modality: "CT Liver Triple Phase"
  diagnosis: "Intrahepatic cholangiocarcinoma"
  description: "Seen in hepatology clinic with raised ALP. Known fatty liver, no cirrhosis. Community ultrasound found a right lobe liver mass. The patient, a 52-year-old man, has had no other imaging. ?HCC ?cholangiocarcinoma ?metastasis."

biliary_gallbladder_007:
  modality: "FDG PET-CT"
  diagnosis: "Perihilar cholangiocarcinoma (Klatskin tumour)"
  description: "Female, 61, biopsy-proven hilar cholangiocarcinoma with a PTC drain in situ, being considered for extended right hepatectomy. Pre-operative staging to exclude distant nodal or metastatic disease."

biliary_gallbladder_008:
  modality: "CT Liver Volumetry (portal venous phase)"
  diagnosis: "Perihilar cholangiocarcinoma (Klatskin tumour)"
  description: "Post right portal vein embolisation 5 weeks ago, ahead of planned extended right hepatectomy for hilar cholangiocarcinoma. 64-year-old man with biliary drains in situ. Please assess left lobe hypertrophy and remnant volume."

biliary_gallbladder_009:
  modality: "Right Portal Vein Embolisation (ultrasound and fluoroscopic guidance)"
  diagnosis: "Perihilar cholangiocarcinoma (Klatskin tumour)"
  description: "MDT outcome: potentially resectable hilar cholangiocarcinoma but the predicted liver remnant is too small. Woman of 57 with a left PTC drain, now afebrile. For right portal vein embolisation."

biliary_gallbladder_010:
  modality: "US-Guided Liver Biopsy"
  diagnosis: "Intrahepatic cholangiocarcinoma"
  description: "Man in his late 40s with an unresectable intrahepatic cholangiocarcinoma; previous biopsy at another Trust was non-diagnostic. Cores needed for histology and molecular testing."

biliary_gallbladder_011:
  modality: "US Abdomen (RUQ)"
  diagnosis: "Gallbladder polyp under surveillance (malignancy not established)"
  description: "Surveillance of a gallbladder polyp found by chance last year, alongside gallstones. Asymptomatic 67-year-old woman, polyp slightly larger on the 6-month scan. ?Growth to inform decision on cholecystectomy."

biliary_gallbladder_012:
  modality: "CT Chest Abdomen Pelvis with contrast (arterial and portal venous phases)"
  diagnosis: "Gallbladder adenocarcinoma (incidental on cholecystectomy)"
  description: "Post-op: cholecystectomy for gallstones 6 weeks ago, histology unexpectedly showed gallbladder adenocarcinoma. Woman, 58, well. Staging before possible radical re-resection; residual disease, vessels, nodes, peritoneum?"

biliary_gallbladder_013:
  modality: "MRI Liver with MRCP and contrast"
  diagnosis: "Primary sclerosing cholangitis; suspected cholangiocarcinoma (unconfirmed)"
  description: "PSC with ulcerative colitis, on annual MRCP. Now aged 44, he has new itch, worsening LFTs and a rising CA19-9 without cholangitis. ?New dominant stricture ?hilar mass."

biliary_gallbladder_014:
  modality: "MRCP (non-contrast)"
  diagnosis: "Primary sclerosing cholangitis (no known malignancy, cholangiocarcinoma surveillance)"
  description: "Routine annual MRCP for cholangiocarcinoma surveillance in PSC. 35-year-old woman, well, with stable LFTs and a small gallbladder polyp on previous imaging. Please compare with last year."

biliary_gallbladder_015:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Intrahepatic cholangiocarcinoma, stage IV"
  description: "68-year-old man with metastatic intrahepatic cholangiocarcinoma on cisplatin/gemcitabine plus durvalumab, cycle 8. Interim scan showed response and CA19-9 is falling. Restaging before maintenance durvalumab."

biliary_gallbladder_016:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Ampullary adenocarcinoma, pancreatobiliary type"
  description: "Surveillance nearly 2 years after Whipple and adjuvant capecitabine for ampullary adenocarcinoma. Woman, 73, with new back pain and a rising CA19-9. ?Local recurrence ?liver metastases."

biliary_gallbladder_017:
  modality: "CT Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Perihilar cholangiocarcinoma, post right hepatectomy"
  description: "Hilar cholangiocarcinoma treated with right hepatectomy, hepaticojejunostomy and adjuvant capecitabine last year. This 69-year-old man now has recurrent fevers and RUQ pain. ?Anastomotic stricture ?abscess ?recurrence."

biliary_gallbladder_018:
  modality: "CT Abdomen with contrast (portal venous)"
  diagnosis: "Perihilar cholangiocarcinoma (Klatskin tumour), unresectable"
  description: "Acute take: woman of 62 with unresectable hilar cholangiocarcinoma, bilateral metal stents, on chemo-immunotherapy. Now rigors, fever and rising bilirubin. ?Stent occlusion ?cholangitis ?liver abscess."

biliary_gallbladder_019:
  modality: "MRI Pancreas and MRCP with contrast"
  diagnosis: "Ampullary adenoma with high-grade dysplasia, post endoscopic ampullectomy"
  description: "Follow-up 9 months after endoscopic ampullectomy for an adenoma with high-grade dysplasia. 41-year-old man with FAP and mild epigastric pain. ?Residual or recurrent tumour ?duct dilatation."

biliary_gallbladder_020:
  modality: "CT Liver Triple Phase"
  diagnosis: "Suspected gallbladder carcinoma (unconfirmed)"
  description: "Admitted via ED: 76-year-old woman with RUQ pain and jaundice, long-standing gallstones for which she declined surgery. Bedside US showed a gallbladder mass. Staging; ?liver or vessel invasion ?Mirizzi syndrome."

biliary_gallbladder_021:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Metastatic gallbladder adenocarcinoma"
  description: "54-year-old woman with metastatic gallbladder cancer on second-line mFOLFOX after progression on first line, including peritoneal disease. Increasing abdominal distension. Restaging; ?progression ?ascites."

biliary_gallbladder_022:
  modality: "Hepatic Angiography with Tc-99m MAA SPECT-CT (SIRT work-up)"
  diagnosis: "Intrahepatic cholangiocarcinoma, liver-only disease"
  description: "SIRT work-up: 72-year-old man with liver-only intrahepatic cholangiocarcinoma, progressed on and poorly tolerated first-line chemotherapy. Planning radioembolisation; shunt fraction and arterial anatomy."

biliary_gallbladder_023:
  modality: "MRI Liver with hepatobiliary contrast (gadoxetate)"
  diagnosis: "Intrahepatic cholangiocarcinoma, post SIRT"
  description: "Female, 80, three months after radioembolisation for intrahepatic cholangiocarcinoma. Well, with a falling CA19-9. Response assessment; post-treatment change vs residual tumour, any new lesions."

biliary_gallbladder_024:
  modality: "Tube Cholangiogram and PTC Drain Exchange (fluoroscopy)"
  diagnosis: "Perihilar cholangiocarcinoma (Klatskin tumour), unresectable"
  description: "Known hilar cholangiocarcinoma with a right internal-external drain from 10 weeks ago, on palliative capecitabine. Man in his 80s, now bile leak at the skin site, low-grade fever and rising bilirubin. For drain exchange."

biliary_gallbladder_025:
  modality: "US Abdomen"
  diagnosis: "Suspected gallbladder malignancy (unconfirmed)"
  description: "Abdo pain, deranged LFTs, ?cause. Care home resident, 89, female, looks yellow per staff. Old letter mentions porcelain gallbladder and gallstones, managed conservatively. Please look at gallbladder and ducts."
