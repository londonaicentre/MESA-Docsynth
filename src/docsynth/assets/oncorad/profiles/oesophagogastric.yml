oesophagogastric_001:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Adenocarcinoma of the gastro-oesophageal junction (Siewert type II)"
  description: "Referred by GP on the 2WW pathway with dysphagia and weight loss; 67-year-old man with a newly biopsied GOJ adenocarcinoma. Staging CT showed small left gastric and coeliac nodes. PET-CT before MDT to exclude distant disease ahead of perioperative chemotherapy."

oesophagogastric_002:
  modality: "Endoscopic ultrasound (radial and linear) of oesophagus"
  diagnosis: "Adenocarcinoma of the distal oesophagus"
  description: "Known distal oesophageal adenocarcinoma arising in Barrett's, 72-year-old man. CT and PET-CT show no distant spread. EUS for local T and N staging to decide between upfront surgery and neoadjuvant treatment."

oesophagogastric_003:
  modality: "Barium swallow (fluoroscopy)"
  diagnosis: "Suspected oesophageal carcinoma (unconfirmed)"
  description: "Frail 88-year-old woman in a care home with dementia, 6 weeks of food sticking and weight loss. OGD felt unsafe because of sedation risk. ?Malignant stricture ?pouch ?dysmotility."

oesophagogastric_004:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Adenocarcinoma of the gastric antrum (intestinal type)"
  description: "Seen in Upper GI clinic after OGD for iron-deficiency anaemia found an ulcerated antral mass the scope could not pass. Woman, 59, now vomiting after meals. Staging; ?gastric outlet obstruction."

oesophagogastric_005:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Diffuse-type gastric adenocarcinoma with signet ring cells (linitis plastica)"
  description: "34-year-old woman with newly diagnosed signet ring gastric cancer (linitis plastica), early satiety and abdominal distension. Father died of stomach cancer young. Staging; ?peritoneal or omental spread."

oesophagogastric_006:
  modality: "CT Thorax Abdomen with IV and water-soluble oral contrast"
  diagnosis: "Adenocarcinoma of the distal oesophagus, post Ivor Lewis oesophagectomy"
  description: "Post-op day 6 after Ivor Lewis oesophagectomy following neoadjuvant chemotherapy. 63-year-old man, now pyrexial and tachycardic with cloudy right chest drain output. ?Anastomotic leak ?empyema."

oesophagogastric_007:
  modality: "Water-soluble contrast swallow (fluoroscopy)"
  diagnosis: "Squamous cell carcinoma of the mid oesophagus, post McKeown oesophagectomy"
  description: "Day 7 after McKeown oesophagectomy with a neck anastomosis for oesophageal SCC; woman in her late fifties, some saliva from the neck wound. ?Cervical anastomotic leak before starting oral fluids."

oesophagogastric_008:
  modality: "CT Abdomen Pelvis with contrast"
  diagnosis: "Gastric adenocarcinoma, post total gastrectomy with Roux-en-Y reconstruction"
  description: "Man, 74, day 5 after total gastrectomy for gastric cancer, sudden right upper quadrant pain with rigors and bilious drain fluid. ?Duodenal stump leak ?anastomotic leak ?collection for drainage."

oesophagogastric_009:
  modality: "CT Radiotherapy planning (thorax, 4D)"
  diagnosis: "Squamous cell carcinoma of the mid oesophagus"
  description: "Planning scan for radical chemoradiotherapy. 81-year-old woman with mid-oesophageal SCC and a subcarinal node on PET-CT, who declined surgery. Please define the primary and nodal target volumes."

oesophagogastric_010:
  modality: "CT Radiotherapy planning (thorax and upper abdomen)"
  diagnosis: "Adenocarcinoma of the gastro-oesophageal junction (Siewert type I)"
  description: "MDT request: neoadjuvant chemoradiotherapy (CROSS) then oesophagectomy for GOJ adenocarcinoma, 70-year-old man with CKD. RT planning CT to define tumour and left gastric/coeliac nodal volumes."

oesophagogastric_011:
  modality: "CT Radiotherapy planning (upper abdomen)"
  diagnosis: "Metastatic adenocarcinoma of the gastric body"
  description: "Known metastatic gastric cancer, progressed on second-line chemotherapy, with ongoing melaena despite endoscopic treatment. Woman, 79. Planning CT for palliative haemostatic radiotherapy to the stomach."

oesophagogastric_012:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Adenocarcinoma of the gastric body (Lauren intestinal type)"
  description: "On FLOT, restaging after completing neoadjuvant cycles. Man in his early fifties with gastric body adenocarcinoma and nodes at the coeliac axis at baseline. Response and resectability before gastrectomy."

oesophagogastric_013:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Adenocarcinoma of the distal oesophagus"
  description: "Completed neoadjuvant chemoradiotherapy for distal oesophageal adenocarcinoma 6 weeks ago; 66-year-old woman, well. Restaging PET-CT before oesophagectomy; ?interval metastases ?nodal response."

oesophagogastric_014:
  modality: "Barium swallow (fluoroscopy)"
  diagnosis: "Adenocarcinoma of the distal oesophagus, post Ivor Lewis oesophagectomy"
  description: "Known to the Upper GI team, Ivor Lewis oesophagectomy 5 months ago with a minor leak managed conservatively. Woman, 61, now progressive solid dysphagia. ?Anastomotic stricture ?recurrence."

oesophagogastric_015:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Metastatic HER2-positive adenocarcinoma of the stomach"
  description: "82-year-old man with metastatic HER2-positive gastric cancer involving coeliac nodes and liver, on trastuzumab-based chemotherapy with less pain. Routine response assessment against baseline CT."

oesophagogastric_016:
  modality: "CT Abdomen Pelvis with contrast"
  diagnosis: "Metastatic adenocarcinoma of the gastro-oesophageal junction"
  description: "Known metastatic GOJ adenocarcinoma on immunotherapy with chemotherapy; 46-year-old man with new abdominal distension and bloating over 3 weeks. Last CT showed a good response. ?Ascites ?peritoneal or omental disease."

oesophagogastric_017:
  modality: "Fluoroscopy-guided oesophageal stent insertion"
  diagnosis: "Squamous cell carcinoma of the distal oesophagus"
  description: "84-year-old man with obstructing distal oesophageal SCC and severe heart failure, not fit for oncological treatment. Now unable to swallow liquids. For palliative stent insertion across the stricture."

oesophagogastric_018:
  modality: "CT Thorax with IV and water-soluble oral contrast"
  diagnosis: "Adenocarcinoma of the distal oesophagus, post Ivor Lewis oesophagectomy"
  description: "Urgent: severe chest pain and neck crepitus hours after balloon dilatation of an anastomotic stricture, 9 months post-oesophagectomy. Man, 69. ?Perforation."

oesophagogastric_019:
  modality: "Endoscopic ultrasound with fine needle aspiration (EUS-FNA)"
  diagnosis: "Adenocarcinoma of the gastric cardia (Siewert type III)"
  description: "MDT request: EUS-FNA of an enlarged coeliac node seen on staging CT in a 55-year-old man with gastric cardia adenocarcinoma. Nodal result decides curative pathway; please also stage T and N."

oesophagogastric_020:
  modality: "US-guided core biopsy of omentum"
  diagnosis: "Suspected gastric carcinoma with peritoneal involvement (histology negative)"
  description: "Two sets of gastric biopsies non-diagnostic despite a stiff, thickened stomach. 76-year-old woman with ascites, omental thickening on CT and raised CA-125. For image-guided omental core biopsy."

oesophagogastric_021:
  modality: "CT Abdomen Pelvis with contrast (arterial and portal venous phases)"
  diagnosis: "Gastrointestinal stromal tumour (GIST) of the stomach, KIT exon 11 mutation"
  description: "Known gastric GIST on neoadjuvant imatinib for 6 months to downsize before surgery; woman, 48, tolerating it well. Response assessment and relation to spleen and pancreatic tail for surgical planning."

oesophagogastric_022:
  modality: "Endoscopic ultrasound of stomach"
  diagnosis: "Small gastric subepithelial lesion, presumed GIST"
  description: "Surveillance EUS for a small gastric subepithelial lesion, presumed GIST, stable over several years. Man, 64, asymptomatic, prefers surveillance over resection. ?Interval growth."

oesophagogastric_023:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Adenocarcinoma of the stomach, post subtotal gastrectomy"
  description: "Distal gastrectomy for gastric cancer 18 months ago after perioperative chemotherapy. 58-year-old woman referred back by GP with anorexia and weight loss. ?Recurrence, particularly peritoneal."

oesophagogastric_024:
  modality: "Endoscopic ultrasound of oesophagus"
  diagnosis: "Barrett's oesophagus with nodular high-grade dysplasia / suspected early adenocarcinoma"
  description: "Found on Barrett's surveillance OGD: a small nodule with high-grade dysplasia and possible early cancer in a 45-year-old man. EUS to assess depth of invasion and nodes before endoscopic resection."

oesophagogastric_025:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Squamous cell carcinoma of the upper-mid oesophagus, post radical chemoradiotherapy"
  description: "Radical chemoradiotherapy for oesophageal SCC about a year ago; woman, 53. New dysphagia with a tight stricture and inconclusive biopsies. ?Local recurrence ?post-radiotherapy stricture; salvage surgery considered."

oesophagogastric_026:
  modality: "CT Abdomen with water distension of the stomach (gastric protocol) and CT Chest"
  diagnosis: "Adenocarcinoma of the gastric incisura"
  description: "Newly diagnosed adenocarcinoma of the gastric incisura in a fit 41-year-old man. Staging CT with water distension; please assess local T stage, perigastric and coeliac nodes and peritoneum."

oesophagogastric_027:
  modality: "MRI Liver with hepatobiliary contrast (gadoxetate) and DWI"
  diagnosis: "Adenocarcinoma of the distal oesophagus"
  description: "Man, 60, with newly diagnosed distal oesophageal adenocarcinoma and a small indeterminate liver lesion on staging CT, not avid on PET. Fatty liver. ?Cyst ?haemangioma ?metastasis before curative treatment."

oesophagogastric_028:
  modality: "CT Abdomen Pelvis with contrast"
  diagnosis: "Adenocarcinoma of the stomach"
  description: "Known gastric Ca. Vomiting ++ for 4 days. ?obstruction. 90-year-old man on best supportive care. ?Gastric outlet obstruction for stent."

oesophagogastric_029:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Squamous cell carcinoma of the cervical oesophagus"
  description: "Recently diagnosed SCC of the cervical oesophagus in a 62-year-old female smoker, treated laryngeal cancer years ago. Staging CT showed a supraclavicular node. PET-CT before radical chemoradiotherapy."

oesophagogastric_030:
  modality: "Water-soluble contrast swallow (fluoroscopy)"
  diagnosis: "Squamous cell carcinoma of the mid oesophagus"
  description: "Mid-oesophageal SCC abutting the left main bronchus, currently on radical chemoradiotherapy. Man, 71, now coughing whenever he drinks with right basal pneumonia. ?Oesophago-airway fistula."
