breast_interventional_001:
  modality: "US-guided core biopsy left breast"
  diagnosis: "Suspected breast cancer (unconfirmed)"
  description: "44-year-old woman seen in the one-stop clinic with a firm left breast lump for 3 weeks. Mammogram and ultrasound this morning showed a suspicious mass. Same-day core biopsy with marker clip requested."

breast_interventional_002:
  modality: "Stereotactic vacuum-assisted biopsy right breast (prone table)"
  diagnosis: "Indeterminate microcalcification, right breast (unconfirmed)"
  description: "Recalled from NHSBSP screening at 51 with a new cluster of microcalcification in the right breast, not seen on ultrasound. Asymptomatic, no family history. Stereotactic vacuum-assisted biopsy with clip."

breast_interventional_003:
  modality: "US-guided core biopsy right breast"
  diagnosis: "Suspected breast cancer (unconfirmed)"
  description: "Woman of 79 with a hard right breast lump found by her carer; imaging at clinic was suspicious. On apixaban for AF, held for 48 hours after discussion with her GP. Core biopsy requested, with careful haemostasis."

breast_interventional_004:
  modality: "Tomosynthesis-guided vacuum-assisted biopsy left breast"
  diagnosis: "Architectural distortion, left breast (unconfirmed)"
  description: "Screening recall, 58. An area of distortion in the left breast is only seen on the tomosynthesis slices, with no ultrasound correlate. Tomosynthesis-guided biopsy with clip and check mammogram."

breast_interventional_005:
  modality: "MRI-guided vacuum-assisted biopsy right breast"
  diagnosis: "Invasive lobular carcinoma, left breast (ER+/HER2-); contralateral MRI abnormality"
  description: "47-year-old with newly diagnosed left breast lobular cancer. Staging MRI showed an area of non-mass enhancement in the right breast with no correlate on second-look ultrasound or mammography. Result will decide between unilateral and bilateral surgery."

breast_interventional_006:
  modality: "Mammogram left breast 2 views (post-biopsy clip check)"
  diagnosis: "Indeterminate microcalcification, left breast (unconfirmed)"
  description: "Check mammogram straight after stereotactic biopsy of left breast calcification in a 64-year-old screening recall. Bleeding during the procedure needed prolonged pressure. Please confirm clip position relative to the target."

breast_interventional_007:
  modality: "US-guided marker clip insertion left breast and Magseed placement left axillary node"
  diagnosis: "Invasive ductal carcinoma NST, triple negative, left breast"
  description: "38-year-old woman with triple-negative left breast cancer and a biopsy-proven axillary node, about to start neoadjuvant chemo-immunotherapy. Marking of the breast tumour and the involved node requested for later targeted axillary surgery."

breast_interventional_008:
  modality: "Stereotactic wire localisation left breast (bracketing)"
  diagnosis: "Ductal carcinoma in situ with microinvasion, left breast"
  description: "66-year-old with left breast DCIS and a focus of microinvasion, diagnosed on vacuum biopsy last month. Bracketing wire localisation of the calcification before therapeutic mammoplasty this afternoon."

breast_interventional_009:
  modality: "US-guided vacuum-assisted excision right breast"
  diagnosis: "Intraduct papilloma without atypia, right breast"
  description: "61-year-old woman who presented with bloody right nipple discharge; core biopsy showed a papilloma and the MDT advised vacuum excision rather than surgery. On warfarin for a mechanical valve, bridged with enoxaparin."

breast_interventional_010:
  modality: "US-guided core biopsy both breasts and FNA right axilla"
  diagnosis: "Suspected bilateral breast cancer (unconfirmed)"
  description: "Lumps in both breasts for 2 months in a 56-year-old; one-stop imaging showed a suspicious mass on each side and an abnormal-looking right axillary node. Biopsy of both breast lesions and the node in one session."

breast_interventional_011:
  modality: "US-guided Magseed localisation right breast"
  diagnosis: "Invasive ductal carcinoma NST, ER+/HER2-, right breast"
  description: "72-year-old with a small right breast cancer, booked for wide local excision and sentinel node biopsy later this week. Magseed localisation before surgery, with mammogram to confirm the seed lies with the biopsy clip. Has a pacemaker."

breast_interventional_012:
  modality: "US Left Breast (post-biopsy review)"
  diagnosis: "Suspected breast cancer (unconfirmed), post core biopsy"
  description: "Back 2 days after a left breast core biopsy with a painful, tense swelling and spreading bruising. 69 years old, on clopidogrel for a coronary stent, and the biopsy bled heavily. ?Haematoma, ?amenable to aspiration."

breast_interventional_013:
  modality: "US-guided aspiration right breast cyst"
  diagnosis: "Complex cystic breast lesion, right breast (unconfirmed)"
  description: "46-year-old on HRT, referred on the 2WW pathway with a tender right breast lump that appeared to be a cyst with a small solid component. Aspiration requested, with core biopsy if anything solid remains."

breast_interventional_014:
  modality: "US-guided aspiration right breast abscess"
  diagnosis: "No known malignancy: lactational breast abscess"
  description: "Breastfeeding mother, 31, with a hot, tender right breast and fever not settling on oral antibiotics from her GP. On-call breast surgeon requests ultrasound and needle aspiration, with pus for culture."

breast_interventional_015:
  modality: "US-guided core biopsy left axillary lymph node"
  diagnosis: "Invasive ductal carcinoma NST, ER-/HER2+, left breast"
  description: "63-year-old with newly diagnosed HER2-positive left breast cancer; staging ultrasound showed abnormal-looking axillary nodes. On rivaroxaban for recurrent DVT, held for 48 hours. Core biopsy of the node and clip before neoadjuvant therapy."

breast_interventional_016:
  modality: "Tomosynthesis-guided vacuum-assisted biopsy right breast (upright)"
  diagnosis: "Indeterminate microcalcification, right breast (unconfirmed)"
  description: "68-year-old recalled from routine screening with new calcification in the right breast. Kyphosis means she cannot lie prone, so a seated tomosynthesis-guided biopsy is booked. Old benign biopsy clip in the same breast."

breast_interventional_017:
  modality: "Stereotactic radar reflector (SCOUT) localisation left breast"
  diagnosis: "Ductal carcinoma in situ, left breast"
  description: "55-year-old woman with screen-detected left breast DCIS, due for day-case wide local excision. The calcification is not visible on ultrasound, so stereotactic reflector localisation before surgery is requested."

breast_interventional_018:
  modality: "Mammogram right breast 2 views (CC and true lateral)"
  diagnosis: "Invasive ductal carcinoma NST, ER+/HER2-, right breast"
  description: "60-year-old with right breast cancer; the check film after her vacuum biopsy, which was complicated by a haematoma, suggested the clip had moved away from the lesion. Repeat views to assess clip position before planning localisation."

breast_interventional_019:
  modality: "US-guided core biopsy left breast (male)"
  diagnosis: "Suspected male breast cancer (unconfirmed)"
  description: "Man of 67 on the 2WW pathway with a firm left subareolar lump and nipple retraction. Has known gynaecomastia on bicalutamide for prostate cancer. Clinic imaging was suspicious; core biopsy and clip requested."

breast_interventional_020:
  modality: "Stereotactic wire localisation both breasts"
  diagnosis: "Synchronous bilateral breast cancer: right IDC, left DCIS"
  description: "70-year-old with screen-detected cancers in both breasts, both seen as calcification only with biopsy clips in place. Wire localisation of both sides before bilateral wide local excision today."

breast_interventional_021:
  modality: "Mammogram both breasts 2 views (B3 surveillance)"
  diagnosis: "Atypical ductal hyperplasia, left breast, post vacuum-assisted excision"
  description: "57-year-old woman who had vacuum excision of left breast calcification a year ago showing atypical ductal hyperplasia, with no upgrade. First of her annual surveillance mammograms. Asymptomatic, on HRT."

breast_interventional_022:
  modality: "Stereotactic vacuum-assisted biopsy left breast"
  diagnosis: "Indeterminate microcalcification, left breast (unconfirmed)"
  description: "Screening recall, 67, with suspicious calcification in the left breast. On aspirin and ticagrelor after a recent coronary stent; cardiology advise against stopping them. Stereotactic biopsy with clip and check film."

breast_interventional_023:
  modality: "MRI-guided vacuum-assisted biopsy left breast"
  diagnosis: "BRCA2 carrier, MRI-detected lesion left breast (unconfirmed)"
  description: "BRCA2 carrier, 36. Annual surveillance MRI showed a new small enhancing lesion in the left breast with no correlate on second-look ultrasound. MRI-guided biopsy with clip, then mammogram to confirm clip position."

breast_interventional_024:
  modality: "US-guided seroma aspiration left breast"
  diagnosis: "Post-operative seroma following wide local excision for invasive ductal carcinoma"
  description: "53-year-old, three weeks after left wide local excision and sentinel node biopsy, with a tense swelling that has refilled after two clinic aspirations. Drainage requested before radiotherapy planning."

breast_interventional_025:
  modality: "US-guided FNA right axillary lymph node"
  diagnosis: "Invasive lobular carcinoma, ER+/HER2-, right breast"
  description: "Frail 84-year-old with newly diagnosed right breast lobular cancer; primary endocrine therapy is being considered. Staging ultrasound showed a borderline axillary node. FNA rather than core, as she has heart failure and cannot lie flat for long."

breast_interventional_026:
  modality: "Tomosynthesis-guided vacuum-assisted excision right breast"
  diagnosis: "Flat epithelial atypia, right breast"
  description: "49-year-old whose screen-detected right breast calcification showed flat epithelial atypia on core biopsy. MDT advised vacuum excision of the remaining calcification instead of surgery. Dense breasts."

breast_interventional_027:
  modality: "MRI Breasts bilateral with contrast (biopsy planning)"
  diagnosis: "Pathological nipple discharge, right breast (unconfirmed)"
  description: "45-year-old with bloodstained right nipple discharge and normal mammogram and ultrasound. MRI at another Trust reported non-mass enhancement behind the right nipple. Repeat MRI to plan MRI-guided biopsy."

breast_interventional_028:
  modality: "US Right Breast and Axilla (pre-operative localisation planning)"
  diagnosis: "Invasive ductal carcinoma NST, HER2+, right breast, post neoadjuvant therapy"
  description: "50-year-old who has finished neoadjuvant chemotherapy for HER2-positive right breast cancer, with clips in the tumour and a biopsied axillary node. No palpable mass now. Please locate both clips to plan localisation for surgery."

breast_interventional_029:
  modality: "US-guided core biopsy left breast"
  diagnosis: "Metastatic colorectal adenocarcinoma; new left breast mass (unconfirmed)"
  description: "Oncology inpatient, 58, with colorectal cancer spread to the liver, on FOLFOX and dalteparin for a recent PE. New left breast lump found on examination. Core biopsy to distinguish a breast primary from a metastasis."

breast_interventional_030:
  modality: "Mammogram left breast 2 views (post MRI-guided biopsy)"
  diagnosis: "MRI-detected non-mass enhancement, left breast (unconfirmed)"
  description: "52-year-old, treated for right breast cancer in the past, who had MRI-guided biopsy of left breast non-mass enhancement this morning. The final MRI suggested the clip may sit away from the biopsy site. Check mammogram."

breast_interventional_031:
  modality: "Mammogram both breasts 2 views (annual surveillance)"
  diagnosis: "Classical lobular in situ neoplasia, left breast, post vacuum-assisted excision"
  description: "45-year-old on annual mammograms since vacuum excision of left breast calcification 2 years ago showed lobular in situ neoplasia. Declined tamoxifen; mother had breast cancer. No new symptoms."

breast_interventional_032:
  modality: "US-guided core biopsy right breast (implants in situ)"
  diagnosis: "Suspected breast cancer (unconfirmed)"
  description: "39-year-old with cosmetic breast implants and a new right breast lump that looked indeterminate on clinic imaging. Core biopsy and clip requested, taking care to avoid the implant."

breast_interventional_033:
  modality: "US-guided Magseed localisation both breasts"
  diagnosis: "Synchronous bilateral breast cancer: left IDC, right ILC"
  description: "63-year-old with cancers in both breasts, booked for bilateral wide local excision and sentinel node biopsy next week. Magseed placement on both sides. On edoxaban, not held for seed insertion."

breast_interventional_034:
  modality: "US-guided Magseed localisation left axillary lymph node and left breast"
  diagnosis: "Invasive ductal carcinoma NST, ER+/HER2+, left breast, post neoadjuvant therapy"
  description: "44-year-old woman who recently completed neoadjuvant chemotherapy with trastuzumab and pertuzumab for left breast cancer with a clipped axillary node. Magseed localisation of the node and breast tumour bed for targeted axillary dissection."

breast_interventional_035:
  modality: "Mammogram right breast 2 views (post vacuum-assisted excision)"
  diagnosis: "Fibroadenoma, right breast, symptomatic"
  description: "34-year-old who had ultrasound-guided vacuum excision of an enlarging, uncomfortable right breast fibroadenoma today; oozing needed a pressure bandage. Check mammogram for clip position and any collection."
