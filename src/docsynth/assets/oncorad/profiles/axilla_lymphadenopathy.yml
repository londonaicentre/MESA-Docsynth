axilla_lymphadenopathy_001:
  modality: "US Axilla Right"
  diagnosis: "Invasive Ductal Carcinoma"
  description: "A 60-year-old female patient with a significant family history of breast cancer. She first noticed a painless lump in her right breast three weeks ago during a self-exam. Her primary care physician referred her to a breast surgeon, and a subsequent core needle biopsy confirmed invasive ductal carcinoma. She is otherwise healthy with no significant medical history. She is now scheduled for surgery and requires a baseline locoregional nodal staging before proceeding to the operating room."

axilla_lymphadenopathy_002:
  modality: "US Axilla Left"
  diagnosis: "Invasive Lobular Carcinoma"
  description: "This 54-year-old female initially presented to her gynecologist complaining of a vague thickening in the left outer quadrant of her breast that had persisted for over a month. She has a history of hormone replacement therapy usage for menopausal symptoms. Following an initial workup that raised suspicion for malignancy, she is now undergoing evaluation of the left axilla to determine her regional nodal burden. This information is critical for her multidisciplinary team to finalize her surgical planning."

axilla_lymphadenopathy_003:
  modality: "US Axilla Right"
  diagnosis: "Triple-Negative Breast Carcinoma"
  description: "The patient is a 46-year-old premenopausal female who recently presented with a rapidly enlarging right breast mass and overlying skin dimpling. A core biopsy revealed high-grade, triple-negative breast carcinoma. Given the aggressive nature of her disease, the oncology tumor board has recommended neoadjuvant chemotherapy. She is now presenting for assessment of nodal involvement to guide a potential biopsy and marker clip placement prior to initiating systemic treatment."

axilla_lymphadenopathy_004:
  modality: "US Axilla Left"
  diagnosis: "HER2-Positive Breast Carcinoma"
  description: "A 51-year-old female with biopsy-proven left breast cancer. She reports progressive left-sided breast heaviness and has recently noticed palpable fullness in her left armpit while showering. She has a past medical history of hypertension and well-controlled type 2 diabetes. She is being evaluated for multi-station nodal disease, which will dictate whether she requires axillary dissection versus sentinel node biopsy."

axilla_lymphadenopathy_005:
  modality: "US Axilla Bilateral"
  diagnosis: "Invasive Ductal Carcinoma"
  description: "This 63-year-old female was recently diagnosed with a right-sided breast cancer following an abnormal screening mammogram. During her clinical exam, her oncologist noted prominent lymph nodes in both axillae. The patient recently recovered from a severe upper respiratory infection, which complicates the clinical picture. She requires assessment to differentiate potentially suspicious ipsilateral nodes from contralateral reactive changes due to her recent illness."

axilla_lymphadenopathy_006:
  modality: "US Axilla Right"
  diagnosis: "Occult Breast Carcinoma"
  description: "A 58-year-old female who presented to her primary care physician with an isolated, hard, painless mass in her right axilla that she noticed two weeks ago. Comprehensive clinical breast examination revealed no palpable breast abnormalities, and she has no family history of breast or ovarian cancer. She is undergoing an extensive diagnostic workup for a suspected occult breast primary."

axilla_lymphadenopathy_007:
  modality: "US Axilla Left"
  diagnosis: "Invasive Ductal Carcinoma"
  description: "The patient is a 49-year-old female with known left breast cancer. She has been experiencing mild discomfort in her left axilla but no lymphedema. Her care team has opted for neoadjuvant chemotherapy, and she is presenting today for a targeted procedure to secure a diagnosis of a clinically prominent Level I node. She will also undergo metallic localization clip placement to ensure the node can be identified surgically post-treatment."

axilla_lymphadenopathy_008:
  modality: "US Axilla Right"
  diagnosis: "Invasive Ductal Carcinoma"
  description: "A 55-year-old female with right breast cancer who has just completed a grueling six-month course of neoadjuvant systemic therapy. She initially presented with locally advanced disease and palpable axillary nodes. She experienced significant fatigue and neuropathy during treatment but persevered. She is now preparing for definitive surgical resection and needs an evaluation for response assessment and pre-operative localization of the previously clipped axillary node."

axilla_lymphadenopathy_009:
  modality: "US Axilla Left"
  diagnosis: "Inflammatory Breast Carcinoma"
  description: "This 62-year-old female presented to the emergency department three weeks ago with acute onset of diffuse erythema, edema, and classic 'peau d'orange' skin changes affecting her left breast, initially misdiagnosed as mastitis. After failing two courses of oral antibiotics, she was urgently referred to breast oncology. She is now undergoing regional assessment of her nodal stations to establish a baseline before urgent induction chemotherapy."

axilla_lymphadenopathy_010:
  modality: "US Axilla Right"
  diagnosis: "Post-Surgical Recurrence Surveillance"
  description: "A 59-year-old female who is three years post-lumpectomy and sentinel lymph node biopsy for an early-stage right breast cancer. She completed adjuvant radiation and remains on endocrine therapy. During a routine follow-up appointment, she reported feeling a new, slight fullness in her right axilla. She is highly anxious about potential recurrence and is presenting for her routine surveillance check."

axilla_lymphadenopathy_011:
  modality: "US Axilla Left"
  diagnosis: "Cutaneous Malignant Melanoma"
  description: "The patient is a 42-year-old male construction worker with a history of extensive sun exposure. He recently underwent wide local excision of a high-risk, ulcerated melanoma on his left upper back. He has no other significant medical history. As part of his comprehensive dermatologic oncology protocol, he is now undergoing baseline nodal surveillance of the left axilla to monitor for early signs of regional microscopic spread."

axilla_lymphadenopathy_012:
  modality: "US Axilla Right"
  diagnosis: "Post-Vaccination Reactive Lymphadenopathy"
  description: "A 34-year-old healthy female who presented with a tender, palpable lump in her right armpit. Upon taking her history, she noted receiving an mRNA COVID-19 booster vaccination in her right deltoid muscle exactly five days prior to symptom onset. She also reported a low-grade fever and myalgias that resolved after 48 hours. She is undergoing this evaluation primarily to alleviate anxiety and rule out underlying malignancy."

axilla_lymphadenopathy_013:
  modality: "US Axilla Left"
  diagnosis: "Silicone-Induced Lymphadenopathy"
  description: "This 48-year-old female has a history of bilateral cosmetic silicone breast implants placed 12 years ago. She recently sought medical attention for painless, slowly progressive fullness in her left axilla. She denies any recent trauma, fevers, or weight loss. Her primary concern is a potential implant rupture, and she is being evaluated to investigate the possibility of silicone-induced lymphadenopathy."

axilla_lymphadenopathy_014:
  modality: "US Axilla Right"
  diagnosis: "Cat Scratch Disease"
  description: "A 27-year-old male veterinary technician who presents to the clinic with a tender, rapidly enlarging right axillary mass that developed over the past week. He reports low-grade pyrexia, malaise, and a recent history of a deep cat scratch on his right forearm while restraining a feral feline. He has no other significant medical history and is currently not taking any medications."

axilla_lymphadenopathy_015:
  modality: "US Axilla Bilateral"
  diagnosis: "Hidradenitis Suppurativa"
  description: "The patient is a 31-year-old female with a long-standing, severe history of chronic bilateral hidradenitis suppurativa. She has undergone multiple courses of long-term antibiotics and surgical debridement procedures. She currently presents with recurrent, exquisitely painful nodules and draining sinus tracts in both axillae. She is being evaluated for suspected secondary reactive adenopathy related to her chronic inflammatory skin condition."

axilla_lymphadenopathy_016:
  modality: "US Axilla Right"
  diagnosis: "Tuberculous Lymphadenitis"
  description: "A 36-year-old male immigrant who recently relocated to the United States. He presents with a two-month history of painless, progressively enlarging right axillary swellings. He reports significant night sweats that require changing his clothes, a 15-pound unintentional weight loss, and an occasional non-productive cough. He is undergoing evaluation and a planned guided aspiration to confirm a suspected infectious etiology."

axilla_lymphadenopathy_017:
  modality: "US Axilla Left"
  diagnosis: "Multicentric Breast Carcinoma"
  description: "This 52-year-old female recently underwent extensive biopsies confirming multicentric left breast carcinoma spanning multiple quadrants. She has a complex medical history including systemic lupus erythematosus. Given the extensive nature of her primary disease, her surgical team is planning a modified radical mastectomy. She is presenting for pre-operative targeted evaluation of all left-sided nodal groups to ensure comprehensive surgical planning."

axilla_lymphadenopathy_018:
  modality: "US Axilla Right"
  diagnosis: "Cutaneous Squamous Cell Carcinoma"
  description: "A 71-year-old retired farmer with a history of multiple non-melanoma skin cancers. He recently developed a large, recurrent cutaneous squamous cell carcinoma on his right forearm that has been growing rapidly despite previous local excisions. He complains of right arm fatigue but no axillary pain. He requires comprehensive staging of the draining regional nodal basin before wide excision and possible reconstructive grafting."

axilla_lymphadenopathy_019:
  modality: "US Axilla Left"
  diagnosis: "Follicular Lymphoma"
  description: "The patient is a 65-year-old male who was evaluated by his primary care physician for a routine physical exam, during which persistent, painless left axillary lymphadenopathy was noted. He denies any B-symptoms such as fever, drenching night sweats, or weight loss. His complete blood count showed mild lymphocytosis. He is undergoing assessment to characterize the nodal architecture and to select the most appropriate target node for an excisional biopsy."

axilla_lymphadenopathy_020:
  modality: "US Axilla Right"
  diagnosis: "Ductal Carcinoma In Situ with Microinvasion"
  description: "A 47-year-old female whose recent screening mammogram showed extensive suspicious calcifications. A subsequent stereotactic core biopsy revealed high-grade DCIS with areas of focal microinvasion. She is a highly anxious patient who wishes to proceed with a bilateral mastectomy for peace of mind. Prior to surgery, she needs a thorough evaluation of the right axilla to definitively exclude regional nodal involvement."

axilla_lymphadenopathy_021:
  modality: "MRI Breast & Axilla"
  diagnosis: "Invasive Ductal Carcinoma"
  description: "This 44-year-old premenopausal female presented with a newly diagnosed right breast carcinoma. Her mammogram was limited due to extremely dense breast tissue, making it difficult to assess the full extent of the lesion. She has no family history of breast cancer. She is scheduled for advanced imaging to precisely map the local disease extent, assess for multifocality, and evaluate the ipsilateral axillary nodes for potential involvement."

axilla_lymphadenopathy_022:
  modality: "MRI Breast & Axilla"
  diagnosis: "Invasive Lobular Carcinoma"
  description: "A 57-year-old postmenopausal female with recently biopsy-proven left invasive lobular carcinoma. Because lobular carcinoma often presents insidiously and is difficult to measure accurately on conventional imaging, her breast surgeon has requested pre-operative bilateral evaluation. She is otherwise in excellent health and hopes to be a candidate for breast-conserving surgery, depending on the true tumor dimensions and regional nodal status."

axilla_lymphadenopathy_023:
  modality: "MRI Breast & Axilla"
  diagnosis: "Occult Primary Breast Carcinoma"
  description: "The patient is a 64-year-old female who noticed a hard lump under her right arm. An excisional biopsy of this node confirmed metastatic adenocarcinoma compatible with a breast primary. However, her recent diagnostic mammogram and breast ultrasound were completely unrevealing. She is now undergoing specialized imaging in an attempt to identify the occult primary lesion within the breast tissue."

axilla_lymphadenopathy_024:
  modality: "MRI Breast & Axilla"
  diagnosis: "Post-Neoadjuvant Breast Carcinoma"
  description: "A 39-year-old female diagnosed a year ago with locally advanced HER2-positive breast cancer. She has just completed a comprehensive, multi-agent neoadjuvant chemotherapy and targeted therapy regimen. Clinically, her tumor has shrunk significantly. She is now being evaluated to assess the residual primary tumor burden and the degree of regional axillary nodal downstaging to guide her upcoming definitive surgery."

axilla_lymphadenopathy_025:
  modality: "MRI Breast & Axilla"
  diagnosis: "Silicone Implant Rupture and Adenopathy"
  description: "This 50-year-old female with bilateral breast implants placed for cosmetic reasons 15 years ago presents with recent, noticeable asymmetric contour changes in her left breast and a new sensation of swelling in her left armpit. She denies any history of breast cancer or recent trauma. She requires dedicated evaluation to check implant integrity and assess for extracapsular silicone migration into the regional lymphatics."

axilla_lymphadenopathy_026:
  modality: "MRI Breast & Axilla"
  diagnosis: "Triple-Negative Breast Carcinoma"
  description: "A 41-year-old female with a known BRCA1 germline mutation. She was recently diagnosed with a medial left breast carcinoma during high-risk screening. Given the medial location of her tumor, there is increased risk of internal mammary node involvement. She is presenting for staging evaluation to map both the internal mammary and axillary nodal chains before discussing prophylactic bilateral mastectomy."

axilla_lymphadenopathy_027:
  modality: "MRI Breast & Axilla"
  diagnosis: "Recurrent Breast Carcinoma"
  description: "The patient is a 66-year-old female who successfully underwent a right modified radical mastectomy and chemotherapy five years ago. She has been doing well until recently when she developed new right-sided chest wall tightness and noticed palpable fullness in her right axilla. She is understandably distressed and is undergoing diagnostic imaging to investigate these symptoms for potential disease recurrence."

axilla_lymphadenopathy_028:
  modality: "MRI Breast & Axilla"
  diagnosis: "Inflammatory Breast Carcinoma"
  description: "A 56-year-old female who initially thought she had a breast infection. Her symptoms progressed rapidly over three weeks to include prominent skin thickening, redness, and a feeling of extreme heaviness in her right breast. Clinical suspicion is very high for inflammatory breast cancer. She needs advanced diagnostic imaging to determine the precise extent of parenchymal, dermal, and regional nodal involvement before starting systemic therapy."

axilla_lymphadenopathy_029:
  modality: "MRI Breast & Axilla"
  diagnosis: "Metaplastic Breast Carcinoma"
  description: "This 53-year-old female presented with a rapidly enlarging right breast mass that seemed to double in size over two months. A core biopsy revealed metaplastic carcinoma, a rare and aggressive subtype. She reports mild, localized pain but no nipple discharge. Pre-operative staging is crucial to delineate whether the tumor involves the underlying chest wall muscles and to assess her axillary nodal status."

axilla_lymphadenopathy_030:
  modality: "MRI Breast & Axilla"
  diagnosis: "Cutaneous Malignant Melanoma"
  description: "A 45-year-old male avid sailor who was recently diagnosed with a deep, ulcerated, high-risk melanoma on his posterior trunk. His surgical oncologist is planning a wide local excision and sentinel node biopsy. Because of the location and depth of the primary lesion, advanced imaging of the regional nodal basins is required to assess for deep nodal spread before proceeding with the complex surgery."

axilla_lymphadenopathy_031:
  modality: "CT Thorax/TAP"
  diagnosis: "Locally Advanced Breast Carcinoma"
  description: "The patient is a 68-year-old female who delayed seeking medical care during the pandemic and now presents with a large, ulcerating right breast mass and clinically fixed axillary nodes. She is wheelchair-bound due to severe osteoarthritis but is otherwise stable. She requires a baseline comprehensive systemic scan to stage her locally advanced disease and check for distant visceral or bone metastases."

axilla_lymphadenopathy_032:
  modality: "CT Thorax/TAP"
  diagnosis: "Cutaneous Malignant Melanoma"
  description: "A 58-year-old male who recently underwent resection of an aggressive, ulcerated melanoma on his right shoulder. He has a history of smoking and mild COPD. Given the high-risk features of his primary tumor, his oncologist has ordered full-body cross-sectional imaging to assess for regional axillary disease and to rule out distant visceral metastases before starting adjuvant immunotherapy."

axilla_lymphadenopathy_033:
  modality: "CT Thorax/TAP"
  diagnosis: "Classical Hodgkin Lymphoma"
  description: "This 24-year-old female graduate student presented to the student health center with a one-month history of prominent left-sided neck and axillary swelling. She also reports severe, drenching night sweats, unexplained weight loss, and recurrent low-grade fevers. A preliminary lymph node biopsy suggested classical Hodgkin lymphoma. She is now undergoing a complete staging scan to map all areas of disease involvement."

axilla_lymphadenopathy_034:
  modality: "CT Thorax/TAP"
  diagnosis: "Diffuse Large B-Cell Lymphoma"
  description: "A 62-year-old male who noticed rapidly growing lumps under both of his arms and in his groin over the past three weeks. He has also been experiencing profound fatigue and early satiety. His primary care doctor suspected an aggressive lymphoproliferative disorder. He requires a baseline diagnostic and staging scan to evaluate the full extent of his lymphadenopathy, including retroperitoneal involvement, before initiating urgent chemotherapy."

axilla_lymphadenopathy_035:
  modality: "CT Thorax/TAP"
  diagnosis: "Metastatic Cutaneous Squamous Cell Carcinoma"
  description: "The patient is a 74-year-old male with a significant history of organ transplantation who is chronically immunosuppressed. He has an aggressive, recurrent squamous cell carcinoma on his left hand that has already required partial amputation. He now has large, hard, palpable masses in his left axilla. He needs comprehensive imaging for regional and distant staging to determine if he is a candidate for further surgical intervention or systemic therapy."

axilla_lymphadenopathy_036:
  modality: "CT Thorax/TAP"
  diagnosis: "Non-Small Cell Lung Cancer"
  description: "A 67-year-old female with a 40-pack-year smoking history who recently developed a persistent cough and mild hemoptysis. A chest x-ray revealed a right upper lobe mass, later confirmed as lung adenocarcinoma via bronchoscopy. She is presenting for a detailed staging scan to evaluate the extent of her thoracic disease and specifically to check for ipsilateral axillary and mediastinal nodal involvement."

axilla_lymphadenopathy_037:
  modality: "CT Thorax/TAP"
  diagnosis: "Post-ALND Recurrent Breast Cancer"
  description: "This 61-year-old female is a breast cancer survivor who underwent a left mastectomy and full axillary lymph node clearance four years ago. She has managed mild chronic lymphedema since surgery. Recently, her left arm lymphedema has significantly worsened, and she has noticed a new fullness in her left supraclavicular region. She is highly concerned about recurrence and requires a comprehensive staging scan."

axilla_lymphadenopathy_038:
  modality: "CT Thorax/TAP"
  diagnosis: "Sarcoidosis"
  description: "A 38-year-old female of African descent presenting with a persistent dry cough, shortness of breath on exertion, and tender red bumps on her shins (erythema nodosum). Her primary care doctor noted bilateral axillary lymphadenopathy on clinical exam. She has no history of smoking. She is undergoing specialized imaging to assess the full extent of thoracic disease and evaluate for classic bilateral hilar lymphadenopathy associated with sarcoidosis."

axilla_lymphadenopathy_039:
  modality: "CT Thorax/TAP"
  diagnosis: "Chronic Lymphocytic Leukemia"
  description: "The patient is a 70-year-old male with known chronic lymphocytic leukemia (CLL) on a watch-and-wait approach for the past three years. Recently, he has developed progressive, debilitating fatigue and noticed new, prominent swelling in his neck, groins, and bilateral axillae. His latest blood work shows a rapidly rising lymphocyte count. He requires a staging scan to evaluate his total tumor burden before initiating targeted therapy."

axilla_lymphadenopathy_040:
  modality: "CT Thorax/TAP"
  diagnosis: "Merkel Cell Carcinoma"
  description: "A 76-year-old female nursing home resident with a history of extensive sun damage who recently had a fast-growing, painless, red-purple nodule biopsied on her left forearm. The pathology returned as Merkel cell carcinoma, a rare neuroendocrine skin cancer. She requires a baseline systemic scan to meticulously map her regional nodal basins and check for any distant metastatic spread."

axilla_lymphadenopathy_041:
  modality: "PET-CT"
  diagnosis: "Locally Advanced Breast Carcinoma"
  description: "This 54-year-old female presented with clinical signs highly suspicious for inflammatory right breast cancer, including rapid onset of skin changes and severe breast swelling. She has no relevant family history. Given the high risk of widespread micrometastatic disease at presentation, her oncology team has ordered comprehensive metabolic imaging for complete regional nodal and distant staging prior to commencing neoadjuvant chemotherapy."

axilla_lymphadenopathy_042:
  modality: "PET-CT"
  diagnosis: "Cutaneous Malignant Melanoma"
  description: "A 51-year-old male who had a thick, ulcerated melanoma resected from his trunk two years ago. He has been compliant with his follow-up schedule. During a routine exam, his dermatologist discovered a newly palpable, rock-hard mass in his right axilla. He is now scheduled for a whole-body metabolic scan to evaluate the extent of this suspected disease recurrence and to rule out distant visceral metastases."

axilla_lymphadenopathy_043:
  modality: "PET-CT"
  diagnosis: "Classical Hodgkin Lymphoma"
  description: "The patient is a 29-year-old male fitness instructor who sought medical care for a persistent cough and new lumps in his left armpit. A biopsy confirmed nodular sclerosis Hodgkin lymphoma. He reports occasional night sweats but no weight loss. He requires a baseline staging metabolic scan to map out all sites of active disease, which will dictate the intensity and duration of his chemotherapy regimen."

axilla_lymphadenopathy_044:
  modality: "PET-CT"
  diagnosis: "Triple-Negative Breast Carcinoma"
  description: "A 46-year-old female diagnosed with stage III triple-negative breast cancer eight months ago. She has endured a highly toxic regimen of neoadjuvant chemotherapy, experiencing significant side effects. She is finally at the end of her systemic treatment course and is preparing for surgery. She needs a post-treatment metabolic scan to evaluate the response in her primary breast tissue and regional axillary nodes."

axilla_lymphadenopathy_045:
  modality: "PET-CT"
  diagnosis: "Occult Primary Adenocarcinoma"
  description: "This 60-year-old female initially presented to her primary care doctor with a painless lump under her left arm. A fine-needle aspiration of the enlarged axillary node was surprisingly positive for metastatic adenocarcinoma. Her mammograms, colonoscopy, and basic labs have all been negative. She is undergoing a whole-body metabolic scan in a comprehensive effort to locate the elusive primary tumor site."

axilla_lymphadenopathy_046:
  modality: "PET-CT"
  diagnosis: "Follicular Lymphoma Transformation"
  description: "A 69-year-old female who has been living with indolent follicular lymphoma for over a decade, managed primarily with a watch-and-wait strategy. Over the past three weeks, she has experienced a dramatic change in her symptoms, including rapid, painful enlargement of a right axillary node, drenching night sweats, and significant weight loss. Her oncologist urgently ordered this scan to investigate for high-grade transformation, such as to DLBCL."

axilla_lymphadenopathy_047:
  modality: "PET-CT"
  diagnosis: "Merkel Cell Carcinoma"
  description: "The patient is a 73-year-old male who had a Merkel cell carcinoma excised from his upper arm six months ago and received adjuvant radiation therapy. He recently felt new lumps in his axilla and beneath his collarbone on the affected side. Due to the high recurrence rate of this tumor type, he is presenting for restaging with a metabolic scan following the clinical detection of these new lymphadenopathies."

axilla_lymphadenopathy_048:
  modality: "PET-CT"
  diagnosis: "Recurrent Breast Carcinoma"
  description: "A 58-year-old female who was treated six years ago for right breast cancer with surgery, radiation, and hormone therapy. Routine blood work recently revealed unexplained, steadily climbing tumor markers. Concurrently, she has begun complaining of deep, vague discomfort in her right axilla and shoulder. She is presenting for a comprehensive whole-body survey to locate any sites of active disease recurrence."

axilla_lymphadenopathy_049:
  modality: "PET-CT"
  diagnosis: "Castleman Disease"
  description: "This 43-year-old male presented with a perplexing constellation of symptoms including fevers, severe fatigue, and weight loss. Clinical examination revealed significant hepatosplenomegaly and diffuse enlarged lymph nodes, particularly prominent in both axillae. A recent biopsy was suggestive of multicentric Castleman disease. He requires a whole-body metabolic scan to comprehensively map his disease burden and guide his systemic treatment strategy."

axilla_lymphadenopathy_050:
  modality: "PET-CT"
  diagnosis: "Diffuse Large B-Cell Lymphoma"
  description: "A 33-year-old female who is currently celebrating being in clinical remission for 12 months post-chemoimmunotherapy for Diffuse Large B-Cell Lymphoma. Her initial presentation involved massive, bulky disease in her axillary and mediastinal regions. She is feeling well, has returned to work, and has no new symptoms. She is presenting for her scheduled routine surveillance scan to ensure she remains disease-free."

axilla_lymphadenopathy_051:
  modality: "US Axilla"
  diagnosis: "Post-Operative Seroma"
  description: "A 55-year-old female who is three weeks status post right modified radical mastectomy and axillary lymph node dissection. She now presents to the clinic complaining of progressive, painless swelling under her right arm. She notes a feeling of fullness and restricted shoulder mobility but denies any fevers, chills, or overlying skin erythema."

axilla_lymphadenopathy_052:
  modality: "US Axilla"
  diagnosis: "Post-Operative Hematoma"
  description: "A 48-year-old female presenting urgently to the clinic four days after a left sentinel lymph node biopsy. She reports sudden onset of painful swelling and significant bruising extending from her left axilla down to her lateral chest wall. She has a history of mild von Willebrand disease and is anxious about the acute changes."

axilla_lymphadenopathy_053:
  modality: "MRI Breast & Axilla"
  diagnosis: "Silicone Implant Rupture"
  description: "A 62-year-old female who underwent bilateral mastectomy with silicone implant reconstruction ten years ago. She recently started experiencing a change in the contour of her right breast along with new, vague discomfort in her right axilla. She denies any recent trauma to the chest and has not had any constitutional symptoms."

axilla_lymphadenopathy_054:
  modality: "US Axilla"
  diagnosis: "Fat Necrosis"
  description: "A 50-year-old female who is one year post-lumpectomy and axillary dissection for breast cancer. She discovered a firm, slightly tender, localized nodule in her left axilla during a routine self-examination. She is highly concerned about a potential recurrence given her history, though she has no systemic symptoms."

axilla_lymphadenopathy_055:
  modality: "US Axilla"
  diagnosis: "Post-Reconstruction Infection"
  description: "A 45-year-old female who had an expander-to-implant exchange surgery two weeks ago. She presents with increasing pain, warmth, and redness in her right axilla and lateral breast region. She also reports feeling generally unwell and recorded a low-grade fever at home this morning."
