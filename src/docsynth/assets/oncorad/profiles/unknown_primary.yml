unknown_primary_001:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Malignancy of undefined primary origin (suspected hepatic metastases)"
  description: "67-year-old man seen by the acute oncology service with weight loss, a hard enlarged liver and raised tumour markers. No previous imaging. Please stage and look for a primary site."

unknown_primary_002:
  modality: "US-guided liver biopsy"
  diagnosis: "Metastatic carcinoma in the liver, primary not yet identified"
  description: "58-year-old woman whose recent CT showed multiple liver lesions with no primary seen. CUP team requests biopsy of the most accessible lesion for histology and immunohistochemistry."

unknown_primary_003:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Metastatic squamous cell carcinoma to left cervical node, primary unknown (p16 positive)"
  description: "Never-smoking man in his fifties with a left neck lump; core biopsy shows p16-positive squamous cell carcinoma and nasendoscopy is normal. Search for primary before panendoscopy and tonsillectomy."

unknown_primary_004:
  modality: "MRI Breasts bilateral with contrast"
  diagnosis: "Axillary metastatic adenocarcinoma, occult primary (ER positive, GATA3 positive)"
  description: "49-year-old woman with a right axillary node showing adenocarcinoma of likely breast origin on immunohistochemistry; mammography and ultrasound found no breast lesion. MRI to look for an occult primary."

unknown_primary_005:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Carcinoma of unknown primary, adenocarcinoma (CK7+/CK20-)"
  description: "62-year-old woman with peritoneal and nodal adenocarcinoma of unknown primary, now after 3 cycles of carboplatin and paclitaxel. Feels less bloated. Response assessment against the baseline CT."

unknown_primary_006:
  modality: "MRI Head with contrast"
  diagnosis: "Multiple brain lesions, presumed metastases, no primary identified"
  description: "First seizure in a 71-year-old ex-smoker; CT head showed two enhancing lesions and body CT found no clear primary. On dexamethasone. Characterise and count the lesions for the neuro-oncology MDT."

unknown_primary_007:
  modality: "CT-guided bone biopsy (left iliac)"
  diagnosis: "Solitary lytic bone lesion, suspected metastasis of unknown origin"
  description: "Man, 76, with left hip pain and a solitary lytic iliac lesion on CT; myeloma screen negative. On apixaban, held. CT-guided biopsy to establish histology."

unknown_primary_008:
  modality: "CT Thorax Abdomen Pelvis with contrast"
  diagnosis: "Malignant pleural effusion, adenocarcinoma of unknown primary"
  description: "Admitted breathless, this 81-year-old woman had a large right pleural effusion drained; cytology shows adenocarcinoma, primary unknown. CT to look for a primary site and other disease."

unknown_primary_009:
  modality: "FDG PET-CT (post-chemoradiotherapy response)"
  diagnosis: "p16-positive squamous cell carcinoma of right neck nodes, unknown primary"
  description: "59-year-old man 12 weeks after radical chemoradiotherapy for p16-positive nodal squamous carcinoma of the right neck; no primary was found despite tonsillectomy. Any residual neck disease?"

unknown_primary_010:
  modality: "MRI Pelvis with contrast"
  diagnosis: "Metastatic squamous cell carcinoma, left inguinal node, primary unknown"
  description: "Woman aged 68 with squamous carcinoma in a left inguinal node; examination under anaesthesia found no vulval, cervical or anal lesion. Please look for a primary and assess pelvic nodes."

unknown_primary_011:
  modality: "CT Chest Abdomen Pelvis with contrast (portal venous)"
  diagnosis: "Adenocarcinoma of unknown primary, colorectal-like profile (CK7-/CK20+/CDX2+)"
  description: "73-year-old on capecitabine and oxaliplatin for peritoneal adenocarcinoma; immunohistochemistry suggests colorectal origin but colonoscopy was normal. Restaging for response."

unknown_primary_012:
  modality: "MRI Liver with gadoxetic acid (Primovist)"
  diagnosis: "Metastatic well-differentiated neuroendocrine tumour, primary unknown"
  description: "Hepatobiliary MDT: 55-year-old woman with flushing and biopsy-proven neuroendocrine liver metastases, primary not seen on CT. Map all liver lesions to plan resection or liver-directed therapy."

unknown_primary_013:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Carcinoma of unknown primary (per referral)"
  description: "Known CUP, not on treatment. Increasing pain and breathless. ?progression ?PE. Please CT. (Care home resident, 84, female; no further details on the request.)"

unknown_primary_014:
  modality: "MRI Whole Spine"
  diagnosis: "Adenocarcinoma of unknown primary with bone metastases"
  description: "Suspected cord compression: 64-year-old woman with bone-predominant CUP on carboplatin and paclitaxel, now with thoracic back pain and leg weakness. Level of compression please."

unknown_primary_015:
  modality: "MRI Head (stereotactic planning, volumetric post-contrast)"
  diagnosis: "Resected solitary cerebellar metastasis, adenocarcinoma of unknown primary"
  description: "Planning scan for stereotactic radiotherapy to the cavity after resection of a solitary cerebellar adenocarcinoma metastasis a month ago in a 52-year-old man; staging found no primary."

unknown_primary_016:
  modality: "CT Neck Chest Abdomen Pelvis with contrast"
  diagnosis: "Metastatic melanoma of unknown primary (nodal only, BRAF wild-type)"
  description: "Surveillance CT for a man in his late forties on adjuvant nivolumab after axillary node dissection for melanoma with no primary found. Well. Please compare with previous imaging."

unknown_primary_017:
  modality: "US-guided core biopsy left supraclavicular lymph node"
  diagnosis: "Left supraclavicular lymphadenopathy, suspected metastatic carcinoma (primary unknown)"
  description: "39-year-old woman with a hard left supraclavicular node, early satiety and weight loss; no imaging yet. One-stop clinic biopsy for histology, with a sample for lymphoma or TB."

unknown_primary_018:
  modality: "US Testes"
  diagnosis: "Retroperitoneal germ cell tumour, suspected burned-out testicular primary"
  description: "29-year-old man with a large retroperitoneal mass on CT and raised hCG and AFP; testes normal to palpation. Ultrasound to look for a testicular primary before chemotherapy."

unknown_primary_019:
  modality: "FDG PET-CT skull base to mid-thigh"
  diagnosis: "Multi-site metastatic malignancy, primary unknown (non-diagnostic biopsy)"
  description: "66-year-old woman with bone lesions, mediastinal nodes and an adrenal nodule on CT; EBUS sampling was non-diagnostic. Please identify the best site for repeat biopsy and any primary."

unknown_primary_020:
  modality: "CT Chest Abdomen Pelvis with contrast"
  diagnosis: "Adenocarcinoma of unknown primary, pancreatobiliary-type profile (CK7+/CK20+, CK19+)"
  description: "Man, 69, with liver and nodal CUP on gemcitabine and cisplatin; previous scan showed liver disease smaller but new lung nodules. Also treated prostate cancer 2018. Progression?"
