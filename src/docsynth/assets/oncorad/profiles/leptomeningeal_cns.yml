leptomeningeal_cns_001:
  modality: "MRI Brain and Whole Spine with contrast"
  diagnosis: "Metastatic invasive ductal carcinoma of breast (ER-negative, HER2-positive)"
  description: "52-year-old woman with HER2-positive breast cancer and liver metastases, on trastuzumab deruxtecan. Three weeks of morning headache and double vision with a new sixth nerve palsy; ?leptomeningeal disease before lumbar puncture."

leptomeningeal_cns_002:
  modality: "MRI Whole Spine with contrast"
  diagnosis: "Lung adenocarcinoma, EGFR exon 19 deletion"
  description: "Never smoker, 67, male, with EGFR-mutant lung adenocarcinoma on osimertinib. Ten days of buttock pain, saddle numbness and urinary hesitancy. Urgent scan: ?cauda equina involvement."

leptomeningeal_cns_003:
  modality: "CT Head without contrast"
  diagnosis: "Leptomeningeal metastases from invasive lobular carcinoma of breast (ER-positive, HER2-negative)"
  description: "Out-of-hours ward request. 45-year-old woman with leptomeningeal spread of lobular breast cancer on intraventricular chemotherapy; Ommaya in situ, now increasingly drowsy and vomiting. ?hydrocephalus ?bleed."

leptomeningeal_cns_004:
  modality: "Fluoroscopy-guided lumbar puncture"
  diagnosis: "Lung adenocarcinoma, ALK-rearranged, suspected leptomeningeal relapse"
  description: "Image-guided LP after two failed ward attempts. 41-year-old woman with ALK-positive lung cancer on alectinib, new leg paraesthesia and facial droop; recent spine MRI equivocal. CSF needed for cytology."

leptomeningeal_cns_005:
  modality: "MRI Brain with contrast"
  diagnosis: "Invasive ductal carcinoma of breast (ER-positive, HER2-negative), on adjuvant endocrine therapy"
  description: "Seen in A&E after a fall, 63-year-old woman on letrozole for early breast cancer treated in 2022. CT head showed a frontal extra-axial lesion; that scan was non-contrast. Meningioma or dural metastasis?"

leptomeningeal_cns_006:
  modality: "MRI Brain and Whole Spine with contrast"
  diagnosis: "Medulloblastoma, SHH-activated, TP53 wild-type"
  description: "Annual surveillance for a 22-year-old man treated for medulloblastoma at 19 with surgery, craniospinal radiotherapy and chemotherapy. Earlier scans were done at the children's hospital with a different protocol. Asymptomatic."

leptomeningeal_cns_007:
  modality: "MRI Lumbosacral Spine with contrast (RT planning position)"
  diagnosis: "Leptomeningeal metastases from invasive lobular carcinoma of breast (ER-positive, HER2-negative)"
  description: "RT planning scan in treatment position. 58-year-old woman with leptomeningeal breast cancer on intrathecal chemotherapy, persisting left leg radicular pain and foot drop. Palliative radiotherapy to the lumbosacral thecal sac planned."

leptomeningeal_cns_008:
  modality: "MRI Brain with contrast (including FLAIR post-gadolinium)"
  diagnosis: "Metastatic cutaneous melanoma (BRAF V600E)"
  description: "Man of 57 with stage IV melanoma on dabrafenib and trametinib, brain metastases treated with SRS last year. Now bilateral hearing loss and new confusion. ?leptomeningeal spread ?progression."

leptomeningeal_cns_009:
  modality: "MRI Brain and Whole Spine with contrast"
  diagnosis: "Diffuse large B-cell lymphoma, suspected secondary CNS relapse"
  description: "Haematology request: 74-year-old man with DLBCL who completed R-CHOP 6 months ago, now numb chin and left facial weakness with abnormal CSF. Assess CNS disease extent before high-dose methotrexate."

leptomeningeal_cns_010:
  modality: "In-111 DTPA CSF flow scintigraphy (via Ommaya reservoir)"
  diagnosis: "Leptomeningeal metastases from invasive ductal carcinoma of breast (HER2-positive)"
  description: "CSF flow study before intraventricular trastuzumab. 49-year-old woman with HER2-positive breast cancer and newly diagnosed leptomeningeal disease; Ommaya recently placed. Recent MRI raised concern for a spinal block."

leptomeningeal_cns_011:
  modality: "MRI Brain and Whole Spine with contrast"
  diagnosis: "Lung adenocarcinoma, EGFR L858R, with leptomeningeal metastases"
  description: "61-year-old woman with EGFR-mutant lung adenocarcinoma and leptomeningeal disease, on intrathecal methotrexate and osimertinib. Response assessment; the baseline spine MRI at another Trust had no contrast. Still unsteady."

leptomeningeal_cns_012:
  modality: "CT Head with contrast"
  diagnosis: "Lung adenocarcinoma, EGFR exon 19 deletion"
  description: "MRI contraindicated owing to a non-conditional pacemaker. 76-year-old woman with EGFR-positive lung cancer on osimertinib, worsening headache and a new scalp lump. ?dural or skull vault disease."

leptomeningeal_cns_013:
  modality: "MRI Whole Spine with contrast (post-operative staging)"
  diagnosis: "Medulloblastoma, WNT/SHH status pending (classic histology)"
  description: "19-year-old woman, 2 weeks after resection of a fourth ventricular medulloblastoma that had caused hydrocephalus. Spinal staging before craniospinal radiotherapy; spine not imaged pre-operatively."

leptomeningeal_cns_014:
  modality: "X-ray VP Shunt Series"
  diagnosis: "Leptomeningeal metastases from invasive lobular carcinoma of breast"
  description: "Shunt series. 58-year-old woman with leptomeningeal breast cancer and a VP shunt placed 4 months ago for hydrocephalus. Headaches and vomiting returned this week; ?shunt disconnection or migration."

leptomeningeal_cns_015:
  modality: "MRI Brain and Whole Spine with contrast"
  diagnosis: "Metastatic breast cancer (subtype not provided)"
  description: "Breast ca with bone mets, on treatment, now headaches and numb left hand. ?spread to brain or meninges ?dural. No details of previous imaging or treatment provided with the referral."
