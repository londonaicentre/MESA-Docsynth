salivary_sinonasal_001:
  modality: "US Neck with US-guided core biopsy (left parotid)"
  diagnosis: "Suspected parotid neoplasm (unconfirmed)"
  description: "2WW referral from the GP: 44-year-old woman with a slowly enlarging painless lump in front of the left ear for 8 months, facial nerve intact. No previous imaging. Please assess and sample under ultrasound guidance."

salivary_sinonasal_002:
  modality: "MRI Parotids and Neck with contrast (including DWI)"
  diagnosis: "Pleomorphic adenoma of the right parotid"
  description: "37-year-old man with a cytologically benign right parotid lump; recent ultrasound could not show its medial extent behind the mandible. Pre-operative MRI to clarify deep lobe or parapharyngeal involvement."

salivary_sinonasal_003:
  modality: "US Parotids (bilateral)"
  diagnosis: "Warthin tumour, bilateral parotid (cytologically confirmed)"
  description: "Smoker of 71 with bilateral Warthin tumours managed conservatively by ENT, last ultrasound a year ago. The right lump has become sore and bigger over the past month. Compare with previous."

salivary_sinonasal_004:
  modality: "MRI Face and Neck with contrast (including DWI and fat-saturated post-contrast T1)"
  diagnosis: "Mucoepidermoid carcinoma of the left parotid"
  description: "Staging for the head and neck MDT. 58-year-old man with a biopsy-proven left parotid carcinoma and progressive left facial weakness over 5 weeks, ?facial nerve involvement towards the skull base."

salivary_sinonasal_005:
  modality: "PET-CT skull base to mid-thigh (FDG)"
  diagnosis: "Salivary duct carcinoma of the right parotid (AR positive, HER2 positive)"
  description: "A 72-year-old man with a rapidly enlarging right parotid mass and a hard right neck lump, core biopsy salivary duct carcinoma. Staging CT chest showed indeterminate small lung nodules. Whole-body staging before treatment decision."

salivary_sinonasal_006:
  modality: "MRI Neck and Skull Base with contrast"
  diagnosis: "Adenoid cystic carcinoma of the left submandibular gland"
  description: "Woman of 49 whose left submandibular gland excision for presumed sialadenitis showed adenoid cystic carcinoma with a positive margin. Tingling of the left tongue and lower teeth, ?spread along V3. Assess residual disease."

salivary_sinonasal_007:
  modality: "MRI Face and Skull Base with contrast"
  diagnosis: "Adenoid cystic carcinoma of the hard palate (minor salivary gland)"
  description: "Surveillance 3 years after partial maxillectomy and PORT for adenoid cystic carcinoma of the right palate; last MRI stable. 63-year-old woman now with new numbness of the right cheek, ?perineural spread along V2."

salivary_sinonasal_008:
  modality: "RT planning CT Head and Neck with contrast (thermoplastic shell)"
  diagnosis: "Mucoepidermoid carcinoma of the right parotid"
  description: "Post-operative radiotherapy planning. 66-year-old man, right parotidectomy with facial nerve sacrifice and neck dissection 5 weeks ago; node-positive disease. Planned chemoradiotherapy to the parotid bed, nerve pathway and neck."

salivary_sinonasal_009:
  modality: "US Neck with US-guided FNA (left level II node)"
  diagnosis: "Mucoepidermoid carcinoma of the left parotid (treated)"
  description: "52-year-old female, left superficial parotidectomy for mucoepidermoid carcinoma 2 years ago. Surveillance MRI showed a new left upper neck node. For US-guided FNA and survey of the neck."

salivary_sinonasal_010:
  modality: "CT Neck and Chest with contrast"
  diagnosis: "Suspected malignant submandibular gland tumour"
  description: "Patient is a 55-year-old man with a hard right submandibular swelling unresponsive to antibiotics; ultrasound-guided FNA was suspicious for carcinoma. Staging of the neck and chest for the MDT."

salivary_sinonasal_011:
  modality: "MRI Parotids with contrast"
  diagnosis: "Recurrent pleomorphic adenoma of the left parotid"
  description: "Left parotid lump enucleated in 2011 at another Trust. Now 46, she has several small firm bumps along the old scar. Map extent of recurrence before considering revision surgery."

salivary_sinonasal_012:
  modality: "CT Thorax with contrast"
  diagnosis: "Metastatic adenoid cystic carcinoma of the right parotid"
  description: "Surveillance of slowly growing lung metastases in a 61-year-old man treated with parotidectomy and PORT in 2019, on observation only. Asymptomatic. Compare with the CT 6 months ago."

salivary_sinonasal_013:
  modality: "PET-CT skull base to mid-thigh (FDG)"
  diagnosis: "Metastatic salivary duct carcinoma of the left parotid (HER2 positive)"
  description: "59-year-old female with relapsed salivary duct carcinoma (bone and mediastinal nodes, plus parotid bed disease tracking towards the mastoid) after radical parotidectomy. Response assessment after 6 cycles of docetaxel, trastuzumab and pertuzumab."

salivary_sinonasal_014:
  modality: "CT Sinuses (non-contrast, thin section)"
  diagnosis: "Suspected sinonasal malignancy (unconfirmed)"
  description: "67-year-old man, a joiner for 40 years, with 4 months of right nasal blockage and bloody discharge. Endoscopy shows a friable mass high in the right nasal cavity, biopsy awaited. ?Erosion of the cribriform plate."

salivary_sinonasal_015:
  modality: "MRI Sinuses, Orbits and Anterior Skull Base with contrast"
  diagnosis: "Intestinal-type sinonasal adenocarcinoma of the ethmoid"
  description: "Retired furniture maker, 74, with biopsy-proven left ethmoid adenocarcinoma. CT showed skull base bone erosion; mild left proptosis, ?orbital involvement. Assess local extent for surgical planning."

salivary_sinonasal_016:
  modality: "MRI Head, Sinuses and Neck with contrast"
  diagnosis: "Olfactory neuroblastoma (esthesioneuroblastoma)"
  description: "34-year-old woman with a year of anosmia and recurrent left epistaxis; biopsy of a high left nasal cavity mass shows olfactory neuroblastoma. Staging for skull base MDT, ?intracranial extension."

salivary_sinonasal_017:
  modality: "PET-CT skull base to mid-thigh (FDG)"
  diagnosis: "Sinonasal mucosal melanoma of the nasal cavity (KIT mutated)"
  description: "78-year-old woman on apixaban with recurrent right nosebleeds and a pigmented right nasal cavity lesion, biopsy mucosal melanoma. MRI showed local disease only. Staging before endoscopic resection."

salivary_sinonasal_018:
  modality: "CT Sinuses, Orbits and Neck with contrast"
  diagnosis: "Squamous cell carcinoma of the left maxillary sinus"
  description: "Heavy smoker of 64 with left cheek swelling, loose upper teeth and a numb cheek; recent diplopia, ?orbital floor involvement. Biopsy from a non-healing extraction socket shows squamous carcinoma. Staging."

salivary_sinonasal_019:
  modality: "RT planning MRI Head and Neck (in treatment position, contrast-enhanced)"
  diagnosis: "Sinonasal undifferentiated carcinoma (SNUC), SMARCB1 retained"
  description: "52-year-old male with right ethmoid and maxillary SNUC extending to the orbital apex and skull base at diagnosis. Partial response to induction chemotherapy. Planning MRI for chemoradiotherapy, co-registration with planning CT."

salivary_sinonasal_020:
  modality: "MRI Sinuses and Anterior Skull Base with contrast"
  diagnosis: "Intestinal-type sinonasal adenocarcinoma (treated)"
  description: "Former sawmill worker, 69, 18 months after endoscopic craniofacial resection and PORT for ethmoid adenocarcinoma. New frontal headaches for 6 weeks. Compare with previous surveillance MRI."

salivary_sinonasal_021:
  modality: "PET-CT Head and Neck (FDG)"
  diagnosis: "Squamous cell carcinoma of the right maxillary sinus"
  description: "12 weeks after right maxillectomy and chemoradiotherapy in a 70-year-old man; a right neck node at diagnosis was treated with radiotherapy alone. Weight loss and facial pain. ?Residual disease, ?need for neck dissection."

salivary_sinonasal_022:
  modality: "US Neck with US-guided FNA"
  diagnosis: "Squamous cell carcinoma of the nasal cavity/septum (treated)"
  description: "81-year-old woman treated with radical radiotherapy for nasal septum squamous carcinoma 14 months ago, endoscopically clear. New lump under the left jaw. Assess the neck and FNA the node; on clopidogrel."

salivary_sinonasal_023:
  modality: "CT Sinuses (non-contrast)"
  diagnosis: "Unilateral sinonasal polyp, cause unknown"
  description: "Unilateral right nasal polyp in a 58-year-old woman with 18 months of blockage, not settling with steroid spray. ?Inverted papilloma. Pre-operative CT before endoscopic excision."

salivary_sinonasal_024:
  modality: "MRI Sinuses and Neck with contrast"
  diagnosis: "Sinonasal mucosal melanoma of the left nasal cavity (recurrent)"
  description: "Woman of 69 with nasal cavity mucosal melanoma, resected and irradiated in 2025, then local and retropharyngeal nodal recurrence. Now on nivolumab maintenance after combination immunotherapy. Response assessment."

salivary_sinonasal_025:
  modality: "CT Sinuses and Orbits with contrast (image-guidance navigation protocol)"
  diagnosis: "Squamous cell carcinoma of the right ethmoid sinus"
  description: "57-year-old female with right ethmoid squamous carcinoma abutting the orbit on MRI. Navigation CT for planned endoscopic resection, including the lamina papyracea and anterior skull base."
