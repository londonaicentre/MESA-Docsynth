lung_pancoast_001:
  modality: "PET-CT"
  diagnosis: "Pancoast Tumor"
  description: "85-year-old male, heavy smoker. Presented with gradual onset of weakness in the hand intrinsic muscles. Patient has also developed a mild chronic cough and 5 kg weight loss. Baseline metabolic staging prior to planned trimodality therapy."

lung_pancoast_002:
  modality: "MRI Brachial Plexus"
  diagnosis: "Superior Sulcus Tumor"
  description: "79-year-old male, 30 pack-year history. Presented with facial anhidrosis with drooping eyelid. He has noticed clumsiness when buttoning shirts. This scan is ordered to evaluate the cause of these progressive neurologic symptoms."

lung_pancoast_003:
  modality: "MRI Cervical Spine"
  diagnosis: "Apical Lung Tumor"
  description: "59-year-old male, 30 pack-year history. Presented with intractable arm pain along the ulnar nerve distribution. Has experienced escalating pain requiring opioid analgesia. Routine follow-up after completing concurrent chemoradiation."

lung_pancoast_004:
  modality: "CT Neck and Thorax"
  diagnosis: "Non-Small Cell Lung Cancer"
  description: "82-year-old female, former smoker. Presented with severe shoulder pain radiating down the arm. The pain is poorly controlled with NSAIDs and physical therapy. Routine follow-up after completing concurrent chemoradiation."

lung_pancoast_005:
  modality: "MRI Cervical Spine"
  diagnosis: "Superior Sulcus Tumor"
  description: "67-year-old female, heavy smoker. Presented with facial anhidrosis with drooping eyelid. Physical exam reveals classical Horner's syndrome. Pre-surgical mapping to assess resectability of the apex."

lung_pancoast_006:
  modality: "PET-CT"
  diagnosis: "Apical Lung Tumor"
  description: "81-year-old female, never-smoker (secondhand smoke exposure). Presented with arm paresthesia and weakness. Neurology consult confirmed C8-T1 radiculopathy. Initial diagnostic workup for suspected apical process."

lung_pancoast_007:
  modality: "CT Thorax without Contrast"
  diagnosis: "Superior Sulcus Tumor"
  description: "47-year-old male, never-smoker (secondhand smoke exposure). Presented with right-sided shoulder and neck pain. He has noticed clumsiness when buttoning shirts. Scan requested to delineate involvement of the brachial plexus."

