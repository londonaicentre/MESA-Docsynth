ugi_fluoroscopy_001:
  modality: Barium Swallow
  diagnosis: Esophageal Squamous Cell Carcinoma
  description: Evaluation of progressive dysphagia to solid foods. Assessing for mucosal
    irregularity or stricture in the mid-esophagus.
ugi_fluoroscopy_002:
  modality: Water-Soluble Contrast Swallow
  diagnosis: Esophageal Adenocarcinoma
  description: Post-esophagectomy day 5. Assessment for anastomotic leak prior to
    initiating oral intake.
ugi_fluoroscopy_003:
  modality: Fluoroscopic Stent Assessment
  diagnosis: Distal Esophageal Adenocarcinoma
  description: Evaluation of esophageal stent patency. Patient reports recurrent dysphagia
    2 months post stent placement.
ugi_fluoroscopy_004:
  modality: Barium Meal
  diagnosis: Gastric Adenocarcinoma
  description: Assessment of gastric emptying and mucosal evaluation in a patient
    with early satiety and unexplained weight loss.
ugi_fluoroscopy_005:
  modality: CT Chest, Abdomen, and Pelvis with IV Contrast
  diagnosis: Gastroesophageal Junction (GEJ) Tumor
  description: Initial staging of biopsy-proven Siewert type II GEJ adenocarcinoma.
    Evaluating for local invasion and distant metastases.
ugi_fluoroscopy_006:
  modality: Barium Swallow
  diagnosis: Esophageal Adenocarcinoma
  description: Pre-operative evaluation to define the precise location and length
    of a distal esophageal stricture.
ugi_fluoroscopy_007:
  modality: Water-Soluble Contrast Swallow
  diagnosis: Gastric Cancer
  description: Post-total gastrectomy evaluation for esophagojejunal anastomotic leak.
ugi_fluoroscopy_008:
  modality: Fluoroscopic Stent Assessment
  diagnosis: Gastric Outlet Obstruction secondary to Gastric Adenocarcinoma
  description: Assessment of duodenal stent expansion and contrast flow into the jejunum.
ugi_fluoroscopy_009:
  modality: PET/CT Skull Base to Mid-Thigh
  diagnosis: Esophageal Squamous Cell Carcinoma
  description: Restaging following completion of neoadjuvant chemoradiotherapy to
    evaluate metabolic response.
ugi_fluoroscopy_010:
  modality: Barium Swallow
  diagnosis: Esophageal Adenocarcinoma
  description: Assessment for tracheoesophageal fistula in a patient presenting with
    intractable coughing while eating.
ugi_fluoroscopy_011:
  modality: Barium Meal
  diagnosis: Linitis Plastica (Gastric Cancer)
  description: Evaluation of gastric distensibility in a patient with suspected diffuse
    gastric cancer.
ugi_fluoroscopy_012:
  modality: Water-Soluble Contrast Swallow
  diagnosis: Esophageal Squamous Cell Carcinoma
  description: Assessment of suspected spontaneous esophageal perforation (Boerhaave
    syndrome) proximal to a known malignant stricture.
ugi_fluoroscopy_013:
  modality: Fluoroscopic Stent Assessment
  diagnosis: Gastroesophageal Junction (GEJ) Tumor
  description: Follow-up fluoroscopy to verify the position of an overlapping esophageal
    stent for malignant stricture.
ugi_fluoroscopy_014:
  modality: CT Chest and Abdomen
  diagnosis: Esophageal Adenocarcinoma
  description: Surveillance imaging 1-year post Ivor-Lewis esophagectomy. Evaluating
    for local recurrence.
ugi_fluoroscopy_015:
  modality: Barium Swallow
  diagnosis: Esophageal Carcinoma
  description: Evaluation of a large, ulcerated mid-esophageal mass with possible
    tracking into the mediastinum.
ugi_fluoroscopy_016:
  modality: Water-Soluble Contrast Swallow
  diagnosis: Gastric Adenocarcinoma
  description: Evaluation for suspected gastrocolic fistula in a patient with severe
    weight loss and feculent vomiting.
ugi_fluoroscopy_017:
  modality: Fluoroscopic Stent Assessment
  diagnosis: Esophageal Squamous Cell Carcinoma
  description: Assessment for tumor ingrowth or overgrowth causing recurrent obstruction
    of a previously placed metallic stent.
ugi_fluoroscopy_018:
  modality: Barium Meal
  diagnosis: Gastric Lymphoma
  description: Evaluation of thickened gastric folds and delayed emptying. Differentiating
    from primary gastric adenocarcinoma.
ugi_fluoroscopy_019:
  modality: MRI Abdomen with IV Contrast
  diagnosis: Gastric Adenocarcinoma
  description: Detailed assessment of indeterminate liver lesions seen on CT, to rule
    out metastatic disease.
ugi_fluoroscopy_020:
  modality: Barium Swallow
  diagnosis: Gastroesophageal Junction (GEJ) Tumor
  description: Assessment of malignant achalasia (pseudoachalasia) versus primary
    achalasia.
ugi_fluoroscopy_021:
  modality: Water-Soluble Contrast Swallow
  diagnosis: Esophageal Adenocarcinoma
  description: Day 7 post-minimally invasive esophagectomy (MIE) to confirm intact
    cervical anastomosis.
ugi_fluoroscopy_022:
  modality: Fluoroscopic Stent Assessment
  diagnosis: Gastric Outlet Obstruction (Malignant)
  description: Fluoroscopic guidance and immediate post-deployment assessment of a
    self-expanding metal stent (SEMS) in the pylorus.
ugi_fluoroscopy_023:
  modality: Fluoroscopy Guidance
  diagnosis: Esophageal Squamous Cell Carcinoma
  description: Fiducial marker placement under fluoroscopic guidance for targeted
    radiotherapy.
ugi_fluoroscopy_024:
  modality: Barium Meal
  diagnosis: Gastric Carcinoid
  description: Evaluation of multiple polypoid lesions in the gastric body and fundus.
ugi_fluoroscopy_025:
  modality: CT Chest, Abdomen, and Pelvis
  diagnosis: Gastroesophageal Junction (GEJ) Tumor
  description: Evaluation of response to systemic chemotherapy in metastatic GEJ adenocarcinoma.
ugi_fluoroscopy_026:
  modality: Barium Swallow
  diagnosis: Esophageal Adenocarcinoma
  description: Assessment of radiation-induced stricture following definitive chemoradiation
    therapy.
ugi_fluoroscopy_027:
  modality: Water-Soluble Contrast Swallow
  diagnosis: Gastric Adenocarcinoma
  description: Assessment for suspected delayed gastric emptying or obstruction following
    subtotal gastrectomy with Roux-en-Y reconstruction.
ugi_fluoroscopy_028:
  modality: Fluoroscopic Stent Assessment
  diagnosis: Esophageal Squamous Cell Carcinoma
  description: Evaluation of stent migration in a patient presenting with sudden onset
    retrosternal pain and dysphagia.
ugi_fluoroscopy_029:
  modality: Barium Swallow
  diagnosis: Esophageal Adenocarcinoma
  description: Assessment of a 'apple-core' constricting lesion in the lower third
    of the esophagus.
ugi_fluoroscopy_030:
  modality: CT Abdomen and Pelvis
  diagnosis: Gastric Adenocarcinoma
  description: Surveillance for peritoneal carcinomatosis and ascites in a patient
    with a history of resected advanced gastric cancer.
