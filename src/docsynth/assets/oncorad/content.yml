# PROMPT GENERATION CONFIG - CONTENT
# Each section contains elements that can be sampled probabilistically
# Descriptions are prompt-ready and will be inserted directly into LLM prompts
# mutually_exclusive: true = exactly ONE item selected from section (weighted random choice)
# mutually_exclusive: false = each item sampled independently (based on independent probability)
#
# Wording rule: descriptions say what the report should SHOW, never how to LABEL
# it. Generating models copy instruction wording into the report (e.g. 'gestalt
# assessment', 'advanced feature:', 'exactly one lesion', 'more extensive than
# clinically anticipated'), which real reports never contain and which an
# extraction model would learn as a spurious cue. Avoid category names and
# words like exact/exactly/definitive/anticipated/incidental/advanced/gestalt.

##############################
# CLINICAL HISTORY INCLUSION #
##############################
clinical_history_inclusion:
  mutually_exclusive: true

  detailed_history:
    probability: 0.30
    description: "Summarise the relevant clinical history from the profile in the clinical details/indication section."

  brief_history:
    probability: 0.30
    description: "Give the clinical history as a short referral-style phrase (e.g. 'Ca bronchus. Restaging.')."

  exclude_history:
    probability: 0.40
    description: "Do not include any clinical history in the report."

################
# SCAN OUTCOME #
################
scan_outcome:
  mutually_exclusive: true

  clinically_anticipated:
    probability: 0.50
    description: "The findings fit the clinical picture given in the profile."

  unexpected_better:
    probability: 0.10
    description: "The findings are less extensive or less severe than the clinical picture in the profile suggests. Show this through the findings themselves; do not state that the result is better than expected."

  unexpected_worse:
    probability: 0.20
    description: "The findings are more extensive or more severe than the clinical picture in the profile suggests (e.g. additional sites of disease). Show this through the findings themselves; do not state that the result is worse than expected."

  equivocal_ambiguous:
    probability: 0.10
    description: "The key findings are genuinely ambiguous, with competing explanations (e.g. treatment change versus recurrence), so no firm conclusion can be drawn."

##########################
# COMPARISON METHODOLOGY #
##########################
comparison_methodology:
  mutually_exclusive: true

  formal_recist:
    probability: 0.15
    description: "Compare with prior imaging using a formal RECIST 1.1 assessment: list target lesions with current and previous measurements, the sum of diameters, non-target lesions, and the overall RECIST response category."

  gestalt_comparison:
    probability: 0.45
    description: "Compare with prior imaging in plain descriptive terms (e.g. 'increased in size', 'similar appearance', 'smaller', 'new since'), without any formal response criteria."

  exclude_comparison:
    probability: 0.40
    description: "No prior imaging is used for comparison. Either leave comparison out entirely or note it briefly as a radiologist would (e.g. 'No previous imaging.')."

################
# LESION COUNT #
################
lesion_count:
  mutually_exclusive: true

  single_lesion:
    probability: 0.40
    description: "Describe one focal lesion in detail."

  few_lesions:
    probability: 0.40
    description: "Describe two or three discrete lesions in detail, which may be cancerous or non-cancerous."

  multiple_lesions:
    probability: 0.20
    description: "Describe more than three discrete lesions in detail, which may be cancerous or non-cancerous."

#######################
# LESION DETAIL LEVEL #
#######################
lesion_detail_level:
  mutually_exclusive: true

  highly_detailed:
    probability: 0.30
    description: "Give three-dimensional measurements (e.g. '32 x 24 x 21 mm') and detailed morphology (margins, shape, internal composition) for the key lesions."

  moderate_detail:
    probability: 0.50
    description: "Give one- or two-dimensional measurements and the anatomical location of the key lesions."

  sparse_vague:
    probability: 0.20
    description: "Describe lesions without measurements or specific morphological detail (e.g. 'large mass', 'several small nodules')."

########################
# DIAGNOSTIC CERTAINTY #
########################
diagnostic_certainty:
  mutually_exclusive: true

  definitive_certainty:
    probability: 0.70
    description: "State the conclusions plainly and confidently, without hedging (e.g. 'Right upper lobe tumour with ipsilateral hilar nodal metastasis.')."

  uncertain_suspicious:
    probability: 0.30
    description: "Hedge the key conclusions with phrases such as 'suspicious for', 'cannot exclude', 'likely represents' or 'indeterminate'."

############################
# ADVANCED TUMOUR FEATURES #
############################
advanced_tumour_features:
  mutually_exclusive: true

  single_feature:
    probability: 0.20
    description: "Describe one of the following where plausible: tumour invading or encasing a vessel (or tumour thrombus), tumour invading adjacent structures, or a lesion that the radiologist names as the index or dominant lesion."

  multiple_features:
    probability: 0.10
    description: "Describe two or more of the following where plausible: tumour invading or encasing a vessel (or tumour thrombus), tumour invading adjacent structures, or a lesion that the radiologist names as the index or dominant lesion."

  omit:
    probability: 0.70
    description: "Do not describe vascular invasion, tumour thrombus or invasion of adjacent structures, and do not name any lesion as the index or dominant lesion."

#####################
# SPECIALTY SCORING #
#####################
specialty_scoring:
  mutually_exclusive: true

  single_score:
    probability: 0.40
    description: "Report one structured radiology or clinical score that suits the profile's modality and cancer type (e.g. TNM, AJCC stage, RCR, BI-RADS, ACR breast density, PI-RADS, Bosniak, LI-RADS, Lung-RADS, TI-RADS, O-RADS, Deauville, Gleason, or another established score)."

  two_scores:
    probability: 0.20
    description: "Report two structured radiology or clinical scores that suit the profile's modality and cancer type (e.g. TNM, AJCC stage, RCR, BI-RADS, ACR breast density, PI-RADS, Bosniak, LI-RADS, Lung-RADS, TI-RADS, O-RADS, Deauville, Gleason, or another established score)."

  multiple_scores:
    probability: 0.10
    description: "Report three or more structured scores that suit the profile's modality and cancer type (e.g. TNM, AJCC stage, RCR, BI-RADS, ACR breast density, PI-RADS, Bosniak, LI-RADS, Lung-RADS, TI-RADS, O-RADS, Deauville, Gleason, or another established score)."

  omit:
    probability: 0.30
    description: "Do not report any structured radiology or clinical scores."

#######################
# NON-CANCER FINDINGS #
#######################
non_cancer_findings:
  mutually_exclusive: true

  single_incidental:
    probability: 0.30
    description: "Include one benign finding unrelated to the cancer (e.g. simple renal cyst, gallstones, diverticulosis), reported where it would naturally appear in the findings."

  multiple_incidentals:
    probability: 0.15
    description: "Include several benign findings unrelated to the cancer (e.g. simple renal cyst, gallstones, diverticulosis), reported where they would naturally appear in the findings."

  single_complication:
    probability: 0.20
    description: "Include one clinically significant non-cancer finding caused by the disease or its treatment (e.g. pulmonary embolus, hydronephrosis, pneumonitis, bowel obstruction)."

  multiple_complications:
    probability: 0.10
    description: "Include several clinically significant non-cancer findings caused by the disease or its treatment (e.g. pulmonary embolus, hydronephrosis, pneumonitis, bowel obstruction)."

  mixed_findings:
    probability: 0.05
    description: "Include both benign findings unrelated to the cancer and non-cancer findings caused by the disease or its treatment."

  omit:
    probability: 0.20
    description: "Do not include any non-cancer findings; everything outside the cancer is normal."

#####################
# TECHNICAL QUALITY #
#####################
technical_quality:
  mutually_exclusive: true

  optimal_quality:
    probability: 0.80
    description: "Do not comment on image quality, as in most routine reports."

  suboptimal_quality:
    probability: 0.20
    description: "Name a specific technical limitation (e.g. motion artefact, suboptimal contrast timing, body habitus, metal streak artefact) and say how it limits interpretation."
