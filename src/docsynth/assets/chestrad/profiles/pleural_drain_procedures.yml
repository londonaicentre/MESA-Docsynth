pleural_drain_procedures_001:
  modality_protocol: "CXR PA"
  diagnosis: "Right malignant pleural effusion, post chest drain insertion"
  description: "Post-procedure film after Seldinger 12F drain into the right pleural space for symptomatic malignant effusion (lung adenocarcinoma). Drained 1 L then clamped. Check position."
  possible_findings:
    - "intercostal drain"
    - "drain side hole outside pleura"
    - "residual pleural fluid"
    - "pneumothorax"
    - "re-expansion oedema"
    - "subcutaneous emphysema"

pleural_drain_procedures_002:
  modality_protocol: "Chest X-ray PA"
  diagnosis: "Indwelling pleural catheter for malignant effusion"
  description: "IPC inserted on the left for breast cancer-related effusion two weeks ago; community nurses draining three times weekly. Increasing breathlessness despite drainage. ?blocked catheter ?loculation."
  possible_findings:
    - "indwelling pleural catheter"
    - "loculated pleural fluid"
    - "trapped lung"
    - "lymphangitic spread"
    - "mastectomy"
    - "pulmonary metastases"

pleural_drain_procedures_003:
  modality_protocol: "Ultrasound chest (pleural)"
  diagnosis: "Indwelling pleural catheter, ?autopleurodesis"
  description: "IPC drainage volumes below 50 ml for three consecutive sessions. Pleural clinic assessing for autopleurodesis prior to catheter removal. Mesothelioma, epithelioid subtype."
  possible_findings:
    - "residual pleural fluid"
    - "absent lung sliding"
    - "septations"
    - "pleural thickening"
    - "catheter tract fluid"
  unremarkable: true

