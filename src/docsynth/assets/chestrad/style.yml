# PROMPT GENERATION CONFIG - STYLE (CHEST RADIOLOGY)
## Each section contains elements that can be sampled probabilistically
## Descriptions are prompt-ready and will be inserted directly into LLM prompts
## mutually_exclusive: true = exactly ONE item selected from section (weighted random choice)
## mutually_exclusive: false = each item sampled independently (based on independent probability)

#################
# DOCUMENT TYPE #
#################
document_type:
  mutually_exclusive: true

  standard_report:
    probability: 0.70
    description: "The document is a standard signed-off radiology report."

  preliminary_report:
    probability: 0.18
    description: "The document is a preliminary report (e.g. an out-of-hours, outsourced or registrar report awaiting consultant review), marked as such in the way a real department would."

  addendum_report:
    probability: 0.12
    description: "The document is a radiology report followed by an addendum that corrects or adds to it (e.g. after MDT review, comparison with newly available imaging, a missed finding, or new clinical information)."

#################
# REPORT LENGTH #
#################
report_length:
  mutually_exclusive: true

  brief:
    probability: 0.25
    description: "Keep the report very short (one to four lines in total), as is common for plain films and line checks."

  standard:
    probability: 0.50
    description: "Write a report of typical length: a findings paragraph or two followed by a short conclusion."

  long_systematic:
    probability: 0.25
    description: "Write a long report that works systematically through the structures imaged under headings (e.g. lungs, airways, pleura, mediastinum and hila, heart and great vessels, bones and soft tissues, upper abdomen), followed by a conclusion."

#################
# WRITING STYLE #
#################
writing_style:
  mutually_exclusive: true

  telegraphic_factual:
    probability: 0.55
    description: "IMPORTANT: Use a telegraphic, highly factual writing style with short sentences, frequent abbreviations, and dropped articles (e.g. 'Lungs clear' instead of 'The lungs appear clear')."

  verbose_descriptive:
    probability: 0.45
    description: "IMPORTANT: Use a verbose, descriptive writing style. Write in full, grammatically complete sentences with detailed radiological terminology."

################
# HEADER STYLE #
################
header_style:
  mutually_exclusive: true

  complex_header:
    probability: 0.30
    description: "Use a complex header including hospital/trust name, full patient demographics, referring clinician, exam date/time, and detailed protocol/technique information (e.g. projection, contrast agent and volume, dose report)."

  standard_header:
    probability: 0.50
    description: "Use a standard header with basic exam metadata: exam name, date, patient identifier and referring team."

  minimal_header:
    probability: 0.20
    description: "Use a minimal header listing only the exam name and date, diving straight into the report text."

################
# FOOTER STYLE #
################
footer_style:
  mutually_exclusive: true

  formal_footer:
    probability: 0.40
    description: "Include a formal footer with the reporting radiologist's name, credentials, GMC/licence number, date/time of verification, and a standard electronic signature disclaimer."

  basic_footer:
    probability: 0.40
    description: "Include a basic footer with just the reporter's name and role (e.g. Consultant Radiologist, Radiology Registrar, Reporting Radiographer)."

  no_footer:
    probability: 0.20
    description: "Omit the footer completely, ending abruptly after the conclusion."

###################
# REDACTION STYLE #
###################
redaction_style:
  mutually_exclusive: true

  fully_redacted:
    probability: 0.33
    description: "ALL personally identifiable information including names of patients/clinicians, hospital names, unique IDs, dates and dates of birth must be redacted by replacing with [redacted]."

  partially_redacted:
    probability: 0.33
    description: "The document is poorly redacted, with around 50% of personally identifiable information remaining visible, while other PID is replaced by [redacted]."

  not_redacted:
    probability: 0.34
    description: "The synthetic document should contain realistic synthetic personally identifiable information, including names, hospital locations, dates and IDs."

################
# DATA QUALITY #
################
data_quality_issues:
  mutually_exclusive: true

  none:
    probability: 0.70
    description: ""

  missing_indication:
    probability: 0.10
    description: "The clinical indication or history section is left blank or states 'No history provided'."

  speech_recognition_errors:
    probability: 0.10
    description: "Include occasional speech recognition typos or phonetic homophone errors typical of dictated radiology reports (e.g. 'plural effusion' for 'pleural effusion', 'hilum' for 'ileum', 'no new mo thorax')."

  inconsistent_formatting:
    probability: 0.10
    description: "Formatting is inconsistent (e.g. inconsistent capitalisation, odd line breaks, all-caps headings mixed with lower case, or mixed units like cm and mm)."
