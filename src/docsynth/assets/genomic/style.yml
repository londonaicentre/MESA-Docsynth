# PROMPT GENERATION CONFIG - STYLE (GENOMIC)
## Each section contains elements that can be sampled probabilistically
## Descriptions are prompt-ready and will be inserted directly into LLM prompts
## mutually_exclusive: true = exactly ONE item selected from section (weighted random choice)
## mutually_exclusive: false = each item sampled independently (based on independent probability)

#################
# DOCUMENT TYPE #
#################
document_type:
  mutually_exclusive: true

  short_cytogenetic_report:
    probability: 0.40
    description: "Brief (<200 words): headline, ISCN string, one-paragraph method and result, disclaimer, signature block. Typical of FISH, QF-PCR and MLPA results."

  preliminary_with_followup_request:
    probability: 0.12
    description: "Short abnormal report flagged PRELIMINARY with request for parental samples and genetic counselling information."

  comprehensive_molecular_report:
    probability: 0.30
    description: "Structured report with clinical information, tests performed, per-test results, ACMG classification, interpretation and numbered recommendations; typical of NGS panel, Sanger and multi-test reports."

  multi_test_combined_report:
    probability: 0.05
    description: "Karyotype + FISH + MLPA + microarray results integrated into a single 'combined interpretation' with unified diagnosis, recurrence risk and management recommendations."

  correspondence:
    probability: 0.13
    description: "The document contains no genetic test results but is asking for a repeat blood sample due to technical errors processing or sample being unsuitable for genetic test"

#################
# REPORT LENGTH #
#################
report_length:
  mutually_exclusive: true

  brief:
    probability: 0.25
    description: "Keep the report very short (one to four lines in total), as is common for routine prenatal karyotype testing."

  standard:
    probability: 0.50
    description: "Write a report of typical length: a findings paragraph or two followed by a short conclusion."

  long_systematic:
    probability: 0.25
    description: "Write a long report that works systematically through the variants detected and lists their ACMG classification criteria applied, followed by a conclusion and recommended next steps."

#################
# WRITING STYLE #
#################
writing_style:
  mutually_exclusive: true

  telegraphic_factual:
    probability: 0.45
    description: "IMPORTANT: Use a telegraphic, highly factual writing style with short sentences, frequent abbreviations, and dropped articles (e.g. 'Lungs clear' instead of 'The lungs appear clear')."

  verbose_descriptive:
    probability: 0.55
    description: "IMPORTANT: Use a verbose, descriptive writing style. Write in full, grammatically complete sentences with detailed genetic terminology."

################
# HEADER STYLE #
################
header_style:
  mutually_exclusive: true

  complex_header:
    probability: 0.30
    description: "Use a complex header including hospital/Trust name, full patient demographics, referring clinician, exam date/time, and detailed protocol/technique information (e.g. projection, contrast agent and volume, dose report)."

  standard_header:
    probability: 0.50
    description: "Use a standard header with basic exam metadata: exam name, date, patient identifier and referring team."

  minimal_header:
    probability: 0.20
    description: "Use a minimal header listing only the exam name and date, diving straight into the report text."

################
# FOOTER STYLE #
################
footer_style:
  mutually_exclusive: true

  formal_footer:
    probability: 0.40
    description: "Include a formal footer with the reporting genticist's name, credentials, licence number, DipRCPath, date/time of verification, and a standard electronic signature disclaimer."

  basic_footer:
    probability: 0.40
    description: "Include a basic footer with just the reporter's name and role (e.g. Consultant Clinical Geneticist, Molecular Genetics Lab, Reporting cytogeneticist)."

  no_footer:
    probability: 0.20
    description: "Omit the footer completely, ending abruptly after the conclusion."

###################
# REDACTION STYLE #
###################
redaction_style:
  mutually_exclusive: true

  fully_redacted:
    probability: 0.33
    description: "ALL personally identifiable information including names of patients/clinicians, hospital names, unique IDs, dates and dates of birth must be redacted by replacing with [redacted]."

  partially_redacted:
    probability: 0.33
    description: "The document is poorly redacted, with around 50% of personally identifiable information remaining visible, while other PID is replaced by [redacted]."

  not_redacted:
    probability: 0.34
    description: "The synthetic document should contain realistic synthetic personally identifiable information, including names, hospital locations, dates and IDs."

################
# DATA QUALITY #
################
data_quality_issues:
  mutually_exclusive: true

  none:
    probability: 0.30
    description: ""

  missing_indication:
    probability: 0.10
    description: "The clinical indication or patient history section is left blank or states 'No history provided'."

  optical_character_recognition_errors:
    probability: 0.10
    description: "Include occasional OCR typos or visual homophone errors typical of scanned reports (e.g. 'D0ctor' for 'doctor', 'S' for '5', '1' for 'I' or 'l')."

  misspelled_terms:
    probability: 0.10
    description: "Include occasional misspellings or typos in medical terminology."

  inconsistent_formatting:
    probability: 0.15
    description: "Formatting is inconsistent (e.g., mixed date formats, irregular spacing)."

  truncated_content:
    probability: 0.05
    description: "Document appears truncated or incomplete at the end or the beginning."

  corrupted_values:
    probability: 0.05
    description: "Some numerical values or measurements are corrupted or nonsensical."

  missing_sections:
    probability: 0.05
    description: "One or more expected document sections are missing."

  inconsistent_formatting:
    probability: 0.10
    description: "Formatting is inconsistent (e.g. inconsistent capitalisation, odd line breaks, all-caps headings mixed with lower case)."
