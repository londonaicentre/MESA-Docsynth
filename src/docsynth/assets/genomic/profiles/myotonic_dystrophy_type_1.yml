myotonic_dystrophy_type_1_001:
  test_methodology: "PCR"
  patient_description: |
    35-year-old woman with grip myotonia, frontal balding, ptosis and early-onset cataracts. Mother has a similar facial appearance and a history of cardiac conduction disease. Her 2-year-old daughter has hypotonia and feeding difficulty. Eligible under Test Directory criteria for suspected myotonic dystrophy based on clinical features and family history.
  genetic_finding: |
    Test Directory indication: Myotonic dystrophy type 1 - DMPK CTG repeat sizing by repeat-primed and long-range PCR. Reference genome GRCh38.
    Expanded CTG repeat in DMPK (DM1 protein kinase): NM_001081560.3:c.*224CTG[>150]; NC_000019.10:g.45770205_45770264CTG[>150] (approximately 400 repeats on long-range PCR, E2 range). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP1_Strong.
    Large expansion carries a risk of congenital myotonic dystrophy in offspring.

myotonic_dystrophy_type_1_002:
  test_methodology: "PCR"
  patient_description: |
    50-year-old man with progressive facial weakness and swallowing difficulty. Mother has a similar facial appearance and cardiac conduction disease. Eligible under Test Directory criteria for suspected myotonic dystrophy.
  genetic_finding: |
    Test Directory indication: Myotonic dystrophy type 1 - DMPK CTG repeat sizing by repeat-primed and long-range PCR. Reference genome GRCh38.
    CTG repeat in DMPK (DM1 protein kinase): NM_001081560.3:c.*224CTG[130]; NC_000019.10:g.45770205_45770264CTG[130] (E1 range (50-150 repeats): adult-onset phenotype). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP1_Strong.
    Large expansions carry a risk of congenital myotonic dystrophy in offspring of affected mothers.

