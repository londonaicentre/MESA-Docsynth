myeloproliferative_neoplasm_jak2_001:
  test_methodology: "DNA - WES; PCR"
  patient_description: |
    63-year-old woman with persistent erythrocytosis (haemoglobin 192 g/L, haematocrit 0.58), pruritus after hot baths and splenomegaly. Serum erythropoietin is low. Eligible under the Cancer Test Directory for suspected myeloproliferative neoplasm with erythrocytosis (diagnostic JAK2 testing as first line).
  genetic_finding: |
    Cancer Test Directory indication: Myeloproliferative neoplasms - JAK2 V617F allele-specific PCR with reflex to JAK2 exon 12, CALR and MPL analysis if negative. Reference genome GRCh38.
    Somatic pathogenic variant in JAK2 (Janus kinase 2): NM_004972.4:c.1849G>T, p.(Val617Phe); NC_000009.12:g.5073770G>T, variant allele fraction 47% (blood). AMP/ASCO/CAP: Tier I, Level A (diagnostic). ACMG germline criteria not applicable.
    Findings consistent with polycythaemia vera meeting WHO diagnostic criteria. No CALR or MPL variants.

