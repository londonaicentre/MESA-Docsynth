  test_methodology: "DNA - WES; PCR"
  patient_description: |
    76-year-old woman with progressive splenomegaly, anaemia, leucoerythroblastic film and bone marrow fibrosis. Eligible under the Cancer Test Directory for suspected myeloproliferative neoplasm (JAK2 first line, with CALR and MPL reflex testing where negative).
  genetic_finding: |
    Cancer Test Directory indication: Myeloproliferative neoplasms - JAK2 V617F allele-specific PCR with reflex to JAK2 exon 12, CALR and MPL analysis if negative. Reference genome GRCh38.
    Somatic pathogenic variant in MPL (MPL proto-oncogene, thrombopoietin receptor): NM_005373.3:c.1544G>T, p.(Trp515Leu); NC_000001.11:g.43348373G>T, variant allele fraction 43%. AMP/ASCO/CAP: Tier I, Level A (diagnostic and prognostic). ACMG germline criteria not applicable.
    MPL W515L variant; JAK2 V617F and CALR not detected; consistent with primary myelofibrosis in the appropriate clinical context.

