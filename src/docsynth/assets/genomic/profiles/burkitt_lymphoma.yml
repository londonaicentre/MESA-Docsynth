burkitt_lymphoma_001:
  test_methodology: "FISH; Karyotyping"
  patient_description: |
    22-year-old man with rapidly enlarging abdominal mass, ileocaecal lymphadenopathy and raised LDH (2,100 U/L). Biopsy shows a medium-sized B-cell infiltrate with a starry-sky pattern, Ki-67 over 95%, CD10 positive and BCL6 positive with BCL2 negative. Eligible under the Cancer Test Directory for suspected high-grade B-cell lymphoma requiring MYC rearrangement testing.
  genetic_finding: |
    Cancer Test Directory indication: Lymphoma - MYC break-apart FISH with MYC::IGH dual-fusion probes, BCL2 and BCL6 break-apart FISH. Reference genome GRCh38.
    FISH: nuc ish(MYCx2)(5'MYC sep 3'MYCx1)[168/200]; IGH::MYC dual-fusion signal pattern consistent with t(8;14)(q24.21;q32.33). BCL2 and BCL6 break-apart FISH negative. Karyotype: 46,XY,t(8;14)(q24;q32)[12]/46,XY[3].
    Rearrangement of MYC (NC_000008.11) with IGH (NC_000014.9) confirms Burkitt lymphoma. AMP/ASCO/CAP: Tier I, Level A (diagnostic). ACMG germline criteria not applicable.

