  patient_description: |
    4-year-old boy with delayed walking, positive Gowers sign and creatine kinase 13529 U/L. No family history; mother has a normal CK. Eligible under Test Directory criteria for dystrophinopathy in a male with raised CK and a compatible phenotype.
  genetic_finding: |
