duchenne_muscular_dystrophy_001:
  test_methodology: "MLPA"
  patient_description: |
    4-year-old boy with delayed walking, positive Gowers sign, calf pseudohypertrophy and serum creatine kinase of 18,500 U/L. No family history; mother has a normal CK. Eligible under Test Directory criteria for dystrophinopathy in a male with raised CK and a compatible phenotype. Exon-level result needed to assess eligibility for exon-skipping therapy.
  genetic_finding: |
    Test Directory indication: Dystrophinopathy - DMD MLPA (first-line copy number analysis), with sequencing reserved if negative. Reference genome GRCh38.
    Hemizygous pathogenic deletion of exons 48 to 50 in DMD (dystrophin): NM_004006.3:c.6913-?_7309+?del; NC_000023.11:g.(?_31787617)_(31967158_?)del, out-of-frame. Consistent with Duchenne phenotype. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting, PP4.
    Deletion potentially amenable to exon 51 skipping. Maternal carrier testing recommended.

duchenne_muscular_dystrophy_002:
  test_methodology: "MLPA"
  patient_description: |
    24-year-old man with exertional myalgia, cramps and creatine kinase 4023 U/L. Maternal uncle died of muscle disease in his twenties. Eligible under Test Directory criteria for dystrophinopathy in a male with raised CK and a compatible phenotype.
  genetic_finding: |
    Test Directory indication: Dystrophinopathy - DMD MLPA (first-line copy number analysis), with sequencing reserved if negative. Reference genome GRCh38.
    Hemizygous pathogenic deletion of exons 45 to 48 in DMD (dystrophin): NM_004006.3:c.6439-?_7098+?del; NC_000023.11:g.(?_31988701)_(32077929_?)del, in-frame. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1_Moderate, PM2_Supporting, PP4.
    Reading-frame rule indicates an intermediate to mild phenotype; not eligible for exon skipping. Maternal carrier testing recommended.

