brugada_syndrome_001:
  test_methodology: "DNA - WES"
  patient_description: |
    44-year-old man with a spontaneous type 1 Brugada ECG pattern in leads V1-V2 noted after a syncopal episode during a febrile illness. Echocardiogram structurally normal. Younger brother has a type 2 pattern. Eligible under Test Directory criteria for Brugada syndrome or cardiac sodium channel disease with a type 1 ECG.
  genetic_finding: |
    Test Directory indication R128 Brugada syndrome and cardiac sodium channel disease: SCN5A and associated gene panel. Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in SCN5A (NM_198056.3) or other panel genes. Coverage of all coding regions of SCN5A at least 20x. One variant of uncertain significance in SCN5A: NM_198056.3:c.4813+3_4813+6del; NC_000003.12:g.38551260_38551263del. ACMG/ACGS classification: Uncertain significance (Class 3) - PM2_Supporting, PP3 (splice prediction).
    Negative result does not exclude a clinical diagnosis. Variant not recommended for predictive testing.

brugada_syndrome_002:
  test_methodology: "DNA - WES"
  patient_description: |
    49-year-old woman with a type 1 Brugada ECG pattern found incidentally and syncope. No family history of sudden death. Eligible under Test Directory criteria for Brugada syndrome or cardiac sodium channel disease with a type 1 ECG.
  genetic_finding: |
    Test Directory indication R128 Brugada syndrome and cardiac sodium channel disease: SCN5A and associated gene panel. Reference genome GRCh38.
    Heterozygous pathogenic variant in SCN5A (sodium voltage-gated channel alpha subunit 5): NM_198056.3:c.5350G>A, p.(Glu1784Lys); NC_000003.12:g.38640391C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM2_Supporting, PM5, PP1, PP3, PP4.

