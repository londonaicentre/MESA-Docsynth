  test_methodology: "DNA - WES"
  patient_description: |
    53-year-old woman with aborted sudden cardiac arrest and a type 1 pattern on ECG at presentation. A brother has a type 2 pattern. Meets R128 criteria (diagnostic type 1 pattern, spontaneous or after provocation).
  genetic_finding: |
    Test Directory indication R128 Brugada syndrome and cardiac sodium channel disease: SCN5A and associated gene panel. Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in SCN5A and the other panel genes (all coding regions covered at 20x or more). Negative result does not exclude a clinical diagnosis; most Brugada cases have no identifiable variant.

