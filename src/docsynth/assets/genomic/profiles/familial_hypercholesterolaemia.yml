  patient_description: |
    65-year-old man with untreated LDL-cholesterol 7.4 mmol/L and bilateral Achilles tendon xanthomata. A first-degree relative has a known familial hypercholesterolaemia variant. Dutch Lipid Clinic Network score 12, meeting Test Directory criteria for genetic testing of probable or definite FH.
  genetic_finding: |
    Test Directory indication R134 Familial hypercholesterolaemia: targeted NGS panel (LDLR, APOB, PCSK9) with LDLR MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in LDLR (low-density lipoprotein receptor): NM_000527.5:c.2043C>A, p.(Cys681*); NC_000019.10:g.11129440C>A. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting.

familial_hypercholesterolaemia_004:
  test_methodology: "Targeted sequencing with PCR; MLPA"
  patient_description: |
    63-year-old woman found to have LDL-cholesterol 8.2 mmol/L at a routine cardiovascular risk check, with no secondary cause on investigation. A first-degree relative has a known familial hypercholesterolaemia variant. Dutch Lipid Clinic Network score 11, meeting Test Directory criteria for genetic testing of probable or definite FH.
  genetic_finding: |
    Test Directory indication R134 Familial hypercholesterolaemia: targeted NGS panel (LDLR, APOB, PCSK9) with LDLR MLPA. Reference genome GRCh38.
    Heterozygous likely pathogenic variant in LDLR (low-density lipoprotein receptor): NM_000527.5:c.1775G>A, p.(Gly592Glu); NC_000019.10:g.11094580G>A. ACMG/ACGS classification: Likely pathogenic (Class 4) - PS3, PS4, PM1, PM2_Supporting, PM5, PP4.

