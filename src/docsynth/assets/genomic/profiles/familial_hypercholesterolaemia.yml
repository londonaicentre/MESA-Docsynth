familial_hypercholesterolaemia_007:
  test_methodology: "Targeted sequencing with PCR; MLPA"
  patient_description: |
    65-year-old woman with LDL-cholesterol 10.1 mmol/L and corneal arcus before the age of 40. Father had a myocardial infarction at 52 years and a paternal uncle had coronary disease at 52. Dutch Lipid Clinic Network score 10, meeting Test Directory criteria for genetic testing of probable or definite FH.
  genetic_finding: |
    Test Directory indication R134 Familial hypercholesterolaemia: targeted NGS panel (LDLR, APOB, PCSK9) with LDLR MLPA. Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in LDLR, APOB and PCSK9 (no LDLR copy number change by MLPA). A polygenic cause of raised LDL-cholesterol is possible; lipid management should follow the clinical diagnosis.

