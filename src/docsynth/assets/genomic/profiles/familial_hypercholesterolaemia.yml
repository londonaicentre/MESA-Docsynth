familial_hypercholesterolaemia_001:
  test_methodology: "Targeted sequencing with PCR; MLPA"
  patient_description: |
    46-year-old man referred by the lipid clinic. Untreated LDL-cholesterol 7.9 mmol/L on two occasions, bilateral Achilles tendon xanthomata and corneal arcus. Father had a myocardial infarction aged 48 and a paternal uncle had coronary artery disease at 52. Dutch Lipid Clinic Network score 14 (definite FH). Eligible under the Test Directory FH criteria (clinical diagnosis of FH with a family history of premature coronary heart disease); a genetic diagnosis would enable cascade testing of his two children and siblings.
  genetic_finding: |
    Test Directory indication R134 Familial hypercholesterolaemia: targeted NGS panel (LDLR, APOB, PCSK9) with LDLR MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant detected in LDLR (low-density lipoprotein receptor): NM_000527.5:c.1747C>T, p.(His583Tyr); NC_000019.10:g.11128016C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM1, PM2_Supporting, PP1, PP3.
    No deletions or duplications of LDLR by MLPA. APOB p.(Arg3527Gln) and PCSK9 gain-of-function variants not detected.

familial_hypercholesterolaemia_002:
  test_methodology: "Targeted sequencing with PCR; MLPA"
  patient_description: |
    46-year-old man with a myocardial infarction and untreated LDL-cholesterol of 9.0 mmol/L. Mother and maternal grandmother were treated for severe hypercholesterolaemia; a brother had a stent at 48. Eligible under the Test Directory FH criteria (clinical diagnosis with family history of premature coronary heart disease); a result enables cascade testing.
  genetic_finding: |
    Test Directory indication R134 Familial hypercholesterolaemia: targeted NGS panel (LDLR, APOB, PCSK9) with LDLR MLPA. Reference genome GRCh38.
    Heterozygous likely pathogenic variant in LDLR (low-density lipoprotein receptor): NM_000527.5:c.1747C>T, p.(His583Tyr); NC_000019.10:g.11092474C>T. ACMG/ACGS classification: Likely pathogenic (Class 4) - PM1, PM2_Supporting, PM5, PP1, PP3, PP4.

familial_hypercholesterolaemia_003:
