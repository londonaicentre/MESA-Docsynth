prader_willi_syndrome_001:
  test_methodology: "MLPA"
  patient_description: |
    3-month-old boy with severe neonatal hypotonia, poor suck requiring nasogastric feeding, undescended testes and almond-shaped eyes. No family history. Eligible under Test Directory criteria for suspected Prader-Willi syndrome in neonatal hypotonia with feeding difficulties. First-line test is methylation analysis.
  genetic_finding: |
    Test Directory indication: Prader-Willi and Angelman syndromes - methylation-specific MLPA (MS-MLPA) of the 15q11-q13 imprinted region. Reference genome GRCh38.
    Loss of the paternal allele at the SNRPN (small nuclear ribonucleoprotein polypeptide N) imprinting centre: only methylated (maternal) pattern seen. Dosage analysis shows a heterozygous deletion NC_000015.10:g.(?_22750000)_(28500000_?)del (type 1 class, BP1 to BP3, approximately 6 Mb). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PM2_Supporting, PP4.
    Consistent with paternal 15q11.2q13 deletion Prader-Willi syndrome.

prader_willi_syndrome_002:
  test_methodology: "MLPA"
  patient_description: |
    9-month-old boy with neonatal hypotonia, hypogenitalism and a weak cry; mother 39 years old at conception. Normal antenatal scans apart from reduced fetal movements. Eligible under Test Directory criteria for suspected Prader-Willi syndrome in neonatal hypotonia with feeding difficulties; first-line test is methylation analysis.
  genetic_finding: |
    Test Directory indication: Prader-Willi and Angelman syndromes - methylation-specific MLPA (MS-MLPA) of the 15q11-q13 imprinted region. Reference genome GRCh38.
    Abnormal methylation pattern at the SNRPN (small nuclear ribonucleoprotein polypeptide N) imprinting centre: methylated (maternal) pattern only, with normal copy number across 15q11.2q13 (no deletion by MS-MLPA). Follow-up microsatellite analysis of the trio shows maternal heterodisomy of chromosome 15 (NC_000015.10, whole chromosome). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PP4.
    Consistent with Prader-Willi syndrome due to maternal uniparental disomy 15; low recurrence risk.

