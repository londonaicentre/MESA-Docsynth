inherited_breast_and_ovarian_cancer_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    42-year-old woman with triple-negative invasive ductal carcinoma of the left breast diagnosed at 41. Maternal aunt had high-grade serous ovarian cancer at 53 and her mother had breast cancer at 49. Ashkenazi Jewish ancestry is not reported. Meets the Test Directory criteria for germline BRCA testing (triple-negative breast cancer under 60 years and a first/second-degree relative with ovarian cancer; CanRisk score above 10%). Result is relevant to adjuvant treatment selection and risk-reducing surgery.
  genetic_finding: |
    Test Directory indication R208 Inherited breast cancer and ovarian cancer: germline panel (BRCA1, BRCA2, PALB2, ATM, CHEK2, RAD51C, RAD51D, BRIP1, TP53, PTEN, CDH1, STK11) with BRCA1/BRCA2 MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in BRCA1 (BRCA1 DNA repair associated): NM_007294.4:c.5266dup, p.(Gln1756Profs*74); NC_000017.11:g.43057062dup. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting.
    No other pathogenic variants in the panel genes; no copy number variants by MLPA.

inherited_breast_and_ovarian_cancer_002:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    41-year-old woman with grade 3 breast cancer at 36 and a CanRisk score of 20%. Two first-degree relatives have breast cancer under 50. Eligible under R208 criteria (ovarian cancer at any age, or breast cancer meeting a ≥10% pathogenic variant likelihood).
  genetic_finding: |
    Test Directory indication R208 Inherited breast cancer and ovarian cancer: germline panel (BRCA1, BRCA2, PALB2, ATM, CHEK2, RAD51C, RAD51D, BRIP1, TP53, PTEN, CDH1, STK11) with BRCA1/BRCA2 MLPA. Reference genome GRCh38.
    Heterozygous variant of uncertain significance in PALB2 (partner and localizer of BRCA2): NM_024675.4:c.848C>T, p.(Pro283Leu); NC_000016.10:g.23640387G>A. ACMG/ACGS classification: Uncertain significance (Class 3) - PM2_Supporting, PP3.
    No pathogenic or likely pathogenic variant identified in the panel genes; no BRCA1/BRCA2 copy number variants by MLPA. Variant not recommended for predictive testing in relatives.

