22q11_2_deletion_syndrome_001:
  test_methodology: "FISH"
  patient_description: |
    2-week-old girl with tetralogy of Fallot with pulmonary atresia, neonatal hypocalcaemia (corrected calcium 1.6 mmol/L) and a small thymus on chest radiograph. Dysmorphic features include a hooded eyelid and low-set ears. Eligible under Test Directory criteria for conotruncal cardiac defects with suspected 22q11.2 deletion syndrome; rapid result requested to guide immunological and calcium management.
  genetic_finding: |
    Test Directory indication: 22q11.2 deletion syndrome (DiGeorge syndrome) - FISH on metaphase and interphase cells with TUPLE1/HIRA (22q11.2) and control probe (22q13). Reference genome GRCh38.
    ish del(22)(q11.2q11.2)(TUPLE1-); nuc ish(TUPLE1x1,ARSAx2)[48/50]. Heterozygous deletion at 22q11.21 encompassing TBX1 (T-box transcription factor 1), approximately 2.5 Mb (typical A-D region): NC_000022.11:g.(?_18912231)_(21465672_?)del. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM2_Supporting, PP4.
    Parental FISH recommended (de novo in over 90% of cases).

