22q11_2_deletion_syndrome_006:
  test_methodology: "FISH"
  patient_description: |
    15-month-old girl with a truncus arteriosus and low T-cell counts. No family history; parents are healthy. Eligible under Test Directory criteria for conotruncal cardiac defects or a recognisable 22q11.2 deletion phenotype.
  genetic_finding: |
    Test Directory indication: 22q11.2 deletion syndrome (DiGeorge syndrome) - FISH with TUPLE1/HIRA (22q11.2) and control probe (22q13), with MLPA where indicated. Reference genome GRCh38.
    nuc ish(TUPLE1x2,ARSAx2)[100/100]: no deletion detected at 22q11.2. MLPA copy number analysis of the 22q11.2 region normal. TBX1 sequencing (NM_080647.1) shows no pathogenic variant. ACMG/ACGS: no pathogenic finding. Consider microarray or the large intellectual disability/paediatric panel if the phenotype persists.

