leber_hereditary_optic_neuropathy_001:
  test_methodology: "DNA - WGS"
  patient_description: |
    23-year-old man with subacute painless sequential loss of central vision over 8 weeks. Fundoscopy shows disc hyperaemia and peripapillary telangiectatic vessels, with a central scotoma. Smoker and regular alcohol use. Maternal uncle lost vision at 25. Eligible under Test Directory criteria for suspected LHON with typical optic neuropathy presentation and a maternal family history.
  genetic_finding: |
    Test Directory indication: Leber hereditary optic neuropathy - targeted mtDNA analysis as part of WGS. Reference mitochondrial sequence rCRS NC_012920.1 (GRCh38-compatible).
    Homoplasmic pathogenic variant in MT-ND4 (mitochondrially encoded NADH:ubiquinone oxidoreductase core subunit 4): NC_012920.1:m.11778G>A, p.(Arg340His). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP1_Strong.
    Variant is one of the three primary LHON mutations; male penetrance about 50%.

