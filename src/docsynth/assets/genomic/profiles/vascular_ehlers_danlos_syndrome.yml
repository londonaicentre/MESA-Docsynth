vascular_ehlers_danlos_syndrome_001:
  test_methodology: "DNA - WES"
  patient_description: |
    28-year-old woman with thin translucent skin, easy bruising and a spontaneous sigmoid colon perforation. Distinctive facial features (thin nose, prominent eyes). Brother died at 35 from a ruptured splenic artery aneurysm. Meets Villefranche/2017 clinical criteria and Test Directory criteria for suspected vascular Ehlers-Danlos syndrome.
  genetic_finding: |
    Test Directory indication: Ehlers-Danlos syndrome, vascular type - COL3A1 sequencing as part of a connective tissue disorder panel. Reference genome GRCh38.
    Heterozygous pathogenic variant in COL3A1 (collagen type III alpha 1 chain): NM_000090.4:c.1798G>A, p.(Gly600Ser); NC_000002.12:g.188996420G>A. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM1, PM5, PM2_Supporting, PP1.
    Glycine substitution within the triple-helical domain.

