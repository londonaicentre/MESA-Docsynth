fragile_x_syndrome_003:
  test_methodology: "PCR; MLPA"
  patient_description: |
    8-year-old boy with global developmental delay, speech delay, autistic features and hyperactivity. Maternal cousin has autism and intellectual disability. Eligible under Test Directory criteria for unexplained developmental delay or intellectual disability with a suggestive phenotype.
  genetic_finding: |
    Test Directory indication: Fragile X syndrome - FMR1 CGG repeat sizing by repeat-primed PCR and methylation-specific MLPA. Reference genome GRCh38.
    Size mosaic in FMR1 (fragile X messenger ribonucleoprotein 1): NM_002024.6:c.-128GGC[136] (pre-mutation) and c.-128GGC[>200] (full mutation), full mutation present in approximately 48% of alleles; methylation partial. NC_000023.11:g.147912051_147912110GGC. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP4.
    Size mosaicism may be associated with a milder cognitive phenotype.

fragile_x_syndrome_004:
  test_methodology: "PCR; MLPA"
  patient_description: |
    28-year-old woman with secondary amenorrhoea and raised FSH (44 IU/L) at age 28, consistent with primary ovarian insufficiency. Nephew has fragile X syndrome. Eligible under Test Directory criteria for FMR1 testing in primary ovarian insufficiency with a family history of fragile X.
  genetic_finding: |
    Test Directory indication: Fragile X syndrome - FMR1 CGG repeat sizing by repeat-primed PCR and methylation-specific MLPA. Reference genome GRCh38.
    Pre-mutation allele in FMR1 (fragile X messenger ribonucleoprotein 1): NM_002024.6:c.-128GGC[136]; NC_000023.11:g.147912051_147912110GGC[101]; second allele 32 CGG repeats; promoter unmethylated. ACMG/ACGS classification: Likely pathogenic (Class 4) - PS4, PP4 (FXPOI association; risk of full mutation expansion in offspring).
    Fragile X-associated primary ovarian insufficiency; genetic counselling regarding expansion risk.

fragile_x_syndrome_005:
  test_methodology: "PCR; MLPA"
  patient_description: |
    7-year-old girl with language delay, learning difficulties, anxiety and social communication difficulties. Maternal grandmother had a movement disorder in her 60s; maternal uncle has intellectual disability. Eligible under Test Directory criteria for fragile X testing in a female with developmental delay and a suggestive family history.
  genetic_finding: |
    Test Directory indication: Fragile X syndrome - FMR1 CGG repeat sizing by repeat-primed PCR and methylation-specific MLPA. Reference genome GRCh38.
    Heterozygous full mutation in FMR1 (fragile X messenger ribonucleoprotein 1): NM_002024.6:c.-128GGC[>200]; NC_000023.11:g.147912051_147912110GGC[>200]; second allele 20 CGG repeats, methylation ratio 68% at the expanded allele (skewed X-inactivation not assessed). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP4.
    Phenotype variable in females, depends on activation ratio.

