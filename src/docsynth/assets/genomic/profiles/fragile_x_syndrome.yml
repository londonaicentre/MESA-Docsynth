fragile_x_syndrome_001:
  test_methodology: "PCR; MLPA"
  patient_description: |
    5-year-old boy with global developmental delay, speech delay, autistic features, hyperactivity and gaze aversion. Examination shows a long face, prominent ears and macro-orchidism is not yet present. Maternal uncle has intellectual disability. Eligible under Test Directory criteria for unexplained developmental delay or intellectual disability in a male with a family history of X-linked intellectual disability.
  genetic_finding: |
    Test Directory indication: Fragile X syndrome - FMR1 CGG repeat sizing by repeat-primed PCR and methylation-specific MLPA. Reference genome GRCh38.
    Full mutation in FMR1 (fragile X messenger ribonucleoprotein 1): NM_002024.6:c.-128GGC[>200]; NC_000023.11:g.147912051_147912110GGC[>200] (5' UTR CGG repeat expansion, over 200 repeats), with full methylation of the FMR1 promoter. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP4.
    Mother is a pre-mutation carrier (CGG repeats 118), to be confirmed.

