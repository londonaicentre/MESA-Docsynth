  patient_description: |
    5-year-old boy with global developmental delay, speech delay, autistic features and hyperactivity. No family history. Eligible under Test Directory criteria for unexplained developmental delay or intellectual disability with a suggestive phenotype.
  genetic_finding: |
    Test Directory indication: Fragile X syndrome - FMR1 CGG repeat sizing by repeat-primed PCR and methylation-specific MLPA. Reference genome GRCh38.
    Full mutation in FMR1 (fragile X messenger ribonucleoprotein 1): NM_002024.6:c.-128GGC[>200]; NC_000023.11:g.147912051_147912110GGC[>200] (5' UTR CGG repeat expansion, over 200 repeats) with full methylation of the FMR1 promoter. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP4.
