familial_adenomatous_polyposis_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    24-year-old man found at colonoscopy to have over 200 colorectal adenomas. Congenital hypertrophy of the retinal pigment epithelium on ophthalmology review. Mother underwent total colectomy at 35 for polyposis. Eligible under Test Directory criteria for more than 10 cumulative colorectal adenomas with a family history of polyposis. Result confirms classical FAP and permits predictive testing of siblings.
  genetic_finding: |
    Test Directory indication R211 Inherited polyposis and early-onset colorectal cancer: APC, MUTYH, POLE, POLD1, NTHL1, MSH3 sequencing with APC MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in APC (APC regulator of WNT signalling pathway): NM_000038.6:c.3927_3931del, p.(Glu1309Aspfs*4); NC_000005.10:g.112839514_112839518del. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting, PP1.
    Variant located in the mutation cluster region, consistent with severe polyposis phenotype.

familial_adenomatous_polyposis_002:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    42-year-old woman with colorectal cancer at 37 on a background of >100 adenomas. Father died of colorectal cancer at 41 with known polyposis. Meets Test Directory criteria for polyposis testing; result confirms classical FAP and permits predictive testing in relatives.
  genetic_finding: |
    Test Directory indication R211 Inherited polyposis and early-onset colorectal cancer: APC, MUTYH, POLE, POLD1, NTHL1, MSH3 sequencing with APC MLPA. Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in APC (no large deletions by MLPA), MUTYH, POLE, POLD1, NTHL1 and MSH3. Mosaic APC variants are possible; tumour testing may be considered.

familial_adenomatous_polyposis_003:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    29-year-old woman with duodenal adenomas and 60 colorectal adenomas at the age of 38. A sibling has been diagnosed with FAP. Meets Test Directory criteria for polyposis testing; result confirms classical FAP and permits predictive testing in relatives.
  genetic_finding: |
    Test Directory indication R211 Inherited polyposis and early-onset colorectal cancer: APC, MUTYH, POLE, POLD1, NTHL1, MSH3 sequencing with APC MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in APC (APC regulator of WNT signalling pathway): NM_000038.6:c.847C>T, p.(Arg283*); NC_000005.10:g.112760599C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting, PP1, PP4.
    Variant location is consistent with the expected severity of polyposis. Cascade testing offered to first-degree relatives.

