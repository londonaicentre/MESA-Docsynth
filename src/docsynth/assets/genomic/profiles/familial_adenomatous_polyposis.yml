  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    41-year-old woman with colorectal cancer at 37 on a background of >100 adenomas. No family history of polyposis; parents unaffected on colonoscopy. Meets Test Directory criteria for polyposis testing; result confirms classical FAP and permits predictive testing in relatives.
  genetic_finding: |
    Test Directory indication R211 Inherited polyposis and early-onset colorectal cancer: APC, MUTYH, POLE, POLD1, NTHL1, MSH3 sequencing with APC MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in APC (APC regulator of WNT signalling pathway): NM_000038.6:c.1744C>T, p.(Arg582*); NC_000005.10:g.112843926C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS2, PM2_Supporting.
    Genotype-phenotype correlation noted; duodenal and desmoid surveillance advised.

