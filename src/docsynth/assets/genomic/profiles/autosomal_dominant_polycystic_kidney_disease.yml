autosomal_dominant_polycystic_kidney_disease_001:
  test_methodology: "DNA - WES"
  patient_description: |
    33-year-old woman with bilateral enlarged kidneys containing multiple cysts on ultrasound (total kidney volume above the 75th centile), hypertension and an eGFR of 68 mL/min. Mother commenced dialysis at 52 and a maternal uncle had a subarachnoid haemorrhage. Eligible under Test Directory criteria where imaging is equivocal or genetic confirmation will inform family planning or living kidney donation within the family.
  genetic_finding: |
    Test Directory indication: Polycystic kidney disease - PKD1, PKD2, GANAB, DNAJB11 sequencing. Reference genome GRCh38.
    Heterozygous pathogenic variant in PKD1 (polycystin 1, transient receptor potential channel interacting): NM_001009944.3:c.10445del, p.(Pro3482Argfs*53); NC_000016.10:g.2087542del. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting, PP1.
    Truncating PKD1 genotype associated with more severe renal disease (Mayo class 1D likely).

