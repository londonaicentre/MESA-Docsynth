  patient_description: |
    49-year-old man with bilateral enlarged cystic kidneys, hypertension and eGFR 68 mL/min. Mother commenced dialysis at 52 and a maternal uncle had a subarachnoid haemorrhage. Meets criteria for polycystic kidney disease testing (atypical imaging or no family history).
  genetic_finding: |
    Test Directory indication: Polycystic kidney disease - PKD1, PKD2, GANAB, DNAJB11 sequencing. Reference genome GRCh38.
    Heterozygous variant of uncertain significance in PKD1 (polycystin 1, transient receptor potential channel interacting): NM_001009944.3:c.796A>T, p.(Met266Leu); NC_000016.10:g.2089559T>A. ACMG/ACGS classification: Uncertain significance (Class 3) - PM2_Supporting, PP3.
    No pathogenic or likely pathogenic variant identified in PKD1, PKD2, GANAB and DNAJB11 (PKD1 duplicated-region sequence resolved by long-range PCR). Variant not recommended for predictive testing in relatives.

