pten_hamartoma_tumour_syndrome_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    34-year-old woman with macrocephaly (head circumference 59.5 cm), trichilemmomas, multinodular goitre and a history of breast cancer at 33. Endometrial polyps on hysteroscopy. Mother has macrocephaly and thyroid cancer. Meets clinical diagnostic criteria for PTEN hamartoma tumour syndrome and the Test Directory criteria for PTEN testing.
  genetic_finding: |
    Test Directory indication: PTEN hamartoma tumour syndrome (Cowden syndrome) - PTEN sequencing and MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in PTEN (phosphatase and tensin homolog): NM_000314.8:c.388C>T, p.(Arg130*); NC_000010.11:g.87933147C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting.
    No copy number variants by MLPA.

pten_hamartoma_tumour_syndrome_002:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    19-year-old man with follicular thyroid cancer and mucocutaneous papillomatous papules. Father has multiple trichilemmomas. Meets Test Directory criteria for PTEN testing (macrocephaly with developmental delay or characteristic clinical features).
  genetic_finding: |
    Test Directory indication: PTEN hamartoma tumour syndrome (Cowden syndrome) - PTEN sequencing and MLPA. Reference genome GRCh38.
    Heterozygous likely pathogenic variant in PTEN (phosphatase and tensin homolog): NM_000314.8:c.406T>C, p.(Cys136Arg); NC_000010.11:g.87938723T>C. ACMG/ACGS classification: Likely pathogenic (Class 4) - PM1, PM2_Supporting, PM5, PP3.
    Cancer surveillance (breast, thyroid, renal, colorectal) advised according to national guidance.

