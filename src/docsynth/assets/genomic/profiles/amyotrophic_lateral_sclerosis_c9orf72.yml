    26-year-old woman with progressive foot drop and upper motor neurone signs. Father had motor neurone disease at 58. Eligible under Test Directory criteria for motor neurone disease with a family history or atypical onset.
  genetic_finding: |
    Test Directory indication: Amyotrophic lateral sclerosis / motor neurone disease - motor neurone disease gene panel (C9orf72 repeat expansion negative; SOD1, TARDBP, FUS, TBK1, OPTN, VCP). Reference genome GRCh38.
    Heterozygous likely pathogenic variant in FUS (FUS RNA binding protein): NM_004960.4:c.1574C>T, p.(Pro525Leu); NC_000016.10:g.31188442C>T. ACMG/ACGS classification: Likely pathogenic (Class 4) - PS4, PM1, PM2_Supporting.
    Aggressive juvenile-onset phenotype typical of FUS p.(Pro525Leu); often de novo.
