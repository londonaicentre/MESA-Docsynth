amyotrophic_lateral_sclerosis_c9orf72_003:
  test_methodology: "DNA - WES"
  patient_description: |
    35-year-old man with bulbar-onset weakness, tongue fasciculations and weight loss. Brother died of frontotemporal dementia at 61 and mother of motor neurone disease at 66. Eligible under Test Directory criteria for motor neurone disease with a family history or atypical onset.
  genetic_finding: |
    Test Directory indication: Amyotrophic lateral sclerosis / motor neurone disease - motor neurone disease gene panel (C9orf72 repeat expansion negative; SOD1, TARDBP, FUS, TBK1, OPTN, VCP). Reference genome GRCh38.
    Heterozygous pathogenic variant in TARDBP (TAR DNA binding protein): NM_007375.4:c.892G>A, p.(Gly298Ser); NC_000001.11:g.11020345G>A. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PM1, PM2_Supporting, PM5, PP4.

