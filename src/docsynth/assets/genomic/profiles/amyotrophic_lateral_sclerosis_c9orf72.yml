amyotrophic_lateral_sclerosis_c9orf72_001:
  test_methodology: "PCR"
  patient_description: |
    57-year-old man with 8 months of progressive asymmetric limb weakness, fasciculations and dysarthria; EMG shows widespread denervation. Brother died of frontotemporal dementia at 61 and mother of motor neurone disease at 66. Eligible under Test Directory criteria for motor neurone disease with a family history. Result informs trial eligibility and family counselling.
  genetic_finding: |
    Test Directory indication: Amyotrophic lateral sclerosis / motor neurone disease - C9orf72 hexanucleotide repeat-primed PCR as first-line test. Reference genome GRCh38.
    Pathogenic repeat expansion in C9orf72 (C9orf72-SMCR8 complex subunit): NC_000009.12:g.27573528GGGGCC[>60] (reference repeat count 2; expansion over 60 repeats on repeat-primed PCR; size not further determined). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PP1_Strong.
    No other pathogenic variants in SOD1, TARDBP or FUS.

