colorectal_cancer_braf_001:
  test_methodology: "DNA - WES; PCR"
  patient_description: |
    72-year-old woman with an obstructing right-sided colon adenocarcinoma and synchronous liver metastases. Mismatch repair deficiency on immunohistochemistry (loss of MLH1 and PMS2). Eligible under the Cancer Test Directory for metastatic colorectal cancer (RAS/BRAF profiling for anti-EGFR and BRAF-targeted therapy decisions; BRAF V600E with MLH1 loss also supports sporadic MSI-H cancer rather than Lynch syndrome).
  genetic_finding: |
    Cancer Test Directory indication: Colorectal carcinoma - targeted NGS (KRAS, NRAS, BRAF) and MLH1 promoter methylation. Reference genome GRCh38.
    Somatic pathogenic variant in BRAF (B-Raf proto-oncogene, serine/threonine kinase): NM_004333.6:c.1799T>A, p.(Val600Glu); NC_000007.14:g.140753336A>T, variant allele fraction 38%. AMP/ASCO/CAP: Tier I, Level A (predictive and prognostic). ACMG germline criteria not applicable.
    KRAS and NRAS wild type. MLH1 promoter hypermethylation detected, consistent with a sporadic MSI-H/dMMR tumour.

colorectal_cancer_braf_002:
  test_methodology: "DNA - WES; PCR"
  patient_description: |
    58-year-old man with a transverse colon adenocarcinoma and lung metastases. Mismatch repair proficient. Eligible under the Cancer Test Directory for metastatic colorectal cancer (RAS/BRAF profiling for anti-EGFR and targeted therapy decisions).
  genetic_finding: |
    Cancer Test Directory indication: Colorectal carcinoma - targeted NGS (KRAS, NRAS, BRAF), with MSI/MMR assessment. Reference genome GRCh38.
    Somatic pathogenic variant in KRAS (KRAS proto-oncogene, GTPase): NM_004985.5:c.436G>A, p.(Ala146Thr); NC_000012.12:g.25213271C>T, variant allele fraction 43%. AMP/ASCO/CAP: Tier I, Level A (predictive of resistance to anti-EGFR antibodies). ACMG germline criteria not applicable.

