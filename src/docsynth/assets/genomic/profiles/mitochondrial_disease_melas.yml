mitochondrial_disease_melas_005:
  test_methodology: "DNA - WGS"
  patient_description: |
    28-year-old woman with progressive external ophthalmoplegia, sensory ataxia and a seizure disorder; lactate raised and muscle biopsy showing COX-negative fibres. Parents are healthy. Eligible under Test Directory criteria for suspected mitochondrial disease with multisystem involvement.
  genetic_finding: |
    Test Directory indication: Mitochondrial disorders - WGS with analysis of the mitochondrial genome and nuclear mitochondrial genes. Reference genome GRCh38; mitochondrial reference rCRS NC_012920.1.
    1) Heterozygous pathogenic variant in POLG (DNA polymerase gamma, catalytic subunit): NM_002693.3:c.1399G>A, p.(Ala467Thr); NC_000015.10:g.89329899C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM1, PM2_Supporting, PP3.
    2) Heterozygous pathogenic variant in POLG (DNA polymerase gamma, catalytic subunit): NM_002693.3:c.2243G>C, p.(Trp748Ser); NC_000015.10:g.89325816C>G. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM1, PM2_Supporting, PP3.
    Variants confirmed in trans on parental testing. No pathogenic mtDNA variant or deletion detected.

