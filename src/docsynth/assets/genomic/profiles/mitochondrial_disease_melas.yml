mitochondrial_disease_melas_001:
  test_methodology: "DNA - WGS"
  patient_description: |
    32-year-old woman with recurrent stroke-like episodes, migraine, sensorineural hearing loss and lactic acidosis. MRI shows non-vascular territory cortical lesions. Diabetes diagnosed at 28; mother has diabetes and deafness. Muscle biopsy showed ragged red fibres. Eligible under Test Directory criteria for suspected mitochondrial disease with multisystem involvement.
  genetic_finding: |
    Test Directory indication: Mitochondrial disorders - WGS with analysis of the mitochondrial genome and nuclear mitochondrial genes (single sample). Reference mitochondrial sequence rCRS NC_012920.1 (GRCh38 compatible).
    Heteroplasmic pathogenic variant in MT-TL1 (mitochondrially encoded tRNA leucine 1 (UUA/G)): NC_012920.1:m.3243A>G. Heteroplasmy 71% in blood (confirmed at 89% in urinary epithelial cells). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM2_Supporting, PP1.
    No pathogenic variants in nuclear mitochondrial disease genes. Maternal relatives at risk.

