  test_methodology: "DNA - WGS"
  patient_description: |
    56-year-old man with recurrent stroke-like episodes and epilepsy and basal ganglia signal change on MRI. Mother has migraine and mild myopathy. Eligible under Test Directory criteria for suspected mitochondrial disease with multisystem involvement.
  genetic_finding: |
    Test Directory indication: Mitochondrial disorders - WGS with analysis of the mitochondrial genome and nuclear mitochondrial genes (single sample). Reference mitochondrial sequence rCRS NC_012920.1 (GRCh38 compatible).
    Heteroplasmic pathogenic variant in MT-ND5 (mitochondrially encoded NADH:ubiquinone oxidoreductase core subunit 5): NC_012920.1:m.13513G>A, p.(Asp393Asn). Heteroplasmy 88% in blood. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM2_Supporting, PP1.
    Consistent with MELAS/Leigh overlap. No pathogenic variants in nuclear mitochondrial disease genes. Maternal relatives at risk.

