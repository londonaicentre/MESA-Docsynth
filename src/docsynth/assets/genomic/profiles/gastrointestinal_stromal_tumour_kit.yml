gastrointestinal_stromal_tumour_kit_001:
  test_methodology: "DNA - WES; PCR"
  patient_description: |
    59-year-old man with a 9 cm gastric spindle cell tumour resected after presenting with iron-deficiency anaemia. Immunohistochemistry positive for CD117 and DOG1; mitotic count 8 per 5 mm2. Intermediate-to-high risk by modified NIH criteria. Eligible under the Cancer Test Directory for GIST for adjuvant imatinib decision-making (KIT and PDGFRA mutation status).
  genetic_finding: |
    Cancer Test Directory indication: Gastrointestinal stromal tumour - KIT (exons 9, 11, 13, 17) and PDGFRA (exons 12, 14, 18) mutation analysis by targeted NGS. Reference genome GRCh38.
    Somatic pathogenic variant in KIT (KIT proto-oncogene, receptor tyrosine kinase): NM_000222.3:c.1669_1674del, p.(Trp557_Lys558del); NC_000004.12:g.54727446_54727451del, variant allele fraction 55%. AMP/ASCO/CAP: Tier I, Level A (predictive of imatinib response). ACMG germline criteria not applicable.
    No PDGFRA exon 18 p.(Asp842Val) variant.

