multiple_endocrine_neoplasia_type_2_001:
  test_methodology: "Targeted sequencing with PCR"
  patient_description: |
    19-year-old woman with medullary thyroid carcinoma (calcitonin 1,450 ng/L) diagnosed after a thyroid nodule biopsy. Plasma metanephrines mildly raised. Mother underwent thyroidectomy for medullary thyroid carcinoma at 28. Eligible under Test Directory criteria for medullary thyroid carcinoma or phaeochromocytoma at any age. Result determines timing of prophylactic surgery in her siblings.
  genetic_finding: |
    Test Directory indication: Multiple endocrine neoplasia type 2 - targeted RET sequencing (exons 5, 8, 10, 11, 13-16) by PCR. Reference genome GRCh38.
    Heterozygous pathogenic variant in RET (ret proto-oncogene): NM_020975.6:c.1900T>C, p.(Cys634Arg); NC_000010.11:g.43121968T>C. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM1, PM2_Supporting, PP1.
    Variant confers ATA high-risk category; consistent with MEN2A.

multiple_endocrine_neoplasia_type_2_002:
  test_methodology: "Targeted sequencing with PCR"
  patient_description: |
    22-year-old man with bilateral phaeochromocytoma and a thyroid nodule. A sibling has medullary thyroid carcinoma and hyperparathyroidism. Eligible under Test Directory criteria for medullary thyroid carcinoma or phaeochromocytoma at any age.
  genetic_finding: |
    Test Directory indication: Multiple endocrine neoplasia type 2 - targeted RET sequencing (exons 5, 8, 10, 11, 13-16) by PCR. Reference genome GRCh38.
    Heterozygous likely pathogenic variant in RET (ret proto-oncogene): NM_020975.6:c.2753T>C, p.(Met918Thr); NC_000010.11:g.43104655T>C. ACMG/ACGS classification: Likely pathogenic (Class 4) - PS4, PM2_Supporting, PP3.
    ATA risk category assigned from genotype to guide timing of prophylactic surgery.

