non_small_cell_lung_cancer_egfr_001:
  test_methodology: "DNA - WES; PCR"
  patient_description: |
    67-year-old woman, never-smoker, with a right upper lobe adenocarcinoma and bilateral pulmonary nodules; staged cT2aN2M1a (IVA). ECOG performance status 1. Eligible under the Cancer Test Directory for advanced non-squamous non-small cell lung cancer (molecular profiling to select targeted therapy).
  genetic_finding: |
    Cancer Test Directory indication: Non-small cell lung cancer - targeted NGS solid tumour panel (EGFR, KRAS, BRAF, ERBB2, MET, ALK, ROS1, RET, NTRK1-3) on FFPE tumour, tumour cellularity 40%. Reference genome GRCh38.
    Somatic pathogenic variant in EGFR (epidermal growth factor receptor): NM_005228.5:c.2573T>G, p.(Leu858Arg); NC_000007.14:g.55191822T>G, variant allele fraction 32%. AMP/ASCO/CAP: Tier I, Level A (predictive of response to EGFR tyrosine kinase inhibitors). ACMG germline criteria not applicable.
    No ALK, ROS1, RET, NTRK, MET exon 14 or KRAS variants; EGFR p.(Thr790Met) not detected at baseline.

