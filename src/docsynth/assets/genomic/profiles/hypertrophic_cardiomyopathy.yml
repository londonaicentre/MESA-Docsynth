  genetic_finding: |
    Test Directory indication: Hypertrophic cardiomyopathy - panel (MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, MYL3). Reference genome GRCh38.
    Heterozygous likely pathogenic variant in MYH7 (myosin heavy chain 7): NM_000257.4:c.1208G>A, p.(Arg403Gln); NC_000014.9:g.23421762C>T. ACMG/ACGS classification: Likely pathogenic (Class 4) - PM2_Supporting, PM5, PP1, PP4.

