hypertrophic_cardiomyopathy_001:
  test_methodology: "DNA - WES"
  patient_description: |
    37-year-old man with unexplained left ventricular hypertrophy (maximum wall thickness 21 mm) and non-sustained ventricular tachycardia on Holter monitoring. Father died suddenly aged 44; a paternal aunt has an implantable cardioverter-defibrillator. Eligible under Test Directory criteria for hypertrophic cardiomyopathy diagnosed on imaging, with a family history of sudden cardiac death.
  genetic_finding: |
    Test Directory indication: Hypertrophic cardiomyopathy - panel (MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, MYL3). Reference genome GRCh38.
    Heterozygous pathogenic variant in MYBPC3 (myosin binding protein C3): NM_000256.3:c.2827C>T, p.(Arg943*); NC_000011.10:g.47355134G>A. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting, PP1.
    Cascade testing offered to first-degree relatives.

