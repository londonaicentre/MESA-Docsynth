  test_methodology: "DNA - WES"
  patient_description: |
    24-year-old man with left ventricular outflow tract obstruction (gradient 70 mmHg) and septal hypertrophy. Brother has hypertrophic cardiomyopathy. Meets criteria for HCM panel testing; cascade testing planned for first-degree relatives.
  genetic_finding: |
    Test Directory indication: Hypertrophic cardiomyopathy - panel (MYBPC3, MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, MYL3). Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in the HCM panel genes. Approximately half of clinically diagnosed HCM remains genetically unexplained; relatives follow clinical screening.

