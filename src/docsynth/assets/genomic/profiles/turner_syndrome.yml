    Karyotype: 46,X,i(Xq)[24] (ISCN 2020). Isochromosome Xq: loss of Xp and duplication of Xq (NC_000023.11, Xp deletion with Xq duplication). FISH: DXZ1 present on the isochromosome; DYZ3 not detected. ACMG/ACGS classification: Pathogenic (Class 5).
    Referred to paediatric endocrinology and cardiology for growth, puberty and aortic surveillance.

turner_syndrome_006:
  test_methodology: "Karyotyping; FISH"
  patient_description: |
    13-year-old girl with short stature, delayed puberty and a horseshoe kidney. Eligible under Test Directory criteria for suspected Turner syndrome in a female with characteristic features. Mosaicism and Y chromosome material need to be excluded.
  genetic_finding: |
    Test Directory indication: Turner syndrome - karyotype with interphase FISH for X and Y centromeres. Reference genome GRCh38.
    Karyotype: mos 45,X[24]/46,X,+mar[10] (ISCN 2020). Mosaic monosomy X with a marker chromosome derived from the Y chromosome. FISH: nuc ish(DXZ1x1)(DYZ3x1)[marker positive in 22/30 metaphases]: Y centromere material present on the marker. Referral for consideration of prophylactic gonadectomy (gonadoblastoma risk). ACMG/ACGS classification: Pathogenic (Class 5).
    Referred to paediatric endocrinology and cardiology for growth, puberty and aortic surveillance.

