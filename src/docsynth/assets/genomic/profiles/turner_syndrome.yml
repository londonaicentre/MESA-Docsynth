    Karyotype: 45,X[25] (ISCN 2020). Complete monosomy X (NC_000023.11, whole chromosome loss). FISH: nuc ish(DXZ1x1)[200/200]; DYZ3 not detected (no Y material). ACMG/ACGS classification: Pathogenic (Class 5).
