spinal_muscular_atrophy_001:
  test_methodology: "MLPA"
  patient_description: |
    5-month-old girl with progressive generalised hypotonia, absent deep tendon reflexes, tongue fasciculations and paradoxical breathing. Unable to sit unsupported. No consanguinity or family history. Urgent testing requested as treatment (gene replacement or splicing modifier) is time-critical. Eligible under Test Directory criteria for suspected SMA with hypotonia and weakness.
  genetic_finding: |
    Test Directory indication: Spinal muscular atrophy - SMN1/SMN2 copy number by MLPA. Reference genome GRCh38.
    Homozygous deletion of SMN1 (survival of motor neuron 1, telomeric) exon 7: NM_000344.4:c.(?_835)_(*1_?)del (exons 7 and 8 absent); NC_000005.10:g.(70924941_70925000)_(70953000_70953015)del. SMN2 copy number: 2. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS3.
    Genotype consistent with SMA type 1. Parents both carry a single SMN1 copy (to be confirmed).

