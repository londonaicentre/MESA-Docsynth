spinal_muscular_atrophy_004:
  test_methodology: "MLPA; DNA - WES"
  patient_description: |
    24-year-old woman with slowly progressive proximal leg weakness since childhood, absent knee reflexes and a creatine kinase of 634 U/L. Sibling has similar features. Eligible under Test Directory criteria for suspected SMA with a compatible phenotype.
  genetic_finding: |
    Test Directory indication: Spinal muscular atrophy - SMN1/SMN2 copy number by MLPA with SMN1 sequencing if a single copy is found. Reference genome GRCh38.
    Heterozygous deletion of SMN1 (survival of motor neuron 1, telomeric) exon 7 (single copy of SMN1 by MLPA): NM_000344.4:c.(?_835)_(*1_?)del; NC_000005.10:g.(70924941_70925000)_(70953000_70953015)del. Compound heterozygous with SMN1 NM_000344.4:c.770_780dup, p.(Ser262Valfs*20); NC_000005.10:g.70942410_70942420dup. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM3, PP4.
    SMN2 copy number: 3.

