  test_methodology: "MLPA"
  patient_description: |
    15-month-old girl who sat unsupported at 8 months but has never stood independently, with fine hand tremor and areflexia. Parents are second cousins. Eligible under Test Directory criteria for suspected SMA with hypotonia and weakness.
  genetic_finding: |
    Test Directory indication: Spinal muscular atrophy - SMN1/SMN2 copy number by MLPA. Reference genome GRCh38.
