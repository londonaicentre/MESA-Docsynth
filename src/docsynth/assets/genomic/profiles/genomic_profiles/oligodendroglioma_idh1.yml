oligodendroglioma_idh1_001:
  test_methodology: "DNA - WES; FISH"
  patient_description: |
    38-year-old man presenting with a first generalised seizure. MRI shows a calcified right frontal lobe mass; resection histology demonstrates a diffusely infiltrating glioma with perinuclear halos. Eligible under the Cancer Test Directory for adult diffuse glioma (IDH and 1p/19q status determine WHO classification and treatment).
  genetic_finding: |
    Cancer Test Directory indication: Adult-type diffuse glioma - targeted NGS tumour panel (IDH1, IDH2, TERT promoter, ATRX, CIC, FUBP1, TP53) with 1p/19q FISH. Reference genome GRCh38.
    Somatic pathogenic variant in IDH1 (isocitrate dehydrogenase (NADP(+)) 1): NM_005896.4:c.395G>A, p.(Arg132His); NC_000002.12:g.208248388C>T, variant allele fraction 41%. TERT promoter variant NC_000005.10:g.1295113G>A (c.-124C>T) detected. FISH: nuc ish(1p36x1,1q25x2)(19q13x1,19p13x2)[96/100], co-deletion of 1p and 19q. AMP/ASCO/CAP: Tier I, Level A (diagnostic and prognostic). ACMG germline criteria not applicable.
    Findings consistent with oligodendroglioma, IDH-mutant and 1p/19q-codeleted (CNS WHO grade 2).

