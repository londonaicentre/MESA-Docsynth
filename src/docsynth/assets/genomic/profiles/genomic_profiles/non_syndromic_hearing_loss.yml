non_syndromic_hearing_loss_001:
  test_methodology: "Targeted sequencing with PCR"
  patient_description: |
    1-year-old girl referred after failing newborn hearing screening bilaterally; auditory brainstem response shows a bilateral severe sensorineural hearing loss. No dysmorphism, normal renal and ophthalmic findings, and no history of congenital cytomegalovirus. Parents are unaffected with normal hearing. Eligible under Test Directory criteria for bilateral permanent childhood hearing loss without an identified acquired cause.
  genetic_finding: |
    Test Directory indication: Hearing loss - GJB2 and GJB6 testing, followed by a hearing loss gene panel if negative. Reference genome GRCh38.
    Homozygous pathogenic variant in GJB2 (gap junction protein beta 2): NM_004004.6:c.35del, p.(Gly12Valfs*2) [legacy 35delG]; NC_000013.11:g.20189546del. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM3.
    Both parents heterozygous carriers. Diagnosis consistent with autosomal recessive deafness DFNB1A.

non_syndromic_hearing_loss_002:
  test_methodology: "DNA - WES"
  patient_description: |
    56-month-old girl with bilateral progressive sensorineural hearing loss and delayed speech. No dysmorphism, normal renal and ophthalmic findings and no congenital CMV; parents have normal hearing. Eligible under Test Directory criteria for bilateral permanent childhood hearing loss without an identified acquired cause.
  genetic_finding: |
    Test Directory indication: Hearing loss - GJB2 and GJB6 testing, followed by a hearing loss gene panel if negative. Reference genome GRCh38.
    Homozygous likely pathogenic variant in GJB2 (gap junction protein beta 2): NM_004004.6:c.101T>C, p.(Met34Thr); NC_000013.11:g.20188443A>G. ACMG/ACGS classification: Likely pathogenic (Class 4) - PM2_Supporting, PP3, PP4.
    Both parents are heterozygous carriers. Diagnosis consistent with autosomal recessive deafness DFNB1A.

