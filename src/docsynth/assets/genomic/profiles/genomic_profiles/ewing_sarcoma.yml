ewing_sarcoma_001:
  test_methodology: "FISH; PCR"
  patient_description: |
    15-year-old boy with 3 months of progressive left thigh pain and swelling. MRI shows a destructive diaphyseal lesion with a soft tissue mass; biopsy reveals sheets of small round blue cells, CD99 membranous positive. Eligible under the Cancer Test Directory for suspected Ewing sarcoma / round cell sarcoma (confirm EWSR1 fusion to support diagnosis and treatment protocol).
  genetic_finding: |
    Cancer Test Directory indication: Sarcoma - EWSR1 break-apart FISH with reflex RT-PCR / RNA sequencing for the fusion partner. Reference genome GRCh38.
    FISH: nuc ish(EWSR1x2)(5'EWSR1 sep 3'EWSR1x1)[84/100]. RT-PCR: EWSR1::FLI1 type 1 fusion transcript (EWSR1 exon 7 to FLI1 exon 6). Karyotype by tumour culture: 46,XY,t(11;22)(q24;q12)[10].
    Fusion between EWSR1 (NC_000022.11, 22q12.2) and FLI1 (NC_000011.10, 11q24.3). AMP/ASCO/CAP: Tier I, Level A (diagnostic). ACMG germline criteria not applicable.

