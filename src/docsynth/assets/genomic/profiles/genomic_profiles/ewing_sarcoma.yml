ewing_sarcoma_006:
  test_methodology: "FISH; PCR"
  patient_description: |
    23-year-old man with 4 months of progressive left thigh pain and swelling. MRI shows a destructive lesion with a soft tissue mass; biopsy reveals sheets of small round blue cells, CD99 membranous positive. Eligible under the Cancer Test Directory for suspected Ewing sarcoma / round cell sarcoma (confirm EWSR1 fusion to support diagnosis and treatment protocol).
  genetic_finding: |
    Cancer Test Directory indication: Sarcoma - EWSR1 break-apart FISH with reflex RT-PCR / RNA sequencing for the fusion partner. Reference genome GRCh38.
    FISH: nuc ish(EWSR1x2)[100/100], no EWSR1 rearrangement. RNA sequencing: CIC::DUX4 fusion transcript detected (CIC exon 20 to DUX4 exon 1; NC_000019.10 and NC_000004.12).
    Findings consistent with CIC-rearranged sarcoma rather than Ewing sarcoma (different prognosis and chemotherapy sensitivity). AMP/ASCO/CAP: Tier I, Level A (diagnostic). ACMG germline criteria not applicable.

