neurofibromatosis_type_1_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    6-year-old boy with more than six café-au-lait macules, axillary freckling and a left optic pathway glioma on MRI. No family history; both parents examined and have no cutaneous features. Fulfils NIH clinical criteria but genetic confirmation requested as the diagnosis is not yet certain in a child with fewer than two additional features. Eligible under Test Directory criteria for suspected NF1 with an uncertain clinical diagnosis.
  genetic_finding: |
    Test Directory indication: Neurofibromatosis type 1 - NF1 sequencing (including RNA-based splicing analysis where indicated) and MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in NF1 (neurofibromin 1), confirmed de novo on parental testing: NM_001042492.3:c.2446C>T, p.(Arg816*); NC_000017.11:g.31229402C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS2, PM2_Supporting.
    No copy number variants by MLPA.

