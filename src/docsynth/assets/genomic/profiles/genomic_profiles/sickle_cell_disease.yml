sickle_cell_disease_001:
  test_methodology: "Targeted sequencing with PCR"
  patient_description: |
    2-year-old girl of Nigerian heritage with dactylitis and two episodes of painful crisis. Haemoglobin 82 g/L, HbS 88% and HbF 11% on HPLC, no HbA detected. Both parents are known HbAS carriers. HPLC is diagnostic but molecular confirmation was requested to establish the genotype ahead of an antenatal request for a future sibling.
  genetic_finding: |
    Test Directory indication: Haemoglobinopathies (sickle cell disease) - HBB targeted sequencing by PCR. Reference genome GRCh38.
    Homozygous pathogenic variant in HBB (hemoglobin subunit beta): NM_000518.5:c.20A>T, p.(Glu7Val) [HbS]; NC_000011.10:g.5227002T>A. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM3, PP1_Strong.
    Genotype HbSS; both parents confirmed heterozygous.

sickle_cell_disease_002:
  test_methodology: "Targeted sequencing with PCR"
  patient_description: |
    1-year-old boy of Indian heritage following an abnormal newborn screening result with confirmed HbS on HPLC. HPLC: HbS 85%, HbF 14%, no HbA. Both parents are known HbAS carriers. Molecular confirmation requested under the Test Directory haemoglobinopathy criteria to define genotype ahead of family planning and therapy decisions.
  genetic_finding: |
    Test Directory indication: Haemoglobinopathies (sickle cell disease) - HBB targeted sequencing by PCR with MLPA where indicated. Reference genome GRCh38.
    Homozygous pathogenic variant in HBB (hemoglobin subunit beta): NM_000518.5:c.20A>T, p.(Glu7Val) [HbS]; NC_000011.10:g.5227002T>A. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM3, PP4.
    Genotype HbSS.

