  genetic_finding: |
    Test Directory indication R211 Inherited polyposis and early-onset colorectal cancer: WES-based panel including APC, MUTYH, POLE, POLD1, NTHL1. Reference genome GRCh38.
    Homozygous pathogenic variant in MUTYH (mutY DNA glycosylase): NM_001128425.2:c.1227_1228dup, p.(Glu410Glyfs*43); NC_000001.11:g.45334801_45334802dup. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting, PP4.
    Biallelic MUTYH genotype; siblings eligible for carrier and diagnostic testing. No pathogenic variants in APC.

