mutyh_associated_polyposis_001:
  test_methodology: "DNA - WES"
  patient_description: |
    52-year-old woman diagnosed with colorectal cancer at 50, with 25 adenomas at colonoscopy. No parental history of polyposis; one sister has multiple adenomas. Parents were reported to be unaffected, consistent with possible recessive inheritance. Eligible under Test Directory criteria for 10 to 100 colorectal adenomas without a dominant family history.
  genetic_finding: |
    Test Directory indication R211 Inherited polyposis and early-onset colorectal cancer: WES-based panel including APC, MUTYH, POLE, POLD1, NTHL1. Reference genome GRCh38.
    Homozygous pathogenic variant in MUTYH (mutY DNA glycosylase): NM_001128425.2:c.1187G>A, p.(Gly396Asp); NC_000001.11:g.45331556C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PM3_Strong, PM2_Supporting, PP3.
    No pathogenic variants identified in APC. Cascade testing offered to the affected sister.

mutyh_associated_polyposis_002:
  test_methodology: "DNA - WES"
  patient_description: |
    34-year-old man with 20 to 40 colorectal adenomas and no family history across generations. No dominant family history of polyposis; parents are first cousins. Meets Test Directory criteria for polyposis testing.
  genetic_finding: |
    Test Directory indication R211 Inherited polyposis and early-onset colorectal cancer: WES-based panel including APC, MUTYH, POLE, POLD1, NTHL1. Reference genome GRCh38.
    1) Heterozygous pathogenic variant in MUTYH (mutY DNA glycosylase): NM_001128425.2:c.934-2A>G, p.?; NC_000001.11:g.45331744T>C. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting.
    2) Heterozygous pathogenic variant in MUTYH (mutY DNA glycosylase): NM_001128425.2:c.1437_1439del, p.(Glu480del); NC_000001.11:g.45336919_45336921del. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM2_Supporting, PP1, PP4.
    Variants confirmed in trans on parental testing.

