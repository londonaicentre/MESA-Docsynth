charcot_marie_tooth_disease_type_1a_001:
  test_methodology: "MLPA"
  patient_description: |
    19-year-old man with progressive distal weakness, pes cavus, hammer toes and frequent ankle sprains. Nerve conduction studies show uniform slowing of motor conduction velocity at 22 m/s in the median nerve. Father and paternal grandfather have similar foot deformity and gait problems. Eligible under Test Directory criteria for demyelinating hereditary neuropathy with a family history.
  genetic_finding: |
    Test Directory indication: Hereditary neuropathy - PMP22 deletion/duplication analysis by MLPA as first-line test for demyelinating neuropathy. Reference genome GRCh38.
    Heterozygous 1.4 Mb duplication at 17p12 encompassing PMP22 (peripheral myelin protein 22): NC_000017.11:g.(15229777_15231000)_(16706000_16708000)dup; copy number 3 by MLPA. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM2_Supporting, PP4.
    Consistent with CMT1A; duplication mediated by CMT1A-REP repeats.

