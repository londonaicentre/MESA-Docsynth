beta_thalassaemia_001:
  test_methodology: "Targeted sequencing with PCR; MLPA"
  patient_description: |
    7-month-old boy of Pakistani heritage with severe microcytic anaemia (Hb 62 g/L, MCV 54 fL), hepatosplenomegaly and transfusion dependence. Raised HbF (92%) and absent HbA2 quantification on HPLC. Parents are first cousins, both with microcytic indices and raised HbA2. Eligible for confirmatory testing for suspected beta thalassaemia major.
  genetic_finding: |
    Test Directory indication: Haemoglobinopathies (thalassaemia) - HBB sequencing and MLPA of the beta-globin cluster. Reference genome GRCh38.
    Homozygous pathogenic variant in HBB (hemoglobin subunit beta): NM_000518.5:c.93-21G>A (IVS-I-110); NC_000011.10:g.5226820C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM3, PP1.
    No deletion of the beta-globin cluster by MLPA. Both parents heterozygous.

beta_thalassaemia_002:
  test_methodology: "Targeted sequencing with PCR; MLPA"
  patient_description: |
    24-year-old man of Pakistani heritage with iron overload on MRI T2* and regular transfusions since infancy. No known family history; carrier status of parents to be confirmed. Eligible under the Test Directory haemoglobinopathy criteria for confirmation of beta-thalassaemia genotype.
  genetic_finding: |
    Test Directory indication: Haemoglobinopathies (thalassaemia) - HBB sequencing and MLPA of the beta-globin cluster. Reference genome GRCh38.
    Homozygous pathogenic variant in HBB (hemoglobin subunit beta): NM_000518.5:c.126_129del, p.(Phe42Leufs*19); NC_000011.10:g.5226763_5226766del. ACMG/ACGS classification: Pathogenic (Class 5) - PM2_Supporting, PM3, PP1.
    No deletion of the beta-globin cluster by MLPA. Genotype predicts a transfusion-dependent (major) phenotype expected.

