von_hippel_lindau_syndrome_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    29-year-old man presenting with a retinal haemangioblastoma and a cerebellar haemangioblastoma. MRI abdomen shows bilateral renal cysts and a 2 cm pancreatic neuroendocrine lesion. Phaeochromocytoma screen negative. Two or more characteristic VHL lesions meet the Test Directory eligibility criteria. His mother had a renal cell carcinoma aged 41.
  genetic_finding: |
    Test Directory indication: Von Hippel-Lindau syndrome - VHL sequencing and MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in VHL (von Hippel-Lindau tumor suppressor): NM_000551.4:c.499C>T, p.(Arg167Trp); NC_000003.12:g.10149813C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM1, PM2_Supporting, PP1.
    Variant associated with type 2B (high phaeochromocytoma and renal carcinoma risk). No copy number variants by MLPA.

von_hippel_lindau_syndrome_002:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    26-year-old woman with a spinal haemangioblastoma and retinal capillary haemangioblastoma. No family history; parents have normal screening. Two or more characteristic VHL lesions meet the Test Directory eligibility criteria.
  genetic_finding: |
    Test Directory indication: Von Hippel-Lindau syndrome - VHL sequencing and MLPA. Reference genome GRCh38.
    Heterozygous likely pathogenic variant in VHL (von Hippel-Lindau tumor suppressor): NM_000551.4:c.353T>C, p.(Leu118Pro); NC_000003.12:g.10143520T>C. ACMG/ACGS classification: Likely pathogenic (Class 4) - PS2, PS4, PM2_Supporting, PM5, PP3, PP4.
    Annual surveillance for CNS, retinal and renal lesions advised.

