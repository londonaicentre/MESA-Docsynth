developmental_and_epileptic_encephalopathy_001:
  test_methodology: "DNA - WES"
  patient_description: |
    14-month-old girl with prolonged febrile hemiclonic seizures from 6 months, with subsequent myoclonic and atypical absence seizures. Developmental plateau and ataxia emerging. MRI normal; EEG shows generalised spike-wave discharges. No consanguinity or family history. Eligible under Test Directory criteria for an early-onset epilepsy with developmental delay and no acquired cause, trio testing requested.
  genetic_finding: |
    Test Directory indication R27 Paediatric disorders / early onset or syndromic epilepsy: WES trio analysis with virtual epilepsy gene panel. Reference genome GRCh38.
    De novo heterozygous pathogenic variant in SCN1A (sodium voltage-gated channel alpha subunit 1): NM_001165963.4:c.2589+2T>C; NC_000002.12:g.166003521A>G (canonical splice donor, exon 15 to 16 boundary region). ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS2, PM2_Supporting.
    Consistent with Dravet syndrome. Sodium channel blockers should be avoided.

developmental_and_epileptic_encephalopathy_002:
  test_methodology: "DNA - WES"
  patient_description: |
    44-month-old boy with neonatal-onset focal tonic seizures and severe developmental delay. No family history; both parents are clinically unaffected. Eligible under Test Directory criteria for an early-onset epilepsy with developmental delay and no acquired cause; trio testing requested.
  genetic_finding: |
    Test Directory indication R27 Paediatric disorders / early onset or syndromic epilepsy: WES trio analysis with virtual epilepsy gene panel. Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in the epilepsy gene panel and the trio exome (no CNVs). Reanalysis in 12 months or WGS is recommended.

developmental_and_epileptic_encephalopathy_003:
  test_methodology: "DNA - WES"
  patient_description: |
    16-month-old boy with neonatal-onset focal tonic seizures and severe developmental delay. No family history; both parents are clinically unaffected. Eligible under Test Directory criteria for an early-onset epilepsy with developmental delay and no acquired cause; trio testing requested.
  genetic_finding: |
    Test Directory indication R27 Paediatric disorders / early onset or syndromic epilepsy: WES trio analysis with virtual epilepsy gene panel. Reference genome GRCh38.
    Heterozygous pathogenic variant in CDKL5 (cyclin dependent kinase like 5): NM_003159.3:c.145C>T, p.(Arg49Cys); NC_000023.11:g.18587537C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS2, PS4, PM1, PM2_Supporting, PM5, PP3.
    Result informs anti-seizure medication selection and recurrence-risk counselling (low if de novo, with gonadal mosaicism not excluded).

