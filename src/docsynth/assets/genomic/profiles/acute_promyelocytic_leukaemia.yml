acute_promyelocytic_leukaemia_001:
  test_methodology: "FISH; PCR"
  patient_description: |
    34-year-old woman presenting with bruising, gum bleeding and fever. Platelets 18 x10^9/L, white cell count 4.1 x10^9/L with abnormal promyelocytes on film, prolonged PT and low fibrinogen consistent with disseminated intravascular coagulation. Suspected APL is a haematological emergency; urgent genetic confirmation of PML::RARA requested to support all-trans retinoic acid and arsenic trioxide therapy.
  genetic_finding: |
    Cancer Test Directory indication: Acute myeloid leukaemia - urgent PML::RARA by interphase FISH and RT-PCR, with karyotype and AML panel. Reference genome GRCh38.
    FISH: nuc ish(PMLx3,RARAx3)(PML con RARAx2)[92/200], consistent with t(15;17)(q24.1;q21.2). RT-PCR: PML::RARA bcr1 (long isoform) transcript detected. Karyotype: 46,XX,t(15;17)(q24.1;q21.2)[18]/46,XX[2]. FLT3-ITD detected (allelic ratio 0.4) by targeted PCR.
    Fusion across NC_000015.10 (PML) and NC_000017.11 (RARA); chimeric protein PML::RARA. AMP/ASCO/CAP: Tier I, Level A (diagnostic and therapeutic). ACMG germline criteria not applicable.

