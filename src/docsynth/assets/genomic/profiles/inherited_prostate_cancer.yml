inherited_prostate_cancer_001:
  test_methodology: "DNA - WES"
  patient_description: |
    58-year-old man with metastatic hormone-sensitive prostate adenocarcinoma (Gleason 4+5, PSA 410 ng/mL). Brother diagnosed with prostate cancer at 54 and a sister with breast cancer at 47. Eligible for germline testing as a patient with metastatic prostate cancer and a first-degree family history of breast and prostate cancer. Result is requested to guide PARP inhibitor eligibility and cascade testing.
  genetic_finding: |
    Test Directory indication R430 Inherited prostate cancer: WES-based virtual panel (BRCA1, BRCA2, ATM, CHEK2, HOXB13, MLH1, MSH2, MSH6, PMS2, PALB2). Reference genome GRCh38.
    Heterozygous pathogenic variant in BRCA2 (BRCA2 DNA repair associated): NM_000059.4:c.5946del, p.(Ser1982Argfs*22); NC_000013.11:g.32340301del. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting.
    No pathogenic variants in other panel genes. HOXB13 p.(Gly84Glu) not detected.

