inherited_prostate_cancer_004:
  test_methodology: "DNA - WES"
  patient_description: |
    68-year-old man with high-risk localised prostate cancer and PSA 58 ng/mL. Two first-degree relatives have prostate cancer. Meets Test Directory criteria (metastatic disease or Gleason 8+ with a qualifying family history).
  genetic_finding: |
    Test Directory indication R430 Inherited prostate cancer: WES-based virtual panel (BRCA1, BRCA2, ATM, CHEK2, HOXB13, MLH1, MSH2, MSH6, PMS2, PALB2). Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in the panel genes; HOXB13 p.(Gly84Glu) not detected. A negative result does not exclude a clinical diagnosis; clinical follow-up as per local pathway.

