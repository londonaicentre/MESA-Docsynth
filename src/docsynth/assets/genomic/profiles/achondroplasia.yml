achondroplasia_001:
  test_methodology: "Targeted sequencing with PCR"
  patient_description: |
    Fetus at 29 weeks of gestation with femoral length below the 3rd centile, frontal bossing and a trident hand on ultrasound; parents are of average height. Eligible under Test Directory criteria for fetal skeletal dysplasia with a suspected common recurrent variant. Targeted testing offered first as 99% of achondroplasia is caused by two FGFR3 variants.
  genetic_finding: |
    Test Directory indication: Achondroplasia / FGFR3-related skeletal dysplasia - targeted FGFR3 sequencing of the p.Gly380 codon by PCR on amniotic fluid DNA. Reference genome GRCh38.
    Heterozygous pathogenic variant in FGFR3 (fibroblast growth factor receptor 3): NM_000142.5:c.1138G>A, p.(Gly380Arg); NC_000004.12:g.1804392G>A. ACMG/ACGS classification: Pathogenic (Class 5) - PS2, PS3, PS4, PM2_Supporting, PP3.
    Parents tested negative (de novo); recurrence risk low.

