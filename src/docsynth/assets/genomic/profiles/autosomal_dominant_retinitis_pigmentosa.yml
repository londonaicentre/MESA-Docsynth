autosomal_dominant_retinitis_pigmentosa_001:
  test_methodology: "DNA - WGS"
  patient_description: |
    41-year-old man with progressive night blindness since his teens and constriction of visual fields. Fundoscopy shows bone-spicule pigmentation and attenuated vessels; electroretinography shows rod-cone dystrophy. Father and two paternal relatives are affected, consistent with autosomal dominant inheritance. Eligible under Test Directory criteria for inherited retinal disorder with a suspected rod-cone dystrophy.
  genetic_finding: |
    Test Directory indication R32 Retinal disorders: WGS with analysis of the Genomics England retinal disorders panel (about 400 genes). Reference genome GRCh38.
    Heterozygous likely pathogenic variant in RHO (rhodopsin): NM_000539.3:c.68C>A, p.(Pro23His); NC_000003.12:g.129528708C>A. ACMG/ACGS classification: Likely pathogenic (Class 4) - PS3, PM1, PM2_Supporting, PP1_Moderate.
    No pathogenic structural or intronic variants found elsewhere in the panel.

autosomal_dominant_retinitis_pigmentosa_002:
  test_methodology: "DNA - WGS"
  patient_description: |
    58-year-old man with night blindness, bone-spicule pigmentation and an ERG showing rod-cone dystrophy. Mother and maternal grandmother have retinitis pigmentosa. Meets R32 criteria for WGS in suspected inherited retinal disease.
  genetic_finding: |
    Test Directory indication R32 Retinal disorders: WGS with analysis of the Genomics England retinal disorders panel (about 400 genes). Reference genome GRCh38.
    Heterozygous pathogenic variant in RHO (rhodopsin): NM_000539.3:c.316G>A, p.(Gly106Arg); NC_000003.12:g.129533989G>A. ACMG/ACGS classification: Pathogenic (Class 5) - PS4, PM1, PM2_Supporting, PM5, PP3.

autosomal_dominant_retinitis_pigmentosa_003:
  test_methodology: "DNA - WGS"
  patient_description: |
    57-year-old man with progressive night blindness and visual field constriction with congenital sensorineural hearing loss (Usher syndrome type 2 features). Parents are second cousins; a sibling has a similar visual and hearing phenotype. Eligible under Test Directory criteria for inherited retinal disorder with extra-ocular features.
  genetic_finding: |
    Test Directory indication R32 Retinal disorders: WGS with analysis of the Genomics England retinal disorders panel (about 400 genes). Reference genome GRCh38.
    Homozygous pathogenic variant in USH2A (usherin): NM_206933.4:c.11864G>A, p.(Trp3955*); NC_000001.11:g.216100035C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting.
    Both parents are heterozygous carriers.

