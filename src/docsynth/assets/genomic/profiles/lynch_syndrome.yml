lynch_syndrome_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    38-year-old woman with colorectal adenocarcinoma of the caecum diagnosed at 37. Tumour showed loss of MSH2 and MSH6 expression on immunohistochemistry with no MLH1 promoter methylation (not applicable). Father had colorectal cancer at 44 and paternal grandmother had endometrial cancer at 51. Amsterdam II criteria met. Eligible under Test Directory criteria for colorectal cancer under 50 with MMR deficiency.
  genetic_finding: |
    Test Directory indication R210 Inherited MMR deficiency (Lynch syndrome): sequencing of MLH1, MSH2, MSH6, PMS2 and EPCAM with MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in MSH2 (mutS homolog 2): NM_000251.3:c.942+3A>T; NC_000002.12:g.47414420A>T, causing exon 5 skipping (in-frame deletion). ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM2_Supporting, PP1.
    No exon deletions or duplications detected by MLPA in MLH1, MSH2, MSH6, PMS2 or EPCAM.

lynch_syndrome_002:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    46-year-old man with colorectal cancer at 42 and microsatellite instability on tumour testing. Amsterdam II criteria are met. Meets Test Directory criteria for Lynch syndrome (dMMR tumour with no somatic explanation).
  genetic_finding: |
    Test Directory indication R210 Inherited MMR deficiency (Lynch syndrome): sequencing of MLH1, MSH2, MSH6, PMS2 and EPCAM with MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in MSH2 (mutS homolog 2): NM_000251.3:c.1216C>T, p.(Arg406*); NC_000002.12:g.47528415C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting, PP4.

