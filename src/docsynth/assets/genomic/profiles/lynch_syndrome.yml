    50-year-old woman with colorectal cancer at 48 and microsatellite instability on tumour testing. Mother had endometrial cancer at 48 and a maternal uncle had colorectal cancer at 54. Meets Test Directory criteria for Lynch syndrome (dMMR tumour with no somatic explanation).
  genetic_finding: |
    Test Directory indication R210 Inherited MMR deficiency (Lynch syndrome): sequencing of MLH1, MSH2, MSH6, PMS2 and EPCAM with MLPA. Reference genome GRCh38.
    Heterozygous variant of uncertain significance in PMS2 (PMS1 homolog 2, mismatch repair system component): NM_000535.7:c.316T>A, p.(Trp106Arg); NC_000007.14:g.6004330A>T. ACMG/ACGS classification: Uncertain significance (Class 3) - PM2_Supporting, PP3.
