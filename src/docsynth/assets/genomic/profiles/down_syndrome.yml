  genetic_finding: |
    Test Directory indication: Down syndrome - rapid aneuploidy testing by QF-PCR followed by G-banded karyotype. Reference genome GRCh38.
    Karyotype: mos 47,XX,+21[16]/46,XX[13] (ISCN 2020), 30 cells counted, 15 analysed. Mosaic trisomy 21; phenotype may be milder than in complete trisomy. Gain involves the Down syndrome critical region at 21q22 (NC_000021.9). ACMG/ACGS classification: Pathogenic (Class 5).
    Interphase FISH on buccal cells recommended to estimate tissue mosaicism; recurrence risk low.

