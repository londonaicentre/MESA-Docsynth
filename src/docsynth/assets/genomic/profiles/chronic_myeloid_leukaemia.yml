chronic_myeloid_leukaemia_001:
  test_methodology: "Karyotyping; FISH; PCR"
  patient_description: |
    51-year-old man with fatigue, left upper quadrant discomfort and night sweats. FBC shows white cell count 168 x10^9/L with a left-shifted neutrophil series, basophilia and thrombocytosis; spleen palpable 8 cm below the costal margin. Eligible under the Cancer Test Directory for suspected chronic myeloid leukaemia at diagnosis (karyotype, BCR::ABL1 FISH and quantitative RT-PCR).
  genetic_finding: |
    Cancer Test Directory indication: Chronic myeloid leukaemia - bone marrow karyotype, interphase FISH and BCR::ABL1 transcript typing/quantification by RT-qPCR. Reference genome GRCh38.
    Karyotype: 46,XY,t(9;22)(q34.1;q11.2)[20] (ISCN 2020). FISH: nuc ish(ABL1,BCR)x3(ABL1 con BCRx2)[186/200]. RT-qPCR: BCR::ABL1 e14a2 (b3a2) p210 transcript detected, BCR::ABL1/ABL1 ratio 62.4% (International Scale), no additional chromosomal abnormalities.
    Fusion at NC_000009.12 (ABL1) and NC_000022.11 (BCR), chimeric protein BCR::ABL1 (p210). AMP/ASCO/CAP: Tier I, Level A (diagnostic, prognostic and therapeutic - tyrosine kinase inhibitor). ACMG germline criteria not applicable.

