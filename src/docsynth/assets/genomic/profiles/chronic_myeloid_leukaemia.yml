chronic_myeloid_leukaemia_004:
  test_methodology: "DNA - WES"
  patient_description: |
    36-year-old man with CML in chronic phase on imatinib for 24 months with rising BCR::ABL1 (IS 10.9%) at a molecular monitoring point. Eligible under the Cancer Test Directory for CML with loss of response to a tyrosine kinase inhibitor (ABL1 kinase domain mutation analysis).
  genetic_finding: |
    Cancer Test Directory indication: Chronic myeloid leukaemia - BCR::ABL1 kinase domain mutation analysis by NGS after TKI failure. Reference genome GRCh38.
    Somatic pathogenic variant in ABL1 (ABL proto-oncogene 1, non-receptor tyrosine kinase): NM_005157.6:c.1052T>C, p.(Met351Thr); NC_000009.12:g.130716366T>C, variant allele fraction 21%. AMP/ASCO/CAP: Tier I, Level A (predictive of TKI resistance). ACMG germline criteria not applicable.
    Consider switching to an alternative second-generation TKI according to the mutation.

chronic_myeloid_leukaemia_005:
  test_methodology: "DNA - WES"
  patient_description: |
    23-year-old man with CML in chronic phase on imatinib for 8 months with rising BCR::ABL1 (IS 5.9%) at a molecular monitoring point. Eligible under the Cancer Test Directory for CML with loss of response to a tyrosine kinase inhibitor (ABL1 kinase domain mutation analysis).
  genetic_finding: |
    Cancer Test Directory indication: Chronic myeloid leukaemia - BCR::ABL1 kinase domain mutation analysis by NGS after TKI failure. Reference genome GRCh38.
    Somatic pathogenic variant in ABL1 (ABL proto-oncogene 1, non-receptor tyrosine kinase): NM_005157.6:c.944C>T, p.(Thr315Ile); NC_000009.12:g.130828857C>T, variant allele fraction 23%. AMP/ASCO/CAP: Tier I, Level A (predictive of TKI resistance). ACMG germline criteria not applicable.
    Resistant to imatinib, nilotinib and dasatinib; ponatinib or asciminib may be considered.

