tuberous_sclerosis_complex_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    4-year-old boy with infantile spasms from 5 months, hypomelanotic macules, facial angiofibromas and cardiac rhabdomyomas identified antenatally. MRI brain shows subependymal nodules and cortical tubers. Two major clinical features fulfil diagnostic criteria; molecular confirmation requested to guide mTOR inhibitor therapy and recurrence risk counselling for the parents.
  genetic_finding: |
    Test Directory indication: Tuberous sclerosis complex - TSC1 and TSC2 sequencing with MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in TSC2 (TSC complex subunit 2): NM_000548.5:c.1832G>A, p.(Arg611Gln); NC_000016.10:g.2073672G>A. ACMG/ACGS classification: Pathogenic (Class 5) - PS2, PS4, PM1, PM2_Supporting, PP3.
    Variant arose de novo (parents tested negative).

