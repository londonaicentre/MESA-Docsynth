retinoblastoma_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    11-month-old girl with bilateral retinoblastoma (leukocoria noticed by parents). Bilateral disease indicates a probable germline RB1 variant. Treated with systemic chemotherapy and focal laser therapy. No family history. Eligible under Test Directory criteria (bilateral or familial retinoblastoma, or unilateral disease with additional risk features).
  genetic_finding: |
    Test Directory indication: Retinoblastoma - RB1 sequencing and MLPA on constitutional (blood) DNA. Reference genome GRCh38.
    Heterozygous pathogenic variant in RB1 (RB transcriptional corepressor 1): NM_000321.3:c.958C>T, p.(Arg320*); NC_000013.11:g.48381331C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting. Parental testing negative (de novo, mosaicism in parents not excluded).
    No copy number variants by MLPA.

retinoblastoma_002:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    26-month-old girl with unilateral multifocal retinoblastoma diagnosed at 21 months. Father had retinoblastoma in infancy. Eligible for constitutional RB1 testing to determine heritable risk.
  genetic_finding: |
    Test Directory indication: Retinoblastoma - RB1 sequencing and MLPA on constitutional (blood) DNA. Reference genome GRCh38.
    Heterozygous pathogenic variant in RB1 (RB transcriptional corepressor 1): NM_000321.3:c.1333C>T, p.(Arg445*); NC_000013.11:g.48460338C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PS4, PM2_Supporting, PP4.
    Tumour sequencing of enucleated tissue (second hit) could be considered where blood testing is negative.

