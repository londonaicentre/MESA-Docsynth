neuroblastoma_001:
  test_methodology: "FISH"
  patient_description: |
    3-year-old girl with abdominal distension and periorbital bruising. MRI shows a large retroperitoneal adrenal mass with encasement of the aorta; MIBG avid bone and bone marrow metastases. Urinary catecholamines are raised. Tumour biopsy confirms undifferentiated neuroblastoma (INRG stage M). Eligible under the Cancer Test Directory for paediatric neuroblastoma (MYCN status determines risk group).
  genetic_finding: |
    Cancer Test Directory indication: Neuroblastoma - MYCN amplification by interphase FISH on tumour touch preparation, with segmental copy number profile. Reference genome GRCh38.
    nuc ish(MYCNx24~40)(2p24.3)(MYCN:CEN2 ratio 18.5)[100/100]; MYCN amplification detected (MYCN, NC_000002.12 region 2p24.3). Additional gain of 17q and deletion of 1p36 noted on array copy number profile.
    High-risk neuroblastoma. AMP/ASCO/CAP: Tier I, Level A (prognostic). ACMG germline criteria not applicable.

neuroblastoma_002:
  test_methodology: "FISH"
  patient_description: |
    26-month-old boy with a cervical mass and opsoclonus-myoclonus. Localised disease (INRG stage L2). Urinary catecholamines raised. Biopsy confirms neuroblastoma. Eligible under the Cancer Test Directory for paediatric neuroblastoma (MYCN status determines risk group).
  genetic_finding: |
    Cancer Test Directory indication: Neuroblastoma - MYCN amplification by interphase FISH on tumour touch preparation, with segmental copy number profile. Reference genome GRCh38.
    nuc ish(MYCNx2)(2p24.3)[100/100]; MYCN not amplified. Segmental copy number profile shows 1p36 deletion and 17q gain.
    
    AMP/ASCO/CAP: Tier I, Level A (prognostic). ACMG germline criteria not applicable.

