  genetic_finding: |
    Cancer Test Directory indication: Neuroblastoma - MYCN amplification by interphase FISH on tumour touch preparation, with segmental copy number profile and targeted NGS. Reference genome GRCh38.
    nuc ish(MYCNx50)(2p24.3)(MYCN:CEN2 ratio 14.6)[100/100]; MYCN amplification detected (MYCN, NC_000002.12 region 2p24.3), homogeneously staining regions. Additional 17q gain and 1p36 deletion on copy number profile.
