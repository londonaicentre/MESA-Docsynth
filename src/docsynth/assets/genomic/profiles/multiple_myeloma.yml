multiple_myeloma_001:
  test_methodology: "FISH"
  patient_description: |
    68-year-old man with bone pain, normocytic anaemia and renal impairment (creatinine 190 umol/L). IgG kappa paraprotein 42 g/L, 45% clonal plasma cells in bone marrow and lytic lesions on skeletal survey. Eligible under the Cancer Test Directory for newly diagnosed multiple myeloma for risk stratification (high-risk cytogenetics inform induction therapy).
  genetic_finding: |
    Cancer Test Directory indication: Plasma cell myeloma - interphase FISH on CD138-selected plasma cells (IGH rearrangements, 17p13 (TP53) deletion, 1q21 gain, 1p32 deletion). Reference genome GRCh38.
    nuc ish(IGHx2)(5'IGH sep 3'IGHx1)[142/200]; IGH::FGFR3 fusion, t(4;14)(p16.3;q32.3), detected in 71% of plasma cells. nuc ish(TP53x1,CEP17x2)[110/200]: deletion 17p13 (TP53 loss) in 55% of cells. 1q21 gain (CKS1Bx3) in 63%.
    Revised-ISS Stage 3 with double-hit high-risk cytogenetics (t(4;14) and del(17p)). AMP/ASCO/CAP: Tier I, Level A (prognostic). ACMG germline criteria not applicable.

