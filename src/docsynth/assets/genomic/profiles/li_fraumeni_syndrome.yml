li_fraumeni_syndrome_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    31-year-old woman with premenopausal breast cancer at 29. Father died of an adrenocortical carcinoma at 6 years and a paternal aunt had osteosarcoma at 17. Meets Chompret criteria and the Test Directory criteria for TP53 testing. Result guides surveillance (whole-body MRI) and avoidance of radiotherapy where possible.
  genetic_finding: |
    Test Directory indication: Inherited TP53-related cancer (Li-Fraumeni) - TP53 full gene sequencing and MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in TP53 (tumor protein p53): NM_000546.6:c.743G>A, p.(Arg248Gln); NC_000017.11:g.7674220C>T. ACMG/ACGS classification: Pathogenic (Class 5) - PS3, PS4, PM1, PM2_Supporting, PP3.
    Variant is a recurrent DNA-binding domain hotspot. No whole-gene or exon-level copy number changes by MLPA.

li_fraumeni_syndrome_002:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    7-year-old girl with adrenocortical carcinoma at 6 years. Mother had breast cancer at 31 and maternal grandfather had a brain tumour at 40. Eligible for TP53 testing (childhood adrenocortical carcinoma or choroid plexus carcinoma at any age).
  genetic_finding: |
    Test Directory indication: Inherited TP53-related cancer (Li-Fraumeni syndrome) - TP53 full gene sequencing and MLPA. Reference genome GRCh38.
    Heterozygous pathogenic variant in TP53 (tumor protein p53): NM_000546.6:c.1024C>T, p.(Arg342*); NC_000017.11:g.7680973G>A. ACMG/ACGS classification: Pathogenic (Class 5) - PVS1, PM2_Supporting.
    Mosaicism and clonal haematopoiesis considered; variant allele fraction in blood approximately 50%.

