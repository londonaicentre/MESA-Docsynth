  patient_description: |
    25-year-old woman with arachnodactyly, pectus carinatum and aortic root dilatation (Z-score 3.4). A paternal uncle died of aortic rupture at 38. Meets revised Ghent criteria; genetic confirmation requested under Test Directory criteria for suspected Marfan syndrome or heritable thoracic aortic disease.
  genetic_finding: |
    Test Directory indication: Heritable thoracic aortic disease - panel (FBN1, TGFBR1, TGFBR2, SMAD3, ACTA2, MYH11) with FBN1 MLPA. Reference genome GRCh38.
