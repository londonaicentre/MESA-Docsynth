marfan_syndrome_001:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    22-year-old man, 195 cm tall, with arachnodactyly, pectus carinatum, positive wrist and thumb signs and ectopia lentis. Echocardiogram shows aortic root dilatation (Z-score 3.4). Father had an aortic dissection at 41. Meets revised Ghent criteria; genetic confirmation requested under Test Directory criteria for suspected Marfan syndrome or heritable thoracic aortic disease.
  genetic_finding: |
    Test Directory indication: Heritable thoracic aortic disease - panel (FBN1, TGFBR1, TGFBR2, SMAD3, ACTA2, MYH11) with FBN1 MLPA. Reference genome GRCh38.
    Heterozygous likely pathogenic variant in FBN1 (fibrillin 1): NM_000138.5:c.3217G>A, p.(Glu1073Lys); NC_000015.10:g.48487801C>T. ACMG/ACGS classification: Likely pathogenic (Class 4) - PS4_Moderate, PM1, PM2_Supporting, PP3, PP1_Moderate.
    Variant in an EGF-like calcium-binding domain.

marfan_syndrome_002:
