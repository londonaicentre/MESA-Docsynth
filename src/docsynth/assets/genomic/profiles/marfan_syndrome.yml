marfan_syndrome_003:
  test_methodology: "DNA - WES; MLPA"
  patient_description: |
    36-year-old man with an acute type A aortic dissection at 35. Mother is tall with ectopia lentis and a mitral valve repair. Meets revised Ghent criteria; genetic confirmation requested under Test Directory criteria for suspected Marfan syndrome or heritable thoracic aortic disease.
  genetic_finding: |
    Test Directory indication: Heritable thoracic aortic disease - panel (FBN1, TGFBR1, TGFBR2, SMAD3, ACTA2, MYH11) with FBN1 MLPA. Reference genome GRCh38.
    No pathogenic or likely pathogenic variant identified in the HTAD panel genes (no FBN1 copy number variants by MLPA). A negative result does not exclude a clinical diagnosis; clinical follow-up as per local pathway.

